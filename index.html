/* ---------- Hoy ----------
   Una sola pantalla sin scroll: la tarjeta principal (el zorro con una frase, lo que toca según nextAction() y
   «▶ Empezar»), la fila «Repasar N» si hay pendientes y la tarjeta no es ya el repaso, las dos piezas de buddy.js
   (Misiones y Palabra del día), los HOME_SLOTS como filas compactas (2 como mucho) y «Privacidad». HOME_ACTS se
   conserva para los módulos que aún lo llenan, pero ya no se pinta: lo de cada sección está en su pestaña. */
let homeOffer = null;   /* lo que ofrece la tarjeta de Hoy ({kind: "repaso"} o {kind: "leccion", id}): el accesorio no lo repite */
let rvGo = false;       /* «Empezar» o «Repasar» en Hoy: #/repaso arranca el repaso sin pasar por su pantalla de inicio */
const lcFirst = t => String(t || "").charAt(0).toLowerCase() + String(t || "").slice(1);
const nPal = n => n === 1 ? "1 palabra" : `${n} palabras`;
const rvOpen = () => !!(rv && rv.q && rv.i < rv.q.length);
/* la lección guardada a medias (sessionStorage "vocab:ls" = {id, i, first, miss, n?, lang?}; la escribe la lección) */
function lsSaved(){
  try{
    const v = JSON.parse(sessionStorage.getItem("vocab:ls"));
    return v && typeof v === "object" && typeof v.id === "string" && v.id && (!v.lang || v.lang === lang) ? v : null;
  }catch(e){ return null; }
}
/* la siguiente lección del camino: la del nivel que enseña el mapa (mapLv) si le quedan, si no la del primer nivel
   sin terminar. {done: true} si ya no queda ninguna en ningún nivel. */
async function nextLesson(){
  await getMap();
  const P = mapP(), open = l => lvCur(l, P) < lvLessons(l).length, saved = store.get("mapLv", null);
  const lv = LVS[saved] && open(saved) ? saved : Object.keys(LVS).find(open);
  if(!lv) return {done: true};
  const ls = lvLessons(lv), i = lvCur(lv, P), l = ls[i], u = lvUnits(lv).find(u => u.ls.some(x => x.id === l.id)) || {t: ""};
  return {lv, i, l, u, first: !Object.keys(P).length};
}
/* qué toca ahora: el repaso si hay 10 o más palabras pendientes; si no, la siguiente lección del camino; y si ya está
   todo, una partida. Devuelve {kind: "repaso"|"leccion"|"juego"|"camino", id?, lv?, title, sub, say, href, btn, resume} */
async function nextAction(){
  const due = dueList().length, nm = game().name ? ", " + game().name : "";
  if(due >= 10){
    const left = rvOpen() ? rv.q.length - rv.i : 0;
    return left ? {kind: "repaso", title: "Repaso", sub: `Te ${left === 1 ? "queda 1 palabra" : `quedan ${left} palabras`}`, say: "¡Sigamos repasando!", href: "#/repaso", btn: "Seguir", resume: true}
      : {kind: "repaso", title: "Repaso", sub: `${nPal(due)} te esperan`, say: `¡Hola${nm}! Vamos a repasar`, href: "#/repaso", btn: "Empezar", resume: false};
  }
  let L = null; try{ L = await nextLesson(); }catch(e){ console.error(e); }
  if(!L) return {kind: "camino", title: "El camino", sub: "Lecciones cortas, una tras otra", say: `¡Hola${nm}! ¿Aprendemos?`, href: "#/mapa", btn: "Empezar", resume: false};
  if(L.done) return {kind: "juego", title: "Juega una partida", sub: "Repasa tus palabras jugando", say: "¡Lo has aprendido todo!", href: "#/juegos", btn: "Jugar", resume: false};
  const {lv, i, l, u} = L, sv = lsSaved(), resume = !!(sv && sv.id === l.id), lvTxt = lv === "A1" ? "" : `Nivel ${lv} · `;
  const base = {kind: "leccion", id: l.id, lv, href: "#/leccion/" + l.id, btn: resume ? "Seguir" : "Empezar", resume};
  if(!l.w){
    const x = ((GRAM[lang] || {})[lv] || [])[l.g];
    return {...base, title: `Gramática · ${l.t}`, sub: resume ? "¡Ya la empezaste!" : lvTxt + (x && x.q ? `${x.q.length} frases para completar` : "Una regla y unas frases"),
      say: resume ? "¡Sigamos donde lo dejaste!" : "¡Hoy toca gramática!"};
  }
  let n = l.w.length;
  try{
    await Promise.all([...new Set(l.w.map(([d]) => d))].map(d => getDoc(d)));
    n = l.w.filter(([d, k]) => { const r = (CACHE[d].rows || [])[k]; return r && r.es && r.l && r.l[lang]; }).length || n;
  }catch(e){}
  return {...base, title: `Lección ${i + 1}${u.t ? " · " + u.t : ""}`, sub: resume ? "¡Ya la empezaste!" : lvTxt + nPal(n),
    say: resume ? "¡Sigamos donde lo dejaste!" : L.first ? `¡Hola${nm}! ¿Empezamos?` : `¡Hola${nm}! Hoy toca ${lcFirst(u.t) || "aprender"}`};
}
/* fila compacta de Hoy (52 px) para los HOME_SLOTS: {t, sub?, icon? (Phosphor) | e? (emoji o dibujo), tone?: "teal" |
   "gold" | "gray", badge?, href? (enlace; sin él es un <button>), id?, label? (para el lector de pantalla)} */
function homeRow(o){

}
/* HOME_SLOTS: funciones (con .id opcional) que devuelven nada ("" / null / false), un objeto para homeRow(), HTML o un
   nodo. Se pintan en orden debajo de las piezas, como mucho 2; las que no devuelven nada no ocupan sitio. */
const SLOT_MAX = 2;
function slotEl(v, f){
  if(v == null || v === false) return null;
  const box = document.createElement("div"); box.className = "hm-slot";
  if(typeof Node !== "undefined" && v instanceof Node) box.append(v);
  else if(typeof v === "object"){ if(!v.t) return null; box.innerHTML = homeRow(v); }
  else { const s = String(v).trim(); if(!s) return null; box.innerHTML = s; }
  if(!box.firstChild) return null;
  if(f && f.id) box.dataset.slot = String(f.id);
  return box;
}
async function homeSlots(){
  const vals = await Promise.all(HOME_SLOTS.map(f => Promise.resolve().then(() => typeof f === "function" ? f() : f).catch(e => { console.error(e); return ""; })));
  const out = [];
  vals.forEach((v, i) => { if(out.length < SLOT_MAX){ const el = slotEl(v, HOME_SLOTS[i]); if(el) out.push(el); } });
  return out;
}

/* ---------- accesorio «Seguir» ----------
   Cápsula de vidrio sobre la barra de pestañas, solo si hay algo empezado: una lección guardada a medias
   (sessionStorage "vocab:ls") o un repaso abierto en memoria con tarjetas por hacer. «Seguir · Lección 4» o
   «Seguir · Repaso», con un anillo de progreso; al tocarlo, sigue. En Hoy no sale si la tarjeta principal ya ofrece lo
   mismo, ni en modo foco. window.vocabAccessory.refresh() lo vuelve a mirar (la lección lo llama al guardar o terminar). */
const ACC = {st: null, tok: 0};
async function accState(){
  if(rvOpen()) return {kind: "repaso", label: "Repaso", aria: "Seguir con el repaso", p: rv.done / Math.max(1, rv.total), href: "#/repaso"};
  const s = lsSaved(); if(!s) return null;
  try{ await getMap(); }catch(e){ return null; }
  const lv = lessonLv(s.id); if(!LVS[lv] || !MAP[lv]) return null;
  const ls = lvLessons(lv), k = ls.findIndex(l => l.id === s.id); if(k < 0) return null;
  const l = ls[k], miss = Array.isArray(s.miss) ? s.miss.length : 0, i = Math.max(0, +s.i || 0);
  const x = !l.w && ((GRAM[lang] || {})[lv] || [])[l.g];
  const n = +s.n > 0 ? +s.n : l.w ? 2 * l.w.length + miss : x && x.q ? x.q.length + miss : 0;
  return {kind: "leccion", id: s.id, label: l.w ? `Lección ${k + 1}` : "Gramática", aria: l.w ? `Seguir con la lección ${k + 1}` : `Seguir con la gramática: ${l.t}`,
    p: n ? Math.min(1, i / n) : 0, href: "#/leccion/" + s.id};
}
function accEl(){
  let a = document.getElementById("acc"); if(a) return a;
  a = document.createElement("a"); a.id = "acc"; a.className = "acc glass"; a.hidden = true; a.href = "#/";
  a.innerHTML = `<span class="acc-ring" aria-hidden="true"><svg class="acc-rs" viewBox="0 0 36 36"><circle class="acc-bg" cx="18" cy="18" r="15"/><circle class="acc-fg" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="0 100"/></svg>${ico("play", "fill", 14)}</span><span class="acc-t"></span>`;
  const bar = document.getElementById("tabbar"); if(bar) bar.after(a); else document.body.append(a);
  return a;
}
async function accRefresh(){
  const tok = ++ACC.tok, st = await accState().catch(e => { console.error(e); return null; });
  if(tok !== ACC.tok) return ACC.st;
  ACC.st = st;
  const a = accEl(), h = hashPath(), root = document.documentElement;
  const same = !!(st && h === "" && homeOffer && homeOffer.kind === st.kind && (st.kind === "repaso" || homeOffer.id === st.id));

  a.hidden = !show; root.toggleAttribute("data-acc", show);
  return st;
}

    document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on", b.dataset.l===state.lvl));
    $("#rate").textContent = `⚙️ Voz · ${rate.toFixed(2).replace(/0$/,"")}×`;
  };
  $("#modes").onclick = e => { const b=e.target.closest("[data-m]"); if(!b) return; autoTok++; state.fc.auto=false; state.mode=b.dataset.m; sync(); draw(doc); };
  $("#rate").onclick = e => openCfg(sync, e.currentTarget);
  $("#to-srs").onclick = () => { const n = srsAdd(doc.id, entries(doc), 0); toast(n ? `➕ ${n} palabra${n>1?"s":""} añadida${n>1?"s":""} al repaso` : "Ya estaban todas en el repaso"); };
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { state.lvl=b.dataset.l; state.fc={i:0,flip:false,order:null,rev:state.fc.rev}; state.test=null; sync(); draw(doc); });
  sync(); draw(doc);
}
function draw(doc){
  if(state.mode==="lista") lista(doc); else if(state.mode==="tarjetas") tarjetas(doc); else if(state.mode==="practica") practica(doc); else test(doc);
}
const imgHtml = r => `<div class="img">${r.img?`<img src="${r.img}" alt="" loading="lazy">`:`<div class="ph">${esc((r.es||"?")[0].toUpperCase())}</div>`}</div>`;

function lista(doc){

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function tarjetas(doc){
  const list = entries(doc); const s = state.fc;
  if(!s.order || s.order.length!==list.length) s.order = list.map((_,i)=>i);
  if(s.i>=list.length) s.i=0;
  const r = list[s.order[s.i]]; if(!r){ $("#view").innerHTML = `<p class="empty">No hay palabras.</p>`; return; }
  const d = r.l[lang];
  const front = s.rev
    ? `<div class="big">${esc(d.word)}</div>${sayBtn(d.word)}`
    : `${imgHtml(r)}<div class="big">${esc(r.es)}</div>`;
  const back = `${imgHtml(r)}<div class="es">${esc(r.es)}</div><div class="big">${esc(d.word)}</div>
      <div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}`;
  $("#view").innerHTML = `<div class="fc-wrap">
    <div class="count">${s.i+1} / ${list.length}</div>
    <div class="fc" id="card">${s.flip?back:front}${s.flip?"":`<div class="hint">Toca la tarjeta para ver la respuesta</div>`}</div>
    <div class="ctrl">
      <button class="btn" id="prev">← Anterior</button>
      <button class="btn pri" id="next">Siguiente →</button>
    </div>
    <div class="ctrl">
      <button class="btn ${s.auto?"pri":""}" id="auto">${s.auto?"⏸ Detener secuencia":"▶ Secuencia automática"}</button>
      <button class="btn" id="shuf">🔀 Barajar</button>
      <button class="btn" id="rev">${s.rev?"Mostrar primero: español":"Mostrar primero: "+LANGS[lang].name}</button>
    </div></div>`;
  const stop = () => { if(s.auto){ s.auto = false; autoTok++; speechSynthesis && speechSynthesis.cancel(); } };
  const go = k => { stop(); s.i = (s.i+k+list.length)%list.length; s.flip=false; tarjetas(doc); };
  $("#card").onclick = () => { stop(); s.flip=!s.flip; tarjetas(doc); if(s.flip && !s.rev) say(d.word); };
  $("#auto").onclick = () => { if(s.auto){ stop(); tarjetas(doc); } else fcAuto(doc); };
  $("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
  $("#shuf").onclick = () => { stop(); s.order = shuffle(list.map((_,i)=>i)); s.i=0; s.flip=false; tarjetas(doc); };
  $("#rev").onclick = () => { stop(); s.rev=!s.rev; s.flip=false; tarjetas(doc); };
}

/* secuencia automática: solo suena el idioma que se estudia, nunca el español */
async function fcAuto(doc){
  const s = state.fc, tok = ++autoTok;
  const alive = () => tok === autoTok && s.auto && state.mode === "tarjetas" && document.getElementById("card");
  s.auto = true;
  while(true){
    const list = entries(doc); if(!list.length) break;
    if(s.i >= list.length) s.i = 0;
    const d = list[s.order ? s.order[s.i] : s.i].l[lang];
    s.flip = false; tarjetas(doc);
    if(s.rev){ await sleep(500); if(!alive()) return; await sayP(d.word); await sleep(1200); }
    else await sleep(2000);
    if(!alive()) return;
    s.flip = true; tarjetas(doc);
    if(!s.rev){ await sayP(d.word); if(!alive()) return; await sleep(700); }
    if(d.ex){ if(!alive()) return; await sayP(d.ex); }
    await sleep(1500);
    if(!alive()) return;
    s.i = (s.i + 1) % list.length;
  }
}

function test(doc){
  const list = entries(doc);
  if(list.length<4){ $("#view").innerHTML = `<p class="empty">Se necesitan al menos 4 palabras.</p>`; return; }
  if(!state.test){ state.test = {qs: shuffle(list).slice(0, Math.min(10,list.length)), i:0, ok:0, done:false}; }
  const t = state.test;
  if(t.i>=t.qs.length){
    if(!t.paid){ t.paid = true; if(t.ok) award(t.ok, "¡Test terminado!"); }
    $("#view").innerHTML = `<div class="q"><div class="big" style="font-size:1.6rem;font-weight:700">${t.ok} / ${t.qs.length}</div>
      <p class="sub">${t.ok===t.qs.length?"¡Perfecto! 🎉":t.ok>=t.qs.length*0.7?"¡Muy bien!":"Sigue practicando con las tarjetas."}</p>
      <button class="btn pri" id="again">Otra ronda</button></div>`;
    $("#again").onclick = () => { state.test=null; test(doc); };
    return;
  }
  const r = t.qs[t.i], d = r.l[lang];
  const pool = shuffle(list.filter(x => x!==r && x.l[lang].word!==d.word)).slice(0,3);
  const opts = shuffle([r,...pool]);
  $("#view").innerHTML = `<div class="q">
    <div class="score">Pregunta ${t.i+1} de ${t.qs.length} · Aciertos: ${t.ok}</div>
    ${imgHtml(r)}<div style="font-size:1.4rem;font-weight:700;margin-top:8px">${esc(r.es)}</div>
    <div class="sub">¿Cómo se dice en ${LANGS[lang].name}?</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.l[lang].word)}</button>`).join("")}</div>
    <div id="after" style="margin-top:14px"></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(t.answered===t.i) return; t.answered=t.i;
    const pick = opts[+b.dataset.i], good = pick===r;
    if(good) t.ok++;
    bus.emit("answer", {ok: good, es: r.es, word: r.l[lang].word, where: "test"});
    srsGrade(state.doc, r, good ? 2 : 0);
    document.querySelectorAll(".opt").forEach(x => { if(opts[+x.dataset.i]===r) x.classList.add("ok"); });
    if(!good) b.classList.add("bad");
    say(d.word);
    $("#after").innerHTML = `<div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span>${sayBtn(d.word,1)}</div>
      <button class="btn pri" id="nextq" style="margin-top:10px">Siguiente →</button>`;
    $("#nextq").onclick = () => { t.i++; test(doc); };
  });
}

/* qué actividad toca en la repetición n de una palabra */
const actFor = (s, n) => s.acts[n % s.acts.length];
const actCount = (s, n, j) => Math.floor(n / s.acts.length) + (j < n % s.acts.length ? 1 : 0);
const actTarget = (s, j) => Math.floor(s.reps / s.acts.length) + (j < s.reps % s.acts.length ? 1 : 0);
function nextIdx(s, from){
  const L = s.words.length;
  for(let k=1; k<=L; k++){ const i = (from + k) % L; if(s.words[i].n < s.reps) return i; }
  return -1;
}

const TINT = {escuchar:["#dbe9fb","#1E6EF4"], leer:["#d9f2e4","#008932"], escribir:["#d6eff2","#008198"], hablar:["#dde3ea","#3b4a5c"], dictado:["#fbf1cc","#A16A00"]};

/* la tarjeta actual y las que vienen, simulando la cola */
function upcoming(s, k){
  const ns = s.words.map(w => w.n), L = ns.length, out = [];
  let cur = s.cur;
  for(let t=0; t<k && cur>=0 && ns[cur] < s.reps; t++){
    out.push({wi:cur, n:ns[cur]});
    ns[cur]++;
    let nx = -1;
    for(let q=1; q<=L; q++){ const i = (cur+q) % L; if(ns[i] < s.reps){ nx = i; break; } }
    cur = nx;
  }
  return out;
}

function prRun(doc, s){
  const all = doc.rows.filter(r => r.es && r.l[lang]);
  if(s.words[s.cur] && s.words[s.cur].n >= s.reps){ const n = nextIdx(s, s.cur); if(n>=0) s.cur = n; }
  const doneReps = s.words.reduce((a,w)=>a+Math.min(w.n,s.reps),0), total = s.words.length*s.reps;
  if(doneReps >= total) return prEnd(doc, s, total);
  const wdone = s.words.filter(w=>w.n>=s.reps).length;
  const pct = Math.round(100*doneReps/total);
  const w = s.words[s.cur], r = all[w.i];
  const seq = upcoming(s, 4), hist = prUI.hist.slice(-3);

  $("#view").innerHTML = `<div class="pr" id="pr-root">

          <span class="dot">${done?"✓":k+1}</span>
          <div><div class="w">${esc(rr.es)}</div>
          <div class="s">${done?"Completada":cur?`En curso · ${x.n} de ${s.reps}`:x.n?`${x.n} de ${s.reps}`:"Pendiente"}</div>
          ${cur?`<div class="acts">${s.acts.map((a,j)=>{const c=actCount(s,x.n,j),t=actTarget(s,j);
            return `<span class="${c>=t?"ok":""}">${c>=t?"✓":ACTS[a].ic} ${ACTS[a].name} (${c}/${t})</span>`}).join("")}</div>`:""}
          </div></li>`; }).join("")}</ol>` : ""}
    </aside>
    <section class="pr-stage">
      <div class="pr-top"><span class="count">Repetición <b>${w.n+1}</b> de ${s.reps} · ${esc(r.es)}</span>
        <span class="pr-row"><label class="pr-opt"><input type="checkbox" id="pr-auto" ${prUI.auto?"checked":""}> Paso automático</label><label class="pr-opt"><input type="checkbox" id="pr-ex" ${prUI.ex?"checked":""}> Audio del ejemplo</label><button class="btn" id="pr-skip" title="Marcar esta palabra como aprendida">Ya me la sé</button><button class="btn" id="pr-fs" title="Pantalla completa">${document.fullscreenElement?"✕ Salir":"⛶"}</button><button class="btn" id="pr-stop">⏸ Pausar</button></span></div>
      <div class="pr-flow" id="pr-flow">
        ${cards.map(c => { const rr = all[s.words[c.wi].i]; return prCard(rr, effAct(rr, actFor(s, c.n)), c.off===0, c.n, s.reps, c.off); }).join("")}
        <div class="pr-dots" title="Repeticiones de esta palabra">${Array.from({length:s.reps},(_,k)=>`<i class="${k<w.n?"on":k===w.n?"now":""}"></i>`).join("")}</div>
      </div>
      <div class="pr-keys">Atajo: Enter para continuar</div>
    </section></div>`;

  const flow = $("#pr-flow");
  const els = [...flow.querySelectorAll(".pr-card")];
  const layout = () => {
    const W = flow.getBoundingClientRect().width, cw = Math.round(Math.min(300, W*0.64));
    els.forEach(el => {
      const o = +el.dataset.off, a = Math.abs(o), sg = Math.sign(o);
      const x = a ? sg*(cw*0.68 + (a-1)*cw*0.40) : 0, sc = 1 - 0.13*a;
      el.style.setProperty("--cw", cw+"px");
      el.style.transform = `translate(${x}px,-50%) scale(${sc})`;
      el.style.zIndex = 10 - a;
      el.style.opacity = a > 3 ? 0 : 1 - 0.1*Math.max(0,a-1);
    });
  };
  els.forEach(el => el.style.transition = "none"); layout();
  requestAnimationFrame(() => els.forEach(el => el.style.transition = ""));
  const onResize = () => { if(document.body.contains(flow)) layout(); else removeEventListener("resize", onResize); };
  addEventListener("resize", onResize);

  const save = () => store.set(prKey(doc.id), s);
  const advance = () => {
    if(prUI.busy) return; prUI.busy = true;
    prUI.hist = [...prUI.hist, {wi:s.cur, n:w.n}].slice(-3);
    w.n++; logAct();
    if(w.n === s.reps){ toast(`🎉 ¡«${r.es}» completada! Vuelve mañana en el repaso`); srsAdd(doc.id, [r], 1); }
    const n = nextIdx(s, s.cur); if(n>=0) s.cur = n;
    save();
    els.forEach(el => { el.dataset.off = +el.dataset.off - 1; el.classList.toggle("side", +el.dataset.off !== 0); });
    layout();
    setTimeout(() => { prUI.busy = false; if(state.mode==="practica" && document.body.contains(flow)) prRun(doc, s); }, 520);
  };

  const act = effAct(r, actFor(s, w.n)), card = flow.querySelector(".pr-card.cur");
  const btn = card.querySelector(".pr-next");
  const tok = ++autoTok, alive = () => tok === autoTok && state.mode === "practica" && document.body.contains(flow);
  /* solo suena el idioma que se estudia: la palabra y, si está marcado, el ejemplo */
  const play = async (wbtn) => {
    if(!alive()) return false;
    await sayP(r.l[lang].word, wbtn); if(!alive()) return false;
    if(prUI.ex && r.l[lang].ex){ await sleep(500); if(!alive()) return false; await sayP(r.l[lang].ex, card.querySelector(".ex .say")); }
    return alive();
  };
  const autoNext = async () => { if(prUI.auto && alive()){ await sleep(1000); if(prUI.auto && alive()) advance(); } };
  let onEnter = () => btn.click();
  if(act === "escuchar" || act === "leer"){
    setTimeout(async () => { if(await play(card.querySelector(".say.xl"))) autoNext(); }, 420);
    btn.onclick = advance;
  } else if(act === "hablar"){
    const mic = card.querySelector(".mic"), msg = card.querySelector(".pr-msg"), word = r.l[lang].word;
    let ok = false, listening = false;
    setTimeout(() => { if(alive()) sayP(word, card.querySelector(".say")); }, 420);
    btn.onclick = advance;
    /* sin reconocimiento de voz: la dice en voz alta y toca «Lo he dicho ✓» */
    onEnter = () => ok || !canListen() ? advance() : mic.click();
    mic.onclick = async () => {
      if(listening || ok) return;
      if(!canListen()){ msg.className = "pr-msg"; msg.textContent = noVoiceMsg(); return; }
      autoTok++; const t2 = autoTok; if("speechSynthesis" in window) speechSynthesis.cancel();
      listening = true; mic.classList.add("on"); msg.className = "pr-msg"; msg.textContent = "Te escucho… di la palabra";
      const got = await listen();
      listening = false; mic.classList.remove("on");
      if(!document.body.contains(flow) || t2 !== autoTok) return;
      if(got.status !== "ok"){
        msg.className = "pr-msg bad";
        msg.textContent = got.status === "denied" ? "Permite el micrófono para esta página (icono del candado en la barra de direcciones). También puedes tocar «Saltar»."
          : got.status === "timeout" || got.status === "no-speech" ? "No te oí. Pulsa 🎤 y prueba otra vez."
          : got.status === "unsupported" ? noVoiceMsg()
          : "No se pudo usar el micrófono. Pulsa 🎤 y prueba otra vez, o toca «Saltar».";
        return;
      }
      const alts = got.alts;
      if(heard(alts, word)){
        ok = true; msg.className = "pr-msg ok"; msg.innerHTML = `¡Bien dicho! ✓ <span style="color:var(--muted)">Oí «${esc(alts[0])}»</span>`;
        btn.textContent = "Siguiente →";
        const tok2 = ++autoTok, al2 = () => tok2===autoTok && document.body.contains(flow);
        if(prUI.ex && r.l[lang].ex){ await sleep(300); if(!al2()) return; await sayP(r.l[lang].ex, card.querySelector(".ex .say")); }
        if(prUI.auto && al2()){ await sleep(1000); if(prUI.auto && al2()) advance(); }
      } else {
        msg.className = "pr-msg bad";
        msg.innerHTML = alts.length ? `Oí «${esc(alts[0])}». Escúchala otra vez y repite.` : "No te oí. Pulsa 🎤 y prueba otra vez.";
      }
    };
  } else if(act === "dictado"){
    const inp = card.querySelector("textarea.ans"), msg = card.querySelector(".pr-msg"), ex = r.l[lang].ex;
    let ok = false, fails = 0;
    setTimeout(() => { if(alive()){ sayP(ex, card.querySelector(".say.xl")); inp.focus({preventScroll:true}); } }, 520);
    inp.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); e.stopPropagation(); btn.click(); } };
    btn.onclick = () => {
      if(ok) return advance();
      const res = dictCheck(inp.value, ex);
      if(res.ok){
        ok = true; inp.classList.remove("bad"); inp.classList.add("ok"); inp.readOnly = true; bus.emit("answer", {ok: true, where: "practice"});
        msg.className = "pr-msg ok"; msg.innerHTML = res.perfect ? "¡Perfecto! ✓" : `Casi perfecto ✓ <div class="diff">${res.html}</div>`;
        btn.textContent = "Siguiente →"; btn.focus({preventScroll:true});
        card.querySelector(".tr").hidden = false;
        if(prUI.auto && res.perfect) (async () => { const t3 = ++autoTok; await sleep(1200); if(t3===autoTok && prUI.auto && document.body.contains(flow)) advance(); })();
      } else {
        fails++; inp.classList.add("bad"); msg.className = "pr-msg bad"; bus.emit("answer", {ok: false, where: "practice"});
        msg.innerHTML = `${res.hits} de ${res.total} palabras bien. En rojo lo que falta o cambia:<div class="diff">${res.html}</div>`;
        if(fails >= 2){ btn.textContent = "Seguir →"; ok = true; card.querySelector(".tr").hidden = false; }
        sayP(ex, card.querySelector(".say.xl"));
      }
    };
  } else {
    const inp = card.querySelector("input.ans"), msg = card.querySelector(".pr-msg");
    let ok = false, failed = false;
    setTimeout(() => inp.focus({preventScroll:true}), 520);
    btn.onclick = () => {
      if(ok) return advance();
      const res = checkAnswer(inp.value, r.l[lang].word);
      if(res === "ok" || res === "accents"){
        ok = true; inp.classList.remove("bad"); inp.classList.add("ok"); inp.disabled = true; bus.emit("answer", {ok: true, es: r.es, word: r.l[lang].word, where: "practice"});
        msg.className = "pr-msg ok";
        msg.innerHTML = res==="ok" ? (failed ? "Bien, ahora sí ✓" : "¡Correcto! ✓") : `Casi: revisa tildes o letras especiales: <b>${esc(r.l[lang].word)}</b>`;
        btn.textContent = "Siguiente →"; btn.focus({preventScroll:true});
        const exEl = card.querySelector(".ex"); if(exEl) exEl.hidden = false;
        play().then(ok2 => { if(ok2) autoNext(); });
      } else {
        failed = true; inp.classList.add("bad"); bus.emit("answer", {ok: false, es: r.es, word: r.l[lang].word, where: "practice"});
        msg.className = "pr-msg bad";
        msg.innerHTML = `Era <b>${esc(r.l[lang].word)}</b>. Escríbela para seguir.`;
        inp.select();
      }
    };
  }
  document.onkeydown = e => {
    if(state.mode!=="practica" || !document.body.contains(flow)) { document.onkeydown = null; return; }
    if(e.key === "Enter"){ if(e.target.tagName==="TEXTAREA") return; e.preventDefault(); onEnter(); }
  };
  $("#pr-fs").onclick = () => {
    const v = $("#view");
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(v.requestFullscreen) v.requestFullscreen().catch(()=>{});
  };
  document.onfullscreenchange = () => {
    const b = $("#pr-fs"); if(b) b.textContent = document.fullscreenElement ? "✕ Salir" : "⛶";
    if(document.body.contains(flow)) setTimeout(layout, 60);
  };
  $("#pr-tg").onclick = () => { prUI.open = !prUI.open; prRun(doc, s); };
  $("#pr-auto").onchange = e => { prUI.auto = e.target.checked; store.set("prAuto", prUI.auto); prRun(doc, s); };
  $("#pr-ex").onchange = e => { prUI.ex = e.target.checked; store.set("prEx", prUI.ex); prRun(doc, s); };
  $("#pr-stop").onclick = () => { autoTok++; if(document.fullscreenElement) document.exitFullscreen(); s.running = false; save(); prUI.hist = []; document.onkeydown = null; prSetup(doc, s); };
  $("#pr-skip").onclick = () => { w.n = s.reps; srsAdd(doc.id, [r], 2); toast(`✓ «${r.es}» marcada como aprendida`); const n = nextIdx(s, s.cur); if(n>=0) s.cur = n; prUI.hist = []; save(); prRun(doc, s); };
  document.querySelectorAll(".pr-steps li").forEach(li => li.onclick = () => {
    const k = +li.dataset.k; if(s.words[k].n >= s.reps || k===s.cur) return;
    s.cur = k; prUI.hist = []; save(); prRun(doc, s);
  });
}

/* validación superficial: sin mayúsculas, signos ni artículo obligatorio */
function checkAnswer(ans, target){
  const norm = x => x.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()…]/g," ").replace(/\s+/g," ").trim();
  const bare = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe");
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = new Set();
  for(let t of String(target).split(/\s\/\s|,\s/)){
    t = norm(t.replace(/\((m|f|pl|m\.\/f)\.?\)/g,"").replace(/\(.*?\)/g,""));
    if(!t) continue;
    cands.add(t); cands.add(t.replace(art,"").trim());
  }
  const a = norm(ans); if(!a) return "bad";
  const a2 = a.replace(art,"").trim();
  if(cands.has(a) || cands.has(a2)) return "ok";
  for(const c of cands) if(bare(c)===bare(a) || bare(c)===bare(a2)) return "accents";
  return "bad";
}

/* micrófono: devuelve las transcripciones posibles */
/* escucha una vez (como mucho ms, 7 s por defecto) y nunca se queda colgado ni falla:
   resuelve {status, alts} con status "ok" | "timeout" | "no-speech" | "denied" | "unsupported" | "busy" | "error" */
let recNow = null;
function listen(opts){
  const ms = (opts && opts.ms) || 7000;
  return new Promise(res => {
    if(!canListen()) return res({status:"unsupported", alts:[]});
    if(recNow) return res({status:"busy", alts:[]});
    let rec = null, fin = false, alts = null, timer = 0;
    const done = (status, error) => {
      if(fin) return; fin = true; clearTimeout(timer);
      if(recNow === rec) recNow = null;
      res(error ? {status, alts:alts || [], error} : {status, alts:alts || []});
    };
    try{ rec = new SR(); }catch(e){ return done("unsupported"); }
    rec.lang = (opts && opts.lang) || LANGS[lang].code; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
    rec.onresult = e => { alts = [...e.results[0]].map(a => a.transcript); done("ok"); try{ rec.stop(); }catch(_){} };
    rec.onerror = e => {
      const c = e.error || "error";
      done(c === "not-allowed" || c === "service-not-allowed" ? "denied" : c === "no-speech" ? "no-speech" : "error", c);
    };
    rec.onend = () => done(alts ? "ok" : "no-speech");
    timer = setTimeout(() => { done("timeout"); try{ rec.abort(); }catch(_){} }, ms);
    recNow = rec;
    try{ rec.start(); }catch(e){ done("busy", String(e && e.name || e)); }
  });
}
const nrm = x => String(x).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()«»…—–-]/g," ").replace(/\s+/g," ").trim();
const bareS = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe").replace(/å/g,"a");
/* basta con que la palabra aparezca en lo que se oyó (sin artículo ni tildes) */
function heard(alts, target){
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = String(target).split(/\s\/\s|,\s/).map(t => bareS(nrm(t.replace(/\(.*?\)/g,"")).replace(art,"").trim())).filter(Boolean);
  return alts.some(a => { const A = " " + bareS(nrm(a)) + " "; return checkAnswer(a, target) !== "bad" || cands.some(c => A.includes(" " + c + " ")); });
}
/* dictado: palabras en común en orden (LCS); se aceptan tildes olvidadas como "casi" */
function dictCheck(ans, ref){
  const R = nrm(ref).split(" ").filter(Boolean), A = nrm(ans).split(" ").filter(Boolean);
  const match = eq => {
    const dp = Array.from({length:R.length+1}, () => new Array(A.length+1).fill(0));
    for(let i=R.length-1; i>=0; i--) for(let j=A.length-1; j>=0; j--)
      dp[i][j] = eq(R[i], A[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    const hit = new Array(R.length).fill(false); let i=0, j=0;
    while(i<R.length && j<A.length){ if(eq(R[i], A[j])){ hit[i]=true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
    return hit;
  };
  const exact = match((a,b) => a===b), loose = match((a,b) => bareS(a)===bareS(b));
  const hits = loose.filter(Boolean).length, extra = Math.max(0, A.length - hits);
  const words = String(ref).split(/\s+/);
  const html = words.length===R.length ? words.map((w,k) => exact[k] ? esc(w) : `<span class="x">${esc(w)}</span>`).join(" ") : esc(ref);
  return {ok: hits >= Math.ceil(R.length*0.9) && extra <= 1, perfect: exact.every(Boolean) && extra===0, hits, total:R.length, html};
}

/* aviso corto en la cápsula de arriba (M.toast); un emoji al principio del texto pasa a ser su icono (🪙 = la moneda) */
const LEAD_EMOJI = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}]|\p{Regional_Indicator})*)\s*/u;
function toast(t, icon){
  t = String(t ?? "").trim(); if(!t || !window.M) return;
  if(!icon){ const m = LEAD_EMOJI.exec(t); if(m && m[0].length < t.length){ icon = m[1]; t = t.slice(m[0].length); } }
  M.toast(t, icon ? {icon: icon === "🪙" ? "coin" : icon} : {});
}

let LS = null;
async function leccion(id){
  await getMap(); document.onkeydown = null;
  if(id.startsWith("G-")) return gramLesson(id);
  const lv = id.slice(0, 2); if(!MAP[lv]) return mapa();
  const ui = MAP[lv].findIndex(u => u.ls.some(l => l.id === id)); if(ui < 0) return mapa(lv);
  const unit = MAP[lv][ui], l = unit.ls.find(l => l.id === id);
  const docs = {}; for(const [d] of l.w) docs[d] = await getDoc(d);
  const words = l.w.map(([d, i]) => ({doc:d, r:docs[d].rows[i]})).filter(x => x.r && x.r.l[lang]);
  if(!words.length) return mapa(lv);
  /* distractores: las otras palabras de la lección y, si faltan, del mismo documento */
  const pool = [...words]; const seen = new Set(words.map(x => x.r.es));
  for(const r of docs[unit.doc].rows) if(pool.length < 12 && r.es && r.l[lang] && !seen.has(r.es)){ seen.add(r.es); pool.push({doc:unit.doc, r}); }
  const steps = [...words.map(w => ({t:"learn", w})), ...shuffle(words).map((w, i) => ({t: i % 2 ? "listen" : "pick", w}))];
  LS = {id, lv, unit, words, pool, steps, i:0, nq:words.length, first:new Set(), miss:new Set(), tok:++autoTok};
  lsStep();
}
function lsOpts(w, field){
  const val = x => field === "es" ? x.r.es : x.r.l[lang].word;
  const out = [w], used = new Set([val(w)]);
  for(const x of shuffle(LS.pool)){ if(out.length >= 4) break; if(!used.has(val(x))){ used.add(val(x)); out.push(x); } }
  return shuffle(out).map(x => val(x));
}
function lsStep(){
  const s = LS; if(!s) return;
  if(s.i >= s.steps.length) return lsEnd();
  const st = s.steps[s.i], r = st.w.r, d = r.l[lang], lc = LVS[s.lv].c;
  const pct = Math.round(100 * s.i / s.steps.length);
  let body = "";
  if(st.t === "learn"){
    body = `<div class="ls-card"><div class="tag">Palabra nueva</div>${imgHtml(r)}
      <div class="es">${esc(r.es)}</div><div class="big">${esc(d.word)}</div>
      <div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}</div>
      <div class="ls-foot"><span class="msg"></span><button class="btn lc" id="ls-go">Continuar</button></div>`;
  } else {
    const listen = st.t === "listen", field = listen ? "es" : "word";
    const opts = lsOpts(st.w, field), right = listen ? r.es : d.word;
    st.right = right;
    body = `<div class="ls-card"><div class="tag">${listen ? "Escucha y elige qué significa" : "¿Cómo se dice en "+LANGS[lang].name+"?"}</div>
      ${listen ? `<div class="sayrow"><button class="say xl" data-say="${esc(d.word)}" aria-label="Escuchar" style="width:72px;height:72px;font-size:1.8rem">🔊</button>${slowBtn(d.word)}</div>`
               : `${imgHtml(r)}<div class="q">${esc(r.es)}</div>`}
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-o="${esc(o)}"><span style="color:var(--muted);font-weight:400">${k+1}</span> ${esc(o)}</button>`).join("")}</div></div>
      <div id="ls-fb"></div>`;
  }
  $("#app").innerHTML = `<div class="ls" style="--lc:${lc}">
    <div class="ls-top"><a class="x" href="#/mapa/${s.lv}" title="Salir" aria-label="Salir">✕</a><div class="ls-prog"><i style="width:${pct}%"></i></div></div>
    ${body}</div>`;
  const tok = s.tok;
  if(st.t === "learn"){
    setTimeout(() => { if(LS === s && autoTok === tok) sayP(d.word, $(".ls-card .say")); }, 250);
    $("#ls-go").onclick = () => { s.i++; lsStep(); };
    document.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("#ls-go") && $("#ls-go").click(); } };
  } else {
    if(st.t === "listen") setTimeout(() => { if(LS === s && autoTok === tok) sayP(d.word, $(".ls-card .say")); }, 250);
    const pick = b => {
      if(st.done) return; st.done = true;
      const ok = b.dataset.o === st.right;
      bus.emit("answer", {ok, es: r.es, word: d.word, where: "lesson"});
      $(".ls-card").querySelectorAll(".opt").forEach(o => { o.disabled = true; if(o.dataset.o === st.right) o.classList.add("ok"); });
      if(!ok) b.classList.add("bad");
      const key = st.w.r.es;
      if(ok){ if(!s.miss.has(key)) s.first.add(key); }
      else { s.miss.add(key); s.steps.push({t: st.t === "pick" ? "listen" : "pick", w: st.w}); }
      $("#ls-fb").innerHTML = `<div class="ls-foot ${ok?"ok":"bad"}"><span class="msg">${ok ? "¡Muy bien!" : "Respuesta correcta:"}
        <small>${esc(d.word)} = ${esc(r.es)}</small></span>${sayBtn(d.word)}<button class="btn lc" id="ls-go">Continuar</button></div>`;
      if(st.t === "pick" || !ok) sayP(d.word);
      $("#ls-go").onclick = () => { s.i++; lsStep(); };
      $("#ls-go").focus({preventScroll:true});
    };
    $(".ls-card").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));
    document.onkeydown = e => {
      if(e.target.tagName === "INPUT") return;
      const n = parseInt(e.key); const os = $(".ls-card") ? $(".ls-card").querySelectorAll(".opt") : [];
      if(n >= 1 && n <= os.length && !st.done) pick(os[n-1]);
      else if(e.key === "Enter" && st.done){ e.preventDefault(); $("#ls-go") && $("#ls-go").click(); }
    };
  }
}
function lsEnd(){

async function getGram(){

const gId = (lv, k) => `G-${lv}-${String(k+1).padStart(2,"0")}`;
function lvUnits(lv){                     /* unidades del nivel con las lecciones de gramática intercaladas */
  const g = (GRAM[lang] || {})[lv] || [], N = MAP[lv].reduce((a, u) => a + u.ls.length, 0);

    n++; const out = [l];

}

  const g = game(), fresh = achList().filter(a => a.ok && !g.ach[a.id]);

    for(const a of fresh) g.ach[a.id] = dayKey(new Date());

    fresh.forEach((a, i) => setTimeout(() => { toast(`${a.e} ¡Nueva medalla: ${a.t}! +20 🪙`); bus.emit("medal", a); }, 400 + i * 2400));

function giftCheck(){
  const g = game(), n = Object.keys(allMapP()).length, due = Math.floor(n / 5);
  if(due <= g.gifts) return false;
  g.gifts = due;
  const pool = SHOP.filter(x => !g.owned[x.id] && x.p > 0 && x.p <= 120);
  const it = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  if(it){ g.owned[it.id] = true; } else { g.coins += 50; g.earned += 50; }
  gameSet(g); showGift(it); return true;
}

/* ---------- «Reducir movimiento» de Ajustes (html[data-motion=calm]) = el del aparato ----------
   Las reglas de cada hoja de estilos para @media (prefers-reduced-motion: reduce) se copian con :root[data-motion=calm]
   delante en <style id="css-calm">: las de esta página y las que inyectan los módulos (se vuelve a copiar cuando entra
   un <style> nuevo en el <head>). La regla general (≤150 ms y sin bucles) está en el CSS de arriba. */
function calmCss(){
  const PRE = ":root[data-motion=calm]", RMQ = /prefers-reduced-motion\s*:\s*reduce/;
  const split = sel => { const out = []; let d = 0, cur = ""; for(const ch of sel){ if(ch === "(" || ch === "[") d++; else if(ch === ")" || ch === "]") d--; if(ch === "," && !d){ out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(x => x.trim()).filter(Boolean); };
  const pre = sel => split(sel).map(x => { const m = /^(?::root|html)(?![\w-])/.exec(x); return m ? PRE + x.slice(m[0].length) : `${PRE} ${x}`; }).join(",");
  const head = r => r.cssText.slice(0, r.cssText.indexOf("{")).trim();
  const copy = list => { let o = ""; for(const r of list){ if(r.selectorText !== undefined && r.style) o += `${pre(r.selectorText)}{${r.style.cssText}}`; else if(r.cssRules) o += `${head(r)}{${copy(r.cssRules)}}`; else o += r.cssText; } return o; };
  const walk = list => { let o = ""; for(const r of list){
    if(r.media && r.cssRules && RMQ.test(r.media.mediaText)) o += copy(r.cssRules);
    else if(r.cssRules && r.selectorText === undefined && !/^@(-webkit-)?keyframes/i.test(r.cssText)){ const i = walk(r.cssRules); if(i) o += `${head(r)}{${i}}`; }
  } return o; };
  let css = "";
  for(const sh of document.styleSheets){
    if(sh.ownerNode && sh.ownerNode.id === "css-calm") continue;
    let rules = null; try{ rules = sh.cssRules; }catch(e){}
    if(rules) try{ css += walk(rules); }catch(e){ console.warn("[calm]", e); }
  }
  let el = document.getElementById("css-calm");
  if(!el){ el = document.createElement("style"); el.id = "css-calm"; document.head.appendChild(el); }
  if(el.textContent !== css) el.textContent = css;
}
{ let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(calmCss, 30); }).observe(document.head, {childList: true}); }

async function route(){
  autoTok++; if(state.fc) state.fc.auto = false; if("speechSynthesis" in window) speechSynthesis.cancel();
  const h = location.hash.replace(/^#\/?/,""), hp = hashPath();
  /* la pestaña se marca al momento (cambiar de pestaña es instantáneo); el título, los segmentos y el modo foco, con la
     pantalla nueva. Si se vuelve a una pestaña, su scroll de antes (tabRestore lo pone goTab). */
  const restoreY = tabRestore; tabRestore = null; ROUTE_RESTORE = restoreY != null;
  langMenu(false); paintTabs(hp);
  const t = tabOf(hp); if(t){ TABMEM[t.id] = {h: memHash(hp), y: restoreY || 0}; memSave(); }
  try{
    await getShop();
    if(h.startsWith("doc/")){
      const id = h.slice(4);
      if(state.doc!==id){ state.doc=id; state.q=""; state.lvl=""; state.fc={i:0,flip:false,order:null,rev:false}; state.test=null; }
      else { state.test=null; state.fc.order=null; }
      await docView(id);
    } else if(h.startsWith("mapa")){ state.doc=null; await mapa(h.split("/")[1]); }
    else if(h.startsWith("gramatica")){ state.doc=null; await gramatica(h.split("/")[1]); }
    else if(h.startsWith("leccion/")){ state.doc=null; await leccion(h.slice(8)); }
    else if(h.startsWith("repaso")){ state.doc=null; await repaso(); }
    else if(h.startsWith("progreso")){ state.doc=null; await premios(); }
    else if(h.startsWith("granja")){ state.doc=null; await granja(); }
    else if(h.startsWith("palabras")){ state.doc=null; await palabras(); }
    else if(ROUTES[h.split("/")[0]]){ state.doc=null; document.onkeydown = null; await ROUTES[h.split("/")[0]](h.split("/").slice(1)); }
    else { state.doc=null; await home(); }
  }catch(e){ console.error(e); $("#app").innerHTML = `<p class="empty">No se pudo cargar. ${esc(e.message)}</p>`; }
  /* si mientras se pintaba se fue a otra ruta, la nueva se encarga de las barras y del scroll */
  if(hashPath() === hp){
    paintTabs(hp); updFocus(); paintHead(hp);
    if(restoreY != null) restoreScroll(restoreY); else if(!h.startsWith("mapa")) window.scrollTo(0,0);
  }
  ROUTE_RESTORE = false;
  bus.emit("route", {h});
}
window.addEventListener("hashchange", route);
