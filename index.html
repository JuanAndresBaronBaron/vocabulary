<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary – Vocabulario</title>
<meta name="application-name" content="Vocabulary">
<meta name="description" content="Vocabulary: a free app for children to learn British English, French and Danish vocabulary.">
<meta name="description" content="Vocabulario en inglés británico, francés y danés con imagen, pronunciación, IPA, ejemplos y audio.">
<script>
/* tema: «light» o «dark» guardados en "theme"; sin clave (o con otro valor) = Automático, sigue al sistema */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("theme"))}catch(e){}
if(t!=="light"&&t!=="dark")t=null;
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocabulario">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* ===================== Cimientos (rediseño F1) =====================
   Tokens en :root (claro) y :root[data-theme=dark] (el script del <head> resuelve el tema: «Automático» = sin clave).
   Material: .glass (vidrio flotante con desenfoque de verdad; usa ::before para el borde) · .glass-btn (vidrio sobre
   contenido, sin desenfoque; ::before borde, ::after brillo desde --mx/--my con .is-pressed) · .btn-fill (cápsula
   sólida) · .ok-fill / .miss-fill (acierto / fallo gris) · .card (contenido sólido) · .ico (sprite Phosphor) · kbd.
   Interruptores en <html>: data-glass="off|lite" · data-contrast="more" · data-text="large".
   Texto: usa los --fs-* (ya respetan el tamaño de texto del sistema en iOS). */
:root{
  color-scheme:light;
  /* superficies y texto (label2 a .76 y no .6: así el texto secundario pasa 4,5:1 sobre #F2F2F7) */
  --bg:#F2F2F7;--card:#FFFFFF;--card-2:#F2F2F7;--card-hi:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.76);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.12);
  /* marca: --brand-fill (fondo con texto blanco) · --brand-tint (iconos y texto sobre blanco) ·
     --brand-ink (texto azul que puede caer sobre el fondo gris o sobre vidrio) */
  --brand-fill:#1E6EF4;--brand-tint:#1E6EF4;--brand-ink:#185CCF;--brand-soft:rgba(30,110,244,.12);
  /* estados: acierto verde, fallo GRIS (nunca rojo) */
  --ok:#34C759;--ok-fill:#008932;--ok-ink:#007F2E;--ok-soft:rgba(52,199,89,.16);
  --miss:#8E8E93;--miss-ink:#6C6C70;--miss-fill:rgba(120,120,128,.22);--miss-on:#48484A;
  /* monedas, marca y adorno de progreso */
  --gold:#FFCC00;--gold-ink:#A16A00;--gold-soft:rgba(255,204,0,.22);--gold-deep:#B38F00;--gold-on:#3D2B00;
  --navy:#0B2545;--teal:#008198;
  /* vidrio flotante */
  --g-tint:rgba(255,255,255,.62);--g-top:rgba(255,255,255,.5);--g-solid:#FFFFFF;
  --g-rim1:rgba(255,255,255,1);--g-rim2:rgba(255,255,255,.16);--g-edge:rgba(0,0,0,.07);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.95);--g-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
  /* vidrio sobre contenido (botones) */
  --neu:#E9E9EE;--neu-ink:#000000;--hb-shadow:0 4px 12px -4px rgba(30,110,244,.45);
  /* tipografía (rem; --k corrige la base de 17 px del texto de sistema en iOS y sube con «Texto más grande») */
  --k:1;
  --f-text:system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  --fs-lt:calc(2.25rem*var(--k));--fs-t1:calc(1.875rem*var(--k));--fs-t2:calc(1.5rem*var(--k));--fs-t3:calc(1.375rem*var(--k));
  --fs-head:calc(1.1875rem*var(--k));--fs-body:calc(1.1875rem*var(--k));--fs-sub:calc(1.0625rem*var(--k));
  --fs-note:calc(.9375rem*var(--k));--fs-min:calc(.8125rem*var(--k));--fs-tab:calc(.75rem*var(--k));--fs-word:calc(2.75rem*var(--k));
  /* medidas */
  --r-card:24px;--r-sheet:32px;--r-menu:20px;--r-pill:999px;--r-md:16px;--r-sm:12px;
  --tap:44px;--tap-bar:48px;--row:52px;--btn-main:56px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--gutter:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --z-bar:10;--z-acc:11;--z-sheet:20;--z-toast:30;
  /* nombres de antes (los usan las pantallas y los módulos js/*.js hasta que se rehagan) */
  --ink:var(--label);--muted:var(--label2);--line:var(--fill);--soft:var(--fill2);--cat:var(--fill2);
  --brand:var(--brand-ink);--brand-2:var(--label2);--bad:var(--miss-ink);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--card-2:#2C2C2E;--card-hi:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.32);--fill2:rgba(120,120,128,.24);
  --brand-tint:#0091FF;--brand-ink:#409CFF;--brand-soft:rgba(0,145,255,.18);
  --ok:#30D158;--ok-ink:#30D158;--ok-soft:rgba(48,209,88,.18);
  --miss-ink:#AEAEB2;--miss-fill:rgba(120,120,128,.36);--miss-on:rgba(235,235,245,.7);
  --gold:#FFD600;--gold-ink:#FFD600;--gold-soft:rgba(255,214,0,.16);--gold-deep:#A68B00;--gold-on:#1C1C1E;
  --teal:#00D2E0;
  --g-tint:rgba(28,28,30,.62);--g-top:rgba(255,255,255,.10);--g-solid:#2C2C2E;
  --g-rim1:rgba(255,255,255,.5);--g-rim2:rgba(255,255,255,.12);--g-edge:rgba(0,0,0,.6);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.22);--g-shadow:0 10px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --neu:#3A3A3C;--neu-ink:#FFFFFF;--hb-shadow:0 6px 16px -6px rgba(0,0,0,.7);
  --shadow:none;
}
/* iOS: el tamaño de texto del sistema (Dynamic Type) fija la base; en el Mac (13 px) no se aplica */
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html{font:-apple-system-body}:root{--k:.9412}}
html[data-text=large]{--k:1.18}
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html[data-text=large]{--k:1.11}}
@media (min-width:744px){:root{--gutter:24px}}
/* más contraste (sistema o Ajustes): texto secundario y separadores más fuertes */
@media (prefers-contrast:more){
  :root{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
  :root[data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}}
:root[data-contrast=more]{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
:root[data-contrast=more][data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}
[data-theme=dark] .img img{background:#fff;border-radius:10px}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 var(--fs-sub)/1.4 var(--f-text);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}

/* ---------- tipografía (escala grande de iOS) ---------- */
.t-lt{font:700 var(--fs-lt)/1.2 var(--f-round);letter-spacing:.005em}
.t-1{font:700 var(--fs-t1)/1.2 var(--f-round)}
.t-2{font:700 var(--fs-t2)/1.2 var(--f-round)}
.t-3{font:700 var(--fs-t3)/1.22 var(--f-round)}
.t-head{font:600 var(--fs-head)/1.26 var(--f-text)}
.t-body{font:400 var(--fs-body)/1.3 var(--f-text)}
.t-sub{font:400 var(--fs-sub)/1.3 var(--f-text);color:var(--label2)}
.t-note{font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.t-min{font:400 var(--fs-min)/1.38 var(--f-text);color:var(--label2)}
.t-tab{font:600 var(--fs-tab)/1.17 var(--f-text)}
.t-word{font:700 var(--fs-word)/1.18 var(--f-round)}
.t-num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- iconos (sprite Phosphor al principio del <body>; ico(nombre, estilo, tamaño)) ---------- */
.ico{display:inline-block;flex:none;fill:currentColor;vertical-align:middle;overflow:visible;pointer-events:none}

/* ---------- utilidades de estado: acierto en verde lleno, fallo en gris (nunca rojo) ---------- */
.ok-fill{background:var(--ok-fill)!important;color:#fff!important;border-color:transparent!important}
.miss-fill{background:var(--miss-fill)!important;color:var(--miss-on)!important;border-color:transparent!important}
.ok-ink{color:var(--ok-ink)}
.miss-ink{color:var(--miss-ink)}

/* ---------- contenido sólido ---------- */
.card{background:var(--card);color:var(--label);border-radius:var(--r-card)}

/* ---------- vidrio flotante (barras, hojas, menús, avisos): desenfoque con valores literales ---------- */
:where(.glass:not(dialog):not([popover])){position:relative}
.glass{color:var(--label);
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-tint);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:var(--g-hi),0 0 0 .5px var(--g-edge),var(--g-shadow)}
.glass::before,.glass-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* versión ligera (sin desenfoque, más opaca): granja, juegos, o html[data-glass=lite] */
.glass.lite,:root[data-glass=lite] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(255,255,255,.9)}
:root[data-theme=dark] .glass.lite,:root[data-theme=dark][data-glass=lite] .glass{
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(28,28,30,.9)}

/* ---------- vidrio sobre contenido: botones de acción (sin desenfoque, tinte opaco) ---------- */
.glass-btn{--g-rim1:rgba(255,255,255,.75);--g-rim2:rgba(255,255,255,.12);
  position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border:0;border-radius:var(--r-pill);
  font:600 var(--fs-head)/1.15 var(--f-text);letter-spacing:-.01em;text-align:center;text-decoration:none;color:var(--neu-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 50%),var(--neu);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.glass-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);
  transition:opacity var(--d-fast,160ms) ease}
.glass-btn.is-pressed::after{opacity:1}
.glass-btn--pri{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 40%),var(--brand-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.10),var(--hb-shadow)}
.glass-btn--ok{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 50%),var(--ok-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.10),0 6px 16px -6px rgba(0,137,50,.6)}
:root[data-theme=dark] .glass-btn{--g-rim1:rgba(255,255,255,.45);--g-rim2:rgba(255,255,255,.08)}
:root[data-theme=dark] .glass-btn:not(.glass-btn--pri):not(.glass-btn--ok){
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 50%),var(--neu);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.glass-btn--lg{min-height:var(--btn-main);padding:0 28px}
.glass-btn--sm{min-height:var(--tap);padding:0 16px;font-size:var(--fs-sub)}
.glass-btn--icon{width:var(--tap);min-height:var(--tap);padding:0;flex:none}
.glass-btn--block{display:flex;width:100%}
.glass-btn:disabled,.glass-btn[aria-disabled=true]{opacity:.45;cursor:default}
.glass-btn:focus-visible,.btn-fill:focus-visible,.glass :focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}

/* ---------- cápsula sólida (filas, tienda, listas) ---------- */
.btn-fill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 18px;border:0;
  border-radius:var(--r-pill);font:600 var(--fs-sub)/1.15 var(--f-text);text-decoration:none;color:#fff;background:var(--brand-fill);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn-fill--neu{background:var(--fill);color:var(--label)}
.btn-fill--ok{background:var(--ok-fill);color:#fff}
.btn-fill--gold{background:var(--gold);color:var(--gold-on)}
.btn-fill:disabled,.btn-fill[aria-disabled=true]{background:var(--fill2);color:var(--label3);cursor:default}

/* ---------- teclas (etiquetas grises que salen tras la primera tecla) ---------- */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border-radius:7px;
  font:600 var(--fs-min)/1 var(--f-text);color:var(--label2);background:var(--fill);box-shadow:inset 0 -1px 0 var(--sep);
  vertical-align:middle;white-space:nowrap}

/* ---------- si el aparato no puede o el niño lo necesita ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(255,255,255,.95)}
  :root[data-theme=dark] .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(28,28,30,.95)}}
:root[data-glass=off] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}
@media (prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}}
@media (prefers-contrast:more){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
  .glass::before,.glass-btn::before{display:none}
  .glass-btn{border:2px solid var(--sep)}}
:root[data-contrast=more] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
:root[data-contrast=more] .glass::before,:root[data-contrast=more] .glass-btn::before{display:none}
:root[data-contrast=more] .glass-btn{border:2px solid var(--sep)}
@media (forced-colors:active){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas;color:CanvasText;border:1px solid CanvasText;box-shadow:none}
  .glass-btn,.btn-fill{border:2px solid ButtonText;background:ButtonFace;color:ButtonText;box-shadow:none}
  .glass::before,.glass-btn::before,.glass-btn::after{display:none}
  .ico{fill:currentColor;forced-color-adjust:auto}}
/* cabecera en dos filas: arriba el nombre, ajustes e idioma (se va al bajar); abajo las secciones (se queda fija) */
header{position:sticky;top:-48px;z-index:10;color:var(--label);padding-top:var(--safe-t);box-shadow:0 .5px 0 var(--sep);
  background:rgba(242,242,247,.72);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
:root[data-theme=dark] header{background:rgba(22,22,24,.72)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header{background:rgba(242,242,247,.97)}:root[data-theme=dark] header{background:rgba(22,22,24,.97)}}
:root[data-glass=off] header,:root[data-glass=lite] header{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
@media (prefers-reduced-transparency:reduce){header{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}}
header .wrap{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"logo . tools langs" "nav nav nav nav";align-items:center;gap:6px 10px;padding-top:8px;padding-bottom:8px}
.logo{grid-area:logo;font-weight:700;font-size:1.15rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:40px;border-radius:12px}
.htools{grid-area:tools;display:flex;gap:6px;align-items:center}
.langs{grid-area:langs;display:flex;background:var(--fill);border-radius:999px;padding:2px;height:44px}
.langs button{border:0;background:none;color:var(--label);padding:0 13px;height:40px;border-radius:999px;font-size:.95rem;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.langs button.on{background:var(--card-hi);color:var(--label);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
.langs .fl{font-size:1.05rem}
main{padding:20px 0 40px}
h1{font:700 1.75rem/1.2 var(--f-round);margin:4px 0 6px}
h2{font:700 1.25rem/1.25 var(--f-round);margin:28px 0 10px;color:var(--label)}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.doc{display:block;text-decoration:none;background:var(--card);border:1px solid transparent;border-radius:18px;padding:14px;box-shadow:var(--shadow);transition:transform .1s}
.doc:hover{transform:translateY(-2px);border-color:var(--brand)}
.doc .n{font-size:.8rem;color:var(--muted)}
.doc .t{font-weight:600;margin:2px 0 4px}
.doc .c{font-size:.85rem;color:var(--muted)}
.doc.off{opacity:.45;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 16px}
.tabs{display:flex;background:var(--fill2);border:0;border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;min-height:38px;font-weight:600}
.tabs button.on{background:var(--card);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme=dark] .tabs button.on{background:#636366}
input[type=search]{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.88rem;min-height:36px}
.chip.on{background:var(--brand-fill);border-color:transparent;color:#fff;font-weight:600}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none}
.cat{background:var(--cat);color:var(--brand-2);font-weight:700;font-size:.9rem;letter-spacing:.03em;padding:7px 12px;border-radius:8px;margin:18px 0 8px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--card);border:1px solid transparent;border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.img{display:flex;align-items:center;justify-content:center}
.img img{max-width:88px;max-height:88px}
.row.wide{grid-template-columns:150px 1fr}.row.wide .img img{max-width:146px;max-height:110px}

/* test */

.opt.ok::before{content:"✓ ";font-weight:800}.opt.bad::before{content:"✗ ";font-weight:800}

.opt.bad{border-color:transparent;background:var(--miss-fill);color:var(--miss-on)}

@media (max-width:560px){
  .row{grid-template-columns:64px 1fr;gap:10px;padding:10px}
  .img img{max-width:60px;max-height:60px}.row.wide{grid-template-columns:104px 1fr}.row.wide .img img{max-width:100px;max-height:90px}.img .ph{width:52px;height:52px}
  .word{font-size:1.15rem}.opts{grid-template-columns:1fr}
}
/* práctica 21 */
.pr-setup{background:var(--card);border:1px solid transparent;border-radius:var(--r-card);box-shadow:var(--shadow);padding:20px;max-width:760px}
.pr-setup h2{margin-top:0}

.pr-act{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}

.pr-act:has(input:checked){border-color:var(--brand);background:var(--soft)}

.pr-words{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.pr-words label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:.92rem;cursor:pointer}
.pr-words input{accent-color:var(--brand)}
.pr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr-start{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.pr-start .count{margin-left:auto}
.pr-resume{background:var(--soft);border:1px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr-resume b{margin-right:auto}
.pr{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.pr-panel{background:var(--card);border:1px solid transparent;border-radius:20px;box-shadow:var(--shadow);padding:16px;position:sticky;top:76px}
.pr-panel .lbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pr-panel .ttl{font-size:1.1rem;font-weight:700;margin:4px 0 2px}
.pr-panel .sub2{color:var(--muted);font-size:.85rem}
.pr-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}
.pr-bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.pr-toggle{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:.85rem}
.pr-steps{list-style:none;margin:12px 0 0;padding:0;max-height:calc(100vh - 290px);overflow:auto}
.pr-steps li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 6px 10px;border-radius:10px;cursor:pointer}
.pr-steps li:not(:last-child)::before{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.pr-steps li.done:not(:last-child)::before{background:var(--brand)}
.pr-steps .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);z-index:1}
.pr-steps li.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.pr-steps li.cur{background:var(--soft);box-shadow:inset 3px 0 0 var(--brand)}
.pr-steps li.cur .dot{border-color:var(--brand);color:var(--brand)}
.pr-steps .w{font-weight:600;line-height:1.2}
.pr-steps li.cur .w{color:var(--brand)}
.pr-steps .s{font-size:.82rem;color:var(--muted)}
.pr-steps .acts{margin-top:4px;font-size:.82rem;display:grid;gap:2px}
.pr-steps .acts .ok{color:var(--ok-ink)}
.pr-stage{min-width:0}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pr-flow{position:relative;height:520px;border-radius:22px;overflow:hidden;
  background:var(--navy);box-shadow:var(--shadow)}
.pr-card{position:absolute;left:50%;top:calc(50% - 14px);width:var(--cw,300px);min-height:420px;margin-left:calc(var(--cw,300px) / -2);
  background:var(--card);border-radius:18px;box-shadow:0 18px 40px rgba(20,20,60,.28);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s;will-change:transform}
.pr-card.side{pointer-events:none;filter:saturate(.85)}

.pr-hero{position:relative;flex:0 0 46%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tagc) 20%,#f4f5fb)}

[data-theme=dark] .pr-hero{background:color-mix(in srgb,var(--tagc) 26%,#dfe3f0)}

.pr-tag{position:absolute;left:14px;bottom:12px;font-size:.68rem;font-weight:800;letter-spacing:.09em;color:#fff;background:var(--tagc,#2e5c8a);border-radius:99px;padding:4px 11px}
.pr-num{position:absolute;right:12px;top:10px;font-size:.72rem;font-weight:700;color:rgba(0,0,0,.45)}
.pr-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 18px 18px;text-align:center}
.pr-card .es2{font-size:1.1rem;color:var(--muted);font-weight:700}
.pr-card.side .es2{font-size:1.25rem;color:var(--ink)}
.pr-card .big{font-size:1.8rem;font-weight:800;line-height:1.15}
.pr-card .meta{justify-content:center;margin:0}
.pr-card .ex{font-size:.88rem}
.pr-card .say.xl{width:62px;height:62px;font-size:1.6rem}
.pr-card input.ans{width:100%;font:inherit;font-size:1.15rem;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.pr-card input.ans:focus{outline:none;border-color:var(--brand)}
.pr-card input.ans.ok{border-color:var(--ok)}
.pr-card input.ans.bad{border-color:var(--bad)}
.pr-msg{min-height:1.3em;font-size:.9rem}
.pr-msg.ok{color:var(--ok-ink)}.pr-msg.bad{color:var(--miss-ink)}
.pr-card .btn.pri{min-width:160px;margin-top:4px}
.pr-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 16px}
.pr-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,transform .3s}

.pr-fs{position:absolute;right:12px;top:12px;z-index:30;border:0;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;padding:6px 10px;font-size:.85rem;backdrop-filter:blur(4px)}

#view:fullscreen{background:var(--bg);padding:20px;overflow:auto}
#view:fullscreen .pr{grid-template-columns:300px 1fr}

.pr-opt{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;cursor:pointer;user-select:none}
.pr-opt input{accent-color:var(--brand);width:16px;height:16px}
.pr-opt:has(input:checked){border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:600}
.pr-keys{font-size:.8rem;color:var(--muted);text-align:center}
.pr-toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--label);color:var(--bg);padding:10px 18px;border-radius:99px;box-shadow:var(--shadow);font-weight:600;z-index:20;animation:pop .3s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.pr-end{text-align:center;padding:30px 20px}

/* cabecera: accesos */

<footer class="wrap">Inglés británico · Francés · Danés — Imágenes: <a href="https://openmoji.org">OpenMoji</a> (CC BY-SA 4.0). Iconos: <a href="https://phosphoricons.com">Phosphor</a> (<a href="icons/PHOSPHOR-LICENSE">MIT</a>). Audio: ElevenLabs y voz del navegador. · <b>Vocabulary</b> · <a href="privacy.html">Privacy Policy / Privacidad</a></footer>
<script>
const LANGS = {
  english:  {label:"🇬🇧 English",  name:"inglés",  code:"en-GB"},
  "français":{label:"🇫🇷 Français", name:"francés", code:"fr-FR"},
  dansk:    {label:"🇩🇰 Dansk",    name:"danés",   code:"da-DK"},
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","english"); if(!LANGS[lang]) lang="english";
let rate = store.get("rate",0.9);
let INDEX = null; const CACHE = {};
const $ = s => document.querySelector(s);
/* conexión con los módulos js/*.js: eventos, rutas y huecos de la portada */
const bus = {h:{}, on(e, f){ (this.h[e] = this.h[e] || []).push(f); }, emit(e, d){ (this.h[e] || []).forEach(f => { try{ f(d); }catch(err){ console.error(err); } }); }};
const ROUTES = {};      /* ROUTES["juegos"] = async partes => {...}   (#/juegos/…) */
const HOME_ACTS = [];   /* {href, e, t, sub, color} botones grandes extra de la portada */
const HOME_SLOTS = [];  /* async () => html, se pinta bajo los botones grandes */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* icono del sprite Phosphor: ico("house", "fill", 28, "x") → <svg class="ico x">…; estilo "bold" (contorno) o "fill" (relleno) */
function ico(name, style = "bold", size = 24, cls = ""){
  return `<svg class="ico${cls ? " " + cls : ""}" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="#i-${name}-${style}"></use></svg>`;
}

/* ---------- audio ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); voiceNote(); }; }
function voiceFor(code){
  const base = code.slice(0,2);
  const pick = store.get("voice:"+lang, null);
  if(pick){ const v = voices.find(v => v.name===pick); if(v) return v; }
  const c = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  return c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase() && /natural|online|google|neural/i.test(v.name))
      || c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase()) || c[0] || null;
}
function speakable(t){
  return String(t).replace(/\((m|f|m\.\/f\.|pl)\.?\)/g,"").replace(/\(.*?\)/g,"").replace(/\s\/\s/g,", ").replace(/—/g,"").trim();
}
/* audios grabados (ElevenLabs): audio/<en|fr|da>.json dice qué archivo tiene cada palabra;
   si una palabra no tiene audio o no carga, habla la voz del navegador como siempre */
const CLIP_AB = {english:"en", "français":"fr", dansk:"da"};
const clipMaps = {};
function loadClips(l){
  if(clipMaps[l] || !CLIP_AB[l]) return;
  clipMaps[l] = {};
  fetch(`audio/${CLIP_AB[l]}.json`).then(r => r.ok ? r.json() : {}).then(m => { clipMaps[l] = m || {}; }).catch(() => {});
}
loadClips(lang);
const clipFor = t => { const m = clipMaps[lang]; return m && m[speakable(t)]; };
let clipEl = null, clipEnd = null;
function stopClip(){
  if(clipEl){ try{ clipEl.pause(); }catch(e){} clipEl = null; }
  if(clipEnd){ const f = clipEnd; clipEnd = null; f(); }
}
if("speechSynthesis" in window){
  const cancel0 = speechSynthesis.cancel.bind(speechSynthesis);
  try{ speechSynthesis.cancel = () => { stopClip(); cancel0(); }; }catch(e){}
}
/* toca el audio grabado; done(true) al acabar, done(false) si no se pudo (y entonces habla el navegador) */
function playClip(text, slow, done){
  const id = clipFor(text); if(!id) return false;
  const a = new Audio(`audio/${CLIP_AB[lang]}/${id}.mp3`);
  a.preservesPitch = true;
  a.playbackRate = slow ? 0.7 : Math.min(1.25, Math.max(0.75, rate / 0.9));
  clipEl = a;
  let fin = false;
  const end = ok => { if(fin) return; fin = true; if(clipEl === a) clipEl = null; if(clipEnd === endOk) clipEnd = null; done(ok); };
  const endOk = () => end(true);
  clipEnd = endOk;
  a.onended = () => end(true);
  a.onerror = () => end(false);
  a.play().catch(() => end(false));
  return true;
}
function say(text, btn, slow){
  if(!("speechSynthesis" in window) && !clipFor(text)) return alert("Tu navegador no permite audio.");
  if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
  document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
  if(btn) btn.classList.add("playing");
  const off = () => { if(btn) btn.classList.remove("playing"); };
  const tts = () => {
    if(!("speechSynthesis" in window)) return off();
    const u = new SpeechSynthesisUtterance(speakable(text));
    const code = LANGS[lang].code; u.lang = code; u.rate = slow ? SLOW() : rate;
    const v = voiceFor(code); if(v) u.voice = v;
    u.onend = u.onerror = off;
    speechSynthesis.speak(u);
  };
  if(!playClip(text, slow, ok => ok ? off() : tts())) tts();
}
/* audio encadenado para las secuencias automáticas */
let autoTok = 0;
const sleep = ms => new Promise(res => setTimeout(res, ms));
function sayP(text, btn){
  return new Promise(res => {
    if(!text || (!("speechSynthesis" in window) && !clipFor(text))) return res();
    if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
    document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
    let done = false;
    const fin = () => { if(done) return; done = true; if(btn) btn.classList.remove("playing"); res(); };
    if(btn) btn.classList.add("playing");
    const tts = () => {
      if(!("speechSynthesis" in window)) return fin();
      const u = new SpeechSynthesisUtterance(speakable(text));
      const code = LANGS[lang].code; u.lang = code; u.rate = rate;
      const v = voiceFor(code); if(v) u.voice = v;
      u.onend = u.onerror = fin;
      setTimeout(fin, 1500 + speakable(text).length * 110 / rate);
      setTimeout(() => speechSynthesis.speak(u), 30);
    };
    if(playClip(text, false, ok => ok ? fin() : (done ? 0 : tts()))) setTimeout(fin, 8000);
    else tts();
  });
}
function voiceNote(){
  const el = $("#voicenote"); if(!el) return;
  if(!("speechSynthesis" in window)){ el.innerHTML = "Tu navegador no permite audio."; el.hidden=false; return; }
  if(voices.length && !voiceFor(LANGS[lang].code)){
    el.innerHTML = `Este dispositivo no tiene una voz en ${LANGS[lang].name}, así que el audio puede sonar con acento equivocado. En Windows: <b>Configuración › Hora e idioma › Voz › Agregar voces</b>. En Android o iPhone: ajustes de texto a voz. Chrome y Edge suelen traer más voces.`;
    el.hidden = false;
  } else el.hidden = true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if(!b) return;
  e.stopPropagation(); say(b.dataset.say, b, b.hasAttribute("data-slow"));
});
const slowBtn = (t, sm) => `<button class="say tt${sm?" sm":""}" data-say="${esc(t)}" data-slow title="Escuchar despacio" aria-label="Escuchar despacio">🐢</button>`;
const sayBtn = (t, sm) => t ? `<span class="sayg"><button class="say${sm?" sm":""}" data-say="${esc(t)}" title="Escuchar" aria-label="Escuchar">🔊</button>${slowBtn(t, sm)}</span>` : "";
const SLOW = () => Math.max(0.35, rate * 0.55);


/* ---------- voz y velocidad ---------- */
const SAMPLE = {english:"Hello! This is how I sound.", "français":"Bonjour ! Voici ma voix.", dansk:"Hej! Sådan lyder min stemme."};
function openCfg(after){
  const d = $("#cfg"), code = LANGS[lang].code, base = code.slice(0,2);
  const vs = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  const cur = (voiceFor(code)||{}).name;
  d.innerHTML = `<h2>Voz y velocidad</h2><div class="count">Para el ${LANGS[lang].name}. Se guarda en este dispositivo.</div>
    <label for="cfg-v">Voz</label>
    ${vs.length ? `<select id="cfg-v" style="width:100%">${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`
      : `<div class="note">Este dispositivo no tiene voces en ${LANGS[lang].name}. En Windows: Configuración › Hora e idioma › Voz › Agregar voces. En el móvil: ajustes de texto a voz.</div>`}
    <label for="cfg-r">Velocidad: <span id="cfg-rv"></span></label>
    <input type="range" id="cfg-r" min="0.5" max="1.3" step="0.05" value="${rate}" style="width:100%">
    <div class="dlbl"><span>🐢 Más lenta</span><span>Más rápida 🐇</span></div>
    <div class="dlab" id="cfg-thl">Apariencia</div>
    <div class="tabs" id="cfg-th" role="radiogroup" aria-labelledby="cfg-thl">${[["auto","Automático"],["light","Claro"],["dark","Oscuro"]].map(([k,t]) =>
      `<button type="button" role="radio" data-th="${k}" aria-checked="${themeMode()===k}" class="${themeMode()===k?"on":""}">${t}</button>`).join("")}</div>
    <div class="pr-row" style="margin-top:18px"><button class="btn" id="cfg-t">🔊 Probar</button><button class="btn pri" id="cfg-x" style="margin-left:auto">Listo</button></div>`;
  const rv = () => $("#cfg-rv").textContent = `${(+rate).toFixed(2).replace(/0$/,"")}×` + (rate<0.75?" (lenta)":rate<=1?" (normal)":" (rápida)");
  rv();
  $("#cfg-r").oninput = e => { rate = +e.target.value; store.set("rate", rate); rv(); };
  if($("#cfg-v")) $("#cfg-v").onchange = e => store.set("voice:"+lang, e.target.value);
  $("#cfg-t").onclick = () => say(SAMPLE[lang]);
  d.querySelectorAll("[data-th]").forEach(b => b.onclick = () => {
    setTheme(b.dataset.th);
    d.querySelectorAll("[data-th]").forEach(x => { const on = x.dataset.th === themeMode(); x.classList.toggle("on", on); x.setAttribute("aria-checked", on); });
  });
  $("#cfg-x").onclick = () => d.close();
  d.onclose = () => { voiceNote(); if(after) after(); };
  d.showModal();
}
$("#cfg-b").onclick = () => openCfg();

/* ---------- repaso espaciado, actividad y progreso ---------- */
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 864e5); };
const IV = [0, 1, 3, 7, 14, 30, 60, 120];   /* días hasta el siguiente repaso según la caja */
const MASTER = 4;                            /* desde 14 días se considera dominada */
const srsAll = () => store.get("srs:"+lang, {});
const srsK = (id, r) => id + "|" + r.es;
function srsPut(m){ store.set("srs:"+lang, m); updBadge(); }
function srsNext(x, g){ const b = x ? x.b : 0; return g===0 ? 0 : g===1 ? Math.max(1, Math.round(IV[b]/2)) : IV[Math.min(IV.length-1, b+1)]; }
function srsGrade(id, r, g){            /* g: 0 no la sabía · 1 difícil · 2 la sabía */
  const m = srsAll(), k = srsK(id, r), x = m[k] || {d:id, e:r.es, b:0, n:0};
  const days = srsNext(m[k], g);
  if(g===0) x.b = 0; else if(g===2) x.b = Math.min(IV.length-1, x.b+1);
  x.due = today() + days; x.n = (x.n||0) + 1; m[k] = x; srsPut(m); logAct();
}
function srsAdd(id, rows, box){         /* añade al repaso; box 0 = hoy, 1 = mañana, 2 = en 3 días */
  const m = srsAll(); let c = 0;
  for(const r of rows){
    const k = srsK(id, r);
    if(!m[k]){ m[k] = {d:id, e:r.es, b:box, due:today()+IV[box], n:0}; c++; }
    else if(m[k].b < box){ m[k].b = box; m[k].due = today()+IV[box]; }
  }
  srsPut(m); return c;
}
const dueList = () => Object.values(srsAll()).filter(x => x.due <= today());
const dayKey = d => d.toLocaleDateString("sv");
function logAct(n=1){ const a = store.get("act", {}), k = dayKey(new Date()); a[k] = (a[k]||0) + n; store.set("act", a); }
function streak(){
  const a = store.get("act", {}), d = new Date(); let s = 0;
  if(!a[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function updBadge(){ const b = $("#due-b"); if(!b) return; const n = dueList().length; b.textContent = n; b.hidden = !n; }
function statsHtml(){
  const m = Object.values(srsAll()), due = m.filter(x=>x.due<=today()).length, mast = m.filter(x=>x.b>=MASTER).length;
  const a = store.get("act", {}), st = streak();
  return `<div class="stats">
    <a class="stat hl" href="#/repaso"><div class="v">🔁 ${due}</div><div class="k">Para repasar hoy</div></a>
    <a class="stat" href="#/progreso"><div class="v">🔥 ${st}</div><div class="k">${st===1?"día seguido":"días seguidos"}</div></a>
    <a class="stat" href="#/granja"><div class="v">🪙 ${game().coins}</div><div class="k">Monedas</div></a>
    <a class="stat" href="#/progreso"><div class="v">💎 ${mast}</div><div class="k">Palabras que ya no olvidas</div></a>
  </div>`;
}
const inDays = n => n<=0 ? "hoy otra vez" : n===1 ? "mañana" : n<30 ? `en ${n} días` : n<60 ? "en 1 mes" : `en ${Math.round(n/30)} meses`;

let rv = null;
async function repaso(){
  rv = null; document.onkeydown = null;
  const idx = await getIndex(), ready = idx.filter(d => d.langs.includes(lang));
  const due = dueList();
  $("#app").innerHTML = `<a class="back" href="#/">← Inicio</a>
    <div class="hello">${heroHtml(90)}<div class="speech">${due.length
      ? `<b>¡${due.length} palabra${due.length>1?"s":""} te ${due.length>1?"esperan":"espera"}!</b>Ya las viste antes. Vamos a ver si te acuerdas. Cada palabra que sepas te da 🪙.`
      : `<b>¡Todo repasado por hoy! 🎉</b>Vuelve mañana: las palabras vuelven justo cuando se te van a olvidar.`}</div></div>
    <div class="panel" style="text-align:center">${due.length
      ? `<button class="btn lc" id="rv-go" style="--lc:#1E6EF4;font-size:1.2rem;padding:14px 30px">▶ ¡Vamos a repasar!</button>`
      : `<a class="btn lc" href="#/mapa" style="--lc:#008932;text-decoration:none;font-size:1.1rem;padding:12px 26px">🗺️ Aprender palabras nuevas</a>`}</div>
    <details class="panel adult"><summary>👨‍👩‍👦 Para mayores: añadir palabras al repaso</summary>
      <p class="sub">El repaso es espaciado: cada palabra vuelve mañana, a los 3 días, a la semana, a las 2 semanas, al mes… Si se falla, vuelve a empezar. Las palabras entran solas al terminar lecciones del camino, una Práctica 21 o al fallar en el Test.</p>
      <h2>Añadir palabras nuevas</h2>
      <p class="sub">También entran solas cuando terminas una Práctica 21 (vuelven mañana) o fallas una pregunta del Test.</p>
      <div class="pr-row"><select id="rv-doc">${ready.map(d=>`<option value="${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</option>`).join("")}</select>
      <select id="rv-n"><option value="5">5 palabras</option><option value="10" selected>10 palabras</option><option value="20">20 palabras</option><option value="999">Todas</option></select>
      <button class="btn" id="rv-add">➕ Añadir</button></div>
      <div class="count" id="rv-msg" style="margin-top:8px"></div></details>`;
  if($("#rv-go")) $("#rv-go").onclick = rvStart;
  $("#rv-add").onclick = async () => {
    const id = $("#rv-doc").value, doc = await getDoc(id), m = srsAll();
    const fresh = doc.rows.filter(r => r.es && r.l[lang] && !m[srsK(id, r)]).slice(0, +$("#rv-n").value);
    if(!fresh.length){ $("#rv-msg").textContent = "Ese documento ya está entero en tu repaso."; return; }
    srsAdd(id, fresh, 0); repaso().then(() => $("#rv-msg").textContent = `Añadidas: ${fresh.map(r=>r.es).join(", ")}.`);
  };
}
async function rvStart(){
  const due = dueList(), ids = [...new Set(due.map(x => x.d))];
  await Promise.all(ids.map(id => getDoc(id).catch(()=>null)));
  const q = shuffle(due.map(x => { const doc = CACHE[x.d], r = doc && doc.rows.find(r => r.es===x.e && r.l[lang]); return r ? {id:x.d, r} : null; }).filter(Boolean));
  rv = {q, i:0, flip:false, done:0, total:q.length, coins:0};
  rvDraw();
}
function rvDraw(){
  if(!rv) return;
  if(rv.i >= rv.q.length){
    award(10, "¡Repaso terminado!"); bus.emit("review-done", {n: rv.total});
    $("#app").innerHTML = `<div class="pr-setup pr-end" style="margin:0 auto">${heroHtml(90)}<h2>¡Repaso terminado! 🎉</h2>
      <p class="sub">Repasaste ${rv.total} palabra${rv.total>1?"s":""} y ganaste 🪙 ${rv.coins + 10}. Racha: 🔥 ${streak()} día${streak()===1?"":"s"}.</p>
      <div class="pr-row" style="justify-content:center"><a class="btn pri" href="#/granja" style="text-decoration:none">🏡 Ir a mi granja</a><a class="btn" href="#/mapa" style="text-decoration:none">🗺️ Seguir el camino</a></div></div>`;
    rv = null; document.onkeydown = null; return;
  }
  const {id, r} = rv.q[rv.i], d = r.l[lang], x = srsAll()[srsK(id, r)];
  const pct = Math.round(100 * rv.done / Math.max(1, rv.total));
  $("#app").innerHTML = `<a class="back" href="#/repaso">← Salir del repaso</a>
    <div class="rv"><div class="count" style="text-align:center">Quedan ${rv.q.length - rv.i} · ${pct}% hecho</div>
    <div class="pr-bar"><i style="width:${pct}%"></i></div>
    <div class="fc">${imgHtml(r)}<div class="big">${esc(r.es)}</div>
    ${rv.flip ? `<div class="ans-word">${esc(d.word)}</div><div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}
      <div class="count" style="margin-top:12px">¿La sabías?</div>
      <div class="rv-btns kid" style="margin-top:6px">
        <button class="btn b-bad" data-g="0" title="Vuelve ${inDays(srsNext(x,0))}"><span>😕</span>No</button>
        <button class="btn" data-g="1" title="Vuelve ${inDays(srsNext(x,1))}"><span>🤔</span>Más o menos</button>
        <button class="btn b-ok" data-g="2" title="Vuelve ${inDays(srsNext(x,2))}"><span>😄</span>¡Sí!</button></div>`
    : `<div class="hint" style="font-size:1rem">¿Cómo se dice en ${LANGS[lang].name}? Dilo en voz alta y luego mira.</div>
       <button class="btn lc" id="rv-show" style="--lc:#1E6EF4;margin-top:16px;font-size:1.1rem">👀 Ver la respuesta</button>`}
    </div></div>`;
  const tok = ++autoTok;
  if(rv.flip){
    (async () => { await sayP(d.word, $(".fc .say")); if(tok===autoTok && prUI.ex && d.ex){ await sleep(400); if(tok===autoTok) sayP(d.ex); } })();
    document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      autoTok++; speechSynthesis && speechSynthesis.cancel();
      const g = +b.dataset.g; srsGrade(id, r, g); if(g){ award(g, "", true); rv.coins += g; }
      bus.emit("review-card", {grade: g, es: r.es, word: d.word});
      if(g===0) rv.q.push(rv.q[rv.i]); else rv.done++;
      rv.i++; rv.flip = false; rvDraw();
    });
  } else $("#rv-show").onclick = () => { rv.flip = true; rvDraw(); };
  document.onkeydown = e => {
    if(!rv || !location.hash.startsWith("#/repaso")){ document.onkeydown = null; return; }
    if(e.target.closest && e.target.closest("input,select,textarea")) return;
    if(!rv.flip && (e.key===" " || e.key==="Enter")){ e.preventDefault(); $("#rv-show").click(); }
    else if(rv.flip && "123".includes(e.key) && e.key.length===1){ const b = document.querySelector(`[data-g="${+e.key-1}"]`); if(b) b.click(); }
  };
}

async function progreso(el){
  const idx = await getIndex(), m = Object.values(srsAll()), a = store.get("act", {});
  const days = []; for(let k=13; k>=0; k--){ const d = new Date(); d.setDate(d.getDate()-k); days.push({k:dayKey(d), n:a[dayKey(d)]||0, lbl:d.toLocaleDateString("es",{weekday:"short"})}); }
  const max = Math.max(1, ...days.map(x=>x.n));
  const by = {}; for(const x of m){ const o = by[x.d] = by[x.d] || {l:0, m:0}; if(x.b>=MASTER) o.m++; else o.l++; }
  const rows = idx.filter(d => d.langs.includes(lang)).map(d => {
    const o = by[d.id] || {l:0, m:0}, pm = 100*o.m/d.count, pl = 100*o.l/d.count;
    return `<tr><td><a href="#/doc/${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</a></td>
      <td>${o.m} / ${d.count}</td><td style="width:40%"><div class="mbar"><i class="m" style="width:${pm}%"></i><i class="l" style="width:${pl}%"></i></div></td></tr>`;
  }).join("");
  const total = days.reduce((s,x)=>s+x.n,0);

/* ---------- app instalable y sin internet ---------- */
/* «Descargar todo»: la app va a la caché del shell actual (la de sw.js) y los documentos, la gramática, los dibujos y los
   audios del idioma actual a vocab-media, que se conserva entre versiones. 6 descargas a la vez, con progreso y Cancelar.
   Pide con cache:"no-store" para que sw.js no lo guarde otra vez por su cuenta. */
const OFF_SHELL = "vocab-shell-v14", OFF_MEDIA = "vocab-media";   /* los mismos nombres que sw.js */
const OFF_APP = ["./", "index.html", "privacy.html", "manifest.webmanifest", "data/index.json", "data/map.json", "data/game.json",
  "data/sprites.json", "js/motion.js", "js/gestures.js", "js/sfx.js", "js/farm.js", "js/games.js", "js/buddy.js", "js/album.js",
  "js/save.js", "js/sync.js", "js/fab.js", "icons/icon.svg", "icons/icon-180.png", "icons/icon-192.png", "icons/icon-512.png",
  "icons/icon-192-maskable.png", "icons/icon-512-maskable.png"];
const OFF_BASE_MB = 13;                           /* documentos, gramática, dibujos y personajes, más o menos */
const AUDIO_KB = {en:7.3, fr:9.7, da:8.4};        /* tamaño medio de un audio de cada idioma */
const OFF_MEDIA_RE = /\.(png|jpe?g|gif|webp|svg|mp3)$/i;
let offJob = null;                                /* la descarga en curso (sigue aunque se cambie de pantalla) */
const offMB = b => (b / 1048576).toLocaleString("es", {maximumFractionDigits: b < 10485760 ? 1 : 0});
async function offShellName(){
  const v = (await caches.keys()).map(n => /^vocab-shell-v(\d+)$/.exec(n)).filter(Boolean).sort((a, b) => b[1] - a[1])[0];
  return v ? v[0] : OFF_SHELL;
}
/* los audios del idioma: los nombres de archivo distintos que hay en audio/<ab>.json */
async function audioIds(l){
  const ab = CLIP_AB[l]; if(!ab) return [];
  let m = clipMaps[l];
  if(!m || !Object.keys(m).length){ try{ const r = await fetch(`audio/${ab}.json`); m = r.ok ? await r.json() : {}; }catch(e){ m = {}; } }
  return [...new Set(Object.values(m || {}))].filter(id => /^[\w-]+$/.test(String(id)));
}
const offEstimate = (l, n) => OFF_BASE_MB * 1048576 + n * (AUDIO_KB[CLIP_AB[l]] || 8.5) * 1024;
/* qué hay ya guardado: documentos y audios del idioma actual (mira unos pocos) */
async function offState(l){
  if(!("caches" in window)) return {docs:false, audio:false};
  try{
    const media = await caches.open(OFF_MEDIA), idx = await getIndex(), ids = await audioIds(l), ab = CLIP_AB[l];
    const has = async u => !!(await media.match(u));
    const docs = idx.length > 0 && await has(`data/${idx[0].id}.json`) && await has(`data/${idx[idx.length - 1].id}.json`);
    const audio = ids.length > 0 && await has(`audio/${ab}/${ids[0]}.mp3`) && await has(`audio/${ab}/${ids[ids.length - 1]}.mp3`) && await has(`audio/${ab}/${ids[ids.length >> 1]}.mp3`);
    return {docs, audio, n:ids.length};
  }catch(e){ return {docs:false, audio:false}; }
}
/* el bloque de la descarga: botón, tamaño, barra de progreso y Cancelar. Se puede poner en cualquier sitio. */
function offlinePanel(el){
  if(!el) return;
  el.innerHTML = `<div class="off-dl">
    <div class="pr-row"><button class="btn pri" id="off-dl" type="button">⬇️ Descargar todo para usar sin internet</button>
      <button class="btn" id="off-x" type="button" hidden>Cancelar</button></div>
    <div class="off-bar" id="off-bar" role="progressbar" aria-label="Descarga" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
    <div class="count" id="off-msg" aria-live="polite"></div></div>`;
  $("#off-dl").onclick = downloadAll;
  $("#off-x").onclick = () => { if(offJob) offJob.ctrl.abort(); };
  if(offJob) return paintOff();
  if(!("caches" in window) || !("serviceWorker" in navigator)){ $("#off-msg").textContent = "Este navegador no permite guardar la web sin internet."; $("#off-dl").disabled = true; return; }
  const l = lang;
  offState(l).then(st => {
    const m = $("#off-msg"); if(!m || offJob || l !== lang) return;
    const name = LANGS[l].name, size = st.n ? `unos ${offMB(offEstimate(l, st.n))} MB` : "bastante espacio";
    m.textContent = st.docs && st.audio ? `✓ Ya está guardado en este dispositivo, con los audios del ${name}. Puedes volver a descargarlo para actualizarlo.`
      : st.docs ? `Ya guardado, pero sin los audios del ${name}. Descárgalo otra vez para añadirlos (en total ${size}).`
      : `Ocupa ${size}, con los audios del ${name}. Mejor con wifi.`;
  });
}
function paintOff(){
  const j = offJob, b = $("#off-dl"), x = $("#off-x"), bar = $("#off-bar"), m = $("#off-msg");
  if(!b || !m) return;
  b.disabled = !!(j && !j.end); if(x) x.hidden = !(j && !j.end);
  if(!j) return;
  const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
  if(bar){ bar.hidden = !!j.end && !j.ok; bar.setAttribute("aria-valuenow", pct); bar.firstElementChild.style.width = pct + "%"; }
  m.textContent = j.end ? j.end
    : j.total ? `Guardando… ${pct} % · ${offMB(j.bytes)} de unos ${offMB(Math.max(j.est, j.bytes))} MB`
    : "Preparando la descarga…";
}
async function downloadAll(){
  if(offJob && !offJob.end) return;
  if(!("caches" in window)){ const m = $("#off-msg"); if(m) m.textContent = "Este navegador no permite guardar la web sin internet."; return; }
  const l = lang, ab = CLIP_AB[l];
  const job = offJob = {ctrl:new AbortController(), done:0, total:0, bytes:0, est:0, fails:0, end:"", ok:false};
  const sig = job.ctrl.signal;
  paintOff();
  const fin = (text, ok) => { job.end = text; job.ok = ok; paintOff(); setTimeout(() => { if(offJob === job){ offJob = null; } }, 0); };
  try{
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
    const [shellName, idx, ids] = [await offShellName(), await getIndex(), await audioIds(l)];
    const shell = await caches.open(shellName), media = await caches.open(OFF_MEDIA);
    job.est = offEstimate(l, ids.length);
    if(navigator.storage && navigator.storage.estimate){
      const q = await navigator.storage.estimate().catch(() => null);
      if(q && q.quota && q.quota - (q.usage || 0) < job.est) return fin(`No cabe: hacen falta unos ${offMB(job.est)} MB y quedan ${offMB(q.quota - (q.usage || 0))} MB libres.`, false);
    }
    /* guarda una url; skip: si ya está, no la vuelve a pedir (imágenes y audios) */
    const one = async (u, c, skip, json) => {
      if(sig.aborted) throw new DOMException("cancelada", "AbortError");
      let out = null;
      if(skip && await c.match(u)){ job.done++; paintOff(); return null; }
      try{
        const r = await fetch(u, {signal:sig, cache:"no-store"});
        if(r.status !== 200) throw new Error("HTTP " + r.status);
        if(json) out = await r.clone().json();
        await c.put(u, r);
        job.bytes += +r.headers.get("content-length") || (OFF_MEDIA_RE.test(u) ? 8192 : 4096);
      }catch(e){
        if(e.name === "AbortError" || e.name === "QuotaExceededError") throw e;
        job.fails++; console.warn("No se pudo guardar", u, e.message);
      }
      job.done++; paintOff();
      return out;
    };
    const pool = async (list, fn) => {
      let i = 0;
      const worker = async () => { while(i < list.length) await fn(list[i++]); };
      await Promise.all(Array.from({length:Math.min(6, list.length)}, worker));
    };
    /* 1) la app y los documentos (de ellos salen los dibujos); 2) dibujos, personajes y audios */
    const docs = idx.map(d => `data/${d.id}.json`);
    const first = [...OFF_APP.map(u => [u, shell]), ...docs.map(u => [u, media]),
      ...["en", "fr", "da"].map(g => [`data/grammar_${g}.json`, media]), ...(ab ? [[`audio/${ab}.json`, media]] : [])];
    const imgs = new Set();
    let sprites = {};
    job.total = first.length + 200 + ids.length;      /* se ajusta al saber cuántos dibujos hay */
    await pool(first, async ([u, c]) => {
      const j = await one(u, c, false, docs.includes(u) || u === "data/sprites.json");
      if(j && u === "data/sprites.json") sprites = j;
      else if(j && Array.isArray(j.rows)) j.rows.forEach(r => r.img && imgs.add(r.img));
    });
    Object.keys(sprites || {}).forEach(k => /^[\w-]+$/.test(k) && imgs.add(`img/pj/${k}.png`));
    const second = [...[...imgs].map(u => [u, media]), ...ids.map(id => [`audio/${ab}/${id}.mp3`, media])];
    job.total = first.length + second.length;
    await pool(second, ([u, c]) => one(u, c, true, false));
    if(job.fails){
      fin(`Casi: ${job.fails} de ${job.total} archivos no se pudieron guardar. Vuelve a intentarlo con buena conexión.`, false);
    } else {
      store.set("offline", true);
      fin(`✓ Listo: ${job.total} archivos guardados, con los audios del ${LANGS[l].name}. Ya puedes usarla sin internet.`, true);
    }
  }catch(e){
    if(!sig.aborted) job.ctrl.abort();                /* para a las demás descargas */
    if(e.name === "AbortError") fin("Descarga parada. Lo que ya se guardó se queda; puedes seguir cuando quieras.", false);
    else if(e.name === "QuotaExceededError") fin("No cabe en este dispositivo: libera espacio y vuelve a intentarlo.", false);
    else fin("No se pudo descargar todo: " + e.message, false);
  }
}

/* ---------- tema: Automático (sin clave "theme": sigue al sistema), Claro u Oscuro ----------
   Nunca se guarda "auto": elegir Automático borra la clave. */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const sysTheme = () => darkMQ.matches ? "dark" : "light";
function themeMode(){ const t = store.get("theme", null); return t === "light" || t === "dark" ? t : "auto"; }
function applyTheme(){
  const m = themeMode(), t = m === "auto" ? sysTheme() : m;
  document.documentElement.dataset.theme = t;
  /* las dos metas theme-color siguen al sistema en Automático; con un tema fijo, las dos dicen el color elegido */
  document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
    const dark = m === "auto" ? /dark/.test(el.getAttribute("media") || "") : t === "dark";
    el.setAttribute("content", dark ? "#000000" : "#F2F2F7");
  });
  paintTheme();
}
function setTheme(mode){
  if(mode === "light" || mode === "dark") store.set("theme", mode);
  else { try{ localStorage.removeItem("theme"); }catch(e){} }
  applyTheme();
}
function paintTheme(){
  const b = $("#theme-b"); if(!b) return;
  const d = document.documentElement.dataset.theme === "dark", auto = themeMode() === "auto";
  b.textContent = d ? "☀️" : "🌙";
  b.title = (d ? "Cambiar a modo claro" : "Cambiar a modo oscuro") + (auto ? " (ahora: automático)" : "");
  b.setAttribute("aria-label", b.title);
}
/* el botón alterna lo que se ve; si lo elegido coincide con el sistema, vuelve a Automático */

darkMQ.addEventListener("change", () => { if(themeMode() === "auto") applyTheme(); });
addEventListener("storage", e => { if(e.key === "theme" || e.key === null) applyTheme(); });

}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function tarjetas(doc){
  const list = entries(doc); const s = state.fc;
  if(!s.order || s.order.length!==list.length) s.order = list.map((_,i)=>i);
  if(s.i>=list.length) s.i=0;
  const r = list[s.order[s.i]]; if(!r){ $("#view").innerHTML = `<p class="empty">No hay palabras.</p>`; return; }
  const d = r.l[lang];
  const front = s.rev
    ? `<div class="big">${esc(d.word)}</div>${sayBtn(d.word)}`
    : `${imgHtml(r)}<div class="big">${esc(r.es)}</div>`;
  const back = `${imgHtml(r)}<div class="es">${esc(r.es)}</div><div class="big">${esc(d.word)}</div>
      <div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}`;
  $("#view").innerHTML = `<div class="fc-wrap">
    <div class="count">${s.i+1} / ${list.length}</div>
    <div class="fc" id="card">${s.flip?back:front}${s.flip?"":`<div class="hint">Toca la tarjeta para ver la respuesta</div>`}</div>
    <div class="ctrl">
      <button class="btn" id="prev">← Anterior</button>
      <button class="btn pri" id="next">Siguiente →</button>
    </div>
    <div class="ctrl">
      <button class="btn ${s.auto?"pri":""}" id="auto">${s.auto?"⏸ Detener secuencia":"▶ Secuencia automática"}</button>
      <button class="btn" id="shuf">🔀 Barajar</button>
      <button class="btn" id="rev">${s.rev?"Mostrar primero: español":"Mostrar primero: "+LANGS[lang].name}</button>
    </div></div>`;
  const stop = () => { if(s.auto){ s.auto = false; autoTok++; speechSynthesis && speechSynthesis.cancel(); } };
  const go = k => { stop(); s.i = (s.i+k+list.length)%list.length; s.flip=false; tarjetas(doc); };
  $("#card").onclick = () => { stop(); s.flip=!s.flip; tarjetas(doc); if(s.flip && !s.rev) say(d.word); };
  $("#auto").onclick = () => { if(s.auto){ stop(); tarjetas(doc); } else fcAuto(doc); };
  $("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
  $("#shuf").onclick = () => { stop(); s.order = shuffle(list.map((_,i)=>i)); s.i=0; s.flip=false; tarjetas(doc); };
  $("#rev").onclick = () => { stop(); s.rev=!s.rev; s.flip=false; tarjetas(doc); };
}

/* secuencia automática: solo suena el idioma que se estudia, nunca el español */
async function fcAuto(doc){
  const s = state.fc, tok = ++autoTok;
  const alive = () => tok === autoTok && s.auto && state.mode === "tarjetas" && document.getElementById("card");
  s.auto = true;
  while(true){
    const list = entries(doc); if(!list.length) break;
    if(s.i >= list.length) s.i = 0;
    const d = list[s.order ? s.order[s.i] : s.i].l[lang];
    s.flip = false; tarjetas(doc);
    if(s.rev){ await sleep(500); if(!alive()) return; await sayP(d.word); await sleep(1200); }
    else await sleep(2000);
    if(!alive()) return;
    s.flip = true; tarjetas(doc);
    if(!s.rev){ await sayP(d.word); if(!alive()) return; await sleep(700); }
    if(d.ex){ if(!alive()) return; await sayP(d.ex); }
    await sleep(1500);
    if(!alive()) return;
    s.i = (s.i + 1) % list.length;
  }
}

function test(doc){
  const list = entries(doc);
  if(list.length<4){ $("#view").innerHTML = `<p class="empty">Se necesitan al menos 4 palabras.</p>`; return; }
  if(!state.test){ state.test = {qs: shuffle(list).slice(0, Math.min(10,list.length)), i:0, ok:0, done:false}; }
  const t = state.test;
  if(t.i>=t.qs.length){
    if(!t.paid){ t.paid = true; if(t.ok) award(t.ok, "¡Test terminado!"); }
    $("#view").innerHTML = `<div class="q"><div class="big" style="font-size:1.6rem;font-weight:700">${t.ok} / ${t.qs.length}</div>
      <p class="sub">${t.ok===t.qs.length?"¡Perfecto! 🎉":t.ok>=t.qs.length*0.7?"¡Muy bien!":"Sigue practicando con las tarjetas."}</p>
      <button class="btn pri" id="again">Otra ronda</button></div>`;
    $("#again").onclick = () => { state.test=null; test(doc); };
    return;
  }
  const r = t.qs[t.i], d = r.l[lang];
  const pool = shuffle(list.filter(x => x!==r && x.l[lang].word!==d.word)).slice(0,3);
  const opts = shuffle([r,...pool]);
  $("#view").innerHTML = `<div class="q">
    <div class="score">Pregunta ${t.i+1} de ${t.qs.length} · Aciertos: ${t.ok}</div>
    ${imgHtml(r)}<div style="font-size:1.4rem;font-weight:700;margin-top:8px">${esc(r.es)}</div>
    <div class="sub">¿Cómo se dice en ${LANGS[lang].name}?</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.l[lang].word)}</button>`).join("")}</div>
    <div id="after" style="margin-top:14px"></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(t.answered===t.i) return; t.answered=t.i;
    const pick = opts[+b.dataset.i], good = pick===r;
    if(good) t.ok++;
    bus.emit("answer", {ok: good, es: r.es, word: r.l[lang].word, where: "test"});
    srsGrade(state.doc, r, good ? 2 : 0);
    document.querySelectorAll(".opt").forEach(x => { if(opts[+x.dataset.i]===r) x.classList.add("ok"); });
    if(!good) b.classList.add("bad");
    say(d.word);
    $("#after").innerHTML = `<div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span>${sayBtn(d.word,1)}</div>
      <button class="btn pri" id="nextq" style="margin-top:10px">Siguiente →</button>`;
    $("#nextq").onclick = () => { t.i++; test(doc); };
  });
}

/* hablar: Chrome, Edge y Safari reconocen la voz; en la app instalada del iPhone o iPad no va bien, así que allí no se
   ofrece el micrófono. Sin micrófono todo se puede hacer tocando. */

function practica(doc){

/* qué actividad toca en la repetición n de una palabra */
const actFor = (s, n) => s.acts[n % s.acts.length];
const actCount = (s, n, j) => Math.floor(n / s.acts.length) + (j < n % s.acts.length ? 1 : 0);
const actTarget = (s, j) => Math.floor(s.reps / s.acts.length) + (j < s.reps % s.acts.length ? 1 : 0);
function nextIdx(s, from){
  const L = s.words.length;
  for(let k=1; k<=L; k++){ const i = (from + k) % L; if(s.words[i].n < s.reps) return i; }
  return -1;
}

const TINT = {escuchar:["#dbe9fb","#1E6EF4"], leer:["#d9f2e4","#008932"], escribir:["#d6eff2","#008198"], hablar:["#dde3ea","#3b4a5c"], dictado:["#fbf1cc","#A16A00"]};

/* la tarjeta actual y las que vienen, simulando la cola */
function upcoming(s, k){
  const ns = s.words.map(w => w.n), L = ns.length, out = [];
  let cur = s.cur;
  for(let t=0; t<k && cur>=0 && ns[cur] < s.reps; t++){
    out.push({wi:cur, n:ns[cur]});
    ns[cur]++;
    let nx = -1;
    for(let q=1; q<=L; q++){ const i = (cur+q) % L; if(ns[i] < s.reps){ nx = i; break; } }
    cur = nx;
  }
  return out;
}

function prRun(doc, s){
  const all = doc.rows.filter(r => r.es && r.l[lang]);
  if(s.words[s.cur] && s.words[s.cur].n >= s.reps){ const n = nextIdx(s, s.cur); if(n>=0) s.cur = n; }
  const doneReps = s.words.reduce((a,w)=>a+Math.min(w.n,s.reps),0), total = s.words.length*s.reps;
  if(doneReps >= total) return prEnd(doc, s, total);
  const wdone = s.words.filter(w=>w.n>=s.reps).length;
  const pct = Math.round(100*doneReps/total);
  const w = s.words[s.cur], r = all[w.i];
  const seq = upcoming(s, 4), hist = prUI.hist.slice(-3);
  const cards = [...hist.map((h,k) => ({...h, off:k-hist.length})), ...seq.map((q,k) => ({...q, off:k}))];

  $("#view").innerHTML = `<div class="pr" id="pr-root">
    <aside class="pr-panel">
      <div class="lbl">PROGRESO DE LA PRÁCTICA</div>
      <div class="ttl">${esc(doc.title)}</div>
      <div class="sub2">${LANGS[lang].name[0].toUpperCase()+LANGS[lang].name.slice(1)} · ${s.reps} repeticiones por palabra</div>
      <div class="sub2" style="margin-top:10px;color:var(--ink)">${wdone} de ${s.words.length} palabras completas · ${pct}%</div>
      <div class="pr-bar"><i style="width:${pct}%"></i></div>
      <button class="pr-toggle" id="pr-tg">${prUI.open?"‹ Ocultar las palabras":"› Ver las palabras"}</button>
      ${prUI.open ? `<ol class="pr-steps">${s.words.map((x,k) => {
        const rr = all[x.i], done = x.n>=s.reps, cur = k===s.cur;
        return `<li class="${done?"done":""} ${cur?"cur":""}" data-k="${k}">
          <span class="dot">${done?"✓":k+1}</span>
          <div><div class="w">${esc(rr.es)}</div>
          <div class="s">${done?"Completada":cur?`En curso · ${x.n} de ${s.reps}`:x.n?`${x.n} de ${s.reps}`:"Pendiente"}</div>
          ${cur?`<div class="acts">${s.acts.map((a,j)=>{const c=actCount(s,x.n,j),t=actTarget(s,j);
            return `<span class="${c>=t?"ok":""}">${c>=t?"✓":ACTS[a].ic} ${ACTS[a].name} (${c}/${t})</span>`}).join("")}</div>`:""}
          </div></li>`; }).join("")}</ol>` : ""}
    </aside>
    <section class="pr-stage">
      <div class="pr-top"><span class="count">Repetición <b>${w.n+1}</b> de ${s.reps} · ${esc(r.es)}</span>
        <span class="pr-row"><label class="pr-opt"><input type="checkbox" id="pr-auto" ${prUI.auto?"checked":""}> Paso automático</label><label class="pr-opt"><input type="checkbox" id="pr-ex" ${prUI.ex?"checked":""}> Audio del ejemplo</label><button class="btn" id="pr-skip" title="Marcar esta palabra como aprendida">Ya me la sé</button><button class="btn" id="pr-fs" title="Pantalla completa">${document.fullscreenElement?"✕ Salir":"⛶"}</button><button class="btn" id="pr-stop">⏸ Pausar</button></span></div>
      <div class="pr-flow" id="pr-flow">
        ${cards.map(c => { const rr = all[s.words[c.wi].i]; return prCard(rr, effAct(rr, actFor(s, c.n)), c.off===0, c.n, s.reps, c.off); }).join("")}
        <div class="pr-dots" title="Repeticiones de esta palabra">${Array.from({length:s.reps},(_,k)=>`<i class="${k<w.n?"on":k===w.n?"now":""}"></i>`).join("")}</div>
      </div>
      <div class="pr-keys">Atajo: Enter para continuar</div>
    </section></div>`;

  const flow = $("#pr-flow");
  const els = [...flow.querySelectorAll(".pr-card")];
  const layout = () => {
    const W = flow.getBoundingClientRect().width, cw = Math.round(Math.min(300, W*0.64));
    els.forEach(el => {
      const o = +el.dataset.off, a = Math.abs(o), sg = Math.sign(o);
      const x = a ? sg*(cw*0.68 + (a-1)*cw*0.40) : 0, sc = 1 - 0.13*a;
      el.style.setProperty("--cw", cw+"px");
      el.style.transform = `translate(${x}px,-50%) scale(${sc})`;
      el.style.zIndex = 10 - a;
      el.style.opacity = a > 3 ? 0 : 1 - 0.1*Math.max(0,a-1);
    });
  };
  els.forEach(el => el.style.transition = "none"); layout();
  requestAnimationFrame(() => els.forEach(el => el.style.transition = ""));
  const onResize = () => { if(document.body.contains(flow)) layout(); else removeEventListener("resize", onResize); };
  addEventListener("resize", onResize);

  const save = () => store.set(prKey(doc.id), s);
  const advance = () => {
    if(prUI.busy) return; prUI.busy = true;
    prUI.hist = [...prUI.hist, {wi:s.cur, n:w.n}].slice(-3);
    w.n++; logAct();
    if(w.n === s.reps){ toast(`🎉 ¡«${r.es}» completada! Vuelve mañana en el repaso`); srsAdd(doc.id, [r], 1); }
    const n = nextIdx(s, s.cur); if(n>=0) s.cur = n;
    save();
    els.forEach(el => { el.dataset.off = +el.dataset.off - 1; el.classList.toggle("side", +el.dataset.off !== 0); });
    layout();
    setTimeout(() => { prUI.busy = false; if(state.mode==="practica" && document.body.contains(flow)) prRun(doc, s); }, 520);
  };

  const act = effAct(r, actFor(s, w.n)), card = flow.querySelector(".pr-card.cur");
  const btn = card.querySelector(".pr-next");
  const tok = ++autoTok, alive = () => tok === autoTok && state.mode === "practica" && document.body.contains(flow);
  /* solo suena el idioma que se estudia: la palabra y, si está marcado, el ejemplo */
  const play = async (wbtn) => {
    if(!alive()) return false;
    await sayP(r.l[lang].word, wbtn); if(!alive()) return false;
    if(prUI.ex && r.l[lang].ex){ await sleep(500); if(!alive()) return false; await sayP(r.l[lang].ex, card.querySelector(".ex .say")); }
    return alive();
  };
  const autoNext = async () => { if(prUI.auto && alive()){ await sleep(1000); if(prUI.auto && alive()) advance(); } };
  let onEnter = () => btn.click();
  if(act === "escuchar" || act === "leer"){
    setTimeout(async () => { if(await play(card.querySelector(".say.xl"))) autoNext(); }, 420);
    btn.onclick = advance;
  } else if(act === "hablar"){
    const mic = card.querySelector(".mic"), msg = card.querySelector(".pr-msg"), word = r.l[lang].word;
    let ok = false, listening = false;
    setTimeout(() => { if(alive()) sayP(word, card.querySelector(".say")); }, 420);
    btn.onclick = advance;
    /* sin reconocimiento de voz: la dice en voz alta y toca «Lo he dicho ✓» */
    onEnter = () => ok || !canListen() ? advance() : mic.click();
    mic.onclick = async () => {
      if(listening || ok) return;
      if(!canListen()){ msg.className = "pr-msg"; msg.textContent = noVoiceMsg(); return; }
      autoTok++; const t2 = autoTok; if("speechSynthesis" in window) speechSynthesis.cancel();
      listening = true; mic.classList.add("on"); msg.className = "pr-msg"; msg.textContent = "Te escucho… di la palabra";
      const got = await listen();
      listening = false; mic.classList.remove("on");
      if(!document.body.contains(flow) || t2 !== autoTok) return;
      if(got.status !== "ok"){
        msg.className = "pr-msg bad";
        msg.textContent = got.status === "denied" ? "Permite el micrófono para esta página (icono del candado en la barra de direcciones). También puedes tocar «Saltar»."
          : got.status === "timeout" || got.status === "no-speech" ? "No te oí. Pulsa 🎤 y prueba otra vez."
          : got.status === "unsupported" ? noVoiceMsg()
          : "No se pudo usar el micrófono. Pulsa 🎤 y prueba otra vez, o toca «Saltar».";
        return;
      }
      const alts = got.alts;
      if(heard(alts, word)){

/* validación superficial: sin mayúsculas, signos ni artículo obligatorio */
function checkAnswer(ans, target){
  const norm = x => x.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()…]/g," ").replace(/\s+/g," ").trim();
  const bare = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe");
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = new Set();
  for(let t of String(target).split(/\s\/\s|,\s/)){
    t = norm(t.replace(/\((m|f|pl|m\.\/f)\.?\)/g,"").replace(/\(.*?\)/g,""));
    if(!t) continue;
    cands.add(t); cands.add(t.replace(art,"").trim());
  }
  const a = norm(ans); if(!a) return "bad";
  const a2 = a.replace(art,"").trim();
  if(cands.has(a) || cands.has(a2)) return "ok";
  for(const c of cands) if(bare(c)===bare(a) || bare(c)===bare(a2)) return "accents";
  return "bad";
}

/* micrófono: devuelve las transcripciones posibles */
/* escucha una vez (como mucho ms, 7 s por defecto) y nunca se queda colgado ni falla:
   resuelve {status, alts} con status "ok" | "timeout" | "no-speech" | "denied" | "unsupported" | "busy" | "error" */
let recNow = null;
function listen(opts){
  const ms = (opts && opts.ms) || 7000;
  return new Promise(res => {
    if(!canListen()) return res({status:"unsupported", alts:[]});
    if(recNow) return res({status:"busy", alts:[]});
    let rec = null, fin = false, alts = null, timer = 0;
    const done = (status, error) => {
      if(fin) return; fin = true; clearTimeout(timer);
      if(recNow === rec) recNow = null;
      res(error ? {status, alts:alts || [], error} : {status, alts:alts || []});
    };
    try{ rec = new SR(); }catch(e){ return done("unsupported"); }
    rec.lang = (opts && opts.lang) || LANGS[lang].code; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
    rec.onresult = e => { alts = [...e.results[0]].map(a => a.transcript); done("ok"); try{ rec.stop(); }catch(_){} };
    rec.onerror = e => {
      const c = e.error || "error";
      done(c === "not-allowed" || c === "service-not-allowed" ? "denied" : c === "no-speech" ? "no-speech" : "error", c);
    };
    rec.onend = () => done(alts ? "ok" : "no-speech");
    timer = setTimeout(() => { done("timeout"); try{ rec.abort(); }catch(_){} }, ms);
    recNow = rec;
    try{ rec.start(); }catch(e){ done("busy", String(e && e.name || e)); }
  });
}
const nrm = x => String(x).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()«»…—–-]/g," ").replace(/\s+/g," ").trim();
const bareS = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe").replace(/å/g,"a");
/* basta con que la palabra aparezca en lo que se oyó (sin artículo ni tildes) */
function heard(alts, target){
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = String(target).split(/\s\/\s|,\s/).map(t => bareS(nrm(t.replace(/\(.*?\)/g,"")).replace(art,"").trim())).filter(Boolean);
  return alts.some(a => { const A = " " + bareS(nrm(a)) + " "; return checkAnswer(a, target) !== "bad" || cands.some(c => A.includes(" " + c + " ")); });
}
/* dictado: palabras en común en orden (LCS); se aceptan tildes olvidadas como "casi" */
function dictCheck(ans, ref){
  const R = nrm(ref).split(" ").filter(Boolean), A = nrm(ans).split(" ").filter(Boolean);
  const match = eq => {
    const dp = Array.from({length:R.length+1}, () => new Array(A.length+1).fill(0));
    for(let i=R.length-1; i>=0; i--) for(let j=A.length-1; j>=0; j--)
      dp[i][j] = eq(R[i], A[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    const hit = new Array(R.length).fill(false); let i=0, j=0;
    while(i<R.length && j<A.length){ if(eq(R[i], A[j])){ hit[i]=true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
    return hit;
  };
  const exact = match((a,b) => a===b), loose = match((a,b) => bareS(a)===bareS(b));
  const hits = loose.filter(Boolean).length, extra = Math.max(0, A.length - hits);
  const words = String(ref).split(/\s+/);
  const html = words.length===R.length ? words.map((w,k) => exact[k] ? esc(w) : `<span class="x">${esc(w)}</span>`).join(" ") : esc(ref);
  return {ok: hits >= Math.ceil(R.length*0.9) && extra <= 1, perfect: exact.every(Boolean) && extra===0, hits, total:R.length, html};
}

let LS = null;
async function leccion(id){
  await getMap(); document.onkeydown = null;
  if(id.startsWith("G-")) return gramLesson(id);
  const lv = id.slice(0, 2); if(!MAP[lv]) return mapa();
  const ui = MAP[lv].findIndex(u => u.ls.some(l => l.id === id)); if(ui < 0) return mapa(lv);
  const unit = MAP[lv][ui], l = unit.ls.find(l => l.id === id);
  const docs = {}; for(const [d] of l.w) docs[d] = await getDoc(d);
  const words = l.w.map(([d, i]) => ({doc:d, r:docs[d].rows[i]})).filter(x => x.r && x.r.l[lang]);
  if(!words.length) return mapa(lv);
  /* distractores: las otras palabras de la lección y, si faltan, del mismo documento */
  const pool = [...words]; const seen = new Set(words.map(x => x.r.es));
  for(const r of docs[unit.doc].rows) if(pool.length < 12 && r.es && r.l[lang] && !seen.has(r.es)){ seen.add(r.es); pool.push({doc:unit.doc, r}); }
  const steps = [...words.map(w => ({t:"learn", w})), ...shuffle(words).map((w, i) => ({t: i % 2 ? "listen" : "pick", w}))];
  LS = {id, lv, unit, words, pool, steps, i:0, nq:words.length, first:new Set(), miss:new Set(), tok:++autoTok};
  lsStep();
}
function lsOpts(w, field){
  const val = x => field === "es" ? x.r.es : x.r.l[lang].word;
  const out = [w], used = new Set([val(w)]);

function lvUnits(lv){                     /* unidades del nivel con las lecciones de gramática intercaladas */
  const g = (GRAM[lang] || {})[lv] || [], N = MAP[lv].reduce((a, u) => a + u.ls.length, 0);
