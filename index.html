<script>
/* tema: «light» o «dark» guardados en "theme"; sin clave (o con otro valor) = Automático, sigue al sistema */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("theme"))}catch(e){}
if(t!=="light"&&t!=="dark")t=null;
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();
/* Ajustes › Accesibilidad ("vocab:ui", solo de este aparato; js/settings.js): se ponen antes de pintar */
(function(){var u=null;try{u=JSON.parse(localStorage.getItem("vocab:ui"))}catch(e){}
if(!u||typeof u!=="object")return;var d=document.documentElement.dataset;
if(u.glass==="off")d.glass="off";if(u.motion==="calm")d.motion="calm";if(u.contrast==="more")d.contrast="more";if(u.text==="large")d.text="large";})();
</script>

<style>
/* ===================== Cimientos (rediseño F1) =====================
   Tokens en :root (claro) y :root[data-theme=dark] (el script del <head> resuelve el tema: «Automático» = sin clave).
   Material: .glass (vidrio flotante con desenfoque de verdad; usa ::before para el borde) · .glass-btn (vidrio sobre
   contenido, sin desenfoque; ::before borde, ::after brillo desde --mx/--my con .is-pressed) · .btn-fill (cápsula
   sólida) · .ok-fill / .miss-fill (acierto / fallo gris) · .card (contenido sólido) · .ico (sprite Phosphor) · kbd.
   Interruptores en <html>: data-glass="off|lite" · data-contrast="more" · data-text="large".
   Texto: usa los --fs-* (ya respetan el tamaño de texto del sistema en iOS). */
/* letra redondeada donde no hay SF Pro Rounded (Android, Windows, Linux): Nunito, licencia OFL (fonts/OFL.txt) */
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* IPA: una letra del aparato que tenga todos los símbolos (ˈ ː ʊ ɐ ˀ ̃…), por su nombre exacto (local(): Windows, Linux,
   Android); si no hay ninguna, la del sistema (San Francisco en el iPhone, el iPad y el Mac). Así no salen mezclados con
   otra letra que solo tenga algunos ni con la redonda (Nunito) */
@font-face{font-family:"VocabIPA";font-style:normal;font-weight:400;src:local("Segoe UI"),local("SegoeUI"),local("Noto Sans"),local("NotoSans-Regular"),local("DejaVu Sans"),local("DejaVuSans"),local("Roboto"),local("Roboto-Regular")}
:root{
  color-scheme:light;
  /* superficies y texto (label2 a .76 y no .6: así el texto secundario pasa 4,5:1 sobre #F2F2F7) */
  --bg:#F2F2F7;--card:#FFFFFF;--card-2:#F2F2F7;--card-hi:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.76);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.12);
  /* marca: --brand-fill (fondo con texto blanco) · --brand-tint (iconos y texto sobre blanco) ·
     --brand-ink (texto azul que puede caer sobre el fondo gris o sobre vidrio) */
  --brand-fill:#1E6EF4;--brand-tint:#1E6EF4;--brand-ink:#185CCF;--brand-soft:rgba(30,110,244,.12);
  /* estados: acierto verde, fallo GRIS (nunca rojo) */
  --ok:#34C759;--ok-fill:#008932;--ok-ink:#007F2E;--ok-soft:rgba(52,199,89,.16);
  --miss:#8E8E93;--miss-ink:#6C6C70;--miss-fill:rgba(120,120,128,.22);--miss-on:#48484A;
  /* monedas, marca y adorno de progreso (texto oro #946200 y no #A16A00: el de la especificación da 4,1:1 sobre el fondo
     #F2F2F7; este pasa 4,5:1 también ahí y sobre el vidrio claro) */
  --gold:#FFCC00;--gold-ink:#946200;--gold-soft:rgba(255,204,0,.22);--gold-deep:#B38F00;--gold-on:#3D2B00;
  --navy:#0B2545;--teal:#008198;
  /* vidrio flotante */
  --g-tint:rgba(255,255,255,.62);--g-top:rgba(255,255,255,.5);--g-solid:#FFFFFF;
  --g-rim1:rgba(255,255,255,1);--g-rim2:rgba(255,255,255,.16);--g-edge:rgba(0,0,0,.07);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.95);--g-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
  /* vidrio sobre contenido (botones) */
  --neu:#E9E9EE;--neu-ink:#000000;--hb-shadow:0 4px 12px -4px rgba(30,110,244,.45);
  /* tipografía (rem; --k corrige la base de 17 px del texto de sistema en iOS y sube con «Texto más grande») */
  --k:1;
  --f-text:system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  /* los títulos y la palabra suben con el texto del sistema, pero con tope (como los títulos grandes de iOS): así una
     palabra larga o el texto enorme de accesibilidad no se salen de la tarjeta; el texto normal sube sin tope */
  --fs-lt:min(calc(2.25rem*var(--k)),48px);--fs-t1:min(calc(1.875rem*var(--k)),40px);
  --fs-t2:min(calc(1.5rem*var(--k)),34px);--fs-t3:min(calc(1.375rem*var(--k)),30px);
  --fs-head:calc(1.1875rem*var(--k));--fs-body:calc(1.1875rem*var(--k));--fs-sub:calc(1.0625rem*var(--k));
  --fs-note:calc(.9375rem*var(--k));--fs-min:calc(.8125rem*var(--k));--fs-tab:calc(.75rem*var(--k));
  --fs-word:min(calc(2.75rem*var(--k)),56px,13vw);
  /* medidas */
  --r-card:24px;--r-sheet:32px;--r-menu:20px;--r-pill:999px;--r-md:16px;--r-sm:12px;
  --tap:44px;--tap-bar:48px;--row:52px;--btn-main:56px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--gutter:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --z-bar:10;--z-acc:11;--z-sheet:20;--z-toast:30;
  /* nombres de antes (los usan las pantallas y los módulos js/*.js hasta que se rehagan) */
  --ink:var(--label);--muted:var(--label2);--line:var(--fill);--soft:var(--fill2);--cat:var(--fill2);
  --brand:var(--brand-ink);--brand-2:var(--label2);--bad:var(--miss-ink);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--card-2:#2C2C2E;--card-hi:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.32);--fill2:rgba(120,120,128,.24);
  --brand-tint:#0091FF;--brand-ink:#409CFF;--brand-soft:rgba(0,145,255,.18);
  --ok:#30D158;--ok-ink:#30D158;--ok-soft:rgba(48,209,88,.18);
  --miss-ink:#AEAEB2;--miss-fill:rgba(120,120,128,.36);--miss-on:rgba(235,235,245,.7);
  --gold:#FFD600;--gold-ink:#FFD600;--gold-soft:rgba(255,214,0,.16);--gold-deep:#A68B00;--gold-on:#1C1C1E;
  --teal:#00D2E0;
  --g-tint:rgba(28,28,30,.62);--g-top:rgba(255,255,255,.10);--g-solid:#2C2C2E;
  --g-rim1:rgba(255,255,255,.5);--g-rim2:rgba(255,255,255,.12);--g-edge:rgba(0,0,0,.6);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.22);--g-shadow:0 10px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --neu:#3A3A3C;--neu-ink:#FFFFFF;--hb-shadow:0 6px 16px -6px rgba(0,0,0,.7);
  --shadow:none;
}
/* iOS: el tamaño de texto del sistema (Dynamic Type) fija la base; en el Mac (13 px) no se aplica */
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html{font:-apple-system-body}:root{--k:.9412}}
html[data-text=large]{--k:1.18}
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html[data-text=large]{--k:1.11}}
/* fuera de iOS, «Texto más grande» sube la base (118 %): crecen los --fs-* y también las pantallas que aún usan rem sueltos */
@supports not ((-webkit-touch-callout:none) and (font:-apple-system-body)){html[data-text=large]{font-size:118%;--k:1}}
@media (min-width:744px){:root{--gutter:24px}}
/* más contraste (sistema o Ajustes): texto secundario y separadores más fuertes */
@media (prefers-contrast:more){
  :root{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
  :root[data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}}
:root[data-contrast=more]{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
:root[data-contrast=more][data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}
/* en oscuro, los dibujos (hechos para fondo claro) van sobre una ficha gris claro con esquinas, como una pegatina */
[data-theme=dark] .img img{background:#F2F2F7;border-radius:var(--r-md);padding:6px}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 var(--fs-sub)/1.4 var(--f-text);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}

/* ---------- tipografía (escala grande de iOS) ---------- */
.t-lt{font:700 var(--fs-lt)/1.2 var(--f-round);letter-spacing:.005em}
.t-1{font:700 var(--fs-t1)/1.2 var(--f-round)}
.t-2{font:700 var(--fs-t2)/1.2 var(--f-round)}
.t-3{font:700 var(--fs-t3)/1.22 var(--f-round)}
.t-head{font:600 var(--fs-head)/1.26 var(--f-text)}
.t-body{font:400 var(--fs-body)/1.3 var(--f-text)}
.t-sub{font:400 var(--fs-sub)/1.3 var(--f-text);color:var(--label2)}
.t-note{font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.t-min{font:400 var(--fs-min)/1.38 var(--f-text);color:var(--label2)}
.t-tab{font:600 var(--fs-tab)/1.17 var(--f-text)}
.t-word{font:700 var(--fs-word)/1.18 var(--f-round);overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;text-wrap:balance}   /* con lang="en-GB|fr|da" en el elemento */
/* la palabra que se aprende (fitWord): nunca se parte ni lleva guion; si no cabe, baja de tamaño. Solo si ni a 28 px
   cabe, se parte (.is-break) */
:root [data-fit]{overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual}
:root [data-fit].is-break{overflow-wrap:anywhere}
.t-num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- iconos (sprite Phosphor al principio del <body>; ico(nombre, estilo, tamaño)) ---------- */
.ico{display:inline-block;flex:none;fill:currentColor;vertical-align:middle;overflow:visible;pointer-events:none}

/* ---------- utilidades de estado: acierto en verde lleno, fallo en gris (nunca rojo) ---------- */
.ok-fill{background:var(--ok-fill)!important;color:#fff!important;border-color:transparent!important}
.miss-fill{background:var(--miss-fill)!important;color:var(--miss-on)!important;border-color:transparent!important}
.ok-ink{color:var(--ok-ink)}
.miss-ink{color:var(--miss-ink)}

/* ---------- contenido sólido ---------- */
.card{background:var(--card);color:var(--label);border-radius:var(--r-card)}

/* ---------- vidrio flotante (barras, hojas, menús, avisos): desenfoque con valores literales ---------- */
:where(.glass:not(dialog):not([popover])){position:relative}
.glass{color:var(--label);
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-tint);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:var(--g-hi),0 0 0 .5px var(--g-edge),var(--g-shadow)}
.glass::before,.glass-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* versión ligera (sin desenfoque, más opaca): granja, juegos, o html[data-glass=lite]. Con :where() pesa lo mismo que
   .glass, así los modos de abajo (sin transparencia, más contraste, data-glass=off) la pisan siempre por orden */
/* Como mucho 3 superficies con desenfoque a la vez (plan §Rendimiento): la barra de pestañas, el grupo de las monedas y
   el accesorio «Seguir» (o el menú, o una hoja). Van siempre sin desenfoque la bandera y la cápsula de avisos; con
   una hoja abierta, las barras y el accesorio (quedan bajo su fondo oscurecido); con el menú de idioma abierto, el
   accesorio. El botón de Google de arriba (#tb-google), como la bandera, siempre sin desenfoque. */
.glass:where(.lite),:where(:root[data-glass=lite]) .glass,
.glass:where(.tb-flag,.tb-google,#m-toasts .m-toast),:where(:root[data-sheet]) .glass:where(.tabbar,.tb-group,.acc),:where(:root[data-menu]) .glass:where(.acc){
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite,rgba(255,255,255,.9))}
:where(:root[data-theme=dark]) .glass:where(.lite),:where(:root[data-theme=dark][data-glass=lite]) .glass,
:where(:root[data-theme=dark]) .glass:where(.tb-flag,.tb-google,#m-toasts .m-toast),:where(:root[data-theme=dark][data-sheet]) .glass:where(.tabbar,.tb-group,.acc),
:where(:root[data-theme=dark][data-menu]) .glass:where(.acc){
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite-d,rgba(28,28,30,.9))}
#m-toasts{--g-lite:rgba(255,255,255,.94);--g-lite-d:rgba(28,28,30,.94)}
#m-toasts .m-tact{--g-lite:#fff;--g-lite-d:#2C2C2E}   /* con «Deshacer», opaca: no se trasluce el título grande */

/* ---------- vidrio sobre contenido: botones de acción (sin desenfoque, tinte opaco) ---------- */
.glass-btn{--g-rim1:rgba(255,255,255,.75);--g-rim2:rgba(255,255,255,.12);
  position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;max-width:100%;min-width:0;padding:0 22px;border:0;border-radius:var(--r-pill);white-space:nowrap;
  font:600 var(--fs-head)/1.15 var(--f-text);letter-spacing:-.01em;text-align:center;text-decoration:none;color:var(--neu-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 50%),var(--neu);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.glass-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);
  transition:opacity var(--d-fast,160ms) ease}
.glass-btn.is-pressed::after{opacity:1}
.glass-btn--pri{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 40%),var(--brand-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.10),var(--hb-shadow)}
.glass-btn--ok{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 50%),var(--ok-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.10),0 6px 16px -6px rgba(0,137,50,.6)}
:root[data-theme=dark] .glass-btn{--g-rim1:rgba(255,255,255,.45);--g-rim2:rgba(255,255,255,.08)}
:root[data-theme=dark] .glass-btn:not(.glass-btn--pri):not(.glass-btn--ok){
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 50%),var(--neu);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.glass-btn--lg{min-height:var(--btn-main);padding:0 28px}
.glass-btn--sm{min-height:var(--tap);padding:0 14px;gap:4px;font-size:var(--fs-sub)}
.glass-btn--icon{width:var(--tap);min-height:var(--tap);padding:0;flex:none}
.glass-btn--block{display:flex;width:100%}
.glass-btn:disabled,.glass-btn[aria-disabled=true]{opacity:.45;cursor:default}
.glass-btn:focus-visible,.btn-fill:focus-visible,.glass :focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
/* foco de teclado: el mismo anillo azul en toda la app (no el del navegador, que en algunos sale naranja o dorado) */
:focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* ---------- cápsula sólida (filas, tienda, listas) ---------- */
.btn-fill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);max-width:100%;min-width:0;padding:0 18px;border:0;white-space:nowrap;
  border-radius:var(--r-pill);font:600 var(--fs-sub)/1.15 var(--f-text);text-decoration:none;color:#fff;background:var(--brand-fill);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn-fill--neu{background:var(--fill);color:var(--label)}
.btn-fill--ok{background:var(--ok-fill);color:#fff}
.btn-fill--gold{background:var(--gold);color:var(--gold-on)}
.btn-fill:disabled,.btn-fill[aria-disabled=true]{background:var(--fill2);color:var(--label3);cursor:default}

/* ---------- teclas (etiquetas grises que salen tras la primera tecla) ---------- */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border-radius:7px;
  font:600 var(--fs-min)/1 var(--f-text);color:var(--label2);background:var(--fill);box-shadow:inset 0 -1px 0 var(--sep);
  vertical-align:middle;white-space:nowrap}

/* ---------- si el aparato no puede o el niño lo necesita ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(255,255,255,.95)}
  :root[data-theme=dark] .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(28,28,30,.95)}}
:root[data-glass=off] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}
@media (prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}}
@media (prefers-contrast:more){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
  .glass::before,.glass-btn::before{display:none}
  .glass-btn{border:2px solid var(--sep)}}
:root[data-contrast=more] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
:root[data-contrast=more] .glass::before,:root[data-contrast=more] .glass-btn::before{display:none}
:root[data-contrast=more] .glass-btn{border:2px solid var(--sep)}
@media (forced-colors:active){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas;color:CanvasText;border:1px solid CanvasText;box-shadow:none}
  .glass-btn,.btn-fill{border:2px solid ButtonText;background:ButtonFace;color:ButtonText;box-shadow:none}
  .glass::before,.glass-btn::before,.glass-btn::after{display:none}
  .ico{fill:currentColor;forced-color-adjust:auto}}
/* ===================== Armazón de navegación (F2) =====================
   · Barra superior header.topbar: a la izquierda la bandera del idioma (#lang-b, abre el menú #lang-m); a la derecha
     el grupo de vidrio .tb-group con las monedas ([data-coins-pill], el número en #coins) y Ajustes
     ([data-open=ajustes] → window.openSettings()). La partida se guarda sola; mientras este aparato no tiene Google,
     js/sync.js pone antes del grupo el botón redondo de Google (#tb-google, Puerta de mayores y «Entrar con Google»).
   · Barra de pestañas nav.tabbar (role=tablist): 5 a.tab[data-nav] con icono relleno de 26 px y nombre de 12/600; la
     activa con aria-selected=true, en azul y con la «gota» de vidrio. Abajo en el móvil; desde 820 px, arriba y centrada.
     No se encoge. Insignias .tb-badge (número azul o punto).
   · #tabhead: título grande y segmentos (.seg, role=tablist) de la pestaña, solo en su raíz.
   · Modo foco html[data-focus] (lección, repaso en marcha, partida): sin barras; .focusbar con la ✕ y el contador de
     monedas [data-coin-target]. html[data-tab] y html[data-sec] dicen la pestaña y la sección actuales. */
:root{--bar-top:calc(var(--safe-t) + 8px);--tb-row:var(--tap);--topbar-h:calc(var(--safe-t) + 60px);--tabbar-h:62px;--tabbar-b:max(12px,var(--safe-b));
  --drop:rgba(120,120,128,.15);--drop-hi:inset 0 1px 0 rgba(255,255,255,.75);--edge:rgba(242,242,247,.9);--tab-ink:#0F4FB0}
:root[data-theme=dark]{--drop:rgba(255,255,255,.08);--drop-hi:inset 0 1px 0 rgba(255,255,255,.16);--edge:rgba(0,0,0,.86);--tab-ink:var(--brand-ink)}
html{scroll-padding-top:calc(var(--topbar-h) + 8px);scroll-padding-bottom:calc(var(--tabbar-h) + var(--tabbar-b) + 8px)}
main{padding:var(--topbar-h) 0 calc(var(--tabbar-h) + var(--tabbar-b) + 28px)}
/* barra superior: tres botones de vidrio sobre un borde que funde el contenido que pasa por debajo */
.topbar{position:fixed;z-index:var(--z-bar);top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:var(--bar-top) max(16px,var(--safe-r)) 8px max(16px,var(--safe-l));pointer-events:none}
.topbar::after{content:"";position:absolute;z-index:-1;inset:0 0 -20px;pointer-events:none;
  background:linear-gradient(180deg,var(--edge) 0,var(--edge) calc(var(--safe-t) + 20px),rgba(242,242,247,0) 100%)}
:root[data-theme=dark] .topbar::after{background:linear-gradient(180deg,var(--edge) 0,var(--edge) calc(var(--safe-t) + 20px),rgba(0,0,0,0) 100%)}
/* en la granja la escena llega hasta arriba (sin el borde que funde); al bajar más allá de ella, el borde vuelve */
:root[data-tab=granja]:not([data-fm-past]) .topbar::after{display:none}
.topbar>*{pointer-events:auto}
.tb-flag{flex:none;width:var(--tap);height:var(--tap);padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
/* el botón de Google (js/sync.js lo enseña mientras no hay Google; nunca en Tech Prep) */
.tb-google{flex:none;width:var(--tap);height:var(--tap);padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb-google[hidden],:root[data-tech] .tb-google{display:none}
.tb-google svg{display:block;width:22px;height:22px}
/* en las pantallas de segundo nivel, la cápsula «‹ Atrás» con el nombre de la anterior va en el sitio de la bandera, como
   el botón de volver de iOS: la ficha de un tema (‹ Palabras), una página del álbum (‹ Álbum) y la temporada (‹ Hoy).
   paintTabs() la pone (html[data-back]); en #/doc/… js/learn.js vuelve con Atrás si se vino de la lista */
.tb-back{display:none;flex:none;align-items:center;gap:2px;height:var(--tap);padding:0 16px 0 8px;border-radius:var(--r-pill);
  color:var(--brand-ink);font:600 var(--fs-sub)/1 var(--f-text);text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tb-back .ico{color:var(--brand-tint)}
:root[data-back] .topbar>.tb-back{display:inline-flex}
:root[data-back] .topbar>.tb-flag{display:none}
.flag{display:block;width:28px;height:28px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.18);flex:none}
.flag svg{display:block;width:100%;height:100%}
.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-group{display:flex;align-items:center;height:var(--tap);border-radius:var(--r-pill);flex:none}
.tb-coins{display:flex;align-items:center;gap:4px;height:var(--tap);min-width:var(--tap);padding:0 12px;border:0;background:none;border-radius:var(--r-pill);
  font:800 calc(1.1875rem*var(--k))/1 var(--f-round);font-variant-numeric:tabular-nums;color:var(--gold-ink);white-space:nowrap;cursor:pointer}
.coin-ico{display:block;width:22px;height:22px;flex:none}
.tb-sep{flex:none;width:1px;height:20px;background:var(--sep)}
.tb-gear{flex:none;width:var(--tap);height:var(--tap);padding:0;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--label);cursor:pointer}
/* menú de idioma (vidrio, radio 20): los tres idiomas con su bandera y ✓ en el elegido */
.lang-m{position:fixed;z-index:calc(var(--z-bar) + 5);top:calc(var(--bar-top) + var(--tb-row) + 8px);left:max(16px,var(--safe-l));
  width:min(280px,calc(100vw - 32px));padding:4px;border-radius:var(--r-menu)}
/* un menú con filas de texto: tinte más denso, para que la letra grande de detrás no se lea entre las filas */
.lang-m.glass{--g-tint:rgba(255,255,255,.84)}
:root[data-theme=dark] .lang-m.glass{--g-tint:rgba(28,28,30,.82)}
.lang-m[hidden]{display:none}
.lm-i{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row);padding:8px 12px;border:0;background:none;border-radius:16px;
  color:var(--label);font:600 var(--fs-body)/1.2 var(--f-text);text-align:left;cursor:pointer}
/* separador recto de media línea, como en las filas de Ajustes (sin las puntas curvas de una sombra con radio) */
.lm-i+.lm-i::before{content:"";position:absolute;top:0;left:52px;right:12px;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0;pointer-events:none}
.lm-i:hover{background:var(--fill2)}
.lm-i:hover::before,.lm-i:hover+.lm-i::before{visibility:hidden}
.lm-t{flex:1;min-width:0}.lm-t small{display:block;font:400 var(--fs-note)/1.3 var(--f-text);color:var(--label2)}
.lm-i .lm-chk{flex:none;color:var(--brand-ink);visibility:hidden}
.lm-i[aria-checked=true] .lm-chk{visibility:visible}
/* Tech Prep (js/tech-boot.js, html[data-tech] mientras se está dentro): su entrada del menú va tras una línea, con su
   icono en un círculo azul (también en el sitio de la bandera); dentro no hay monedas */
.flag.tp-flag{display:grid;place-items:center;background:var(--brand-fill);color:#fff;box-shadow:none}
.tb-flag .flag.tp-flag .ico{width:18px;height:18px}
.lang-m .lm-tp{margin-top:9px}
.lang-m .lm-tp::before,.lang-m .lm-i:hover+.lm-tp::before,.lang-m .lm-tp:hover::before{visibility:visible;top:-5px;left:12px;right:12px}
:root[data-tech] .tb-coins,:root[data-tech] .tb-sep,:root[data-tech] .fx-coins{display:none}
/* barra de pestañas flotante */
.tabbar{position:fixed;z-index:var(--z-bar);left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));bottom:var(--tabbar-b);
  max-width:520px;height:var(--tabbar-h);margin:0 auto;padding:4px;display:flex;border-radius:calc(var(--tabbar-h) / 2)}
/* nav (punto de referencia «Principal») › div role=tablist › las 5 a.tab */
.tb-list{flex:1 1 auto;min-width:0;display:flex}
.tab{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:calc(var(--tabbar-h) / 2 - 4px);color:var(--label);text-decoration:none;font:600 var(--fs-tab)/1.17 var(--f-text);letter-spacing:-.1px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tab .ico{width:26px;height:26px}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected=true]{color:var(--tab-ink);background:var(--drop);box-shadow:var(--drop-hi)}
.tab[aria-selected=true] .ico{color:var(--tab-ink)}   /* icono y nombre del mismo azul: en claro uno algo más oscuro que el de texto, que da 4,5:1 sobre la gota gris */
.tab[aria-selected=true]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.8;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tab:focus-visible{outline-offset:-3px}
.tb-badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--brand-fill);color:#fff;font:700 calc(.8125rem*var(--k))/20px var(--f-text);font-variant-numeric:tabular-nums;text-align:center;
  box-shadow:0 0 0 2px var(--g-solid);pointer-events:none}
.tb-badge.dot{top:6px;left:calc(50% + 9px);min-width:0;width:10px;height:10px;padding:0}
.tb-badge[hidden]{display:none}
/* en la granja la barra va sin desenfoque: casi opaca para que los textos de debajo no se mezclen con los nombres (lo
   mismo los botones de arriba cuando van sin desenfoque) */
.tabbar,.topbar,.acc{--g-lite:rgba(255,255,255,.96);--g-lite-d:rgba(28,28,30,.96)}
.tabbar.lite .tab[aria-selected=true]{background:rgba(120,120,128,.10)}
:root[data-theme=dark] .tabbar.lite .tab[aria-selected=true]{background:var(--drop)}
@media (prefers-contrast:more){.tab[aria-selected=true]::before{display:none}.tab[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--brand-tint)}}
:root[data-contrast=more] .tab[aria-selected=true]::before{display:none}
:root[data-contrast=more] .tab[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--brand-tint)}
@media (forced-colors:active){.tab[aria-selected=true]{outline:2px solid Highlight}.tb-badge{border:1px solid CanvasText}}
/* tableta grande y ordenador: la barra flota arriba, en la fila de la bandera y las monedas. Va dentro de header.topbar
   (placeBar() la mueve ahí: así el orden del teclado es el de la pantalla), que pasa a rejilla de 3 columnas: las de
   los lados se reparten el sitio que sobra, y la barra queda centrada en la pantalla si cabe o se corre lo justo si el
   grupo de la derecha es ancho, siempre a 12 px como poco de los otros botones. Pestañas de 44 px de alto (la barra,
   52) con los nombres enteros: si no caben, placeBar() aprieta las pestañas (compact) y, si aun así no caben (texto
   muy grande), la barra vuelve abajo (bottom). */
@media (min-width:820px){
  :root:not([data-bar=bottom]){--tb-row:52px;--topbar-h:calc(var(--safe-t) + 68px);scroll-padding-bottom:16px}
  :root:not([data-bar=bottom]) main{padding-bottom:48px}
  :root:not([data-bar=bottom]) .topbar{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);column-gap:12px}
  :root:not([data-bar=bottom]) .topbar>.tb-flag,:root:not([data-bar=bottom]) .topbar>.tb-back{grid-column:1;grid-row:1;justify-self:start}
  :root:not([data-bar=bottom]) .topbar>.tabbar{grid-column:2}
  :root:not([data-bar=bottom]) .topbar>.tb-right{grid-column:3;justify-self:end}
  :root:not([data-bar=bottom]) .tabbar{position:relative;inset:auto;z-index:auto;width:max-content;max-width:none;height:var(--tb-row);margin:0;
    padding:4px;border-radius:calc(var(--tb-row) / 2)}
  :root:not([data-bar=bottom]) .tb-list{flex:none}
  :root:not([data-bar=bottom]) .tab{flex:none;flex-direction:row;gap:6px;min-height:var(--tap);padding:0 14px;border-radius:calc(var(--tap) / 2);font-size:calc(.875rem*var(--k))}
  :root:not([data-bar=bottom]) .tab .tl{max-width:none;overflow:visible;text-overflow:clip}
  :root:not([data-bar=bottom]) .tab .ico{width:20px;height:20px}
  :root:not([data-bar=bottom]) .tb-badge{position:static;margin-left:2px}
  :root:not([data-bar=bottom]) .tb-badge.dot{margin-left:0}
  :root[data-bar=compact] .tab{gap:4px;padding:0 8px;font-size:calc(.8125rem*var(--k))}
}
/* título grande y segmentos de la pestaña (solo en su raíz; las pantallas no pintan otro título grande) */
.tabhead{padding-top:4px}
.tabhead[hidden]{display:none}
/* Aprender: el título y los segmentos en la misma columna de 640 px que Camino, Palabras y Gramática (js/learn.js) */
:root[data-tab=aprender] #tabhead{max-width:calc(640px + max(16px,var(--safe-l)) + max(16px,var(--safe-r)))}
.th-t{margin:0 0 12px;color:var(--label)}
/* segmentos del mismo ancho mientras quepan; si un nombre (con su aviso o con texto grande) no cabe, ese segmento crece
   y los demás ceden */
.seg{display:flex;gap:2px;width:100%;max-width:560px;min-height:48px;padding:2px;margin:0 0 20px;border-radius:var(--r-pill);background:var(--fill2);container-type:inline-size}
.seg-i{position:relative;flex:1 1 0;min-width:max-content;min-height:var(--tap);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;background:none;border-radius:var(--r-pill);
  color:var(--label);font:600 var(--fs-note)/1.15 var(--f-text);text-align:center;text-decoration:none;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.seg-i[aria-selected=true],.seg-i[aria-checked=true]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg-i[aria-selected=true],:root[data-theme=dark] .seg-i[aria-checked=true]{background:#636366;color:#fff}
.seg-i:focus-visible{outline-offset:-2px}
/* el aviso de la pestaña, repetido en el segmento al que se refiere («Repasar 9+», punto en «Álbum») */
.seg-i[data-badge]::after{content:attr(data-badge);flex:none;box-sizing:border-box;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--brand-fill);color:#fff;font:700 calc(.8125rem*var(--k))/20px var(--f-text);font-variant-numeric:tabular-nums;text-align:center}
.seg-i[data-badge=""]::after{min-width:0;width:8px;height:8px;padding:0}
/* en el móvil no caben «Repasar» y «9+» en un cuarto de fila: el segmento lleva el punto (el número ya está en la pestaña
   y en el nombre que lee el lector de pantalla) */
@container (max-width:419px){.seg-i[data-badge]::after{content:"";min-width:0;width:8px;height:8px;padding:0}
  /* y los segmentos de las pestañas, a lo que mide su nombre y cediendo todos a la vez: la fila nunca se sale */
  #tabhead .seg-i{flex:1 1 auto;min-width:0;padding:0 4px;gap:4px}}
@media (forced-colors:active){.seg-i[data-badge]::after{border:1px solid CanvasText}}
@media (prefers-contrast:more){.seg-i[aria-selected=true],.seg-i[aria-checked=true]{outline:2px solid var(--label);outline-offset:-2px}}
@media (forced-colors:active){.seg-i[aria-selected=true],.seg-i[aria-checked=true]{outline:2px solid Highlight}}
/* solo para el lector de pantalla */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* las pantallas que aún llevan «← Inicio»: sobra con la barra de pestañas */
.back[href="#/"]{display:none!important}
/* modo foco: sin barras; ✕ de vidrio arriba a la izquierda y el contador pequeño de monedas a la derecha */
.focusbar{display:none}
:root[data-focus] .topbar,:root[data-focus] .tabbar,:root[data-focus] .lang-m,:root[data-focus] .tabhead{display:none}
:root[data-focus] .focusbar{position:fixed;z-index:var(--z-bar);top:var(--bar-top);left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));
  height:var(--tap);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.focusbar>*{pointer-events:auto}
/* en la lección y el repaso, la ✕ y las monedas van en la misma columna de 560 px que la barra y la tarjeta */
:root:is([data-focus=leccion],[data-focus=repaso]) .focusbar{left:max(16px,var(--safe-l),calc(50% - 280px));right:max(16px,var(--safe-r),calc(50% - 280px))}
:root[data-focus=tech] .focusbar{left:max(16px,var(--safe-l),calc(50% - 340px));right:max(16px,var(--safe-r),calc(50% - 340px))}   /* Tech Prep: columna de 680 px */
.fx-x{flex:none;width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--label);text-decoration:none}
.fx-coins{display:flex;align-items:center;gap:5px;min-height:32px;padding:0 2px;font:800 calc(1.0625rem*var(--k))/1 var(--f-round);
  font-variant-numeric:tabular-nums;color:var(--gold-ink);white-space:nowrap}
.fx-coins .coin-ico{width:20px;height:20px}
:root[data-focus] main{padding:calc(var(--bar-top) + var(--tap) + 12px) 0 calc(var(--safe-b) + 32px)}
html[data-focus]{scroll-padding-top:calc(var(--bar-top) + var(--tap) + 8px);scroll-padding-bottom:16px}
/* la fila de arriba de la lección y de la partida va en la misma línea que la ✕ y las monedas (su ✕ propia sobra) */
:root[data-focus] .ls-top,:root[data-focus] .gm-top{margin-top:calc(-1 * (var(--tap) + 12px));min-height:var(--tap);padding:0 92px 0 56px}
:root[data-focus] .ls-top .x,:root[data-focus] .gm-x,:root[data-focus] .back[href="#/repaso"],:root[data-focus] .gm .back[href="#/juegos"]{display:none!important}
/* la cápsula de avisos sale debajo de las barras de arriba */
html #m-toasts{inset:calc(var(--bar-top) + var(--tb-row) + 8px) 0 auto 0}
:root[data-focus] #m-toasts{inset:calc(var(--bar-top) + var(--tap) + 8px) 0 auto 0}
/* filas agrupadas de las hojas: Ajustes (js/settings.js, dialog#ajustes) y la hoja de voz (dialog#cfg, openCfg) */
#cfg.m-sheet{max-width:600px}
/* fondo gris de lista agrupada (las filas blancas encima), opaco como Ajustes a toda altura */
dialog#cfg.m-sheet,dialog#cfg.m-sheet.glass{background:#F2F2F7;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-theme=dark] dialog#cfg.m-sheet,:root[data-theme=dark] dialog#cfg.m-sheet.glass{background:#1C1C1E}
.st-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
dialog .st-top h2{margin:0}
.st-sec{margin:0 0 22px}
.st-h{margin:0 16px 6px;font:600 var(--fs-note)/1.33 var(--f-text);color:rgba(60,60,67,.9)}
:root[data-theme=dark] .st-h{color:var(--label2)}
#cfg .note{background:none;border:0;padding:0;color:var(--label2)}
.btn[hidden],.glass-btn[hidden]{display:none}
:root[data-theme=dark] #cfg .note{color:rgba(235,235,245,.78)}
.st-g{background:var(--card);border-radius:var(--r-card);overflow:hidden}
:root[data-theme=dark] .st-g{background:var(--card-2)}
.st-r{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row);margin:0;padding:10px 16px;border:0;background:none;
  color:var(--label);font:400 var(--fs-body)/1.3 var(--f-text);text-align:left;text-decoration:none}
dialog label.st-r{margin:0;font-weight:400}
.st-r+.st-r::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.st-r.col{flex-direction:column;align-items:stretch;gap:8px}
.st-r[hidden]{display:none}
button.st-r{cursor:pointer}
.st-l{flex:1;min-width:0}
.st-l small{display:block;font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.st-ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--brand-fill)}
.st-ic.tl{background:var(--brand-fill)}.st-ic.gr{width:30px;margin:0;background:#8E8E93}   /* (tl: el verde azulado es solo adorno de progreso; width y margin: que .gr de js/learn.js no la estire) */
.st-r.col select,.st-r.col input[type=range]{width:100%}
dialog .st-r.col>label{margin:0;font:600 var(--fs-sub)/1.3 var(--f-text)}
.st-r[data-sync-cfg]:empty{display:none}
.st-r .dlbl{margin:0}
.dlbl span{display:inline-flex;align-items:center;gap:4px}
button.st-r:disabled{cursor:default;color:var(--label2)}
button.st-r:disabled .st-ic{background:#8E8E93}
.st-btn{color:var(--brand-ink);font-weight:600}
.st-sw{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:51px;height:31px;margin:0;border-radius:16px;
  background:rgba(120,120,128,.32);cursor:pointer;transition:background var(--d-fast,160ms) ease}
.st-sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:translate var(--d-base,260ms) var(--sp-snappy,ease)}
.st-sw:checked{background:var(--ok-fill)}
.st-sw:checked::after{translate:20px 0}
.st-sw:focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
.st-g .seg{margin:0;max-width:none}
.st-cred{padding:14px 16px;font:400 var(--fs-note)/1.45 var(--f-text);color:var(--label2)}
.st-cred a{color:var(--brand-ink)}
.st-g .off-dl .pr-row{gap:8px}
.off-rows .st-r{position:relative}
.off-rows>.st-r+.st-r::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.off-prog{padding-left:58px}
/* Voz y velocidad: una fila por idioma (bandera, la voz que sonará y ›) y la página de cada idioma (✓ en la elegida, ▶ para
   oírla). Van aquí y no en js/settings.js porque la hoja propia de voz (dialog#cfg) también las usa. */
.aj-val{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label2)}
.aj-chev{flex:none;display:grid;place-items:center;color:var(--label3)}
.st-ic.fl{background:none}
.st-ic.fl .flag{width:28px;height:28px}
/* la fila de idioma: el nombre es corto y no se encoge; la voz que sonará ocupa el resto, en una línea (… si no cabe; «Automática ·
   Sonia» que no cabe se queda en «Automática»: fitVoz). Con una nota debajo del idioma, la nota manda. */
.cfg-l .st-l{flex:none}
.cfg-l .aj-val{flex:1 1 auto;min-width:0;max-width:none;text-align:right}
.cfg-l.cfg-n .st-l{flex:1 1 auto;min-width:0}
.cfg-l.cfg-n .aj-val{flex:none;max-width:45%}
#cfg .st-g.ics>.st-r+.st-r::before{left:58px}
.vl-r{padding:0 0 0 9px;gap:0;align-items:stretch}
.vl-try{flex:none;align-self:center;width:44px;height:44px;display:grid;place-items:center;margin:0;padding:0;border:0;border-radius:50%;
  background:none;color:var(--brand-tint);cursor:pointer;-webkit-tap-highlight-color:transparent}
.vl-pl{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:transparent;transition:background var(--d-fast,160ms) ease,color var(--d-fast,160ms) ease}   /* solo ▶; el disco, mientras suena */
.vl-try.playing .vl-pl{background:var(--brand-fill);color:#fff}
/* «Probar voz»: lo que ve el aparato, una cosa por línea */
#cfg-pr b,#cfg-pr .pv-l,#cfg-fix .pv-l{display:block}
#cfg-pr b{font-weight:700}
#cfg-pr .pv-ok{color:var(--ok-ink)}#cfg-pr .pv-no{color:var(--miss-ink)}
#cfg-pv.playing .st-ic{background:var(--brand-fill);color:#fff}
.vl-pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:var(--row);margin:0;padding:10px 16px 10px 5px;border:0;background:none;
  color:var(--label);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vl-chk{flex:none;display:grid;place-items:center;color:var(--brand-tint);visibility:hidden}
.vl-pick[aria-checked=true] .vl-chk{visibility:visible}
.vl-pick:focus-visible,.vl-try:focus-visible{outline:3px solid var(--brand-tint);outline-offset:-3px;border-radius:12px}
.vl-low>.st-r::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
/* «Más voces»: se despliega en su sitio (⌄), con el texto en la columna de los nombres */
.st-r.vl-more{padding-left:58px}
.vl-mchev{flex:none;display:grid;place-items:center;color:var(--label3);transition:transform var(--d-fast,160ms) ease}
.vl-more[aria-expanded=true] .vl-mchev{transform:rotate(180deg)}
/* nube: «necesita internet» (la leyenda va al pie del primer grupo que tiene una) */
.vl-net{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--label2)}
.st-foot{margin:8px 16px 0;font:400 var(--fs-note)/1.38 var(--f-text);color:var(--label2)}   /* (también en js/settings.js; aquí para dialog#cfg) */
.st-foot .vl-net{margin:0 2px 0 0}
.vl-none{margin:0 16px 16px;font:400 var(--fs-sub)/1.38 var(--f-text);color:var(--label2)}
.vl-foot{margin:8px 16px 0;font:400 var(--fs-note)/1.38 var(--f-text);color:var(--label2)}
/* el pie de «Voces» se ve a media altura, sobre el vidrio de la hoja: un poco más oscuro, como los encabezados */
:root:not([data-theme=dark]) .cfg-ls .st-foot{color:rgba(60,60,67,.9)}
@media (forced-colors:active){.vl-chk{color:Highlight}.vl-pl{border:1px solid ButtonText}}
/* la hoja propia de voz (dialog#cfg): barra como la de Ajustes */
.cfg-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px;margin:0 0 8px}
.cfg-tt{grid-column:2;min-width:0;margin:0;font:600 var(--fs-head)/1.2 var(--f-text);color:var(--label);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-tt:focus{outline:none}
.cfg-back{grid-column:1;justify-self:start;display:inline-flex;align-items:center;gap:2px;min-height:var(--tap);max-width:100%;padding:0 8px 0 2px;border:0;
  border-radius:var(--r-pill);background:none;color:var(--brand-ink);font:400 var(--fs-sub)/1.2 var(--f-text);white-space:nowrap;cursor:pointer}
.cfg-back[hidden]{display:none}
.cfg-back span{overflow:hidden;text-overflow:ellipsis}
.cfg-x{grid-column:3;justify-self:end;white-space:nowrap;min-width:max-content}
.off-prog .off-bar{flex:1;margin:0}
.off-x{flex:none;min-height:var(--tap);padding:0 4px;border:0;background:none;font:600 var(--fs-sub)/1.2 var(--f-text);cursor:pointer}
/* Aprender › Camino, Palabras, la ficha de un tema y Gramática: sus estilos van con js/learn.js (<style id="css-learn">) */
/* ===================== Hoy (F2) =====================
   Una sola pantalla sin scroll (390×844 y 360×740 con la barra de pestañas, también con el texto más grande): .hm-hero,
   la tarjeta principal sólida (arriba el zorro con su frase, que lee Hoy en voz alta al tocarlo;
   el título y el subtítulo de nextAction(), los dibujos de lo que toca y «▶ Empezar»); .hm-row, la fila compacta de
   52 px («Repasar N» y lo que devuelven los HOME_SLOTS con homeRow()); .hm-pair, las dos piezas de buddy.js (Misiones y
   Palabra del día); los HOME_SLOTS; .hm-week, la semana (L…D) con la llama; y «Privacidad». Columna de 600 px como
   mucho; desde 820 px, dos columnas. El título y la columna empiezan donde en las otras pestañas (el mismo marco .wrap):
   cambiar de pestaña no mueve el título. Si algo no cabe, fit() de js/shortcuts.js quita antes la frase de la cena y la
   semana y, más tarde, los dibujos (en el móvil, con «Tus atajos» no hay dibujos: la fila ya es de dibujos). */
.hm{display:flex;flex-direction:column;gap:12px;max-width:600px}
/* tableta pequeña (744-819 px): la columna, de todo el ancho como el título (no apoyada a la izquierda con un hueco) */
@media (min-width:744px) and (max-width:819px){.hm{max-width:none}}
.hm-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.hm-hero{display:flex;flex-direction:column;align-items:stretch;padding:16px;text-align:center}
/* arriba: el zorro y su bocadillo en una sola fila (con poco sitio, el bocadillo pasa a dos líneas, no debajo del zorro);
   todo es un botón que lee la tarjeta con la voz española (el altavoz solo sale si el aparato tiene esa voz) */
.hm-top{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.hm-read{display:flex;align-items:center;min-width:0;max-width:100%;margin:0;padding:0;border:0;border-radius:18px;background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hm-read:focus-visible{outline:3px solid var(--brand-tint);outline-offset:3px}
.hm-fox{flex:none;display:flex;transform-origin:50% 92%}
.hm-say{position:relative;display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;margin:0 0 0 18px;padding:8px 16px;border-radius:16px;
  background:var(--card-2);color:var(--label);font:600 var(--fs-sub)/1.2 var(--f-text);text-align:left}
.hm-say::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right:6px solid var(--card-2)}
.hm-st{min-width:0;overflow-wrap:anywhere}
.hm-spk{flex:none;display:grid;place-items:center;width:28px;height:28px;margin:-4px -8px -4px 0;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink)}
.hm-read.is-playing .hm-spk{background:var(--brand-fill);color:#fff}
/* sin voz española en el aparato, ningún altavoz del zorro (Hoy, Misiones, la bienvenida): html sin data-es-voice */
:root:not([data-es-voice]) :is(.hm-spk,.bd-spk,.wl-spk){display:none}
:root:not([data-es-voice]) .hm-say{padding-right:16px}
.hm-t{margin:12px 0 0;font:700 var(--fs-t2)/1.2 var(--f-round);color:var(--label);text-wrap:balance;overflow-wrap:anywhere}
.hm-sub{margin:2px 0 0;font:400 var(--fs-sub)/1.3 var(--f-text);color:var(--label2)}
/* los dibujos de lo que toca (3 de 64 px; en un móvil bajo, 2 de 48 px) */
.hm-tiles{display:flex;justify-content:center;gap:12px;margin:10px 0 0}
.hm-tile{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--card-2)}
.hm-tile img{display:block;width:52px;height:52px;max-width:none;object-fit:contain;-webkit-user-drag:none;user-select:none}
.hm-notiles .hm-tiles{display:none}
.hm-go{margin-top:16px}
.hm-tiles+.hm-go,.hm-tiles+.hm-two{margin-top:12px}
/* «¡Lo de hoy, hecho!»: dos botones, la granja y los juegos */
.hm-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:16px}
.hm-two .glass-btn{min-width:0;padding:0 12px}
.hm-two .hm-go{margin-top:0}
/* el zorro saluda una vez al entrar (el único reclamo de la pantalla) y da un saltito al ganar monedas */
.hm-fox.wave{animation:hm-wave 1.1s cubic-bezier(.4,0,.3,1) .3s 1 both}
.hm-fox.hop{animation:hm-hop .5s cubic-bezier(.3,.9,.4,1) 1}
@keyframes hm-wave{0%,100%{rotate:0deg}15%{rotate:-9deg}35%{rotate:8deg}55%{rotate:-6deg}75%{rotate:3deg}}
@keyframes hm-hop{0%,100%{translate:0 0}40%{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.hm-fox.wave,.hm-fox.hop{animation:none}}
/* fila compacta (homeRow): icono en círculo, texto, número opcional y flecha */
.hm-row{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row);margin:0;padding:8px 12px;border:0;border-radius:calc(var(--row) / 2);
  color:var(--label);text-decoration:none;text-align:left;font:600 var(--fs-head)/1.2 var(--f-text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.hm-ric{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--brand-fill);color:#fff;font-size:18px;line-height:1}
.hm-ric.teal{background:var(--brand-fill)}.hm-ric.gold{background:var(--gold);color:var(--gold-on)}.hm-ric.gray{background:#8E8E93}.hm-ric.emo{background:var(--fill2);font-size:20px}
.hm-rt{flex:1;min-width:0;overflow-wrap:anywhere}
.hm-rt small{display:block;margin-top:1px;font:400 var(--fs-note)/1.3 var(--f-text);color:var(--label2)}
.hm-badge{flex:none;min-width:28px;height:24px;padding:0 8px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);
  font:800 var(--fs-note)/1 var(--f-round);font-variant-numeric:tabular-nums}
.hm-chev{flex:none;color:var(--label3)}
:root[data-theme=dark] .hm-chev{color:rgba(235,235,245,.45)}
.hm-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
/* la semana, de lunes a domingo (vocabRewards.week()), con la llama y los días seguidos (streak()): sin tarjeta, una línea
   de 28 px debajo de las piezas. Dorado = ese día practicó; hoy, con un aro */
.hm-week{display:flex;align-items:center;justify-content:center;gap:12px;min-height:28px;margin:-2px 0 0}
.hm-week[hidden]{display:none}
.hm-wf{display:inline-flex;align-items:center;gap:2px;font:800 var(--fs-sub)/1 var(--f-round);color:var(--label);font-variant-numeric:tabular-nums}
.hm-wf .ico{color:var(--gold-deep)}
.hm-wf.off .ico{color:var(--label3)}
.hm-wd{display:flex;gap:6px;margin:0;padding:0;list-style:none}
.hm-wd li{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--fill2);color:var(--label);font:700 var(--fs-min)/1 var(--f-text)}
.hm-wd li.on{background:var(--gold);color:var(--gold-on)}
.hm-wd li.today:not(.on){background:none;box-shadow:inset 0 0 0 2px var(--gold-deep)}
.hm-wd li.fut{background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2)}
@media (forced-colors:active){.hm-wd li{border:1px solid CanvasText}.hm-wd li.on{background:CanvasText;color:Canvas}}
/* HOME_SLOTS: como mucho 2, y si no hay nada no ocupan sitio. Lo que no sea una fila de homeRow() (un .panel o una
   tarjeta de otro módulo) se compacta aquí: en fila, con el título pequeño, sin el párrafo y con los botones justos */
.hm-slots{display:flex;flex-direction:column;gap:8px}
.hm-slots:empty{display:none}
.hm-slot{min-width:0}
.hm-slots .hm-slot>:not(.hm-row){display:flex;flex-direction:row;align-items:center;gap:10px;margin:0;padding:8px 14px;border:0;border-radius:var(--r-card);box-shadow:none}
.hm-slots .hm-slot>:not(.hm-row)>[aria-hidden=true]:first-child{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1}
.hm-slots .hm-slot>:not(.hm-row)>*{min-width:0}
.hm-slots .hm-slot>:not(.hm-row) :is(h2,h3){margin:0 0 2px;font:600 var(--fs-note)/1.25 var(--f-text);color:var(--label)}
.hm-slots .hm-slot>:not(.hm-row) p{display:none}
.hm-slots .hm-slot>:not(.hm-row) :is(.btn,button){min-height:var(--tap);padding:0 12px;font-size:var(--fs-note);box-shadow:none}
.hm-slots .hm-slot>:not(.hm-row) div:has(>:is(.btn,button)){margin:0;gap:0 6px}
.hm-priv{margin:-8px 0 0;text-align:center;font:400 var(--fs-min)/1.38 var(--f-text)}
/* móviles bajos (iPhone SE 375×667, Android 360×740): Hoy sigue cabiendo sin scroll; zorro y título más pequeños, menos
   aire, 2 dibujos de 48 px, sin la semana (está en Premios) y un solo HOME_SLOT (homeSlots()) */
@media (max-width:819px) and (max-height:760px){
  #tabhead .th-t{margin-bottom:8px}
  .hm,.hm-side,.hm-pair{gap:8px}
  .hm-hero{padding:12px 16px}
  .hm-fox .hero{font-size:40px!important}
  .hm-say{padding-top:6px;padding-bottom:6px}
  .hm-t{margin-top:8px;font-size:var(--fs-t3)}
  .hm-tiles{gap:12px;margin-top:8px}
  .hm-tile{width:48px;height:48px;border-radius:12px}
  .hm-tile img{width:40px;height:40px}
  .hm-tile:nth-child(n+3){display:none}
  .hm-go{margin-top:12px;min-height:48px}
  .hm-tiles+.hm-go,.hm-tiles+.hm-two{margin-top:10px}
  .hm-two{margin-top:12px;gap:8px}
  .hm-week{display:none}
  .hm-priv{margin-top:-4px}
  :root[data-tab=hoy]:not([data-acc]) main{padding-bottom:calc(var(--tabbar-h) + var(--tabbar-b) + 8px)}   /* «Privacidad», justo encima de la barra */
  :root[data-tab=hoy][data-acc]:not([data-focus]) main{padding-bottom:calc(var(--tabbar-h) + var(--tabbar-b) + 20px + var(--tap-bar))}   /* y del accesorio */
}
/* texto más grande: 4 px menos de aire para que siga cabiendo */
:root[data-text=large] .hm-t{margin-top:8px}
.hm-priv a{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;color:var(--label2);text-decoration:none}
@media (min-width:820px){
  .hm{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start;max-width:none}
  .hm-hero{align-self:stretch;justify-content:center;padding:24px}
  .hm-fox .hero{font-size:72px!important}
  .hm-side,.hm-pair{gap:16px}
  .hm-week{margin:0}
  .hm-priv{grid-column:1/-1}
}
/* accesorio «Seguir» (algo empezado: una lección guardada o un repaso abierto): cápsula de vidrio del ancho de la barra
   de pestañas, justo encima, como el minirreproductor de Música: anillo de progreso, «Seguir · Lección 4» y la flecha.
   En el ordenador (la barra va arriba), abajo y centrado, con el mismo ancho como mucho. */
.acc{position:fixed;z-index:var(--z-acc);left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));bottom:calc(var(--tabbar-b) + var(--tabbar-h) + 8px);
  max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:var(--tap-bar);padding:0 16px 0 8px;border-radius:var(--r-pill);
  color:var(--label);text-decoration:none;font:600 var(--fs-sub)/1.2 var(--f-text);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.acc-go{flex:none;color:var(--label2)}
.acc[hidden],:root[data-focus] .acc{display:none}
.acc-ring{position:relative;flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--brand-tint)}
.acc-rs{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg}
.acc-ring circle{fill:none;stroke-width:3.5}
.acc-bg{stroke:var(--fill)}
.acc-fg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dasharray var(--d-base,260ms) ease}
.acc-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acc-t b{font-weight:700}
:root[data-acc]:not([data-focus]) main{padding-bottom:calc(var(--tabbar-h) + var(--tabbar-b) + 38px + var(--tap-bar))}
/* ese hueco cambia de golpe, también con «Reducir movimiento» (que da 150 ms a toda transición): Hoy lo mide al momento */
main{transition-property:none}
@media (min-width:820px){
  :root:not([data-bar=bottom]) .acc{bottom:calc(16px + var(--safe-b))}
  :root[data-acc]:not([data-focus]):not([data-bar=bottom]) main{padding-bottom:calc(64px + var(--tap-bar))}
}
/* «Reducir movimiento»: el del aparato y el de Ajustes (html[data-motion=calm]) hacen lo mismo. Aquí, para todo:
   animaciones y transiciones cortas (≤150 ms) y sin bucles; las reglas propias de cada pantalla y módulo para el
   aparato se copian para data-motion=calm en <style id="css-calm"> (calmCss() más abajo). */
@media (prefers-reduced-motion:reduce){*,*::before,*::after,::backdrop{animation-duration:150ms!important;animation-delay:0s!important;
  animation-iteration-count:1!important;transition-duration:150ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
:root[data-motion=calm] *,:root[data-motion=calm] *::before,:root[data-motion=calm] *::after,:root[data-motion=calm] ::backdrop{animation-duration:150ms!important;
  animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:150ms!important;transition-delay:0s!important;
  scroll-behavior:auto!important}
h1{font:700 1.75rem/1.2 var(--f-round);margin:4px 0 6px}
h2{font:700 1.25rem/1.25 var(--f-round);margin:28px 0 10px;color:var(--label)}
.sub{color:var(--muted);margin:0 0 14px}
input[type=search]{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none}
.cat{background:var(--cat);color:var(--brand-2);font-weight:700;font-size:.9rem;letter-spacing:.03em;padding:7px 12px;border-radius:8px;margin:18px 0 8px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--card);border:1px solid transparent;border-radius:var(--r-card);padding:12px;box-shadow:var(--shadow)}
.img{display:flex;align-items:center;justify-content:center}
.img img{max-width:88px;max-height:88px}
.row.wide{grid-template-columns:150px 1fr}.row.wide .img img{max-width:146px;max-height:110px}
.img .ph{width:72px;height:72px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--muted)}
.es{font-size:.9rem;color:var(--muted);font-weight:600}
.word{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0;font-size:.92rem}
.meta b{font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
/* IPA (ipaHtml()): gris secundario, en la letra VocabIPA (arriba, con todos los símbolos) y nunca en la redonda; el
   tamaño lo pone el sitio donde va (subtítulo) */
.ipa{color:var(--label2);font-family:"VocabIPA",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400;font-style:normal;
  letter-spacing:normal;font-synthesis:none}
.pron{font-style:italic}
.ex{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:.95rem}
.ex .tr{color:var(--muted);font-style:italic;font-size:.88rem}
.say{border:1px solid var(--line);background:var(--soft);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
.sayg{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.say.tt{font-size:.95rem}
.sayrow{display:flex;gap:10px;align-items:center;justify-content:center}
.say.sm{width:28px;height:28px;font-size:.85rem;vertical-align:middle;margin-left:4px}
.say:hover{border-color:var(--brand)}
.say.playing{background:var(--brand-fill);color:#fff;border-color:transparent}
[data-novoice]{filter:grayscale(1);opacity:.5}
.note{background:var(--soft);border:1px solid transparent;border-radius:14px;padding:10px 12px;font-size:.9rem;color:var(--muted);margin:10px 0}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid transparent;background:var(--fill);color:var(--label);border-radius:999px;padding:8px 18px;font-weight:600;text-align:center;line-height:1.2}
.btn.pri{background:var(--brand-fill);border-color:transparent;color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),var(--hb-shadow)}
.btn.pri:hover{filter:brightness(1.06)}
.btn:disabled{cursor:not-allowed}
.count{color:var(--muted);font-size:.9rem}
@media (max-width:560px){
  .row{grid-template-columns:64px 1fr;gap:10px;padding:10px}
  .img img{max-width:60px;max-height:60px}.row.wide{grid-template-columns:104px 1fr}.row.wide .img img{max-width:100px;max-height:90px}.img .ph{width:52px;height:52px}
  .word{font-size:1.15rem}
}
/* fila de botones y final de una pantalla (js/review.js, js/album.js, la descarga); la práctica de repeticiones lleva
   sus estilos en js/learn.js */
.pr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr-end{text-align:center;padding:30px 20px}
.pr-end .big{font-size:2.6rem}

/* etiquetas de los extremos de una barra (Voz y velocidad) y la barra de «Descargar todo» */
.dlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.off-bar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden;margin:12px 0 6px}
.off-bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:inherit;transition:width .2s}
@media (prefers-reduced-motion:reduce){.off-bar i{transition:none}}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{accent-color:var(--brand)}
/* diálogo de voz */
dialog{border:0;border-radius:var(--r-card);background:var(--card);color:var(--label);padding:20px;width:min(92vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 6px}
dialog label{display:block;font-weight:600;margin:14px 0 6px}
/* lección: sus estilos van con js/lesson.js (<style id="css-lesson">) */
/* el botón principal es siempre azul (un solo color para lo que se toca); --lc queda para cabeceras y adornos del nivel o juego */
.btn.lc{background:var(--brand-fill);border-color:transparent;color:#fff;font-weight:700;padding:11px 22px;box-shadow:0 4px 0 color-mix(in srgb,var(--brand-fill) 60%,#000)}
.hero{position:relative;display:inline-block;width:1.3em;height:1.25em;line-height:1;flex:none}
.hero span{position:absolute;line-height:1}
.hero .h-base{left:.15em;top:.2em;font-size:1em}
.hero .h-hat{left:.37em;top:-.12em;font-size:.55em;transform:rotate(-8deg)}
.hero .h-face{left:.42em;top:.42em;font-size:.45em}
.hero .h-hand{right:-.18em;bottom:-.02em;font-size:.42em;transform:rotate(12deg)}
.hero .h-pet{left:-.22em;bottom:-.04em;font-size:.4em}
/* personajes y animales de cuerpo entero (img/pj): caja fija parecida a la del emoji para no mover nada */
.pj{display:inline-block;width:1.3em;height:1.1em;object-fit:contain;object-position:50% 100%;vertical-align:-.18em;-webkit-user-drag:none;user-select:none}
.pj.pj-sm{width:1.25em;height:1.05em;vertical-align:-.25em}
.hero.pjh .h-base{left:0;top:0;width:100%;height:100%;font-size:1em}
.hero.pjh .h-base .pj{display:block;width:100%;height:100%}
.hero.pjh .h-hat{font-size:.4em;transform:translate(-50%,-80%) rotate(-10deg);transform-origin:50% 100%}
.hero.pjh .h-face{font-size:.3em;transform:translate(-50%,-50%)}
.hero.pjh .h-hand{left:-.06em;right:auto;bottom:-.03em;font-size:.32em;transform:rotate(-12deg)}
.hero.pjh .h-pet{left:auto;right:-.2em;bottom:-.02em;font-size:.48em}
.hero.pjh .h-pet .pj{display:block}
.hero :is(.h-hat,.h-face,.h-hand) .pj{display:block;width:1.15em;height:1.15em;object-position:50% 50%;vertical-align:0}
.hero :is(.h-hat,.h-face,.h-hand) .pj-fb{position:static}
/* la granja (escena, animales, tienda y su hoja) la pinta y la estiliza js/farm.js (<style id="css-farm">) */
/* las piezas de la tienda (.shop, .sc.shp-c) las pinta y las estiliza js/shop.js (window.vocabShop) */
.btn.sm{padding:5px 12px;font-size:.88rem}.btn.sm.on{border-color:var(--brand);color:var(--brand)}
.miss{color:var(--muted);font-size:.78rem}
#gift{width:min(92vw,380px);text-align:center}
.gift h2{color:var(--ink)}
.gbox{font-size:5.5rem;line-height:1.1;animation:shake 1s 3}
@media (prefers-reduced-motion:reduce){.gbox{animation:none}}
.gbox.open{animation:boom .6s forwards}.gbox.got{animation:gpop .5s}
@keyframes gpop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.gword{font-size:1.6rem;font-weight:800;margin:4px 0}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
/* Premios (Medallas y Mi zorro): sus estilos van con js/rewards.js (<style id="css-rewards">) */
</style>
</head>

<script>
const LANGS = {
  english:  {label:"🇬🇧 English",  name:"inglés",  code:"en-GB"},
  "français":{label:"🇫🇷 Français", name:"francés", code:"fr-FR"},
  dansk:    {label:"🇩🇰 Dansk",    name:"danés",   code:"da-DK"},
};
/* "srs:<idioma>" (el repaso) va por su mapa en memoria: srsMem/srsSet/srsFlush, más abajo */
const store = {
  get(k,d){if(/^srs:/.test(k))return srsMem(k.slice(4)).m;try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){if(/^srs:/.test(k)){srsSet(k.slice(4),v);srsFlush();return}try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","english"); if(!LANGS[lang]) lang="english";
let rate = store.get("rate",0.9);
let INDEX = null; const CACHE = {};
const $ = s => document.querySelector(s);
/* conexión con los módulos js/*.js: eventos, rutas y huecos de la portada */
const bus = {h:{}, on(e, f){ (this.h[e] = this.h[e] || []).push(f); }, emit(e, d){ (this.h[e] || []).forEach(f => { try{ f(d); }catch(err){ console.error(err); } }); }};
const ROUTES = {};      /* ROUTES["juegos"] = async partes => {...}   (#/juegos/…) */
const HOME_SLOTS = [];  /* funciones (con .id opcional) → filas compactas de Hoy (homeSlots()) */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* IPA (la pronunciación con símbolos, "ipa" de data/*.json): se ve siempre, salvo que un mayor la apague en Ajustes ›
   Para mayores (vocab:ui {ipa: false}; un {ipa: true} de antes sigue siendo «encendida»). Todos los módulos usan estas dos:
   ipaOn() dice si se ve; ipaHtml(ipa, code, cls, label) la pinta igual en todas partes (<span class="ipa"> con el idioma
   de la palabra y «IPA» oculto para el lector de pantalla; label=false si ya hay una etiqueta «IPA» a la vista) o ""
   si está apagada o no hay. Solo se parte por los espacios: tras la barra de apertura y antes de ˈ ˌ (el acento) va un
   «word joiner» (U+2060, invisible), si no el navegador cortaba «/» al final de una línea o «ˈhæmstə» por la mitad. */
function ipaOn(){ let o = null; try{ o = window.vocabUI ? vocabUI.get() : JSON.parse(localStorage.getItem("vocab:ui")); }catch(e){} return !(o && typeof o === "object" && o.ipa === false); }
function ipaHtml(ipa, code, cls = "", label = true){
  if(!ipa || !ipaOn()) return "";
  const t = esc(ipa).replace(/(\S)(?=[\u02C8\u02CC])/g, "$1\u2060").replace(/\/(?=[^\s\u2060])/g, "/\u2060");
  return `<span class="ipa${cls ? " " + cls : ""}"${code ? ` lang="${esc(code)}"` : ""}>${label ? `<span class="vh" lang="es">IPA: </span>` : ""}${t}</span>`;
}
/* icono del sprite Phosphor: ico("house", "fill", 28, "x") → <svg class="ico x">…; estilo "bold" (contorno) o "fill" (relleno) */
function ico(name, style = "bold", size = 24, cls = ""){
  /* si falta ese estilo se usa el otro; si falta el icono, se avisa (un botón sin icono no lo entiende un niño) */
  if(!document.getElementById(`i-${name}-${style}`)){
    const alt = style === "fill" ? "bold" : "fill";
    if(document.getElementById(`i-${name}-${alt}`)) style = alt;
    else console.warn("[ico] falta el icono", name);
  }
  return `<svg class="ico${cls ? " " + cls : ""}" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="#i-${name}-${style}"></use></svg>`;
}

/* ---------- audio ---------- */
/* Voces del navegador (speechSynthesis): leen solo lo que no tiene audio grabado. Cada idioma tiene la suya.
   - pickVoice(l) / voiceFor(code, l): la voz del idioma l en ESTE aparato: la elegida (localStorage "vocab:voice" =
     {english, "français", dansk: nombre de la voz, o "nombre|en-US" si en ese idioma dos se llaman igual; "" =
     Automática}, solo de este aparato) si la tiene y se puede usar ahora; si no, «Automática». La elección de antes
     ("voice:<l>", va en la partida) se lee solo de respaldo y nunca se toca. Un código que no es de los tres (es-ES):
     la mejor voz de ese idioma (otherVoice).
   - autoVoice(l): la mejor del aparato para l: primero el acento (inglés británico, francés de Francia, danés), luego
     la calidad (Natural de Edge y ChromeOS > Premium > Google > Mejorada y Windows > compactas de Apple), a igual
     calidad las del aparato antes que las de internet y, sin internet, solo las del aparato. Nunca las de broma de
     Apple ni las muy robóticas (Eloquence, Fred…, eSpeak: van en «Más voces»). null = la que ponga el sistema.
   - langVoices(l): las voces de l sin repetir, en ese orden y sin las de broma.
   - useVoice(u, l): pone en el enunciado u esa voz y su lang (Chrome en Android solo mira u.lang); l es un idioma de la
     app o un código («fr-FR», «es-ES»). retryLocal(u, e, done): si una voz de internet falla, otra vez con una del aparato.
   Las voces llegan tarde (Chrome, Edge, Safari 26) o cambian al volver de los ajustes del sistema: bus "voices". */
const VC = {k: "", m: {}};
let voices = [], voicesSig = "", voicesVer = 0;
function loadVoices(){
  let v = [];
  try{ v = "speechSynthesis" in window ? Array.from(speechSynthesis.getVoices() || []) : []; }catch(e){ v = []; }
  voices = v;
  const sig = v.map(x => `${x.name}|${x.lang}|${x.localService}|${x.voiceURI}`).join("\n");
  if(sig === voicesSig) return false;
  voicesSig = sig; voicesVer++;
  return true;
}
function voicesChanged(){ if(loadVoices()){ voiceNote(); bus.emit("voices"); } }
if("speechSynthesis" in window){
  loadVoices();
  try{ if(typeof speechSynthesis.addEventListener === "function") speechSynthesis.addEventListener("voiceschanged", voicesChanged);
    else speechSynthesis.onvoiceschanged = voicesChanged; }catch(e){}
  [400, 1500, 3500].forEach(ms => setTimeout(voicesChanged, ms));   /* Safari a veces no avisa */
  /* al volver de los ajustes del sistema (donde se instala una voz): la lista otra vez */
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") voicesChanged(); });
  addEventListener("pageshow", voicesChanged);
}
/* idioma de una voz: "en_GB" (Android), "eng-GBR-f000" (motor de Samsung), "da" (sin región)… → {b:"en", r:"GB", tag:"en-GB"} */
const VL3 = {eng: "en", fra: "fr", fre: "fr", dan: "da"};
const VR3 = {GBR: "GB", USA: "US", FRA: "FR", CAN: "CA", BEL: "BE", CHE: "CH", DNK: "DK", AUS: "AU", IRL: "IE", NZL: "NZ", ZAF: "ZA", IND: "IN"};
function vlang(v){
  const p = String((v && v.lang) || "").replace(/_/g, "-").split("-");
  const b0 = (p[0] || "").toLowerCase(), r0 = (p[1] || "").toUpperCase(), r = VR3[r0] || r0, b = VL3[b0] || b0;
  return /^[A-Z]{2}$/.test(r) ? {b, r, tag: `${b}-${r}`} : {b, r: "", tag: b};
}
/* el nombre sin «Microsoft », « Online (Natural)», « - English (United Kingdom)» ni paréntesis */
const vcore = n => String(n || "").replace(/^Microsoft\s+/i, "").replace(/\s+-\s+.*$/, "").replace(/\s*\(.*$/, "").replace(/\s+(Online|Desktop)$/i, "").trim();
const V_JOKE = new Set(["Albert", "Bad News", "Bahh", "Bells", "Boing", "Bubbles", "Cellos", "Good News", "Jester", "Organ", "Superstar",
  "Trinoids", "Whisper", "Wobble", "Zarvox", "Hysterical", "Deranged", "Princess", "Pipe Organ", "Malas noticias", "Campanas", "Burbujas",
  "Violonchelos", "Buenas noticias", "Bufón", "Órgano", "Superestrella", "Susurro", "Mauvaises nouvelles", "Cloches", "Bulles",
  "Violoncelles", "Bonnes nouvelles", "Bouffon", "Orgue", "Trinoïdes", "Murmure"]);
const V_JOKE_URI = /com\.apple\.speech\.synthesis\.voice\.(Albert|BadNews|Bahh|Bells|Boing|Bubbles|Cellos|GoodNews|Hysterical|Organ|Princess|Trinoids|Whisper|Deranged|Zarvox)\b/i;
const V_LOW = new Set(["Eddy", "Flo", "Grandma", "Grandpa", "Reed", "Rocko", "Sandy", "Shelley", "Jacques", "Fred", "Junior", "Kathy", "Ralph"]);
const V_LOW_URI = /com\.apple\.eloquence\.|com\.apple\.speech\.synthesis\.voice\.(Fred|Junior|Kathy|Ralph)\b|espeak/i;
const V_KID = new Set(["Maisie", "Eloise", "Ana"]);
const vbrand = n => /^(Microsoft|Google|Android|Chrome OS)\s/i.test(n);
const vjoke = v => V_JOKE_URI.test(v.voiceURI || "") || (!vbrand(v.name || "") && V_JOKE.has(vcore(v.name)));
const vnet = v => v.localService === false;
/* Chrome y Samsung en Android («inglés Reino Unido», lang en_GB) y Firefox en Android (moz-tts:android:en_GB) dan una
   entrada por país, no por voz: la voz la elige Android; aquí solo se elige el acento */
const vsys = v => /_/.test(v.lang || "") || /^moz-tts:android:/i.test(v.voiceURI || "");
/* calidad: 6 Natural · 5 Premium, Google, Multilingual o voz de niño · 4 Mejorada o Windows · 3 compacta (Apple, ChromeOS,
   Android) · 2 super-compacta · 1 otra · 0 muy robótica («Más voces», nunca automática) */
function vtier(v){
  const n = String(v.name || ""), s = n + " " + (v.voiceURI || ""), c = vcore(n), ms = /^Microsoft\s/i.test(n);
  if(V_LOW_URI.test(s) || (!vbrand(n) && V_LOW.has(c))) return 0;
  if(/Multilingual/i.test(n)) return 5;
  if(/\(Natural\)|\bNeural\b/i.test(n)) return V_KID.has(c) ? 5 : 6;
  const frUI = /^fr/i.test(navigator.language || "");   /* con Chrome del Mac en francés, «(premium)» es la Mejorada */
  if(/\.premium\.|\((Premium|de qualité|høj kvalitet)\)/.test(s) || (!frUI && /\(premium\)/.test(n))) return 5;
  if(/^(Google|Android Speech Recognition and Synthesis from Google)\s/i.test(n)) return 5;
  if(/\.enhanced\.|\((Enhanced|mejorada|forbedret|améliorée|premium)\)/i.test(s)) return 4;
  if(ms && !/Desktop/i.test(n)) return 4;
  if(/super-compact/i.test(s)) return 2;
  if(ms || /com\.apple\.(voice\.compact|ttsbundle)\.|^Chrome OS\s/i.test(s) || vsys(v)) return 3;
  return 1;

        if(e instanceof TypeError && ++job.net >= OFF_NET_FAILS){ const n = new Error(OFFLINE); n.name = "NetworkError"; throw n; }
      }
      job.done++; paintOff();
      return out;
    };
    const pool = async (list, fn) => {
      let i = 0;
      const worker = async () => { while(i < list.length) await fn(list[i++]); };
      await Promise.all(Array.from({length:Math.min(6, list.length)}, worker));
    };
    /* 1) la app y los documentos (de ellos salen los dibujos); 2) dibujos, personajes y audios */
    const docs = idx.map(d => `data/${d.id}.json`);
    const first = [...OFF_APP.map(u => [u, shell]), ...docs.map(u => [u, media]),
      ...["en", "fr", "da"].map(g => [`data/grammar_${g}.json`, media]), ...(ab ? [[`audio/${ab}.json`, media]] : [])];
    const imgs = new Set();
    let sprites = {};
    job.total = first.length + 200 + ids.length;      /* se ajusta al saber cuántos dibujos hay */
    /* los temas de «Jergas de oficios» y «Deportes de combate» (Juegos) no están en el índice: sus dibujos salen de sus datos */
    const jerga = u => /^data\/(programadores|gimnasio|muaythai|kickboxing|lucha|jiujitsu|army\/[a-z]{2})\.json$/.test(u);
    await pool(first, async ([u, c]) => {
      const j = await one(u, c, false, docs.includes(u) || jerga(u) || u === "data/sprites.json");
      if(j && u === "data/sprites.json") sprites = j;
      else if(j && Array.isArray(j.rows)) j.rows.forEach(r => r.img && imgs.add(r.img));
      else if(j && Array.isArray(j.terms)) j.terms.forEach(t => t && typeof t.img === "string" && imgs.add(t.img));
    });
    Object.keys(sprites || {}).forEach(k => /^[\w-]+$/.test(k) && imgs.add(`img/pj/${k}.png`));
    if(window.vocabShop) vocabShop.images().forEach(u => imgs.add(u));   /* los dibujos de la tienda (img/shop) */
    if(window.vocabGames && vocabGames.images) vocabGames.images().forEach(u => imgs.add(u));   /* los de Juegos (img/games y temas) */
    /* y la versión de los juegos de los dibujos de los temas: los árboles de familia recortados (img/fam2/, unos 470 KB). Van
       aquí y no en SHELL (sw.js): solo hacen falta con Familia y, sin ellos, los juegos vuelven al dibujo de siempre */
    if(window.vocabGames && typeof vocabGames.pic === "function") [...imgs].forEach(u => { const p = vocabGames.pic(u); if(p && p !== u) imgs.add(p); });
    if(window.vocabSeason && vocabSeason.images) (await vocabSeason.images()).forEach(u => imgs.add(u));   /* los de las temporadas (img/season) */
    if(window.vocabMailbox && vocabMailbox.images) vocabMailbox.images().forEach(u => imgs.add(u));   /* los del Buzón del tío */
    if(window.vocabCalls && vocabCalls.images) (await vocabCalls.images()).forEach(u => imgs.add(u));   /* los de las llamadas del zorro (img/calls) */
    if(window.vocabStories && vocabStories.images) (await vocabStories.images()).forEach(u => imgs.add(u));   /* los de los Cuentos del zorro */
    if(window.vocabHunter && vocabHunter.images) vocabHunter.images().forEach(u => imgs.add(u));   /* los del Cazador de cosas (modo tocar) */
    const second = [...[...imgs].map(u => [u, media]), ...ids.map(id => [`audio/${ab}/${id}.mp3`, media])];
    job.total = first.length + second.length;
    await pool(second, ([u, c]) => one(u, c, true, false));
    if(job.fails){
      fin(`Casi: ${job.fails} de ${job.total} archivos no se pudieron guardar. Vuelve a intentarlo con buena conexión.`, false);
    } else {
      store.set("offline", true);
      fin(`✓ Listo: ${job.total} archivos guardados, con los audios del ${LANGS[l].name}. Ya puedes usarla sin internet.`, true);
    }
  }catch(e){
    if(!sig.aborted) job.ctrl.abort();                /* para a las demás descargas */
    if(e.name === "AbortError") fin("Descarga parada. Lo que ya se guardó se queda; puedes seguir cuando quieras.", false);
    else if(e.name === "NetworkError") fin(OFFLINE, false);
    else if(e.name === "QuotaExceededError") fin("No cabe en este dispositivo: libera espacio y vuelve a intentarlo.", false);
    else fin("No se pudo descargar todo: " + e.message, false);

}
