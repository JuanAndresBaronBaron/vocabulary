<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario</title>
<meta name="description" content="Vocabulario en inglés británico, francés y danés con imagen, pronunciación, IPA, ejemplos y audio.">
<script>
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("theme"))}catch(e){}
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2545">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#16202c;--muted:#5b6778;--line:#dfe4eb;
  --brand:#1f5fbf;--brand-2:#0f2f57;--cat:#e1ebf7;--soft:#edf3fa;--ok:#1f9d62;--bad:#d64545;
  --grad:linear-gradient(120deg,#0f3d75 0%,#1f6fd1 55%,#1a9e94 100%);
  --head:linear-gradient(120deg,#0b2545 0%,#13406e 100%);
  --shadow:0 1px 2px rgba(15,30,50,.06),0 6px 18px rgba(15,30,50,.07);
}
html{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1119;--card:#141c28;--ink:#e6ebf2;--muted:#93a0b3;--line:#243042;
    --brand:#5aa2ff;--brand-2:#bcd6f5;--cat:#16283f;--soft:#132235;--ok:#45cf8b;--bad:#ff7b7b;
    --grad:linear-gradient(120deg,#164a8a 0%,#1f6fd1 55%,#168a80 100%);
    --head:linear-gradient(120deg,#081a30 0%,#0f3156 100%);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25)}
[data-theme=dark] .img img{background:#fff;border-radius:10px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* cabecera en dos filas: arriba el nombre, ajustes e idioma (se va al bajar); abajo las secciones (se queda fija) */
header{position:sticky;top:-48px;z-index:10;background:var(--head);color:#fff;box-shadow:0 2px 12px rgba(5,20,40,.25)}
header .wrap{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"logo . tools langs" "nav nav nav nav";align-items:center;gap:6px 10px;padding-top:8px;padding-bottom:8px}
.logo{grid-area:logo;font-weight:700;font-size:1.15rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:40px;border-radius:12px}
.htools{grid-area:tools;display:flex;gap:6px;align-items:center}
.langs{grid-area:langs;display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:0;height:40px}
.langs button{border:0;background:none;color:#fff;padding:0 13px;height:40px;border-radius:999px;font-size:.95rem;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.langs button.on{background:#fff;color:#0b2545;font-weight:600}
.langs .fl{font-size:1.05rem}
main{padding:20px 0 40px}
h1{font-size:1.6rem;margin:4px 0 6px}
h2{font-size:1.15rem;margin:28px 0 10px;color:var(--brand)}
.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.doc{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .1s}
.doc:hover{transform:translateY(-2px);border-color:var(--brand)}
.doc .n{font-size:.8rem;color:var(--muted)}
.doc .t{font-weight:600;margin:2px 0 4px}
.doc .c{font-size:.85rem;color:var(--muted)}
.doc.off{opacity:.45;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 16px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(31,95,191,.3)}
input[type=search]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.88rem}
.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none}
.cat{background:var(--cat);color:var(--brand-2);font-weight:700;font-size:.9rem;letter-spacing:.03em;padding:7px 12px;border-radius:8px;margin:18px 0 8px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.img{display:flex;align-items:center;justify-content:center}
.img img{max-width:88px;max-height:88px}
.row.wide{grid-template-columns:150px 1fr}.row.wide .img img{max-width:146px;max-height:110px}
.img .ph{width:72px;height:72px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--muted)}
.es{font-size:.9rem;color:var(--muted);font-weight:600}
.word{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0;font-size:.92rem}
.meta b{font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.ipa{color:var(--brand);font-family:"Segoe UI","Noto Sans","DejaVu Sans",sans-serif}
.pron{font-style:italic}
.ex{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:.95rem}
.ex .tr{color:var(--muted);font-style:italic;font-size:.88rem}
.lvl{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.say{border:1px solid var(--line);background:var(--soft);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
.sayg{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.say.tt{font-size:.95rem}
.sayrow{display:flex;gap:10px;align-items:center;justify-content:center}
.say.sm{width:28px;height:28px;font-size:.85rem;vertical-align:middle;margin-left:4px}
.say:hover{border-color:var(--brand)}
.say.playing{background:var(--grad);color:#fff;border-color:transparent}
.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--muted);margin:10px 0}
.empty{color:var(--muted);padding:30px 0;text-align:center}
/* tarjetas */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:min(100%,460px);min-height:330px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;cursor:pointer;user-select:none}
.fc .img img{max-width:240px;max-height:170px}
.fc .big{font-size:1.8rem;font-weight:700;margin:10px 0 4px}
.fc .hint{color:var(--muted);font-size:.85rem;margin-top:12px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(31,95,191,.28)}
.btn.pri:hover{filter:brightness(1.06)}
.btn:disabled{cursor:not-allowed}
.count{color:var(--muted);font-size:.9rem}
/* test */
.q{width:min(100%,560px);margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;text-align:center}
.q .img img{max-width:120px;max-height:120px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;font-size:1.05rem;font-weight:600}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.score{font-size:.95rem;color:var(--muted);margin-bottom:8px}
footer{color:var(--muted);font-size:.8rem;padding:20px 0 40px;text-align:center}
@media (max-width:560px){
  .row{grid-template-columns:64px 1fr;gap:10px;padding:10px}
  .img img{max-width:60px;max-height:60px}.row.wide{grid-template-columns:104px 1fr}.row.wide .img img{max-width:100px;max-height:90px}.img .ph{width:52px;height:52px}
  .word{font-size:1.15rem}.opts{grid-template-columns:1fr}
}
/* práctica 21 */
.pr-setup{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;max-width:760px}
.pr-setup h2{margin-top:0}
.pr-sec{margin:18px 0 8px;font-weight:600}
.pr-acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pr-act{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}
.pr-act input{width:18px;height:18px;accent-color:var(--brand)}
.pr-act:has(input:checked){border-color:var(--brand);background:var(--soft)}
.pr-act .ic{font-size:1.4rem}
.pr-act small{display:block;color:var(--muted);font-size:.8rem}
.pr-words{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.pr-words label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:.92rem;cursor:pointer}
.pr-words input{accent-color:var(--brand)}
.pr-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pr-start{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.pr-start .count{margin-left:auto}
.pr-resume{background:var(--soft);border:1px solid var(--brand);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pr-resume b{margin-right:auto}
.pr{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.pr-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;position:sticky;top:76px}
.pr-panel .lbl{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pr-panel .ttl{font-size:1.1rem;font-weight:700;margin:4px 0 2px}
.pr-panel .sub2{color:var(--muted);font-size:.85rem}
.pr-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 12px}
.pr-bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.pr-toggle{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:.85rem}
.pr-steps{list-style:none;margin:12px 0 0;padding:0;max-height:calc(100vh - 290px);overflow:auto}
.pr-steps li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 6px 10px;border-radius:10px;cursor:pointer}
.pr-steps li:not(:last-child)::before{content:"";position:absolute;left:19px;top:34px;bottom:-6px;width:2px;background:var(--line)}
.pr-steps li.done:not(:last-child)::before{background:var(--brand)}
.pr-steps .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);z-index:1}
.pr-steps li.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.pr-steps li.cur{background:var(--soft);box-shadow:inset 3px 0 0 var(--brand)}
.pr-steps li.cur .dot{border-color:var(--brand);color:var(--brand)}
.pr-steps .w{font-weight:600;line-height:1.2}
.pr-steps li.cur .w{color:var(--brand)}
.pr-steps .s{font-size:.82rem;color:var(--muted)}
.pr-steps .acts{margin-top:4px;font-size:.82rem;display:grid;gap:2px}
.pr-steps .acts .ok{color:var(--ok)}
.pr-stage{min-width:0}
.pr-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pr-flow{position:relative;height:520px;border-radius:22px;overflow:hidden;
  background:linear-gradient(120deg,#0f3d75 0%,#1f6fd1 50%,#1a9e94 100%);box-shadow:var(--shadow)}
[data-theme=dark] .pr-flow{background:linear-gradient(120deg,#0c2a4f 0%,#14427a 50%,#0f5a55 100%)}
.pr-card{position:absolute;left:50%;top:calc(50% - 14px);width:var(--cw,300px);min-height:420px;margin-left:calc(var(--cw,300px) / -2);
  background:var(--card);border-radius:18px;box-shadow:0 18px 40px rgba(20,20,60,.28);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s;will-change:transform}
.pr-card.side{pointer-events:none;filter:saturate(.85)}
.pr-card.side::after{content:"";position:absolute;inset:0;background:rgba(15,20,45,.10)}
.pr-hero{position:relative;flex:0 0 46%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tagc) 20%,#f4f5fb)}
.pr-hero .img img{background:transparent!important}
[data-theme=dark] .pr-hero{background:color-mix(in srgb,var(--tagc) 26%,#dfe3f0)}
.pr-card.cur .pr-hero{flex:0 0 150px}
.pr-card.side .pr-hero{flex:0 0 190px}
.pr-hero .img img{max-width:130px;max-height:120px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.pr-hero .ph{background:rgba(255,255,255,.6)}
.pr-tag{position:absolute;left:14px;bottom:12px;font-size:.68rem;font-weight:800;letter-spacing:.09em;color:#fff;background:var(--tagc,#2e5c8a);border-radius:99px;padding:4px 11px}
.pr-num{position:absolute;right:12px;top:10px;font-size:.72rem;font-weight:700;color:rgba(0,0,0,.45)}
.pr-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 18px 18px;text-align:center}
.pr-card .es2{font-size:1.1rem;color:var(--muted);font-weight:700}
.pr-card.side .es2{font-size:1.25rem;color:var(--ink)}
.pr-card .big{font-size:1.8rem;font-weight:800;line-height:1.15}
.pr-card .meta{justify-content:center;margin:0}
.pr-card .ex{font-size:.88rem}
.pr-card .say.xl{width:62px;height:62px;font-size:1.6rem}
.pr-card input.ans{width:100%;font:inherit;font-size:1.15rem;text-align:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.pr-card input.ans:focus{outline:none;border-color:var(--brand)}
.pr-card input.ans.ok{border-color:var(--ok)}
.pr-card input.ans.bad{border-color:var(--bad)}
.pr-msg{min-height:1.3em;font-size:.9rem}
.pr-msg.ok{color:var(--ok)}.pr-msg.bad{color:var(--bad)}
.pr-card .btn.pri{min-width:160px;margin-top:4px}
.pr-dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 16px}
.pr-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .3s,transform .3s}
.pr-dots i.on{background:#fff}
.pr-dots i.now{background:#fff;transform:scale(1.5);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.pr-fs{position:absolute;right:12px;top:12px;z-index:30;border:0;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;padding:6px 10px;font-size:.85rem;backdrop-filter:blur(4px)}
.pr-fs:hover{background:rgba(255,255,255,.35)}
#view:fullscreen{background:var(--bg);padding:20px;overflow:auto}
#view:fullscreen .pr{grid-template-columns:300px 1fr}
#view:fullscreen .pr-flow{height:calc(100vh - 120px);min-height:500px}
#view:fullscreen .pr-panel{position:static}
#view:fullscreen .pr-steps{max-height:calc(100vh - 300px)}
.pr-opt{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;cursor:pointer;user-select:none}
.pr-opt input{accent-color:var(--brand);width:16px;height:16px}
.pr-opt:has(input:checked){border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:600}
.pr-keys{font-size:.8rem;color:var(--muted);text-align:center}
.pr-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f2f57;color:#fff;padding:10px 18px;border-radius:99px;box-shadow:var(--shadow);font-weight:600;z-index:20;animation:pop .3s;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.pr-end{text-align:center;padding:30px 20px}
.pr-end .big{font-size:2.6rem}
@media (max-width:820px){
  .pr{grid-template-columns:1fr}
  .pr-panel{position:static}
  .pr-steps{max-height:240px}
  .pr-flow{height:540px}
  .pr-card.cur .pr-hero{flex-basis:120px}.pr-hero .img img{max-height:96px;max-width:110px}
}

/* cabecera: accesos */
.hnav{grid-area:nav;display:flex;gap:6px;align-items:center}
.hbtn{position:relative;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:0 12px;min-height:40px;min-width:40px;font-size:.95rem;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.hnav .hbtn{min-height:44px;padding:0 15px;font-size:1rem}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn:active{transform:scale(.95)}
.hnav .hbtn.on{background:#fff;color:#0b2545;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.hnav .coin{margin-left:auto}
.hbtn .b{background:#d64545;color:#fff;border-radius:99px;padding:0 6px;font-size:.75rem;margin-left:5px;font-weight:700;line-height:1.5}
.hbtn.coin.cbump{animation:cbump .55s ease-out}
@keyframes cbump{0%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.hbtn.coin.cbump{animation:none}}
/* progreso */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);text-decoration:none;display:block}
.stat .v{font-size:1.6rem;font-weight:800;line-height:1.15}
.stat .k{font-size:.82rem;color:var(--muted)}
.stat.hl{background:var(--grad);color:#fff;border-color:transparent}.stat.hl .k{color:rgba(255,255,255,.88)}
.days{display:flex;gap:4px;align-items:flex-end;height:80px;margin:10px 0 4px}
.days i{flex:1;background:var(--line);border-radius:4px 4px 0 0;min-height:4px}
.days i.on{background:var(--grad)}
.dlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:.92rem}
.ptable td,.ptable th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.ptable th{font-size:.78rem;color:var(--muted);font-weight:600}
.ptable a{text-decoration:none}.ptable a:hover{color:var(--brand)}
.mbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex;min-width:80px}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--ok)}.mbar .l{background:var(--brand);opacity:.6}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:14px;margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.panel h2{margin-top:0}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{accent-color:var(--brand)}
/* repaso */
.rv{width:min(100%,520px);margin:0 auto}
.rv .fc{cursor:default;min-height:380px}

</div></header>
<dialog id="cfg"></dialog>
<main><div class="wrap" id="app"><p class="empty">Cargando…</p></div></main>
<footer class="wrap">Inglés británico · Francés · Danés — Imágenes: <a href="https://openmoji.org">OpenMoji</a> (CC BY-SA 4.0). Audio: voz del navegador.</footer>
<script>
const LANGS = {
  english:  {label:"🇬🇧 English",  name:"inglés",  code:"en-GB"},
  "français":{label:"🇫🇷 Français", name:"francés", code:"fr-FR"},
  dansk:    {label:"🇩🇰 Dansk",    name:"danés",   code:"da-DK"},
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","english"); if(!LANGS[lang]) lang="english";
let rate = store.get("rate",0.9);
let INDEX = null; const CACHE = {};
const $ = s => document.querySelector(s);
/* conexión con los módulos js/*.js: eventos, rutas y huecos de la portada */
const bus = {h:{}, on(e, f){ (this.h[e] = this.h[e] || []).push(f); }, emit(e, d){ (this.h[e] || []).forEach(f => { try{ f(d); }catch(err){ console.error(err); } }); }};
const ROUTES = {};      /* ROUTES["juegos"] = async partes => {...}   (#/juegos/…) */
const HOME_ACTS = [];   /* {href, e, t, sub, color} botones grandes extra de la portada */
const HOME_SLOTS = [];  /* async () => html, se pinta bajo los botones grandes */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- audio ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); voiceNote(); }; }
function voiceFor(code){
  const base = code.slice(0,2);
  const pick = store.get("voice:"+lang, null);
  if(pick){ const v = voices.find(v => v.name===pick); if(v) return v; }
  const c = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  return c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase() && /natural|online|google|neural/i.test(v.name))
      || c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase()) || c[0] || null;
}
function speakable(t){
  return String(t).replace(/\((m|f|m\.\/f\.|pl)\.?\)/g,"").replace(/\(.*?\)/g,"").replace(/\s\/\s/g,", ").replace(/—/g,"").trim();
}
function say(text, btn, slow){
  if(!("speechSynthesis" in window)) return alert("Tu navegador no permite audio.");
  speechSynthesis.cancel();
  document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
  const u = new SpeechSynthesisUtterance(speakable(text));
  const code = LANGS[lang].code; u.lang = code; u.rate = slow ? SLOW() : rate;
  const v = voiceFor(code); if(v) u.voice = v;
  if(btn){ btn.classList.add("playing"); u.onend = u.onerror = () => btn.classList.remove("playing"); }
  speechSynthesis.speak(u);
}
/* audio encadenado para las secuencias automáticas */
let autoTok = 0;
const sleep = ms => new Promise(res => setTimeout(res, ms));
function sayP(text, btn){
  return new Promise(res => {
    if(!("speechSynthesis" in window) || !text) return res();
    speechSynthesis.cancel();
    document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
    const u = new SpeechSynthesisUtterance(speakable(text));
    const code = LANGS[lang].code; u.lang = code; u.rate = rate;
    const v = voiceFor(code); if(v) u.voice = v;
    let done = false;
    const fin = () => { if(done) return; done = true; if(btn) btn.classList.remove("playing"); res(); };
    if(btn) btn.classList.add("playing");
    u.onend = u.onerror = fin;
    setTimeout(fin, 1500 + speakable(text).length * 110 / rate);
    setTimeout(() => speechSynthesis.speak(u), 30);
  });
}
function voiceNote(){
  const el = $("#voicenote"); if(!el) return;
  if(!("speechSynthesis" in window)){ el.innerHTML = "Tu navegador no permite audio."; el.hidden=false; return; }
  if(voices.length && !voiceFor(LANGS[lang].code)){
    el.innerHTML = `Este dispositivo no tiene una voz en ${LANGS[lang].name}, así que el audio puede sonar con acento equivocado. En Windows: <b>Configuración › Hora e idioma › Voz › Agregar voces</b>. En Android o iPhone: ajustes de texto a voz. Chrome y Edge suelen traer más voces.`;
    el.hidden = false;
  } else el.hidden = true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if(!b) return;
  e.stopPropagation(); say(b.dataset.say, b, b.hasAttribute("data-slow"));
});
const slowBtn = (t, sm) => `<button class="say tt${sm?" sm":""}" data-say="${esc(t)}" data-slow title="Escuchar despacio" aria-label="Escuchar despacio">🐢</button>`;
const sayBtn = (t, sm) => t ? `<span class="sayg"><button class="say${sm?" sm":""}" data-say="${esc(t)}" title="Escuchar" aria-label="Escuchar">🔊</button>${slowBtn(t, sm)}</span>` : "";
const SLOW = () => Math.max(0.35, rate * 0.55);


/* ---------- voz y velocidad ---------- */
const SAMPLE = {english:"Hello! This is how I sound.", "français":"Bonjour ! Voici ma voix.", dansk:"Hej! Sådan lyder min stemme."};
function openCfg(after){
  const d = $("#cfg"), code = LANGS[lang].code, base = code.slice(0,2);
  const vs = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  const cur = (voiceFor(code)||{}).name;
  d.innerHTML = `<h2>Voz y velocidad</h2><div class="count">Para el ${LANGS[lang].name}. Se guarda en este dispositivo.</div>
    <label for="cfg-v">Voz</label>
    ${vs.length ? `<select id="cfg-v" style="width:100%">${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`
      : `<div class="note">Este dispositivo no tiene voces en ${LANGS[lang].name}. En Windows: Configuración › Hora e idioma › Voz › Agregar voces. En el móvil: ajustes de texto a voz.</div>`}
    <label for="cfg-r">Velocidad: <span id="cfg-rv"></span></label>
    <input type="range" id="cfg-r" min="0.5" max="1.3" step="0.05" value="${rate}" style="width:100%">
    <div class="dlbl"><span>🐢 Más lenta</span><span>Más rápida 🐇</span></div>
    <div class="pr-row" style="margin-top:18px"><button class="btn" id="cfg-t">🔊 Probar</button><button class="btn pri" id="cfg-x" style="margin-left:auto">Listo</button></div>`;
  const rv = () => $("#cfg-rv").textContent = `${(+rate).toFixed(2).replace(/0$/,"")}×` + (rate<0.75?" (lenta)":rate<=1?" (normal)":" (rápida)");
  rv();
  $("#cfg-r").oninput = e => { rate = +e.target.value; store.set("rate", rate); rv(); };
  if($("#cfg-v")) $("#cfg-v").onchange = e => store.set("voice:"+lang, e.target.value);
  $("#cfg-t").onclick = () => say(SAMPLE[lang]);
  $("#cfg-x").onclick = () => d.close();
  d.onclose = () => { voiceNote(); if(after) after(); };
  d.showModal();
}
$("#cfg-b").onclick = () => openCfg();

/* ---------- repaso espaciado, actividad y progreso ---------- */
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 864e5); };
const IV = [0, 1, 3, 7, 14, 30, 60, 120];   /* días hasta el siguiente repaso según la caja */
const MASTER = 4;                            /* desde 14 días se considera dominada */
const srsAll = () => store.get("srs:"+lang, {});
const srsK = (id, r) => id + "|" + r.es;
function srsPut(m){ store.set("srs:"+lang, m); updBadge(); }
function srsNext(x, g){ const b = x ? x.b : 0; return g===0 ? 0 : g===1 ? Math.max(1, Math.round(IV[b]/2)) : IV[Math.min(IV.length-1, b+1)]; }
function srsGrade(id, r, g){            /* g: 0 no la sabía · 1 difícil · 2 la sabía */
  const m = srsAll(), k = srsK(id, r), x = m[k] || {d:id, e:r.es, b:0, n:0};
  const days = srsNext(m[k], g);
  if(g===0) x.b = 0; else if(g===2) x.b = Math.min(IV.length-1, x.b+1);
  x.due = today() + days; x.n = (x.n||0) + 1; m[k] = x; srsPut(m); logAct();
}
function srsAdd(id, rows, box){         /* añade al repaso; box 0 = hoy, 1 = mañana, 2 = en 3 días */
  const m = srsAll(); let c = 0;
  for(const r of rows){
    const k = srsK(id, r);
    if(!m[k]){ m[k] = {d:id, e:r.es, b:box, due:today()+IV[box], n:0}; c++; }
    else if(m[k].b < box){ m[k].b = box; m[k].due = today()+IV[box]; }
  }
  srsPut(m); return c;
}
const dueList = () => Object.values(srsAll()).filter(x => x.due <= today());
const dayKey = d => d.toLocaleDateString("sv");
function logAct(n=1){ const a = store.get("act", {}), k = dayKey(new Date()); a[k] = (a[k]||0) + n; store.set("act", a); }
function streak(){
  const a = store.get("act", {}), d = new Date(); let s = 0;
  if(!a[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function updBadge(){ const b = $("#due-b"); if(!b) return; const n = dueList().length; b.textContent = n; b.hidden = !n; }
function statsHtml(){
  const m = Object.values(srsAll()), due = m.filter(x=>x.due<=today()).length, mast = m.filter(x=>x.b>=MASTER).length;
  const a = store.get("act", {}), st = streak();
  return `<div class="stats">
    <a class="stat hl" href="#/repaso"><div class="v">🔁 ${due}</div><div class="k">Para repasar hoy</div></a>
    <a class="stat" href="#/progreso"><div class="v">🔥 ${st}</div><div class="k">${st===1?"día seguido":"días seguidos"}</div></a>
    <a class="stat" href="#/granja"><div class="v">🪙 ${game().coins}</div><div class="k">Monedas</div></a>
    <a class="stat" href="#/progreso"><div class="v">💎 ${mast}</div><div class="k">Palabras que ya no olvidas</div></a>
  </div>`;
}
const inDays = n => n<=0 ? "hoy otra vez" : n===1 ? "mañana" : n<30 ? `en ${n} días` : n<60 ? "en 1 mes" : `en ${Math.round(n/30)} meses`;

let rv = null;
async function repaso(){
  rv = null; document.onkeydown = null;
  const idx = await getIndex(), ready = idx.filter(d => d.langs.includes(lang));
  const due = dueList();
  $("#app").innerHTML = `<a class="back" href="#/">← Inicio</a>
    <div class="hello">${heroHtml(90)}<div class="speech">${due.length
      ? `<b>¡${due.length} palabra${due.length>1?"s":""} te ${due.length>1?"esperan":"espera"}!</b>Ya las viste antes. Vamos a ver si te acuerdas. Cada palabra que sepas te da 🪙.`
      : `<b>¡Todo repasado por hoy! 🎉</b>Vuelve mañana: las palabras vuelven justo cuando se te van a olvidar.`}</div></div>
    <div class="panel" style="text-align:center">${due.length
      ? `<button class="btn lc" id="rv-go" style="--lc:#1f6fd1;font-size:1.2rem;padding:14px 30px">▶ ¡Vamos a repasar!</button>`
      : `<a class="btn lc" href="#/mapa" style="--lc:#2e9e4f;text-decoration:none;font-size:1.1rem;padding:12px 26px">🗺️ Aprender palabras nuevas</a>`}</div>
    <details class="panel adult"><summary>👨‍👩‍👦 Para mayores: añadir palabras al repaso</summary>
      <p class="sub">El repaso es espaciado: cada palabra vuelve mañana, a los 3 días, a la semana, a las 2 semanas, al mes… Si se falla, vuelve a empezar. Las palabras entran solas al terminar lecciones del camino, una Práctica 21 o al fallar en el Test.</p>
      <h2>Añadir palabras nuevas</h2>
      <p class="sub">También entran solas cuando terminas una Práctica 21 (vuelven mañana) o fallas una pregunta del Test.</p>
      <div class="pr-row"><select id="rv-doc">${ready.map(d=>`<option value="${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</option>`).join("")}</select>
      <select id="rv-n"><option value="5">5 palabras</option><option value="10" selected>10 palabras</option><option value="20">20 palabras</option><option value="999">Todas</option></select>
      <button class="btn" id="rv-add">➕ Añadir</button></div>
      <div class="count" id="rv-msg" style="margin-top:8px"></div></details>`;
  if($("#rv-go")) $("#rv-go").onclick = rvStart;
  $("#rv-add").onclick = async () => {
    const id = $("#rv-doc").value, doc = await getDoc(id), m = srsAll();
    const fresh = doc.rows.filter(r => r.es && r.l[lang] && !m[srsK(id, r)]).slice(0, +$("#rv-n").value);
    if(!fresh.length){ $("#rv-msg").textContent = "Ese documento ya está entero en tu repaso."; return; }
    srsAdd(id, fresh, 0); repaso().then(() => $("#rv-msg").textContent = `Añadidas: ${fresh.map(r=>r.es).join(", ")}.`);
  };
}
async function rvStart(){
  const due = dueList(), ids = [...new Set(due.map(x => x.d))];
  await Promise.all(ids.map(id => getDoc(id).catch(()=>null)));
  const q = shuffle(due.map(x => { const doc = CACHE[x.d], r = doc && doc.rows.find(r => r.es===x.e && r.l[lang]); return r ? {id:x.d, r} : null; }).filter(Boolean));
  rv = {q, i:0, flip:false, done:0, total:q.length, coins:0};
  rvDraw();
}
function rvDraw(){
  if(!rv) return;
  if(rv.i >= rv.q.length){
    award(10, "¡Repaso terminado!"); bus.emit("review-done", {n: rv.total});
    $("#app").innerHTML = `<div class="pr-setup pr-end" style="margin:0 auto">${heroHtml(90)}<h2>¡Repaso terminado! 🎉</h2>
      <p class="sub">Repasaste ${rv.total} palabra${rv.total>1?"s":""} y ganaste 🪙 ${rv.coins + 10}. Racha: 🔥 ${streak()} día${streak()===1?"":"s"}.</p>
      <div class="pr-row" style="justify-content:center"><a class="btn pri" href="#/granja" style="text-decoration:none">🏡 Ir a mi granja</a><a class="btn" href="#/mapa" style="text-decoration:none">🗺️ Seguir el camino</a></div></div>`;
    rv = null; document.onkeydown = null; return;
  }
  const {id, r} = rv.q[rv.i], d = r.l[lang], x = srsAll()[srsK(id, r)];
  const pct = Math.round(100 * rv.done / Math.max(1, rv.total));
  $("#app").innerHTML = `<a class="back" href="#/repaso">← Salir del repaso</a>
    <div class="rv"><div class="count" style="text-align:center">Quedan ${rv.q.length - rv.i} · ${pct}% hecho</div>
    <div class="pr-bar"><i style="width:${pct}%"></i></div>
    <div class="fc">${imgHtml(r)}<div class="big">${esc(r.es)}</div>
    ${rv.flip ? `<div class="ans-word">${esc(d.word)}</div><div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}
      <div class="count" style="margin-top:12px">¿La sabías?</div>
      <div class="rv-btns kid" style="margin-top:6px">
        <button class="btn b-bad" data-g="0" title="Vuelve ${inDays(srsNext(x,0))}"><span>😕</span>No</button>
        <button class="btn" data-g="1" title="Vuelve ${inDays(srsNext(x,1))}"><span>🤔</span>Más o menos</button>
        <button class="btn b-ok" data-g="2" title="Vuelve ${inDays(srsNext(x,2))}"><span>😄</span>¡Sí!</button></div>`
    : `<div class="hint" style="font-size:1rem">¿Cómo se dice en ${LANGS[lang].name}? Dilo en voz alta y luego mira.</div>
       <button class="btn lc" id="rv-show" style="--lc:#1f6fd1;margin-top:16px;font-size:1.1rem">👀 Ver la respuesta</button>`}
    </div></div>`;
  const tok = ++autoTok;
  if(rv.flip){
    (async () => { await sayP(d.word, $(".fc .say")); if(tok===autoTok && prUI.ex && d.ex){ await sleep(400); if(tok===autoTok) sayP(d.ex); } })();
    document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      autoTok++; speechSynthesis && speechSynthesis.cancel();
      const g = +b.dataset.g; srsGrade(id, r, g); if(g){ award(g, "", true); rv.coins += g; }
      bus.emit("review-card", {grade: g, es: r.es, word: d.word});
      if(g===0) rv.q.push(rv.q[rv.i]); else rv.done++;
      rv.i++; rv.flip = false; rvDraw();
    });
  } else $("#rv-show").onclick = () => { rv.flip = true; rvDraw(); };
  document.onkeydown = e => {
    if(!rv || !location.hash.startsWith("#/repaso")){ document.onkeydown = null; return; }
    if(e.target.closest && e.target.closest("input,select,textarea")) return;
    if(!rv.flip && (e.key===" " || e.key==="Enter")){ e.preventDefault(); $("#rv-show").click(); }
    else if(rv.flip && "123".includes(e.key) && e.key.length===1){ const b = document.querySelector(`[data-g="${+e.key-1}"]`); if(b) b.click(); }
  };
}

async function progreso(el){
  const idx = await getIndex(), m = Object.values(srsAll()), a = store.get("act", {});
  const days = []; for(let k=13; k>=0; k--){ const d = new Date(); d.setDate(d.getDate()-k); days.push({k:dayKey(d), n:a[dayKey(d)]||0, lbl:d.toLocaleDateString("es",{weekday:"short"})}); }
  const max = Math.max(1, ...days.map(x=>x.n));
  const by = {}; for(const x of m){ const o = by[x.d] = by[x.d] || {l:0, m:0}; if(x.b>=MASTER) o.m++; else o.l++; }
  const rows = idx.filter(d => d.langs.includes(lang)).map(d => {
    const o = by[d.id] || {l:0, m:0}, pm = 100*o.m/d.count, pl = 100*o.l/d.count;
    return `<tr><td><a href="#/doc/${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</a></td>
      <td>${o.m} / ${d.count}</td><td style="width:40%"><div class="mbar"><i class="m" style="width:${pm}%"></i><i class="l" style="width:${pl}%"></i></div></td></tr>`;
  }).join("");
  const total = days.reduce((s,x)=>s+x.n,0);
  (el || $("#app")).innerHTML = `${el ? "" : `<a class="back" href="#/">← Inicio</a>
    <h1>Tu progreso <span style="color:var(--muted);font-weight:400">en ${LANGS[lang].name}</span></h1>
    ${statsHtml()}`}
    <div class="panel"><h2>Últimos 14 días</h2><div class="count">${total} repeticiones en total. La racha cuenta los días seguidos con al menos una práctica, test o repaso.</div>
      <div class="days">${days.map(x=>`<i class="${x.n?"on":""}" style="height:${Math.max(5, 100*x.n/max)}%" title="${x.k}: ${x.n}"></i>`).join("")}</div>
      <div class="dlbl"><span>${days[0].lbl}</span><span>hoy</span></div></div>
    <div class="panel"><h2>Por documento</h2>
      <div class="legend"><span><i style="background:var(--ok)"></i>Dominadas (repaso cada 14 días o más)</span><span><i style="background:var(--brand);opacity:.6"></i>Aprendiendo</span></div>
      <table class="ptable"><thead><tr><th>Documento</th><th>Dominadas</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="panel"><h2>📲 En el móvil y sin internet</h2>
      <p class="sub">Puedes instalar esta web como una app: en Android o en Chrome, botón «Instalar» arriba o menú ⋮ › «Instalar aplicación»; en iPhone, Safari › Compartir › «Añadir a pantalla de inicio». Tu progreso se guarda en cada dispositivo.</p>
      <button class="btn pri" id="off-dl">⬇️ Descargar todo para usar sin internet</button> <span class="count" id="off-msg">${store.get("offline",false)?"Ya descargado en este dispositivo. Puedes volver a descargarlo para actualizarlo.":""}</span></div>`;
  $("#off-dl").onclick = downloadAll;
}

/* ---------- app instalable y sin internet ---------- */
const CACHE_NAME = "vocab-v1";
async function downloadAll(){
  const b = $("#off-dl"), msg = $("#off-msg");
  if(!("caches" in window)){ msg.textContent = "Este navegador no permite guardar la web sin internet."; return; }
  b.disabled = true;
  try{
    const idx = await getIndex(), urls = new Set(["./", "index.html", "data/index.json", "data/map.json", "data/grammar_en.json", "data/grammar_fr.json", "data/grammar_da.json", "data/game.json", "js/sfx.js", "js/farm.js", "js/games.js", "js/buddy.js", "js/album.js", "manifest.webmanifest", "icons/icon-192.png", "icons/icon-512.png"]);
    let k = 0;

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

function tarjetas(doc){
  const list = entries(doc); const s = state.fc;
  if(!s.order || s.order.length!==list.length) s.order = list.map((_,i)=>i);
  if(s.i>=list.length) s.i=0;
  const r = list[s.order[s.i]]; if(!r){ $("#view").innerHTML = `<p class="empty">No hay palabras.</p>`; return; }
  const d = r.l[lang];
  const front = s.rev
    ? `<div class="big">${esc(d.word)}</div>${sayBtn(d.word)}`
    : `${imgHtml(r)}<div class="big">${esc(r.es)}</div>`;
  const back = `${imgHtml(r)}<div class="es">${esc(r.es)}</div><div class="big">${esc(d.word)}</div>
      <div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}`;
  $("#view").innerHTML = `<div class="fc-wrap">
    <div class="count">${s.i+1} / ${list.length}</div>
    <div class="fc" id="card">${s.flip?back:front}${s.flip?"":`<div class="hint">Toca la tarjeta para ver la respuesta</div>`}</div>
    <div class="ctrl">
      <button class="btn" id="prev">← Anterior</button>
      <button class="btn pri" id="next">Siguiente →</button>
    </div>
    <div class="ctrl">
      <button class="btn ${s.auto?"pri":""}" id="auto">${s.auto?"⏸ Detener secuencia":"▶ Secuencia automática"}</button>
      <button class="btn" id="shuf">🔀 Barajar</button>
      <button class="btn" id="rev">${s.rev?"Mostrar primero: español":"Mostrar primero: "+LANGS[lang].name}</button>
    </div></div>`;
  const stop = () => { if(s.auto){ s.auto = false; autoTok++; speechSynthesis && speechSynthesis.cancel(); } };
  const go = k => { stop(); s.i = (s.i+k+list.length)%list.length; s.flip=false; tarjetas(doc); };
  $("#card").onclick = () => { stop(); s.flip=!s.flip; tarjetas(doc); if(s.flip && !s.rev) say(d.word); };
  $("#auto").onclick = () => { if(s.auto){ stop(); tarjetas(doc); } else fcAuto(doc); };
  $("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
  $("#shuf").onclick = () => { stop(); s.order = shuffle(list.map((_,i)=>i)); s.i=0; s.flip=false; tarjetas(doc); };
  $("#rev").onclick = () => { stop(); s.rev=!s.rev; s.flip=false; tarjetas(doc); };
}

/* secuencia automática: solo suena el idioma que se estudia, nunca el español */
async function fcAuto(doc){
  const s = state.fc, tok = ++autoTok;
  const alive = () => tok === autoTok && s.auto && state.mode === "tarjetas" && document.getElementById("card");
  s.auto = true;
  while(true){
    const list = entries(doc); if(!list.length) break;
    if(s.i >= list.length) s.i = 0;
    const d = list[s.order ? s.order[s.i] : s.i].l[lang];
    s.flip = false; tarjetas(doc);
    if(s.rev){ await sleep(500); if(!alive()) return; await sayP(d.word); await sleep(1200); }
    else await sleep(2000);
    if(!alive()) return;
    s.flip = true; tarjetas(doc);
    if(!s.rev){ await sayP(d.word); if(!alive()) return; await sleep(700); }
    if(d.ex){ if(!alive()) return; await sayP(d.ex); }
    await sleep(1500);
    if(!alive()) return;
    s.i = (s.i + 1) % list.length;
  }
}

function test(doc){
  const list = entries(doc);
  if(list.length<4){ $("#view").innerHTML = `<p class="empty">Se necesitan al menos 4 palabras.</p>`; return; }
  if(!state.test){ state.test = {qs: shuffle(list).slice(0, Math.min(10,list.length)), i:0, ok:0, done:false}; }
  const t = state.test;
  if(t.i>=t.qs.length){
    if(!t.paid){ t.paid = true; if(t.ok) award(t.ok, "¡Test terminado!"); }
    $("#view").innerHTML = `<div class="q"><div class="big" style="font-size:1.6rem;font-weight:700">${t.ok} / ${t.qs.length}</div>
      <p class="sub">${t.ok===t.qs.length?"¡Perfecto! 🎉":t.ok>=t.qs.length*0.7?"¡Muy bien!":"Sigue practicando con las tarjetas."}</p>
      <button class="btn pri" id="again">Otra ronda</button></div>`;
    $("#again").onclick = () => { state.test=null; test(doc); };
    return;
  }
  const r = t.qs[t.i], d = r.l[lang];
  const pool = shuffle(list.filter(x => x!==r && x.l[lang].word!==d.word)).slice(0,3);
  const opts = shuffle([r,...pool]);
  $("#view").innerHTML = `<div class="q">
    <div class="score">Pregunta ${t.i+1} de ${t.qs.length} · Aciertos: ${t.ok}</div>
    ${imgHtml(r)}<div style="font-size:1.4rem;font-weight:700;margin-top:8px">${esc(r.es)}</div>
    <div class="sub">¿Cómo se dice en ${LANGS[lang].name}?</div>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.l[lang].word)}</button>`).join("")}</div>
    <div id="after" style="margin-top:14px"></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if(t.answered===t.i) return; t.answered=t.i;
    const pick = opts[+b.dataset.i], good = pick===r;
    if(good) t.ok++;
    bus.emit("answer", {ok: good, es: r.es, word: r.l[lang].word, where: "test"});
    srsGrade(state.doc, r, good ? 2 : 0);
    document.querySelectorAll(".opt").forEach(x => { if(opts[+x.dataset.i]===r) x.classList.add("ok"); });
    if(!good) b.classList.add("bad");
    say(d.word);
    $("#after").innerHTML = `<div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span>${sayBtn(d.word,1)}</div>
      <button class="btn pri" id="nextq" style="margin-top:10px">Siguiente →</button>`;
    $("#nextq").onclick = () => { t.i++; test(doc); };
  });
}

const ACTS = {

    boxes.forEach(b => b.checked = false);
    if(mode==="all") boxes.forEach(b => b.checked = true);
    else if(mode==="first") boxes.slice(0,10).forEach(b => b.checked = true);
    else if(mode!=="none") shuffle(boxes).slice(0,+mode).forEach(b => b.checked = true);
    upd();
  };
  pick(list.length > 10 ? "first" : "all");
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(b.dataset.pick));
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    reps = +b.dataset.r; document.querySelectorAll("[data-r]").forEach(x => x.classList.toggle("on", x===b)); upd(); });
  document.querySelectorAll("input[name=act], input[name=w]").forEach(b => b.onchange = upd);
  $("#pr-go").onclick = () => {
    const acts = Object.keys(ACTS).filter(k => document.querySelector(`input[name=act][value=${k}]`).checked);
    const words = boxes.filter(b=>b.checked).map(b => ({i:+b.value, n:0}));
    if(!acts.length || !words.length) return;
    store.set("prPrefs", {acts, reps});
    prUI.auto = $("#pr-o-auto").checked; prUI.ex = $("#pr-o-ex").checked; store.set("prAuto", prUI.auto); store.set("prEx", prUI.ex);
    const sess = {running:true, acts, reps, words, cur:0, step:0};
    store.set(prKey(doc.id), sess);
    prUI.hist = [];
    prRun(doc, sess);
  };
  if(resume){
    $("#pr-cont").onclick = () => { resume.running = true; store.set(prKey(doc.id), resume); prRun(doc, resume); };
    $("#pr-drop").onclick = () => { store.set(prKey(doc.id), null); prSetup(doc, null); };
  }
}

/* qué actividad toca en la repetición n de una palabra */
const actFor = (s, n) => s.acts[n % s.acts.length];
const actCount = (s, n, j) => Math.floor(n / s.acts.length) + (j < n % s.acts.length ? 1 : 0);
const actTarget = (s, j) => Math.floor(s.reps / s.acts.length) + (j < s.reps % s.acts.length ? 1 : 0);
function nextIdx(s, from){
  const L = s.words.length;
  for(let k=1; k<=L; k++){ const i = (from + k) % L; if(s.words[i].n < s.reps) return i; }
  return -1;
}

const TINT = {escuchar:["#dbe9fb","#2f6fd6"], leer:["#d9f2e4","#2f8f5b"], escribir:["#fde7d3","#d36b1f"], hablar:["#dde3ea","#3b4a5c"], dictado:["#f3e1d6","#9a4a1c"]};

/* la tarjeta actual y las que vienen, simulando la cola */
function upcoming(s, k){
  const ns = s.words.map(w => w.n), L = ns.length, out = [];
  let cur = s.cur;
  for(let t=0; t<k && cur>=0 && ns[cur] < s.reps; t++){
    out.push({wi:cur, n:ns[cur]});
    ns[cur]++;
    let nx = -1;
    for(let q=1; q<=L; q++){ const i = (cur+q) % L; if(ns[i] < s.reps){ nx = i; break; } }
    cur = nx;
  }
  return out;
}

function prRun(doc, s){
  const all = doc.rows.filter(r => r.es && r.l[lang]);
  if(s.words[s.cur] && s.words[s.cur].n >= s.reps){ const n = nextIdx(s, s.cur); if(n>=0) s.cur = n; }
  const doneReps = s.words.reduce((a,w)=>a+Math.min(w.n,s.reps),0), total = s.words.length*s.reps;
  if(doneReps >= total) return prEnd(doc, s, total);
  const wdone = s.words.filter(w=>w.n>=s.reps).length;

  const w = s.words[s.cur], r = all[w.i];
  const seq = upcoming(s, 4), hist = prUI.hist.slice(-3);

  $("#view").innerHTML = `<div class="pr" id="pr-root">

      <button class="pr-toggle" id="pr-tg">${prUI.open?"‹ Ocultar las palabras":"› Ver las palabras"}</button>
      ${prUI.open ? `<ol class="pr-steps">${s.words.map((x,k) => {
        const rr = all[x.i], done = x.n>=s.reps, cur = k===s.cur;
        return `<li class="${done?"done":""} ${cur?"cur":""}" data-k="${k}">
          <span class="dot">${done?"✓":k+1}</span>
          <div><div class="w">${esc(rr.es)}</div>
          <div class="s">${done?"Completada":cur?`En curso · ${x.n} de ${s.reps}`:x.n?`${x.n} de ${s.reps}`:"Pendiente"}</div>
          ${cur?`<div class="acts">${s.acts.map((a,j)=>{const c=actCount(s,x.n,j),t=actTarget(s,j);
            return `<span class="${c>=t?"ok":""}">${c>=t?"✓":ACTS[a].ic} ${ACTS[a].name} (${c}/${t})</span>`}).join("")}</div>`:""}

    </aside>
    <section class="pr-stage">

      <div class="pr-flow" id="pr-flow">
        ${cards.map(c => { const rr = all[s.words[c.wi].i]; return prCard(rr, effAct(rr, actFor(s, c.n)), c.off===0, c.n, s.reps, c.off); }).join("")}
        <div class="pr-dots" title="Repeticiones de esta palabra">${Array.from({length:s.reps},(_,k)=>`<i class="${k<w.n?"on":k===w.n?"now":""}"></i>`).join("")}</div>

    btn.onclick = () => {

  $("#pr-auto").onchange = e => { prUI.auto = e.target.checked; store.set("prAuto", prUI.auto); prRun(doc, s); };
  $("#pr-ex").onchange = e => { prUI.ex = e.target.checked; store.set("prEx", prUI.ex); prRun(doc, s); };
  $("#pr-stop").onclick = () => { autoTok++; if(document.fullscreenElement) document.exitFullscreen(); s.running = false; save(); prUI.hist = []; document.onkeydown = null; prSetup(doc, s); };
  $("#pr-skip").onclick = () => { w.n = s.reps; srsAdd(doc.id, [r], 2); toast(`✓ «${r.es}» marcada como aprendida`); const n = nextIdx(s, s.cur); if(n>=0) s.cur = n; prUI.hist = []; save(); prRun(doc, s); };
  document.querySelectorAll(".pr-steps li").forEach(li => li.onclick = () => {
    const k = +li.dataset.k; if(s.words[k].n >= s.reps || k===s.cur) return;
    s.cur = k; prUI.hist = []; save(); prRun(doc, s);
  });
}

/* validación superficial: sin mayúsculas, signos ni artículo obligatorio */
function checkAnswer(ans, target){
  const norm = x => x.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()…]/g," ").replace(/\s+/g," ").trim();
  const bare = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe");
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = new Set();
  for(let t of String(target).split(/\s\/\s|,\s/)){
    t = norm(t.replace(/\((m|f|pl|m\.\/f)\.?\)/g,"").replace(/\(.*?\)/g,""));
    if(!t) continue;
    cands.add(t); cands.add(t.replace(art,"").trim());
  }
  const a = norm(ans); if(!a) return "bad";
  const a2 = a.replace(art,"").trim();
  if(cands.has(a) || cands.has(a2)) return "ok";
  for(const c of cands) if(bare(c)===bare(a) || bare(c)===bare(a2)) return "accents";
  return "bad";
}

/* micrófono: devuelve las transcripciones posibles */
function listen(){
  return new Promise((res, rej) => {
    const rec = new SR(); let got = false;
    rec.lang = LANGS[lang].code; rec.interimResults = false; rec.maxAlternatives = 5;
    rec.onresult = e => { got = true; res([...e.results[0]].map(a => a.transcript)); };
    rec.onerror = e => rej(e.error || "error");
    rec.onend = () => { if(!got) rej("no-speech"); };
    try{ rec.start(); }catch(e){ rej("busy"); }
  });
}
const nrm = x => String(x).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?¿¡;:"()«»…—–-]/g," ").replace(/\s+/g," ").trim();
const bareS = x => x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ø/g,"o").replace(/æ/g,"ae").replace(/œ/g,"oe").replace(/å/g,"a");
/* basta con que la palabra aparezca en lo que se oyó (sin artículo ni tildes) */
function heard(alts, target){
  const art = /^(le |la |les |l'|un |une |des |en |et |at |to |the |a |an )/;
  const cands = String(target).split(/\s\/\s|,\s/).map(t => bareS(nrm(t.replace(/\(.*?\)/g,"")).replace(art,"").trim())).filter(Boolean);
  return alts.some(a => { const A = " " + bareS(nrm(a)) + " "; return checkAnswer(a, target) !== "bad" || cands.some(c => A.includes(" " + c + " ")); });
}
/* dictado: palabras en común en orden (LCS); se aceptan tildes olvidadas como "casi" */
function dictCheck(ans, ref){
  const R = nrm(ref).split(" ").filter(Boolean), A = nrm(ans).split(" ").filter(Boolean);
  const match = eq => {
    const dp = Array.from({length:R.length+1}, () => new Array(A.length+1).fill(0));
    for(let i=R.length-1; i>=0; i--) for(let j=A.length-1; j>=0; j--)
      dp[i][j] = eq(R[i], A[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    const hit = new Array(R.length).fill(false); let i=0, j=0;
    while(i<R.length && j<A.length){ if(eq(R[i], A[j])){ hit[i]=true; i++; j++; } else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
    return hit;
  };
  const exact = match((a,b) => a===b), loose = match((a,b) => bareS(a)===bareS(b));
  const hits = loose.filter(Boolean).length, extra = Math.max(0, A.length - hits);
  const words = String(ref).split(/\s+/);
  const html = words.length===R.length ? words.map((w,k) => exact[k] ? esc(w) : `<span class="x">${esc(w)}</span>`).join(" ") : esc(ref);
  return {ok: hits >= Math.ceil(R.length*0.9) && extra <= 1, perfect: exact.every(Boolean) && extra===0, hits, total:R.length, html};
}

let LS = null;
async function leccion(id){
  await getMap(); document.onkeydown = null;
  if(id.startsWith("G-")) return gramLesson(id);
  const lv = id.slice(0, 2); if(!MAP[lv]) return mapa();
  const ui = MAP[lv].findIndex(u => u.ls.some(l => l.id === id)); if(ui < 0) return mapa(lv);
  const unit = MAP[lv][ui], l = unit.ls.find(l => l.id === id);
  const docs = {}; for(const [d] of l.w) docs[d] = await getDoc(d);
  const words = l.w.map(([d, i]) => ({doc:d, r:docs[d].rows[i]})).filter(x => x.r && x.r.l[lang]);
  if(!words.length) return mapa(lv);
  /* distractores: las otras palabras de la lección y, si faltan, del mismo documento */
  const pool = [...words]; const seen = new Set(words.map(x => x.r.es));
  for(const r of docs[unit.doc].rows) if(pool.length < 12 && r.es && r.l[lang] && !seen.has(r.es)){ seen.add(r.es); pool.push({doc:unit.doc, r}); }
  const steps = [...words.map(w => ({t:"learn", w})), ...shuffle(words).map((w, i) => ({t: i % 2 ? "listen" : "pick", w}))];
  LS = {id, lv, unit, words, pool, steps, i:0, nq:words.length, first:new Set(), miss:new Set(), tok:++autoTok};
  lsStep();
}
function lsOpts(w, field){
  const val = x => field === "es" ? x.r.es : x.r.l[lang].word;
  const out = [w], used = new Set([val(w)]);
  for(const x of shuffle(LS.pool)){ if(out.length >= 4) break; if(!used.has(val(x))){ used.add(val(x)); out.push(x); } }
  return shuffle(out).map(x => val(x));
}
function lsStep(){
  const s = LS; if(!s) return;
  if(s.i >= s.steps.length) return lsEnd();
  const st = s.steps[s.i], r = st.w.r, d = r.l[lang], lc = LVS[s.lv].c;
  const pct = Math.round(100 * s.i / s.steps.length);
  let body = "";
  if(st.t === "learn"){
    body = `<div class="ls-card"><div class="tag">Palabra nueva</div>${imgHtml(r)}
      <div class="es">${esc(r.es)}</div><div class="big">${esc(d.word)}</div>

      <div class="ls-foot"><span class="msg"></span><button class="btn lc" id="ls-go">Continuar</button></div>`;
  } else {
    const listen = st.t === "listen", field = listen ? "es" : "word";
    const opts = lsOpts(st.w, field), right = listen ? r.es : d.word;
    st.right = right;
    body = `<div class="ls-card"><div class="tag">${listen ? "Escucha y elige qué significa" : "¿Cómo se dice en "+LANGS[lang].name+"?"}</div>
      ${listen ? `<div class="sayrow"><button class="say xl" data-say="${esc(d.word)}" aria-label="Escuchar" style="width:72px;height:72px;font-size:1.8rem">🔊</button>${slowBtn(d.word)}</div>`
               : `${imgHtml(r)}<div class="q">${esc(r.es)}</div>`}
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-o="${esc(o)}"><span style="color:var(--muted);font-weight:400">${k+1}</span> ${esc(o)}</button>`).join("")}</div></div>
      <div id="ls-fb"></div>`;
  }
  $("#app").innerHTML = `<div class="ls" style="--lc:${lc}">
    <div class="ls-top"><a class="x" href="#/mapa/${s.lv}" title="Salir" aria-label="Salir">✕</a><div class="ls-prog"><i style="width:${pct}%"></i></div></div>
    ${body}</div>`;
  const tok = s.tok;
  if(st.t === "learn"){
    setTimeout(() => { if(LS === s && autoTok === tok) sayP(d.word, $(".ls-card .say")); }, 250);
    $("#ls-go").onclick = () => { s.i++; lsStep(); };
    document.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("#ls-go") && $("#ls-go").click(); } };
  } else {
    if(st.t === "listen") setTimeout(() => { if(LS === s && autoTok === tok) sayP(d.word, $(".ls-card .say")); }, 250);
    const pick = b => {
      if(st.done) return; st.done = true;
      const ok = b.dataset.o === st.right;
      bus.emit("answer", {ok, es: r.es, word: d.word, where: "lesson"});
      $(".ls-card").querySelectorAll(".opt").forEach(o => { o.disabled = true; if(o.dataset.o === st.right) o.classList.add("ok"); });
      if(!ok) b.classList.add("bad");
      const key = st.w.r.es;
      if(ok){ if(!s.miss.has(key)) s.first.add(key); }
      else { s.miss.add(key); s.steps.push({t: st.t === "pick" ? "listen" : "pick", w: st.w}); }
      $("#ls-fb").innerHTML = `<div class="ls-foot ${ok?"ok":"bad"}"><span class="msg">${ok ? "¡Muy bien!" : "Respuesta correcta:"}
        <small>${esc(d.word)} = ${esc(r.es)}</small></span>${sayBtn(d.word)}<button class="btn lc" id="ls-go">Continuar</button></div>`;
      if(st.t === "pick" || !ok) sayP(d.word);
      $("#ls-go").onclick = () => { s.i++; lsStep(); };
      $("#ls-go").focus({preventScroll:true});
    };
    $(".ls-card").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));
    document.onkeydown = e => {
      if(e.target.tagName === "INPUT") return;
      const n = parseInt(e.key); const os = $(".ls-card") ? $(".ls-card").querySelectorAll(".opt") : [];
      if(n >= 1 && n <= os.length && !st.done) pick(os[n-1]);
      else if(e.key === "Enter" && st.done){ e.preventDefault(); $("#ls-go") && $("#ls-go").click(); }
    };
  }
}

/* ---------- gramática ---------- */
const GRAM = {};
async function getGram(){
  if(!GRAM[lang]) GRAM[lang] = await fetch(`data/grammar_${LANGS[lang].code.slice(0,2)}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return GRAM[lang];
}
const gId = (lv, k) => `G-${lv}-${String(k+1).padStart(2,"0")}`;
function lvUnits(lv){                     /* unidades del nivel con las lecciones de gramática intercaladas */
  const g = (GRAM[lang] || {})[lv] || [], N = MAP[lv].reduce((a, u) => a + u.ls.length, 0);
  const at = g.map((_, k) => Math.max(1, Math.round((k + 0.5) * N / g.length)));
  let n = 0, k = 0;
  return MAP[lv].map(u => ({...u, ls: u.ls.flatMap(l => {
    n++; const out = [l];
    while(k < g.length && at[k] === n){ out.push({id: gId(lv, k), g: k, t: g[k].t}); k++; }
    return out;
  })}));
}
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function gramTheory(x){
  return `${x.rules.map(r => `<div class="g-rule"><h3>${esc(r.h)}</h3><p>${md(r.p)}</p>
      ${r.tab ? `<table class="g-tab">${r.tab.map(row => `<tr>${row.map(c => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</table>` : ""}</div>`).join("")}

  $(".ls-card").querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b));

    const n = parseInt(e.key), os = $(".ls-card") ? $(".ls-card").querySelectorAll(".opt") : [];
    if(n >= 1 && n <= os.length && !st.done) pick(os[n-1]);
    else if(e.key === "Enter" && st.done){ e.preventDefault(); $("#ls-go") && $("#ls-go").click(); }
  };
}

/* ---------- juego: monedas, personaje, granja y premios ---------- */
let SHOP = [];
async function getShop(){ if(!SHOP.length) SHOP = await fetch("data/game.json").then(r => r.json()).catch(() => []); return SHOP; }
const GDEF = {coins:0, earned:0, owned:{zorro:true}, wear:{hero:"zorro"}, ach:{}, name:"", gifts:0, day:""};
const game = () => { const g = Object.assign(JSON.parse(JSON.stringify(GDEF)), store.get("game", {})); g.owned.zorro = true; return g; };
function gameSet(g){ store.set("game", g); paintCoins(); }
let coinShown = null;
function paintCoins(){
  const c = $("#coins"); if(!c) return;
  const v = game().coins, b = c.closest(".hbtn");
  if(coinShown !== null && v > coinShown && b){ b.classList.remove("cbump"); void b.offsetWidth; b.classList.add("cbump"); }
  coinShown = v; c.textContent = v;
  /* todo lo que enseña monedas en la página de la granja (también tras una medalla, que no emite "coins") */
  const mc = $(".me-coins b"); if(mc) mc.textContent = v;
  shopCoins();
}
/* otra pestaña ganó o gastó monedas */
window.addEventListener("storage", e => { if(e.key === "game") paintCoins(); });
const itemById = id => SHOP.find(x => x.id === id);
const TYPES = [["hero","🦸","Personajes"],["hat","🎩","Sombreros"],["face","🕶️","Gafas"],["hand","⚽","Juguetes"],["pet","🐶","Mascotas"],["farm","🌻","Granja"]];
const itemWord = it => it.w[lang] || it.n;
function heroHtml(size = 110, g = game()){
  const w = g.wear, E = id => (itemById(id) || {}).e || "";
  return `<div class="hero" style="font-size:${size}px" aria-hidden="true">
    ${w.pet ? `<span class="h-pet">${E(w.pet)}</span>` : ""}<span class="h-base">${E(w.hero) || "🦊"}</span>
    ${w.hat ? `<span class="h-hat">${E(w.hat)}</span>` : ""}${w.face ? `<span class="h-face">${E(w.face)}</span>` : ""}
    ${w.hand ? `<span class="h-hand">${E(w.hand)}</span>` : ""}</div>`;
}
function coinPop(n, why){
  const el = document.createElement("div"); el.className = "coin-pop";
  el.innerHTML = `<b>+${n} 🪙</b>${why ? `<small>${esc(why)}</small>` : ""}`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1900);
}
function award(n, why, quiet){
  const g = game(); const day = dayKey(new Date());
  if(g.day !== day){ g.day = day; g.coins += 10; g.earned += 10; if(!quiet) setTimeout(() => coinPop(10, "¡Regalo del día!"), 2000); }
  g.coins += n; g.earned += n; gameSet(g);
  if(n && !quiet) coinPop(n, why);
  bus.emit("coins", {n, why, quiet: !!quiet});
  setTimeout(checkAch, 1200);
}
/* medallas */
function allMapP(){ const all = {}; for(const L of Object.keys(LANGS)) Object.assign(all, ...Object.entries(store.get("map:"+L, {})).map(([k, v]) => ({[L+k]: v}))); return all; }
function achList(){
  const g = game(), P = allMapP(), keys = Object.keys(P);
  const les = keys.filter(k => !k.includes("G-")).length, gr = keys.filter(k => k.includes("G-")).length;
  const three = Object.values(P).filter(v => v === 3).length;
  const words = Object.keys(srsAll()).length, mast = Object.values(srsAll()).filter(x => x.b >= MASTER).length;
  const farm = SHOP.filter(x => x.t === "farm" && g.owned[x.id]).length, things = Object.keys(g.owned).length - 1;
  const st = streak();
  const A = [
    ["l1","🥇","Primera lección","Termina tu primera lección", les, 1], ["l10","📗","Explorador","Termina 10 lecciones", les, 10],
    ["l50","📘","Aventurero","Termina 50 lecciones", les, 50], ["l150","📙","Sabio","Termina 150 lecciones", les, 150],
    ["g1","✏️","Primera gramática","Termina una lección de gramática", gr, 1], ["g10","📐","Maestro de reglas","Termina 10 de gramática", gr, 10],
    ["s3","⭐","Tres estrellas","Saca 3 estrellas en 5 lecciones", three, 5], ["s20","🌟","Estrella brillante","Saca 3 estrellas en 20 lecciones", three, 20],
    ["r3","🔥","Racha de 3","Aprende 3 días seguidos", st, 3], ["r7","🚒","Racha de 7","Aprende 7 días seguidos", st, 7], ["r30","🌋","Racha de 30","Aprende 30 días seguidos", st, 30],
    ["w50","📖","50 palabras","Ten 50 palabras en tu repaso", words, 50], ["w300","📚","300 palabras","Ten 300 palabras en tu repaso", words, 300],
    ["m25","💎","Memoria de oro","Domina 25 palabras", mast, 25],
    ["c200","💰","Ahorrador","Gana 200 monedas", g.earned, 200], ["c1000","🏦","Banquero","Gana 1000 monedas", g.earned, 1000],
    ["f5","🌾","Granjero","Ten 5 cosas en tu granja", farm, 5], ["f20","🚜","Gran granjero","Ten 20 cosas en tu granja", farm, 20],
    ["t10","🎽","Con estilo","Consigue 10 premios de la tienda", things, 10],
  ];
  return A.map(([id, e, t, d, v, goal]) => ({id, e, t, d, v: Math.min(v, goal), goal, ok: v >= goal}));
}
let achBusy = false;
function checkAch(){
  if(achBusy) return; achBusy = true;
  const g = game(), fresh = achList().filter(a => a.ok && !g.ach[a.id]);
  if(fresh.length){
    for(const a of fresh) g.ach[a.id] = dayKey(new Date());
    g.coins += 20 * fresh.length; g.earned += 20 * fresh.length; gameSet(g);
    fresh.forEach((a, i) => setTimeout(() => { toast(`${a.e} ¡Nueva medalla: ${a.t}! +20 🪙`); bus.emit("medal", a); }, 400 + i * 2400));
  }
  achBusy = false;
}
/* regalos: uno cada 5 lecciones terminadas */
function giftCheck(){
  const g = game(), n = Object.keys(allMapP()).length, due = Math.floor(n / 5);
  if(due <= g.gifts) return false;
  g.gifts = due;
  const pool = SHOP.filter(x => !g.owned[x.id] && x.p > 0 && x.p <= 120);
  const it = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  if(it){ g.owned[it.id] = true; } else { g.coins += 50; g.earned += 50; }
  gameSet(g); showGift(it); return true;
}
function showGift(it){
  let d = $("#gift"); if(!d){ d = document.createElement("dialog"); d.id = "gift"; document.body.appendChild(d); }
  d.innerHTML = `<div class="gift"><div class="gbox" id="gbox">🎁</div><h2>¡Tienes un regalo!</h2><p class="sub">Por terminar 5 lecciones más.</p>
    <button class="btn lc" id="gopen" style="--lc:#1f6fd1">Abrir el regalo</button></div>`;
  d.showModal();
  $("#gopen").onclick = () => {
    $("#gbox").classList.add("open"); bus.emit("gift-open", {item: it});
    setTimeout(() => {
      d.innerHTML = `<div class="gift"><div class="gbox got">${it ? it.e : "🪙"}</div>
        <h2>${it ? `¡Es ${esc(art(it.n))}!` : "¡50 monedas!"}</h2>
        ${it ? `<p class="gword">${esc(itemWord(it))} ${sayBtn(itemWord(it))}</p><p class="sub">Así se dice en ${LANGS[lang].name}. ${it.t === "farm" ? "Ya está en tu granja." : "Ya está en tu armario."}</p>` : `<p class="sub">Ya tienes todos los regalos pequeños. ¡Compra algo grande en la tienda!</p>`}
        <div class="ctrl" style="justify-content:center">
          ${it && it.t !== "farm" ? `<button class="btn lc" id="gwear" style="--lc:#1f6fd1">Ponérmelo</button>` : ""}
          <button class="btn" id="gclose">¡Genial!</button></div></div>`;
      if(it) setTimeout(() => say(itemWord(it)), 300);
      $("#gclose").onclick = () => d.close();
      if($("#gwear")) $("#gwear").onclick = () => { const g = game(); g.wear[it.t] = it.id; gameSet(g); d.close(); location.hash = "#/granja"; };
    }, 650);
  };
}
const FEM = new Set(["rana","gorra","corona","cometa","guitarra","pelota de baloncesto","varita mágica","videoconsola","copa","tortuga","gallina","abeja","oveja","cabra","vaca","flor","seta","zanahoria","fresa","calabaza","manzana","tienda de campaña","cabaña","casa","fuente","gafas","gafas de sol","gafas de bucear"]);
const art = n => n.startsWith("gafas") ? "unas " + n : (FEM.has(n) ? "una " : "un ") + n;

/* página: mi granja + tienda */
let shopTab = "farm";
const buyBtn = (x, coins) => coins >= x.p ? `<button class="btn buy" data-buy="${x.id}">🪙 ${x.p}</button>`
  : `<button class="btn buy no" disabled>🪙 ${x.p}</button><small class="miss">Te faltan ${x.p - coins}</small>`;
/* las monedas cambian sin repintar la página (comida de la granja, regalos recogidos): los precios se ponen al día */
function shopCoins(){ const c = game().coins; document.querySelectorAll(".shop [data-sb]").forEach(el => { const it = itemById(el.dataset.sb); if(it) el.innerHTML = buyBtn(it, c); }); }
bus.on("coins", shopCoins);
async function granja(){
  await getShop(); document.onkeydown = null;
  const g = game(), farm = SHOP.filter(x => x.t === "farm" && g.owned[x.id]);
  const big = new Set(["casa","castillo","cabana","tienda","tractor","molino","fuente","cohete","arbol","pino"]);
  const items = farm.map((x, i) => {
    const sx = (i * 41 + 7) % 86 + 3, sy = 52 + (i * 29 + 11) % 36;
    return `<button class="fi ${big.has(x.id) ? "bg" : ""}" data-it="${x.id}" style="left:${sx}%;top:${sy}%;z-index:${sy}" aria-label="${esc(x.n)}">${x.e}</button>`;
  }).join("");
  const tabs = TYPES.map(([t, e, n]) => `<button class="${t === shopTab ? "on" : ""}" data-tab="${t}">${e} ${n}</button>`).join("");
  /* animales que se fueron al refugio (farm.js): siguen siendo suyos, se rescatan desde la granja */
  const shel = id => { try{ return typeof farmMount === "function" && !!farmMount.care && farmMount.care.inShelter(id); }catch(e){ return false; } };
  const cards = SHOP.filter(x => x.t === shopTab).map(x => {
    const own = g.owned[x.id], worn = g.wear[x.t] === x.id, sh = x.t === "farm" && own && shel(x.id);
    const btn = x.t === "farm" ? (own ? (sh ? `<span class="own shl">🏚️ En el refugio</span><button class="btn sm" data-shelter="${x.id}">Ir al refugio</button>` : `<span class="own">✓ En tu granja</span>`) : "")
      : own ? (x.t === "hero" ? (worn ? `<span class="own">✓ Eres tú</span>` : `<button class="btn sm" data-wear="${x.id}">Elegir</button>`)
                              : `<button class="btn sm ${worn ? "on" : ""}" data-wear="${x.id}">${worn ? "Quitármelo" : "Ponérmelo"}</button>`) : "";
    const buy = own ? "" : `<span class="sb" data-sb="${x.id}">${buyBtn(x, g.coins)}</span>`;
    return `<div class="sc ${own ? "own" : ""}${sh ? " shel" : ""}" data-id="${x.id}"><div class="se">${x.e}</div><div class="sn">${esc(x.n)}</div>
      <div class="sw">${esc(itemWord(x))} ${sayBtn(itemWord(x), 1)}</div>${btn}${buy}</div>`;
  }).join("");
  $("#app").innerHTML = `<a class="back" href="#/">← Inicio</a>
    <div class="me">${heroHtml(120, g)}
      <div class="me-info"><input id="me-name" maxlength="20" placeholder="Escribe tu nombre" value="${esc(g.name)}" aria-label="Tu nombre">
        <div class="me-coins">🪙 <b>${g.coins}</b> monedas</div>
        <div class="count">Ganas monedas al terminar lecciones, repasar y conseguir medallas.</div></div></div>
    <h2>🏡 Mi granja</h2>
    <div id="farm-host">${typeof farmMount === "function" ? "" : `<div class="farm" id="farm"><span class="sun">☀️</span><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span>
      <div class="farm-hero">${heroHtml(54, g)}</div>${items}
      ${farm.length ? "" : `<div class="farm-empty">Tu granja está vacía. ¡Compra animales y plantas en la tienda!</div>`}
      <div class="farm-tip" id="farm-tip" hidden></div></div>
    ${farm.length ? `<p class="count" style="text-align:center">Toca un animal o una planta para oír cómo se dice en ${LANGS[lang].name}.</p>` : ""}`}</div>
    <h2>🛒 Tienda</h2>
    <div class="shop-tabs">${tabs}</div>
    <div class="shop">${cards}</div>`;
  if(typeof farmMount === "function") farmMount($("#farm-host"));
  $("#me-name").onchange = e => { const g = game(); g.name = e.target.value.trim(); gameSet(g); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { shopTab = b.dataset.tab; granja(); });
  document.querySelectorAll("[data-it]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.it), tip = $("#farm-tip");
    b.classList.remove("hop"); void b.offsetWidth; b.classList.add("hop");
    tip.hidden = false; tip.innerHTML = `${it.e} <b>${esc(itemWord(it))}</b> = ${esc(it.n)}`;
    tip.style.left = b.style.left; tip.style.top = `calc(${b.style.top} - 54px)`;
    say(itemWord(it));
  });
  $(".shop").addEventListener("click", e => {
    const b = e.target.closest("[data-buy]"); if(!b) return;
    const it = itemById(b.dataset.buy), g = game(); if(!it || g.owned[it.id]) return;
    if(g.coins < it.p){ toast(`Te faltan ${it.p - g.coins} 🪙`); return shopCoins(); }
    g.coins -= it.p; g.owned[it.id] = true; if(it.t !== "farm") g.wear[it.t] = it.id; gameSet(g); bus.emit("buy", {item: it});
    toast(`¡Nuevo! ${it.e} ${it.n} = ${itemWord(it)}`); say(itemWord(it)); granja(); setTimeout(checkAch, 800);
  });
  document.querySelectorAll("[data-wear]").forEach(b => b.onclick = () => {
    const it = itemById(b.dataset.wear), g = game();
    g.wear[it.t] = (g.wear[it.t] === it.id && it.t !== "hero") ? null : it.id; gameSet(g); granja();
  });
}

  const det = document.querySelector("details.adult");

/* ---------- rutas ---------- */
async function route(){
  autoTok++; if(state.fc) state.fc.auto = false; if("speechSynthesis" in window) speechSynthesis.cancel();
  const h = location.hash.replace(/^#\/?/,"");
  try{
    await getShop();
    if(h.startsWith("doc/")){
      const id = h.slice(4);
      if(state.doc!==id){ state.doc=id; state.q=""; state.lvl=""; state.fc={i:0,flip:false,order:null,rev:false}; state.test=null; }
      else { state.test=null; state.fc.order=null; }
      await docView(id);
    } else if(h.startsWith("mapa")){ state.doc=null; await mapa(h.split("/")[1]); }
    else if(h.startsWith("gramatica")){ state.doc=null; await gramatica(h.split("/")[1]); }
    else if(h.startsWith("leccion/")){ state.doc=null; await leccion(h.slice(8)); }
    else if(h.startsWith("repaso")){ state.doc=null; await repaso(); }
    else if(h.startsWith("progreso")){ state.doc=null; await premios(); }
    else if(h.startsWith("granja")){ state.doc=null; await granja(); }
    else if(ROUTES[h.split("/")[0]]){ state.doc=null; document.onkeydown = null; await ROUTES[h.split("/")[0]](h.split("/").slice(1)); }
    else { state.doc=null; await home(); }
  }catch(e){ console.error(e); $("#app").innerHTML = `<p class="empty">No se pudo cargar. ${esc(e.message)}</p>`; }
  if(!h.startsWith("mapa")) window.scrollTo(0,0);
  const sec = {leccion:"mapa", gramatica:"mapa"}[h.split("/")[0]] || h.split("/")[0];
  document.querySelectorAll(".hnav [data-nav]").forEach(a => { const on = a.dataset.nav === sec; a.classList.toggle("on", on); if(on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  bus.emit("route", {h});
}
window.addEventListener("hashchange", route);
document.addEventListener("DOMContentLoaded", () => { renderLangs(); updBadge(); paintCoins(); bus.emit("boot"); route(); });
