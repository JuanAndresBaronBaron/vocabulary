<script>
/* tema: «light» o «dark» guardados en "theme"; sin clave (o con otro valor) = Automático, sigue al sistema */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("theme"))}catch(e){}
if(t!=="light"&&t!=="dark")t=null;
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();
/* Ajustes › Accesibilidad ("vocab:ui", solo de este aparato; js/settings.js): se ponen antes de pintar */
(function(){var u=null;try{u=JSON.parse(localStorage.getItem("vocab:ui"))}catch(e){}
if(!u||typeof u!=="object")return;var d=document.documentElement.dataset;
if(u.glass==="off")d.glass="off";if(u.motion==="calm")d.motion="calm";if(u.contrast==="more")d.contrast="more";if(u.text==="large")d.text="large";})();
</script>

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
/* ===================== Cimientos (rediseño F1) =====================
   Tokens en :root (claro) y :root[data-theme=dark] (el script del <head> resuelve el tema: «Automático» = sin clave).
   Material: .glass (vidrio flotante con desenfoque de verdad; usa ::before para el borde) · .glass-btn (vidrio sobre
   contenido, sin desenfoque; ::before borde, ::after brillo desde --mx/--my con .is-pressed) · .btn-fill (cápsula
   sólida) · .ok-fill / .miss-fill (acierto / fallo gris) · .card (contenido sólido) · .ico (sprite Phosphor) · kbd.
   Interruptores en <html>: data-glass="off|lite" · data-contrast="more" · data-text="large".
   Texto: usa los --fs-* (ya respetan el tamaño de texto del sistema en iOS). */
/* letra redondeada donde no hay SF Pro Rounded (Android, Windows, Linux): Nunito, licencia OFL (fonts/OFL.txt) */
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:light;
  /* superficies y texto (label2 a .76 y no .6: así el texto secundario pasa 4,5:1 sobre #F2F2F7) */
  --bg:#F2F2F7;--card:#FFFFFF;--card-2:#F2F2F7;--card-hi:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.76);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.12);
  /* marca: --brand-fill (fondo con texto blanco) · --brand-tint (iconos y texto sobre blanco) ·
     --brand-ink (texto azul que puede caer sobre el fondo gris o sobre vidrio) */
  --brand-fill:#1E6EF4;--brand-tint:#1E6EF4;--brand-ink:#185CCF;--brand-soft:rgba(30,110,244,.12);
  /* estados: acierto verde, fallo GRIS (nunca rojo) */
  --ok:#34C759;--ok-fill:#008932;--ok-ink:#007F2E;--ok-soft:rgba(52,199,89,.16);
  --miss:#8E8E93;--miss-ink:#6C6C70;--miss-fill:rgba(120,120,128,.22);--miss-on:#48484A;
  /* monedas, marca y adorno de progreso (texto oro #946200 y no #A16A00: el de la especificación da 4,1:1 sobre el fondo
     #F2F2F7; este pasa 4,5:1 también ahí y sobre el vidrio claro) */
  --gold:#FFCC00;--gold-ink:#946200;--gold-soft:rgba(255,204,0,.22);--gold-deep:#B38F00;--gold-on:#3D2B00;
  --navy:#0B2545;--teal:#008198;
  /* vidrio flotante */
  --g-tint:rgba(255,255,255,.62);--g-top:rgba(255,255,255,.5);--g-solid:#FFFFFF;
  --g-rim1:rgba(255,255,255,1);--g-rim2:rgba(255,255,255,.16);--g-edge:rgba(0,0,0,.07);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.95);--g-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
  /* vidrio sobre contenido (botones) */
  --neu:#E9E9EE;--neu-ink:#000000;--hb-shadow:0 4px 12px -4px rgba(30,110,244,.45);
  /* tipografía (rem; --k corrige la base de 17 px del texto de sistema en iOS y sube con «Texto más grande») */
  --k:1;
  --f-text:system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  /* los títulos y la palabra suben con el texto del sistema, pero con tope (como los títulos grandes de iOS): así una
     palabra larga o el texto enorme de accesibilidad no se salen de la tarjeta; el texto normal sube sin tope */
  --fs-lt:min(calc(2.25rem*var(--k)),48px);--fs-t1:min(calc(1.875rem*var(--k)),40px);
  --fs-t2:min(calc(1.5rem*var(--k)),34px);--fs-t3:min(calc(1.375rem*var(--k)),30px);
  --fs-head:calc(1.1875rem*var(--k));--fs-body:calc(1.1875rem*var(--k));--fs-sub:calc(1.0625rem*var(--k));
  --fs-note:calc(.9375rem*var(--k));--fs-min:calc(.8125rem*var(--k));--fs-tab:calc(.75rem*var(--k));
  --fs-word:min(calc(2.75rem*var(--k)),56px,13vw);
  /* medidas */
  --r-card:24px;--r-sheet:32px;--r-menu:20px;--r-pill:999px;--r-md:16px;--r-sm:12px;
  --tap:44px;--tap-bar:48px;--row:52px;--btn-main:56px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--gutter:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --z-bar:10;--z-acc:11;--z-sheet:20;--z-toast:30;
  /* nombres de antes (los usan las pantallas y los módulos js/*.js hasta que se rehagan) */
  --ink:var(--label);--muted:var(--label2);--line:var(--fill);--soft:var(--fill2);--cat:var(--fill2);
  --brand:var(--brand-ink);--brand-2:var(--label2);--bad:var(--miss-ink);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--card-2:#2C2C2E;--card-hi:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.32);--fill2:rgba(120,120,128,.24);
  --brand-tint:#0091FF;--brand-ink:#409CFF;--brand-soft:rgba(0,145,255,.18);
  --ok:#30D158;--ok-ink:#30D158;--ok-soft:rgba(48,209,88,.18);
  --miss-ink:#AEAEB2;--miss-fill:rgba(120,120,128,.36);--miss-on:rgba(235,235,245,.7);
  --gold:#FFD600;--gold-ink:#FFD600;--gold-soft:rgba(255,214,0,.16);--gold-deep:#A68B00;--gold-on:#1C1C1E;
  --teal:#00D2E0;
  --g-tint:rgba(28,28,30,.62);--g-top:rgba(255,255,255,.10);--g-solid:#2C2C2E;
  --g-rim1:rgba(255,255,255,.5);--g-rim2:rgba(255,255,255,.12);--g-edge:rgba(0,0,0,.6);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.22);--g-shadow:0 10px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --neu:#3A3A3C;--neu-ink:#FFFFFF;--hb-shadow:0 6px 16px -6px rgba(0,0,0,.7);
  --shadow:none;
}
/* iOS: el tamaño de texto del sistema (Dynamic Type) fija la base; en el Mac (13 px) no se aplica */
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html{font:-apple-system-body}:root{--k:.9412}}
html[data-text=large]{--k:1.18}
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html[data-text=large]{--k:1.11}}
/* fuera de iOS, «Texto más grande» sube la base (118 %): crecen los --fs-* y también las pantallas que aún usan rem sueltos */
@supports not ((-webkit-touch-callout:none) and (font:-apple-system-body)){html[data-text=large]{font-size:118%;--k:1}}
@media (min-width:744px){:root{--gutter:24px}}
/* más contraste (sistema o Ajustes): texto secundario y separadores más fuertes */
@media (prefers-contrast:more){
  :root{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
  :root[data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}}
:root[data-contrast=more]{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
:root[data-contrast=more][data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}
/* en oscuro, los dibujos (hechos para fondo claro) van sobre una ficha gris claro con esquinas, como una pegatina */
[data-theme=dark] .img img{background:#F2F2F7;border-radius:var(--r-md);padding:6px}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 var(--fs-sub)/1.4 var(--f-text);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}

/* ---------- tipografía (escala grande de iOS) ---------- */
.t-lt{font:700 var(--fs-lt)/1.2 var(--f-round);letter-spacing:.005em}
.t-1{font:700 var(--fs-t1)/1.2 var(--f-round)}
.t-2{font:700 var(--fs-t2)/1.2 var(--f-round)}
.t-3{font:700 var(--fs-t3)/1.22 var(--f-round)}
.t-head{font:600 var(--fs-head)/1.26 var(--f-text)}
.t-body{font:400 var(--fs-body)/1.3 var(--f-text)}
.t-sub{font:400 var(--fs-sub)/1.3 var(--f-text);color:var(--label2)}
.t-note{font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.t-min{font:400 var(--fs-min)/1.38 var(--f-text);color:var(--label2)}
.t-tab{font:600 var(--fs-tab)/1.17 var(--f-text)}
.t-word{font:700 var(--fs-word)/1.18 var(--f-round);overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;text-wrap:balance}   /* con lang="en-GB|fr|da" en el elemento */
/* la palabra que se aprende (fitWord): nunca se parte ni lleva guion; si no cabe, baja de tamaño. Solo si ni a 28 px
   cabe, se parte (.is-break) */
:root [data-fit]{overflow-wrap:normal;word-break:normal;-webkit-hyphens:manual;hyphens:manual}
:root [data-fit].is-break{overflow-wrap:anywhere}
.t-num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- iconos (sprite Phosphor al principio del <body>; ico(nombre, estilo, tamaño)) ---------- */
.ico{display:inline-block;flex:none;fill:currentColor;vertical-align:middle;overflow:visible;pointer-events:none}

/* ---------- utilidades de estado: acierto en verde lleno, fallo en gris (nunca rojo) ---------- */
.ok-fill{background:var(--ok-fill)!important;color:#fff!important;border-color:transparent!important}
.miss-fill{background:var(--miss-fill)!important;color:var(--miss-on)!important;border-color:transparent!important}
.ok-ink{color:var(--ok-ink)}
.miss-ink{color:var(--miss-ink)}

/* ---------- contenido sólido ---------- */
.card{background:var(--card);color:var(--label);border-radius:var(--r-card)}

/* ---------- vidrio flotante (barras, hojas, menús, avisos): desenfoque con valores literales ---------- */
:where(.glass:not(dialog):not([popover])){position:relative}
.glass{color:var(--label);
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-tint);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:var(--g-hi),0 0 0 .5px var(--g-edge),var(--g-shadow)}
.glass::before,.glass-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* versión ligera (sin desenfoque, más opaca): granja, juegos, o html[data-glass=lite]. Con :where() pesa lo mismo que
   .glass, así los modos de abajo (sin transparencia, más contraste, data-glass=off) la pisan siempre por orden */
/* Como mucho 3 superficies con desenfoque a la vez (plan §Rendimiento): la barra de pestañas, el grupo de las monedas y
   el accesorio «Seguir» (o el menú, o una hoja). Van siempre sin desenfoque la bandera, la pastilla «Guardar» y la
   cápsula de avisos; con una hoja abierta, las barras y el accesorio (quedan bajo su fondo oscurecido); con el menú de
   idioma abierto, el accesorio. */
.glass:where(.lite),:where(:root[data-glass=lite]) .glass,
.glass:where(.tb-flag,.sv-chip,#m-toasts .m-toast),:where(:root[data-sheet]) .glass:where(.tabbar,.tb-group,.acc),:where(:root[data-menu]) .glass:where(.acc){
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite,rgba(255,255,255,.9))}
:where(:root[data-theme=dark]) .glass:where(.lite),:where(:root[data-theme=dark][data-glass=lite]) .glass,
:where(:root[data-theme=dark]) .glass:where(.tb-flag,.sv-chip,#m-toasts .m-toast),:where(:root[data-theme=dark][data-sheet]) .glass:where(.tabbar,.tb-group,.acc),
:where(:root[data-theme=dark][data-menu]) .glass:where(.acc){
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite-d,rgba(28,28,30,.9))}
#m-toasts{--g-lite:rgba(255,255,255,.94);--g-lite-d:rgba(28,28,30,.94)}
#m-toasts .m-tact{--g-lite:#fff;--g-lite-d:#2C2C2E}   /* con «Deshacer», opaca: no se trasluce el título grande */

/* ---------- vidrio sobre contenido: botones de acción (sin desenfoque, tinte opaco) ---------- */
.glass-btn{--g-rim1:rgba(255,255,255,.75);--g-rim2:rgba(255,255,255,.12);
  position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;max-width:100%;min-width:0;padding:0 22px;border:0;border-radius:var(--r-pill);white-space:nowrap;
  font:600 var(--fs-head)/1.15 var(--f-text);letter-spacing:-.01em;text-align:center;text-decoration:none;color:var(--neu-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 50%),var(--neu);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.glass-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);
  transition:opacity var(--d-fast,160ms) ease}
.glass-btn.is-pressed::after{opacity:1}
.glass-btn--pri{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 40%),var(--brand-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.10),var(--hb-shadow)}
.glass-btn--ok{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 50%),var(--ok-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.10),0 6px 16px -6px rgba(0,137,50,.6)}
:root[data-theme=dark] .glass-btn{--g-rim1:rgba(255,255,255,.45);--g-rim2:rgba(255,255,255,.08)}
:root[data-theme=dark] .glass-btn:not(.glass-btn--pri):not(.glass-btn--ok){
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 50%),var(--neu);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.glass-btn--lg{min-height:var(--btn-main);padding:0 28px}
.glass-btn--sm{min-height:var(--tap);padding:0 14px;gap:4px;font-size:var(--fs-sub)}
.glass-btn--icon{width:var(--tap);min-height:var(--tap);padding:0;flex:none}
.glass-btn--block{display:flex;width:100%}
.glass-btn:disabled,.glass-btn[aria-disabled=true]{opacity:.45;cursor:default}
.glass-btn:focus-visible,.btn-fill:focus-visible,.glass :focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
/* foco de teclado: el mismo anillo azul en toda la app (no el del navegador, que en algunos sale naranja o dorado) */
:focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* ---------- cápsula sólida (filas, tienda, listas) ---------- */
.btn-fill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);max-width:100%;min-width:0;padding:0 18px;border:0;white-space:nowrap;
  border-radius:var(--r-pill);font:600 var(--fs-sub)/1.15 var(--f-text);text-decoration:none;color:#fff;background:var(--brand-fill);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn-fill--neu{background:var(--fill);color:var(--label)}
.btn-fill--ok{background:var(--ok-fill);color:#fff}
.btn-fill--gold{background:var(--gold);color:var(--gold-on)}
.btn-fill:disabled,.btn-fill[aria-disabled=true]{background:var(--fill2);color:var(--label3);cursor:default}

/* ---------- teclas (etiquetas grises que salen tras la primera tecla) ---------- */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border-radius:7px;
  font:600 var(--fs-min)/1 var(--f-text);color:var(--label2);background:var(--fill);box-shadow:inset 0 -1px 0 var(--sep);
  vertical-align:middle;white-space:nowrap}

/* ---------- si el aparato no puede o el niño lo necesita ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(255,255,255,.95)}
  :root[data-theme=dark] .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(28,28,30,.95)}}
:root[data-glass=off] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}
@media (prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}}
@media (prefers-contrast:more){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
  .glass::before,.glass-btn::before{display:none}
  .glass-btn{border:2px solid var(--sep)}}
:root[data-contrast=more] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
:root[data-contrast=more] .glass::before,:root[data-contrast=more] .glass-btn::before{display:none}
:root[data-contrast=more] .glass-btn{border:2px solid var(--sep)}
@media (forced-colors:active){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas;color:CanvasText;border:1px solid CanvasText;box-shadow:none}
  .glass-btn,.btn-fill{border:2px solid ButtonText;background:ButtonFace;color:ButtonText;box-shadow:none}
  .glass::before,.glass-btn::before,.glass-btn::after{display:none}
  .ico{fill:currentColor;forced-color-adjust:auto}}
/* ===================== Armazón de navegación (F2) =====================
   · Barra superior header.topbar: a la izquierda la bandera del idioma (#lang-b, abre el menú #lang-m); a la derecha
     [data-sync-slot] (sync.js monta ahí su pastilla) y el grupo de vidrio .tb-group con las monedas ([data-coins-pill],
     el número en #coins) y Ajustes ([data-open=ajustes] → window.openSettings()).
   · Barra de pestañas nav.tabbar (role=tablist): 5 a.tab[data-nav] con icono relleno de 26 px y nombre de 12/600; la
     activa con aria-selected=true, en azul y con la «gota» de vidrio. Abajo en el móvil; desde 820 px, arriba y centrada.
     No se encoge. Insignias .tb-badge (número azul o punto).
   · #tabhead: título grande y segmentos (.seg, role=tablist) de la pestaña, solo en su raíz.
   · Modo foco html[data-focus] (lección, repaso en marcha, partida): sin barras; .focusbar con la ✕ y el contador de
     monedas [data-coin-target]. html[data-tab] y html[data-sec] dicen la pestaña y la sección actuales. */
:root{--bar-top:calc(var(--safe-t) + 8px);--tb-row:var(--tap);--topbar-h:calc(var(--safe-t) + 60px);--tabbar-h:62px;--tabbar-b:max(12px,var(--safe-b));
  --drop:rgba(120,120,128,.15);--drop-hi:inset 0 1px 0 rgba(255,255,255,.75);--edge:rgba(242,242,247,.9);--tab-ink:#0F4FB0}
:root[data-theme=dark]{--drop:rgba(255,255,255,.08);--drop-hi:inset 0 1px 0 rgba(255,255,255,.16);--edge:rgba(0,0,0,.86);--tab-ink:var(--brand-ink)}
html{scroll-padding-top:calc(var(--topbar-h) + 8px);scroll-padding-bottom:calc(var(--tabbar-h) + var(--tabbar-b) + 8px)}
main{padding:var(--topbar-h) 0 calc(var(--tabbar-h) + var(--tabbar-b) + 28px)}
/* barra superior: tres botones de vidrio sobre un borde que funde el contenido que pasa por debajo */
.topbar{position:fixed;z-index:var(--z-bar);top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:var(--bar-top) max(16px,var(--safe-r)) 8px max(16px,var(--safe-l));pointer-events:none}
.topbar::after{content:"";position:absolute;z-index:-1;inset:0 0 -20px;pointer-events:none;
  background:linear-gradient(180deg,var(--edge) 0,var(--edge) calc(var(--safe-t) + 20px),rgba(242,242,247,0) 100%)}
:root[data-theme=dark] .topbar::after{background:linear-gradient(180deg,var(--edge) 0,var(--edge) calc(var(--safe-t) + 20px),rgba(0,0,0,0) 100%)}
/* en la granja la escena llega hasta arriba (sin el borde que funde); al bajar más allá de ella, el borde vuelve */
:root[data-tab=granja]:not([data-fm-past]) .topbar::after{display:none}
.topbar>*{pointer-events:auto}
.tb-flag{flex:none;width:var(--tap);height:var(--tap);padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
/* en las pantallas de segundo nivel, la cápsula «‹ Atrás» con el nombre de la anterior va en el sitio de la bandera, como
   el botón de volver de iOS: la ficha de un tema (‹ Palabras), una página del álbum (‹ Álbum) y la temporada (‹ Hoy).
   paintTabs() la pone (html[data-back]); en #/doc/… js/learn.js vuelve con Atrás si se vino de la lista */
.tb-back{display:none;flex:none;align-items:center;gap:2px;height:var(--tap);padding:0 16px 0 8px;border-radius:var(--r-pill);
  color:var(--brand-ink);font:600 var(--fs-sub)/1 var(--f-text);text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tb-back .ico{color:var(--brand-tint)}
:root[data-back] .topbar>.tb-back{display:inline-flex}
:root[data-back] .topbar>.tb-flag{display:none}
.flag{display:block;width:28px;height:28px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.18);flex:none}
.flag svg{display:block;width:100%;height:100%}
.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-slot{display:flex;align-items:center;gap:8px}
.tb-slot:empty{display:none}
/* la pastilla «Guardar» de sync.js: vidrio de la barra (sin desenfoque: cuenta como el grupo de al lado), texto azul */
.tb-slot .sv-chip{position:relative;flex:none;margin:0;display:flex;align-items:center;gap:6px;height:var(--tap);min-width:var(--tap);padding:0 16px 0 12px;
  border:0;border-radius:var(--r-pill);color:var(--brand-ink);font:600 var(--fs-sub)/1 var(--f-text);white-space:nowrap;cursor:pointer}
.tb-slot .sv-chip .ico{color:var(--brand-tint)}
/* sin sitio en la barra de arriba (placeBar(), más abajo): solo la nube */
:root:is([data-bar=slim],[data-bar=compact]) .tb-slot .sv-chip{width:var(--tap);padding:0;justify-content:center}
:root:is([data-bar=slim],[data-bar=compact]) .tb-slot .sv-chip-t{display:none}
.tb-group{display:flex;align-items:center;height:var(--tap);border-radius:var(--r-pill);flex:none}
.tb-coins{display:flex;align-items:center;gap:4px;height:var(--tap);min-width:var(--tap);padding:0 12px;border:0;background:none;border-radius:var(--r-pill);
  font:800 calc(1.1875rem*var(--k))/1 var(--f-round);font-variant-numeric:tabular-nums;color:var(--gold-ink);white-space:nowrap;cursor:pointer}
.coin-ico{display:block;width:22px;height:22px;flex:none}
.tb-sep{flex:none;width:1px;height:20px;background:var(--sep)}
.tb-gear{flex:none;width:var(--tap);height:var(--tap);padding:0;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--label);cursor:pointer}
/* menú de idioma (vidrio, radio 20): los tres idiomas con su bandera y ✓ en el elegido */
.lang-m{position:fixed;z-index:calc(var(--z-bar) + 5);top:calc(var(--bar-top) + var(--tb-row) + 8px);left:max(16px,var(--safe-l));
  width:min(280px,calc(100vw - 32px));padding:4px;border-radius:var(--r-menu)}
/* un menú con filas de texto: tinte más denso, para que la letra grande de detrás no se lea entre las filas */
.lang-m.glass{--g-tint:rgba(255,255,255,.84)}
:root[data-theme=dark] .lang-m.glass{--g-tint:rgba(28,28,30,.82)}
.lang-m[hidden]{display:none}
.lm-i{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row);padding:8px 12px;border:0;background:none;border-radius:16px;
  color:var(--label);font:600 var(--fs-body)/1.2 var(--f-text);text-align:left;cursor:pointer}
/* separador recto de media línea, como en las filas de Ajustes (sin las puntas curvas de una sombra con radio) */
.lm-i+.lm-i::before{content:"";position:absolute;top:0;left:52px;right:12px;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0;pointer-events:none}
.lm-i:hover{background:var(--fill2)}
.lm-i:hover::before,.lm-i:hover+.lm-i::before{visibility:hidden}
.lm-t{flex:1;min-width:0}.lm-t small{display:block;font:400 var(--fs-note)/1.3 var(--f-text);color:var(--label2)}
.lm-i .lm-chk{flex:none;color:var(--brand-ink);visibility:hidden}
.lm-i[aria-checked=true] .lm-chk{visibility:visible}
/* barra de pestañas flotante */
.tabbar{position:fixed;z-index:var(--z-bar);left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));bottom:var(--tabbar-b);
  max-width:520px;height:var(--tabbar-h);margin:0 auto;padding:4px;display:flex;border-radius:calc(var(--tabbar-h) / 2)}
/* nav (punto de referencia «Principal») › div role=tablist › las 5 a.tab */
.tb-list{flex:1 1 auto;min-width:0;display:flex}
.tab{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:calc(var(--tabbar-h) / 2 - 4px);color:var(--label);text-decoration:none;font:600 var(--fs-tab)/1.17 var(--f-text);letter-spacing:-.1px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tab .ico{width:26px;height:26px}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected=true]{color:var(--tab-ink);background:var(--drop);box-shadow:var(--drop-hi)}
.tab[aria-selected=true] .ico{color:var(--tab-ink)}   /* icono y nombre del mismo azul: en claro uno algo más oscuro que el de texto, que da 4,5:1 sobre la gota gris */
.tab[aria-selected=true]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.8;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.tab:focus-visible{outline-offset:-3px}
.tb-badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--brand-fill);color:#fff;font:700 calc(.8125rem*var(--k))/20px var(--f-text);font-variant-numeric:tabular-nums;text-align:center;
  box-shadow:0 0 0 2px var(--g-solid);pointer-events:none}
.tb-badge.dot{top:6px;left:calc(50% + 9px);min-width:0;width:10px;height:10px;padding:0}
.tb-badge[hidden]{display:none}
/* en la granja la barra va sin desenfoque: casi opaca para que los textos de debajo no se mezclen con los nombres (lo
   mismo los botones de arriba cuando van sin desenfoque) */
.tabbar,.topbar,.acc{--g-lite:rgba(255,255,255,.96);--g-lite-d:rgba(28,28,30,.96)}
.tabbar.lite .tab[aria-selected=true]{background:rgba(120,120,128,.10)}
:root[data-theme=dark] .tabbar.lite .tab[aria-selected=true]{background:var(--drop)}
@media (prefers-contrast:more){.tab[aria-selected=true]::before{display:none}.tab[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--brand-tint)}}
:root[data-contrast=more] .tab[aria-selected=true]::before{display:none}
:root[data-contrast=more] .tab[aria-selected=true]{box-shadow:inset 0 0 0 2px var(--brand-tint)}
@media (forced-colors:active){.tab[aria-selected=true]{outline:2px solid Highlight}.tb-badge{border:1px solid CanvasText}}
/* tableta grande y ordenador: la barra flota arriba, en la fila de la bandera y las monedas. Va dentro de header.topbar
   (placeBar() la mueve ahí: así el orden del teclado es el de la pantalla), que pasa a rejilla de 3 columnas: las de
   los lados se reparten el sitio que sobra, y la barra queda centrada en la pantalla si cabe o se corre lo justo si el
   grupo de la derecha es ancho, siempre a 12 px como poco de los otros botones. Pestañas de 44 px de alto (la barra,
   52) con los nombres enteros: si no caben, placeBar() deja solo la nube en la pastilla «Guardar» (data-bar=slim),
   luego aprieta las pestañas (compact) y, si aun así no caben (texto muy grande), la barra vuelve abajo (bottom). */
@media (min-width:820px){
  :root:not([data-bar=bottom]){--tb-row:52px;--topbar-h:calc(var(--safe-t) + 68px);scroll-padding-bottom:16px}
  :root:not([data-bar=bottom]) main{padding-bottom:48px}
  :root:not([data-bar=bottom]) .topbar{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);column-gap:12px}
  :root:not([data-bar=bottom]) .topbar>.tb-flag,:root:not([data-bar=bottom]) .topbar>.tb-back{grid-column:1;grid-row:1;justify-self:start}
  :root:not([data-bar=bottom]) .topbar>.tabbar{grid-column:2}
  :root:not([data-bar=bottom]) .topbar>.tb-right{grid-column:3;justify-self:end}
  :root:not([data-bar=bottom]) .tabbar{position:relative;inset:auto;z-index:auto;width:max-content;max-width:none;height:var(--tb-row);margin:0;
    padding:4px;border-radius:calc(var(--tb-row) / 2)}
  :root:not([data-bar=bottom]) .tb-list{flex:none}
  :root:not([data-bar=bottom]) .tab{flex:none;flex-direction:row;gap:6px;min-height:var(--tap);padding:0 14px;border-radius:calc(var(--tap) / 2);font-size:calc(.875rem*var(--k))}
  :root:not([data-bar=bottom]) .tab .tl{max-width:none;overflow:visible;text-overflow:clip}
  :root:not([data-bar=bottom]) .tab .ico{width:20px;height:20px}
  :root:not([data-bar=bottom]) .tb-badge{position:static;margin-left:2px}
  :root:not([data-bar=bottom]) .tb-badge.dot{margin-left:0}
  :root[data-bar=compact] .tab{gap:4px;padding:0 8px;font-size:calc(.8125rem*var(--k))}
}
/* título grande y segmentos de la pestaña (solo en su raíz; las pantallas no pintan otro título grande) */
.tabhead{padding-top:4px}
.tabhead[hidden]{display:none}
/* Aprender: el título y los segmentos en la misma columna de 640 px que Camino, Palabras y Gramática (js/learn.js) */
:root[data-tab=aprender] #tabhead{max-width:calc(640px + max(16px,var(--safe-l)) + max(16px,var(--safe-r)))}
.th-t{margin:0 0 12px;color:var(--label)}
/* segmentos del mismo ancho mientras quepan; si un nombre (con su aviso o con texto grande) no cabe, ese segmento crece
   y los demás ceden */
.seg{display:flex;gap:2px;width:100%;max-width:560px;min-height:48px;padding:2px;margin:0 0 20px;border-radius:var(--r-pill);background:var(--fill2);container-type:inline-size}
.seg-i{position:relative;flex:1 1 0;min-width:max-content;min-height:var(--tap);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;background:none;border-radius:var(--r-pill);
  color:var(--label);font:600 var(--fs-note)/1.15 var(--f-text);text-align:center;text-decoration:none;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.seg-i[aria-selected=true],.seg-i[aria-checked=true]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
:root[data-theme=dark] .seg-i[aria-selected=true],:root[data-theme=dark] .seg-i[aria-checked=true]{background:#636366;color:#fff}
.seg-i:focus-visible{outline-offset:-2px}
/* el aviso de la pestaña, repetido en el segmento al que se refiere («Repasar 9+», punto en «Álbum») */
.seg-i[data-badge]::after{content:attr(data-badge);flex:none;box-sizing:border-box;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--brand-fill);color:#fff;font:700 calc(.8125rem*var(--k))/20px var(--f-text);font-variant-numeric:tabular-nums;text-align:center}
.seg-i[data-badge=""]::after{min-width:0;width:8px;height:8px;padding:0}
/* en el móvil no caben «Repasar» y «9+» en un cuarto de fila: el segmento lleva el punto (el número ya está en la pestaña
   y en el nombre que lee el lector de pantalla) */
@container (max-width:419px){.seg-i[data-badge]::after{content:"";min-width:0;width:8px;height:8px;padding:0}
  /* y los segmentos de las pestañas, a lo que mide su nombre y cediendo todos a la vez: la fila nunca se sale */
  #tabhead .seg-i{flex:1 1 auto;min-width:0;padding:0 4px;gap:4px}}
@media (forced-colors:active){.seg-i[data-badge]::after{border:1px solid CanvasText}}
@media (prefers-contrast:more){.seg-i[aria-selected=true],.seg-i[aria-checked=true]{outline:2px solid var(--label);outline-offset:-2px}}
@media (forced-colors:active){.seg-i[aria-selected=true],.seg-i[aria-checked=true]{outline:2px solid Highlight}}
/* solo para el lector de pantalla */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
/* las pantallas que aún llevan «← Inicio»: sobra con la barra de pestañas */
.back[href="#/"]{display:none!important}
/* modo foco: sin barras; ✕ de vidrio arriba a la izquierda y el contador pequeño de monedas a la derecha */
.focusbar{display:none}
:root[data-focus] .topbar,:root[data-focus] .tabbar,:root[data-focus] .lang-m,:root[data-focus] .tabhead{display:none}
:root[data-focus] .focusbar{position:fixed;z-index:var(--z-bar);top:var(--bar-top);left:max(16px,var(--safe-l));right:max(16px,var(--safe-r));
  height:var(--tap);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.focusbar>*{pointer-events:auto}
/* en la lección y el repaso, la ✕ y las monedas van en la misma columna de 560 px que la barra y la tarjeta */
:root:is([data-focus=leccion],[data-focus=repaso]) .focusbar{left:max(16px,var(--safe-l),calc(50% - 280px));right:max(16px,var(--safe-r),calc(50% - 280px))}
.fx-x{flex:none;width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--label);text-decoration:none}
.fx-coins{display:flex;align-items:center;gap:5px;min-height:32px;padding:0 2px;font:800 calc(1.0625rem*var(--k))/1 var(--f-round);
  font-variant-numeric:tabular-nums;color:var(--gold-ink);white-space:nowrap}
.fx-coins .coin-ico{width:20px;height:20px}
:root[data-focus] main{padding:calc(var(--bar-top) + var(--tap) + 12px) 0 calc(var(--safe-b) + 32px)}
html[data-focus]{scroll-padding-top:calc(var(--bar-top) + var(--tap) + 8px);scroll-padding-bottom:16px}
/* la fila de arriba de la lección y de la partida va en la misma línea que la ✕ y las monedas (su ✕ propia sobra) */
:root[data-focus] .ls-top,:root[data-focus] .gm-top{margin-top:calc(-1 * (var(--tap) + 12px));min-height:var(--tap);padding:0 92px 0 56px}
:root[data-focus] .ls-top .x,:root[data-focus] .gm-x,:root[data-focus] .back[href="#/repaso"],:root[data-focus] .gm .back[href="#/juegos"]{display:none!important}
/* la cápsula de avisos sale debajo de las barras de arriba */
html #m-toasts{inset:calc(var(--bar-top) + var(--tb-row) + 8px) 0 auto 0}
:root[data-focus] #m-toasts{inset:calc(var(--bar-top) + var(--tap) + 8px) 0 auto 0}
/* filas agrupadas de las hojas: Ajustes (js/settings.js, dialog#ajustes) y la hoja de voz (dialog#cfg, openCfg) */
#cfg.m-sheet{max-width:600px}
.st-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
dialog .st-top h2{margin:0}
.st-sec{margin:0 0 22px}
.st-h{margin:0 16px 6px;font:600 var(--fs-note)/1.33 var(--f-text);color:rgba(60,60,67,.9)}
:root[data-theme=dark] .st-h{color:var(--label2)}
#cfg .note{background:none;border:0;padding:0;color:var(--label2)}
.btn[hidden],.glass-btn[hidden]{display:none}
:root[data-theme=dark] #cfg .note{color:rgba(235,235,245,.78)}
.st-g{background:var(--card);border-radius:var(--r-card);overflow:hidden}
:root[data-theme=dark] .st-g{background:var(--card-2)}
.st-r{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:var(--row);margin:0;padding:10px 16px;border:0;background:none;
  color:var(--label);font:400 var(--fs-body)/1.3 var(--f-text);text-align:left;text-decoration:none}
dialog label.st-r{margin:0;font-weight:400}
.st-r+.st-r::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);transform:scaleY(.5);transform-origin:0 0}
.st-r.col{flex-direction:column;align-items:stretch;gap:8px}
.st-r[hidden]{display:none}
button.st-r{cursor:pointer}
.st-l{flex:1;min-width:0}
.st-l small{display:block;font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.st-ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--brand-fill)}
.st-ic.tl{background:var(--brand-fill)}.st-ic.gr{background:#8E8E93}   /* (tl: el verde azulado es solo adorno de progreso) */
.st-r.col select,.st-r.col input[type=range]{width:100%}
dialog .st-r.col>label{margin:0;font:600 var(--fs-sub)/1.3 var(--f-text)}
.st-r[data-sync-cfg]:empty{display:none}
.st-r .dlbl{margin:0}
.dlbl span{display:inline-flex;align-items:center;gap:4px}
button.st-r:disabled{cursor:default;color:var(--label2)}
button.st-r:disabled .st-ic{background:#8E8E93}
.st-btn{color:var(--brand-ink);font-weight:600}
.st-sw{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:51px;height:31px;margin:0;border-radius:16px;
  background:rgba(120,120,128,.32);cursor:pointer;transition:background var(--d-fast,160ms) ease}
.st-sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:translate var(--d-base,260ms) var(--sp-snappy,ease)}
.st-sw:checked{background:var(--ok-fill)}
.st-sw:checked::after{translate:20px 0}
.st-sw:focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
.st-g .seg{margin:0;max-width:none}

<script>
const LANGS = {
  english:  {label:"🇬🇧 English",  name:"inglés",  code:"en-GB"},
  "français":{label:"🇫🇷 Français", name:"francés", code:"fr-FR"},
  dansk:    {label:"🇩🇰 Dansk",    name:"danés",   code:"da-DK"},
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","english"); if(!LANGS[lang]) lang="english";
let rate = store.get("rate",0.9);
let INDEX = null; const CACHE = {};
const $ = s => document.querySelector(s);
/* conexión con los módulos js/*.js: eventos, rutas y huecos de la portada */
const bus = {h:{}, on(e, f){ (this.h[e] = this.h[e] || []).push(f); }, emit(e, d){ (this.h[e] || []).forEach(f => { try{ f(d); }catch(err){ console.error(err); } }); }};
const ROUTES = {};      /* ROUTES["juegos"] = async partes => {...}   (#/juegos/…) */
const HOME_ACTS = [];   /* {href, e, t, sub, color} botones grandes extra de la portada */
const HOME_SLOTS = [];  /* async () => html, se pinta bajo los botones grandes */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* icono del sprite Phosphor: ico("house", "fill", 28, "x") → <svg class="ico x">…; estilo "bold" (contorno) o "fill" (relleno) */
function ico(name, style = "bold", size = 24, cls = ""){
  /* si falta ese estilo se usa el otro; si falta el icono, se avisa (un botón sin icono no lo entiende un niño) */
  if(!document.getElementById(`i-${name}-${style}`)){
    const alt = style === "fill" ? "bold" : "fill";
    if(document.getElementById(`i-${name}-${alt}`)) style = alt;
    else console.warn("[ico] falta el icono", name);
  }
  return `<svg class="ico${cls ? " " + cls : ""}" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="#i-${name}-${style}"></use></svg>`;
}

/* ---------- audio ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); voiceNote(); }; }
function voiceFor(code){
  const base = code.slice(0,2);
  const pick = store.get("voice:"+lang, null);
  if(pick){ const v = voices.find(v => v.name===pick); if(v) return v; }
  const c = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  return c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase() && /natural|online|google|neural/i.test(v.name))
      || c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase()) || c[0] || null;
}
function speakable(t){
  return String(t).replace(/\((m|f|m\.\/f\.|pl)\.?\)/g,"").replace(/\(.*?\)/g,"").replace(/\s\/\s/g,", ").replace(/—/g,"").trim();
}
/* audios grabados (ElevenLabs): audio/<en|fr|da>.json dice qué archivo tiene cada palabra;
   si una palabra no tiene audio o no carga, habla la voz del navegador como siempre */
const CLIP_AB = {english:"en", "français":"fr", dansk:"da"};
const clipMaps = {};
function loadClips(l){
  if(clipMaps[l] || !CLIP_AB[l]) return;
  clipMaps[l] = {};
  fetch(`audio/${CLIP_AB[l]}.json`).then(r => r.ok ? r.json() : {}).then(m => { clipMaps[l] = m || {}; }).catch(() => {});
}
loadClips(lang);
const clipFor = t => { const m = clipMaps[lang]; return m && m[speakable(t)]; };
/* ¿se oirá bien? tiene audio grabado, o el navegador tiene una voz de ese idioma (si aún no hay lista de voces, sí):
   sin voz, el navegador lo leería con otro acento y enseñaría mal la pronunciación */
const canHear = t => !!clipFor(t) || ("speechSynthesis" in window && (!voices.length || !!voiceFor(LANGS[lang].code)));
let clipEl = null, clipEnd = null;
function stopClip(){
  if(clipEl){ try{ clipEl.pause(); }catch(e){} clipEl = null; }
  if(clipEnd){ const f = clipEnd; clipEnd = null; f(); }
}
if("speechSynthesis" in window){
  const cancel0 = speechSynthesis.cancel.bind(speechSynthesis);
  try{ speechSynthesis.cancel = () => { stopClip(); cancel0(); }; }catch(e){}
}
/* toca el audio grabado; done(true) al acabar, done(false) si no se pudo (y entonces habla el navegador) */
function playClip(text, slow, done){
  const id = clipFor(text); if(!id) return false;
  const a = new Audio(`audio/${CLIP_AB[lang]}/${id}.mp3`);
  a.preservesPitch = true;
  a.playbackRate = slow ? 0.7 : Math.min(1.25, Math.max(0.75, rate / 0.9));
  clipEl = a;
  let fin = false;
  const end = ok => { if(fin) return; fin = true; if(clipEl === a) clipEl = null; if(clipEnd === endOk) clipEnd = null; done(ok); };
  const endOk = () => end(true);
  clipEnd = endOk;
  a.onended = () => end(true);
  a.onerror = () => end(false);
  a.play().catch(() => end(false));
  return true;
}
function say(text, btn, slow){
  if(!("speechSynthesis" in window) && !clipFor(text)) return alert("Tu navegador no permite audio.");
  if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
  document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
  if(btn) btn.classList.add("playing");
  const off = () => { if(btn) btn.classList.remove("playing"); };
  const tts = () => {
    if(!("speechSynthesis" in window)) return off();
    const u = new SpeechSynthesisUtterance(speakable(text));
    const code = LANGS[lang].code; u.lang = code; u.rate = slow ? SLOW() : rate;
    const v = voiceFor(code); if(v) u.voice = v;
    u.onend = u.onerror = off;
    speechSynthesis.speak(u);
  };
  if(!playClip(text, slow, ok => ok ? off() : tts())) tts();
}

function sayP(text, btn){
  return new Promise(res => {
    if(!text || (!("speechSynthesis" in window) && !clipFor(text))) return res();
    if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
    document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
    let done = false;
    const fin = () => { if(done) return; done = true; if(btn) btn.classList.remove("playing"); res(); };
    if(btn) btn.classList.add("playing");
    const tts = () => {
      if(!("speechSynthesis" in window)) return fin();
      const u = new SpeechSynthesisUtterance(speakable(text));
      const code = LANGS[lang].code; u.lang = code; u.rate = rate;
      const v = voiceFor(code); if(v) u.voice = v;
      u.onend = u.onerror = fin;
      setTimeout(fin, 1500 + speakable(text).length * 110 / rate);
      setTimeout(() => speechSynthesis.speak(u), 30);
    };
    if(playClip(text, false, ok => ok ? fin() : (done ? 0 : tts()))) setTimeout(fin, 8000);
    else tts();
  });
}

/* ---------- repaso espaciado, actividad y progreso ---------- */
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 864e5); };
const IV = [0, 1, 3, 7, 14, 30, 60, 120];   /* días hasta el siguiente repaso según la caja */
const MASTER = 4;                            /* desde 14 días se considera dominada */
const srsAll = () => store.get("srs:"+lang, {});
const srsK = (id, r) => id + "|" + r.es;
function srsPut(m){ store.set("srs:"+lang, m); updBadge(); }
function srsNext(x, g){ const b = x ? x.b : 0; return g===0 ? 0 : g===1 ? Math.max(1, Math.round(IV[b]/2)) : IV[Math.min(IV.length-1, b+1)]; }
function srsGrade(id, r, g){            /* g: 0 no la sabía · 1 difícil · 2 la sabía */
  const m = srsAll(), k = srsK(id, r), x = m[k] || {d:id, e:r.es, b:0, n:0};
  const days = srsNext(m[k], g);
  if(g===0) x.b = 0; else if(g===2) x.b = Math.min(IV.length-1, x.b+1);
  x.due = today() + days; x.n = (x.n||0) + 1; m[k] = x; srsPut(m); logAct();
}
function srsAdd(id, rows, box){         /* añade al repaso; box 0 = hoy, 1 = mañana, 2 = en 3 días */
  const m = srsAll(); let c = 0;
  for(const r of rows){
    const k = srsK(id, r);
    if(!m[k]){ m[k] = {d:id, e:r.es, b:box, due:today()+IV[box], n:0}; c++; }
    else if(m[k].b < box){ m[k].b = box; m[k].due = today()+IV[box]; }
  }
  srsPut(m); return c;
}
const dueList = () => Object.values(srsAll()).filter(x => x.due <= today());
const dayKey = d => d.toLocaleDateString("sv");
function logAct(n=1){ const a = store.get("act", {}), k = dayKey(new Date()); a[k] = (a[k]||0) + n; store.set("act", a); }
function streak(){
  const a = store.get("act", {}), d = new Date(); let s = 0;
  if(!a[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}

/* tamaños medidos en Chrome (MiB y KiB; todo en inglés ocupa unos 33 MiB) */
const OFF_FIRST_MB = 6.2;                         /* la app, los documentos y la gramática (se piden siempre) */
const OFF_IMG_MB = 7.5, OFF_IMG_N = 970;          /* dibujos y personajes (los que ya están no se vuelven a pedir) */
const AUDIO_KB = {en:7.1, fr:9.5, da:8.2}, ENTRY_KB = .4;    /* audio medio de cada idioma y lo que suma cada entrada */
const OFF_NET_FAILS = 10;                         /* tantos fallos de red seguidos = no hay conexión: se para */

async function offShellName(){
  const v = (await caches.keys()).map(n => /^vocab-shell-v(\d+)$/.exec(n)).filter(Boolean).sort((a, b) => b[1] - a[1])[0];
  return v ? v[0] : OFF_SHELL;
}
/* los audios del idioma: los nombres de archivo distintos que hay en audio/<ab>.json */
async function audioIds(l){
  const ab = CLIP_AB[l]; if(!ab) return [];
  let m = clipMaps[l];
  if(!m || !Object.keys(m).length){ try{ const r = await fetch(`audio/${ab}.json`); m = r.ok ? await r.json() : {}; }catch(e){ m = {}; } }
  return [...new Set(Object.values(m || {}))].filter(id => /^[\w-]+$/.test(String(id)));
}
const audioKB = l => (AUDIO_KB[CLIP_AB[l]] || 8.5) + ENTRY_KB;
const offEstimate = (l, n) => (OFF_FIRST_MB + OFF_IMG_MB) * 1048576 + n * audioKB(l) * 1024;
/* lo que falta por guardar (para no pedir sitio para lo que ya está): fetched = lo que se va a bajar (barra de progreso);
   room = lo que ocupará de más (los documentos se sustituyen, así que solo cuentan si faltan) */
async function offNeed(l, idx, ids, media){
  const have = new Set((await media.keys()).map(r => r.url)), abs = u => new URL(u, location.href).href, ab = CLIP_AB[l];
  const docsMiss = idx.length ? idx.filter(d => !have.has(abs(`data/${d.id}.json`))).length / idx.length : 1;
  let img = 0; for(const u of have) if(u.includes("/img/")) img++;
  const imgMiss = Math.max(0, 1 - img / OFF_IMG_N);
  const audio = ids.filter(id => !have.has(abs(`audio/${ab}/${id}.mp3`))).length * audioKB(l) * 1024;
  return {fetched: (OFF_FIRST_MB + imgMiss * OFF_IMG_MB) * 1048576 + audio,
          room: (docsMiss * OFF_FIRST_MB + imgMiss * OFF_IMG_MB) * 1048576 + audio};
}
/* qué hay ya guardado: documentos y audios del idioma actual (mira unos pocos) */
async function offState(l){
  if(!("caches" in window)) return {docs:false, audio:false};
  try{
    const media = await caches.open(OFF_MEDIA), idx = await getIndex(), ids = await audioIds(l), ab = CLIP_AB[l];
    const has = async u => !!(await media.match(u));
    const docs = idx.length > 0 && await has(`data/${idx[0].id}.json`) && await has(`data/${idx[idx.length - 1].id}.json`);
    const audio = ids.length > 0 && await has(`audio/${ab}/${ids[0]}.mp3`) && await has(`audio/${ab}/${ids[ids.length - 1]}.mp3`) && await has(`audio/${ab}/${ids[ids.length >> 1]}.mp3`);
    return {docs, audio, n:ids.length};
  }catch(e){ return {docs:false, audio:false}; }
}

function paintOff(){
  const j = offJob, b = $("#off-dl"), x = $("#off-x"), bar = $("#off-bar"), m = $("#off-msg");
  if(!b || !m) return;
  b.disabled = !!(j && !j.end); if(x) x.hidden = !(j && !j.end);
  if(!j) return;
  const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
  if(bar){ bar.hidden = !!j.end && !j.ok; bar.setAttribute("aria-valuenow", pct); bar.firstElementChild.style.width = pct + "%"; }
  const pr = $("#off-prog"); if(pr) pr.hidden = (!x || x.hidden) && (!bar || bar.hidden);
  m.textContent = j.end ? j.end
    : j.total ? `Guardando… ${pct} % · ${offMB(j.bytes)} de unos ${offMB(Math.max(j.est, j.bytes))} MB`
    : "Preparando la descarga…";
}
async function downloadAll(){

  if(!("caches" in window)){ const m = $("#off-msg"); if(m) m.textContent = "Este navegador no permite guardar la web sin internet."; return; }
  const l = lang, ab = CLIP_AB[l];
  const job = offJob = {ctrl:new AbortController(), done:0, total:0, bytes:0, est:0, fails:0, net:0, failed:[], end:"", ok:false};
  const sig = job.ctrl.signal;
  paintOff();
  const fin = (text, ok) => {
    if(job.fails) console.warn(`No se pudieron guardar ${job.fails} archivos, por ejemplo:`, job.failed.join(", "));
    job.end = text; job.ok = ok; paintOff(); setTimeout(() => { if(offJob === job){ offJob = null; } }, 0);
  };
  const OFFLINE = "Sin conexión: conéctate a internet para descargar. Lo que ya se guardó se queda.";
  if(navigator.onLine === false) return fin(OFFLINE, false);
  try{
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
    const [shellName, idx, ids] = [await offShellName(), await getIndex(), await audioIds(l)];
    const shell = await caches.open(shellName), media = await caches.open(OFF_MEDIA);
    const need = await offNeed(l, idx, ids, media);
    job.est = need.fetched;
    if(navigator.storage && navigator.storage.estimate){
      const q = await navigator.storage.estimate().catch(() => null);
      if(q && q.quota && q.quota - (q.usage || 0) < need.room) return fin(`No cabe: hacen falta unos ${offMB(need.room)} MB y quedan ${offMB(q.quota - (q.usage || 0))} MB libres.`, false);
    }
    /* guarda una url; skip: si ya está, no la vuelve a pedir (imágenes y audios) */
    const one = async (u, c, skip, json) => {
      if(sig.aborted) throw new DOMException("cancelada", "AbortError");
      let out = null;
      if(skip && await c.match(u)){ job.done++; paintOff(); return null; }
      try{
        const r = await fetch(u, {signal:sig, cache:"no-store"});
        if(r.status !== 200) throw new Error("HTTP " + r.status);
        if(json) out = await r.clone().json();
        await c.put(u, r);
        job.net = 0;
        job.bytes += +r.headers.get("content-length") || (OFF_MEDIA_RE.test(u) ? 8192 : 4096);
      }catch(e){
        if(e.name === "AbortError" || e.name === "QuotaExceededError") throw e;
        job.fails++; if(job.failed.length < 5) job.failed.push(u);
        /* fallo de red (no un 404): si se repite, es que no hay conexión y no tiene sentido seguir */
        if(e instanceof TypeError && ++job.net >= OFF_NET_FAILS){ const n = new Error(OFFLINE); n.name = "NetworkError"; throw n; }
      }
      job.done++; paintOff();
      return out;
    };
    const pool = async (list, fn) => {
      let i = 0;
      const worker = async () => { while(i < list.length) await fn(list[i++]); };
      await Promise.all(Array.from({length:Math.min(6, list.length)}, worker));
    };
    /* 1) la app y los documentos (de ellos salen los dibujos); 2) dibujos, personajes y audios */
    const docs = idx.map(d => `data/${d.id}.json`);
    const first = [...OFF_APP.map(u => [u, shell]), ...docs.map(u => [u, media]),
      ...["en", "fr", "da"].map(g => [`data/grammar_${g}.json`, media]), ...(ab ? [[`audio/${ab}.json`, media]] : [])];
    const imgs = new Set();
    let sprites = {};
    job.total = first.length + 200 + ids.length;      /* se ajusta al saber cuántos dibujos hay */
    await pool(first, async ([u, c]) => {
      const j = await one(u, c, false, docs.includes(u) || u === "data/sprites.json");
      if(j && u === "data/sprites.json") sprites = j;

    if(window.vocabShop) vocabShop.images().forEach(u => imgs.add(u));   /* los dibujos de la tienda (img/shop) */
    if(window.vocabGames && vocabGames.images) vocabGames.images().forEach(u => imgs.add(u));   /* los de Juegos (img/games y temas) */
    if(window.vocabSeason && vocabSeason.images) (await vocabSeason.images()).forEach(u => imgs.add(u));   /* los de las temporadas (img/season) */
    if(window.vocabMailbox && vocabMailbox.images) vocabMailbox.images().forEach(u => imgs.add(u));   /* los del Buzón del tío */
    const second = [...[...imgs].map(u => [u, media]), ...ids.map(id => [`audio/${ab}/${id}.mp3`, media])];
    job.total = first.length + second.length;
    await pool(second, ([u, c]) => one(u, c, true, false));
    if(job.fails){
      fin(`Casi: ${job.fails} de ${job.total} archivos no se pudieron guardar. Vuelve a intentarlo con buena conexión.`, false);
    } else {
      store.set("offline", true);
      fin(`✓ Listo: ${job.total} archivos guardados, con los audios del ${LANGS[l].name}. Ya puedes usarla sin internet.`, true);
    }
  }catch(e){
    if(!sig.aborted) job.ctrl.abort();                /* para a las demás descargas */
    if(e.name === "AbortError") fin("Descarga parada. Lo que ya se guardó se queda; puedes seguir cuando quieras.", false);
    else if(e.name === "NetworkError") fin(OFFLINE, false);
    else if(e.name === "QuotaExceededError") fin("No cabe en este dispositivo: libera espacio y vuelve a intentarlo.", false);
    else fin("No se pudo descargar todo: " + e.message, false);
  }
}

     1) «¡Tienes carta!» (mail, js/mailbox.js): una carta sin abrir o un candado recién abierto; llega pocas veces y es
        de alguien de casa; 2) un animal que se fue al refugio por hambre (granja, js/farm.js): espera a que lo traigan;
     3) la temporada (season, js/season.js): pocas semanas al año y la única entrada a #/temporada; 4) «Guarda tu

     con candado aún cerrada y cómo va (mail-lock, js/mailbox.js): dura pocos días; 6) «La frase de la cena» (phrase,

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* hablar: Chrome, Edge y Safari reconocen la voz; en la app instalada del iPhone o iPad no va bien, así que allí no se
   ofrece el micrófono. Sin micrófono todo se puede hacer tocando. */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const iosPWA = () => IOS && (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches);
function canListen(){ return !!SR && !iosPWA(); }

/* micrófono: devuelve las transcripciones posibles */
/* escucha una vez (como mucho ms, 7 s por defecto) y nunca se queda colgado ni falla:
   resuelve {status, alts} con status "ok" | "timeout" | "no-speech" | "denied" | "unsupported" | "unavailable" | "busy" |
   "error" (con error: el código del reconocedor) */
let recNow = null;
/* corta la escucha en curso (al acertar, al cerrar el globo o al salir de la pantalla): listen() acaba en "aborted" y el
   micrófono se apaga enseguida, así otra pantalla puede escuchar sin recibir "busy" */
function stopListen(){ try{ if(recNow && recNow._stop) recNow._stop(); }catch(e){} }
function listen(opts){
  const ms = (opts && opts.ms) || 7000;
  return new Promise(res => {
    if(!canListen()) return res({status:"unsupported", alts:[]});
    if(recNow) return res({status:"busy", alts:[]});
    let rec = null, fin = false, alts = null, timer = 0;
    const done = (status, error) => {
      if(fin) return; fin = true; clearTimeout(timer);
      if(recNow === rec) recNow = null;
      res(error ? {status, alts:alts || [], error} : {status, alts:alts || []});
    };
    try{ rec = new SR(); }catch(e){ return done("unsupported"); }
    rec.lang = (opts && opts.lang) || LANGS[lang].code; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
    rec.onresult = e => { alts = [...e.results[0]].map(a => a.transcript); done("ok"); try{ rec.stop(); }catch(_){} };
    rec.onerror = e => {
      const c = e.error || "error";
      /* sin internet (el reconocedor de Chrome lo necesita), sin micrófono o sin ese idioma: "unavailable" (no es culpa
         del niño y no sirve repetir); el código de verdad va en error */
      done(c === "not-allowed" || c === "service-not-allowed" ? "denied" : c === "no-speech" ? "no-speech"
        : c === "network" || c === "audio-capture" || c === "language-not-supported" ? "unavailable" : "error", c);
    };
    rec.onend = () => done(alts ? "ok" : "no-speech");
    timer = setTimeout(() => { done("timeout"); try{ rec.abort(); }catch(_){} }, ms);
    rec._stop = () => { done("aborted"); try{ rec.abort(); }catch(_){} };
    recNow = rec;
    try{ rec.start(); }catch(e){ done("busy", String(e && e.name || e)); }
  });
}

/* aviso corto en la cápsula de arriba (M.toast); un emoji al principio del texto pasa a ser su icono (🪙 = la moneda) */
const LEAD_EMOJI = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}]|\p{Regional_Indicator})*)\s*/u;
function toast(t, icon){
  t = String(t ?? "").trim(); if(!t || !window.M) return;
  if(!icon){ const m = LEAD_EMOJI.exec(t); if(m && m[0].length < t.length){ icon = m[1]; t = t.slice(m[0].length); } }
  M.toast(t, icon ? {icon: icon === "🪙" ? "coin" : icon} : {});
}

/* la palabra que se aprende nunca se parte a media palabra («grandmothe / r», «grand-daughter»): el elemento (la palabra
   de la lección, del repaso o de Tarjetas) queda con [data-fit] (sin partir ni guiones) y, si no cabe, baja de 2 en 2 px
   hasta min (28 px). Solo si ni así cabe, se parte (.is-break). Se vuelve a medir al cambiar el tamaño de la ventana o al
   cargar la letra. Las frases se parten por los espacios, como siempre. */
const FIT = new Set();
function fitWord(el, min){
  if(!el || !el.isConnected) return;
  min = +min || +el.dataset.fit || 28;
  el.dataset.fit = String(min); el.classList.remove("is-break"); el.style.fontSize = "";
  FIT.add(el);
  const over = () => el.scrollWidth > el.clientWidth + 1;
  let fs = parseFloat(getComputedStyle(el).fontSize) || 44;
  while(over() && fs > min){ fs = Math.max(min, fs - 2); el.style.fontSize = fs + "px"; }
  if(over()) el.classList.add("is-break");
}
let fitRaf = 0;
function refitWords(){
  if(fitRaf) return;
  fitRaf = requestAnimationFrame(() => { fitRaf = 0; for(const el of [...FIT]){ if(el.isConnected) fitWord(el); else FIT.delete(el); } });
}
addEventListener("resize", refitWords);

const gId = (lv, k) => `G-${lv}-${String(k+1).padStart(2,"0")}`;
function lvUnits(lv){                     /* unidades del nivel con las lecciones de gramática intercaladas */
  const g = (GRAM[lang] || {})[lv] || [], N = MAP[lv].reduce((a, u) => a + u.ls.length, 0);
  const at = g.map((_, k) => Math.max(1, Math.round((k + 0.5) * N / g.length)));

    return out;

}

function award(n, why, quiet, from){
  const g = game(); const day = dayKey(new Date());
  if(g.day !== day){ g.day = day; g.coins += 10; g.earned += 10; if(!quiet) setTimeout(() => toast("¡Regalo del día! +10", "coin"), 2000); }
  g.coins += n; g.earned += n;
  const fly = !!(n > 0 && !quiet && from && window.M && typeof M.coins === "function");
  if(fly) coinHold++;
  gameSet(g);
  if(n && !quiet){
    if(fly){
      let done = false;
      const land = () => { if(done) return; done = true; coinHold = Math.max(0, coinHold - 1); paintCoins({quiet: true}); };
      Promise.resolve(M.coins(n, from, why)).then(land, land);
      setTimeout(land, 2500);
    } else toast(why ? `${why} +${n}` : `+${n}`, "coin");

}

/* ---------- «Reducir movimiento» de Ajustes (html[data-motion=calm]) = el del aparato ----------
   Las reglas de cada hoja de estilos para @media (prefers-reduced-motion: reduce) se copian con :root[data-motion=calm]
   delante en <style id="css-calm">: las de esta página y las que inyectan los módulos (se vuelve a copiar cuando entra
   un <style> nuevo en el <head>). La regla general (≤150 ms y sin bucles) está en el CSS de arriba. */
function calmCss(){
  const PRE = ":root[data-motion=calm]", RMQ = /prefers-reduced-motion\s*:\s*reduce/;
  const split = sel => { const out = []; let d = 0, cur = ""; for(const ch of sel){ if(ch === "(" || ch === "[") d++; else if(ch === ")" || ch === "]") d--; if(ch === "," && !d){ out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(x => x.trim()).filter(Boolean); };
  const pre = sel => split(sel).map(x => { const m = /^(?::root|html)(?![\w-])/.exec(x); return m ? PRE + x.slice(m[0].length) : `${PRE} ${x}`; }).join(",");
  const head = r => r.cssText.slice(0, r.cssText.indexOf("{")).trim();
  const copy = list => { let o = ""; for(const r of list){ if(r.selectorText !== undefined && r.style) o += `${pre(r.selectorText)}{${r.style.cssText}}`; else if(r.cssRules) o += `${head(r)}{${copy(r.cssRules)}}`; else o += r.cssText; } return o; };
  const walk = list => { let o = ""; for(const r of list){
    if(r.media && r.cssRules && RMQ.test(r.media.mediaText)) o += copy(r.cssRules);
    else if(r.cssRules && r.selectorText === undefined && !/^@(-webkit-)?keyframes/i.test(r.cssText)){ const i = walk(r.cssRules); if(i) o += `${head(r)}{${i}}`; }
  } return o; };
  let css = "";
  for(const sh of document.styleSheets){
    if(sh.ownerNode && sh.ownerNode.id === "css-calm") continue;
    let rules = null; try{ rules = sh.cssRules; }catch(e){}
    if(rules) try{ css += walk(rules); }catch(e){ console.warn("[calm]", e); }
  }
  let el = document.getElementById("css-calm");
  if(!el){ el = document.createElement("style"); el.id = "css-calm"; document.head.appendChild(el); }
  if(el.textContent !== css) el.textContent = css;
}
{ let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(calmCss, 30); }).observe(document.head, {childList: true}); }

/* ---------- rutas ---------- */
/* las rutas que existen: las de aquí y las de los módulos (ROUTES). Una que no existe (un enlace viejo o mal escrito)
   se cambia por Hoy en el historial, y así la pestaña, el título y el modo foco son los de Hoy */
const KNOWN = ["", "leccion"];   /* #/repaso: ROUTES.repaso (js/review.js); #/granja: js/farm.js; #/mapa, #/palabras, #/doc y #/gramatica: js/learn.js; #/progreso y #/mizorro: js/rewards.js */
const knownRoute = hp => KNOWN.includes(secOf(hp)) || Object.prototype.hasOwnProperty.call(ROUTES, secOf(hp));
let prevHp = null, mapScrolled = false;
async function route(){
  if(window.vocabLesson && vocabLesson.blocks(hashPath())) return;   /* lección a medias: «¿Paramos aquí?» (js/lesson.js) */
  if(!knownRoute(hashPath())){ location.replace("#/"); return; }
  autoTok++; if("speechSynthesis" in window) speechSynthesis.cancel();
  const h = location.hash.replace(/^#\/?/,""), hp = hashPath(), from = prevHp; prevHp = hp;
  /* la pestaña se marca al momento (cambiar de pestaña es instantáneo); el título, los segmentos y el modo foco, con la
     pantalla nueva. Si se vuelve a una pestaña, su scroll de antes (tabRestore lo pone goTab); con Atrás o Adelante (o
     al recargar), el de esa entrada del historial; si es una pantalla nueva, arriba del todo. */
  const ek = entryKey(); curVk = ek.vk;
  let restoreY = tabRestore; tabRestore = null;
  if(restoreY == null && ek.seen && POSY[ek.vk] > 0) restoreY = POSY[ek.vk];
  ROUTE_RESTORE = restoreY != null; ROUTE_FROM = from; mapScrolled = false;
  langMenu(false); paintTabs(hp);
  const t = tabOf(hp); if(t){ TABMEM[t.id] = {h: memHash(hp), y: restoreY || 0}; memSave(); }
  try{
    await getShop();
    /* las partes de la ruta, sin el ?query (#/temporada/cosas?season=halloween → ["cosas"]) */
    if(hp.startsWith("leccion/")) await leccion(hp.slice(8));
    else if(ROUTES[secOf(hp)]){ document.onkeydown = null; await ROUTES[secOf(hp)](hp.split("/").slice(1)); }
    else await home();
  }catch(e){ console.error(e); $("#app").innerHTML = `<p class="empty">No se pudo cargar. ${esc(e.message)}</p>`; }
  /* si mientras se pintaba se fue a otra ruta, la nueva se encarga de las barras y del scroll */
  if(hashPath() === hp){
    paintTabs(hp); updFocus(); paintHead(hp); sayScreen(hp); fmPast();
    if(restoreY != null) restoreScroll(restoreY); else if(!mapScrolled) window.scrollTo(0,0);
    if(!focusOn) plainHash = "#/" + hp;
  }
  ROUTE_RESTORE = false;
  bus.emit("route", {h});
}
window.addEventListener("hashchange", route);
