<meta name="description" content="Vocabulario en inglés británico, francés y danés con imagen, pronunciación, IPA, ejemplos y audio.">
<script>
/* tema: «light» o «dark» guardados en "theme"; sin clave (o con otro valor) = Automático, sigue al sistema */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem("theme"))}catch(e){}
if(t!=="light"&&t!=="dark")t=null;
document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();
/* Ajustes › Accesibilidad ("vocab:ui", solo de este aparato; js/settings.js): se ponen antes de pintar */
(function(){var u=null;try{u=JSON.parse(localStorage.getItem("vocab:ui"))}catch(e){}
if(!u||typeof u!=="object")return;var d=document.documentElement.dataset;
if(u.glass==="off")d.glass="off";if(u.motion==="calm")d.motion="calm";if(u.contrast==="more")d.contrast="more";if(u.text==="large")d.text="large";})();
</script>

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
/* ===================== Cimientos (rediseño F1) =====================
   Tokens en :root (claro) y :root[data-theme=dark] (el script del <head> resuelve el tema: «Automático» = sin clave).
   Material: .glass (vidrio flotante con desenfoque de verdad; usa ::before para el borde) · .glass-btn (vidrio sobre
   contenido, sin desenfoque; ::before borde, ::after brillo desde --mx/--my con .is-pressed) · .btn-fill (cápsula
   sólida) · .ok-fill / .miss-fill (acierto / fallo gris) · .card (contenido sólido) · .ico (sprite Phosphor) · kbd.
   Interruptores en <html>: data-glass="off|lite" · data-contrast="more" · data-text="large".
   Texto: usa los --fs-* (ya respetan el tamaño de texto del sistema en iOS). */
/* letra redondeada donde no hay SF Pro Rounded (Android, Windows, Linux): Nunito, licencia OFL (fonts/OFL.txt) */
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:light;
  /* superficies y texto (label2 a .76 y no .6: así el texto secundario pasa 4,5:1 sobre #F2F2F7) */
  --bg:#F2F2F7;--card:#FFFFFF;--card-2:#F2F2F7;--card-hi:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.76);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.12);
  /* marca: --brand-fill (fondo con texto blanco) · --brand-tint (iconos y texto sobre blanco) ·
     --brand-ink (texto azul que puede caer sobre el fondo gris o sobre vidrio) */
  --brand-fill:#1E6EF4;--brand-tint:#1E6EF4;--brand-ink:#185CCF;--brand-soft:rgba(30,110,244,.12);
  /* estados: acierto verde, fallo GRIS (nunca rojo) */
  --ok:#34C759;--ok-fill:#008932;--ok-ink:#007F2E;--ok-soft:rgba(52,199,89,.16);
  --miss:#8E8E93;--miss-ink:#6C6C70;--miss-fill:rgba(120,120,128,.22);--miss-on:#48484A;
  /* monedas, marca y adorno de progreso (texto oro #946200 y no #A16A00: el de la especificación da 4,1:1 sobre el fondo
     #F2F2F7; este pasa 4,5:1 también ahí y sobre el vidrio claro) */
  --gold:#FFCC00;--gold-ink:#946200;--gold-soft:rgba(255,204,0,.22);--gold-deep:#B38F00;--gold-on:#3D2B00;
  --navy:#0B2545;--teal:#008198;
  /* vidrio flotante */
  --g-tint:rgba(255,255,255,.62);--g-top:rgba(255,255,255,.5);--g-solid:#FFFFFF;
  --g-rim1:rgba(255,255,255,1);--g-rim2:rgba(255,255,255,.16);--g-edge:rgba(0,0,0,.07);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.95);--g-shadow:0 10px 30px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.06);
  /* vidrio sobre contenido (botones) */
  --neu:#E9E9EE;--neu-ink:#000000;--hb-shadow:0 4px 12px -4px rgba(30,110,244,.45);
  /* tipografía (rem; --k corrige la base de 17 px del texto de sistema en iOS y sube con «Texto más grande») */
  --k:1;
  --f-text:system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Inter",Roboto,"Segoe UI",sans-serif;
  /* los títulos y la palabra suben con el texto del sistema, pero con tope (como los títulos grandes de iOS): así una
     palabra larga o el texto enorme de accesibilidad no se salen de la tarjeta; el texto normal sube sin tope */
  --fs-lt:min(calc(2.25rem*var(--k)),48px);--fs-t1:min(calc(1.875rem*var(--k)),40px);
  --fs-t2:min(calc(1.5rem*var(--k)),34px);--fs-t3:min(calc(1.375rem*var(--k)),30px);
  --fs-head:calc(1.1875rem*var(--k));--fs-body:calc(1.1875rem*var(--k));--fs-sub:calc(1.0625rem*var(--k));
  --fs-note:calc(.9375rem*var(--k));--fs-min:calc(.8125rem*var(--k));--fs-tab:calc(.75rem*var(--k));
  --fs-word:min(calc(2.75rem*var(--k)),56px,13vw);
  /* medidas */
  --r-card:24px;--r-sheet:32px;--r-menu:20px;--r-pill:999px;--r-md:16px;--r-sm:12px;
  --tap:44px;--tap-bar:48px;--row:52px;--btn-main:56px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--gutter:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --z-bar:10;--z-acc:11;--z-sheet:20;--z-toast:30;
  /* nombres de antes (los usan las pantallas y los módulos js/*.js hasta que se rehagan) */
  --ink:var(--label);--muted:var(--label2);--line:var(--fill);--soft:var(--fill2);--cat:var(--fill2);
  --brand:var(--brand-ink);--brand-2:var(--label2);--bad:var(--miss-ink);
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--card-2:#2C2C2E;--card-hi:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.32);--fill2:rgba(120,120,128,.24);
  --brand-tint:#0091FF;--brand-ink:#409CFF;--brand-soft:rgba(0,145,255,.18);
  --ok:#30D158;--ok-ink:#30D158;--ok-soft:rgba(48,209,88,.18);
  --miss-ink:#AEAEB2;--miss-fill:rgba(120,120,128,.36);--miss-on:rgba(235,235,245,.7);
  --gold:#FFD600;--gold-ink:#FFD600;--gold-soft:rgba(255,214,0,.16);--gold-deep:#A68B00;--gold-on:#1C1C1E;
  --teal:#00D2E0;
  --g-tint:rgba(28,28,30,.62);--g-top:rgba(255,255,255,.10);--g-solid:#2C2C2E;
  --g-rim1:rgba(255,255,255,.5);--g-rim2:rgba(255,255,255,.12);--g-edge:rgba(0,0,0,.6);
  --g-hi:inset 0 1px 0 rgba(255,255,255,.22);--g-shadow:0 10px 30px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --neu:#3A3A3C;--neu-ink:#FFFFFF;--hb-shadow:0 6px 16px -6px rgba(0,0,0,.7);
  --shadow:none;
}
/* iOS: el tamaño de texto del sistema (Dynamic Type) fija la base; en el Mac (13 px) no se aplica */
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html{font:-apple-system-body}:root{--k:.9412}}
html[data-text=large]{--k:1.18}
@supports (-webkit-touch-callout:none) and (font:-apple-system-body){html[data-text=large]{--k:1.11}}
/* fuera de iOS, «Texto más grande» sube la base (118 %): crecen los --fs-* y también las pantallas que aún usan rem sueltos */
@supports not ((-webkit-touch-callout:none) and (font:-apple-system-body)){html[data-text=large]{font-size:118%;--k:1}}
@media (min-width:744px){:root{--gutter:24px}}
/* más contraste (sistema o Ajustes): texto secundario y separadores más fuertes */
@media (prefers-contrast:more){
  :root{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
  :root[data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}}
:root[data-contrast=more]{--label2:rgba(60,60,67,.92);--sep:rgba(60,60,67,.6);--fill:rgba(120,120,128,.26);--miss-ink:#545458}
:root[data-contrast=more][data-theme=dark]{--label2:rgba(235,235,245,.85);--sep:rgba(235,235,245,.5);--miss-ink:#C7C7CC}
/* en oscuro, los dibujos (hechos para fondo claro) van sobre una ficha gris claro con esquinas, como una pegatina */
[data-theme=dark] .img img{background:#F2F2F7;border-radius:var(--r-md);padding:6px}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 var(--fs-sub)/1.4 var(--f-text);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}

/* ---------- tipografía (escala grande de iOS) ---------- */
.t-lt{font:700 var(--fs-lt)/1.2 var(--f-round);letter-spacing:.005em}
.t-1{font:700 var(--fs-t1)/1.2 var(--f-round)}
.t-2{font:700 var(--fs-t2)/1.2 var(--f-round)}
.t-3{font:700 var(--fs-t3)/1.22 var(--f-round)}
.t-head{font:600 var(--fs-head)/1.26 var(--f-text)}
.t-body{font:400 var(--fs-body)/1.3 var(--f-text)}
.t-sub{font:400 var(--fs-sub)/1.3 var(--f-text);color:var(--label2)}
.t-note{font:400 var(--fs-note)/1.33 var(--f-text);color:var(--label2)}
.t-min{font:400 var(--fs-min)/1.38 var(--f-text);color:var(--label2)}
.t-tab{font:600 var(--fs-tab)/1.17 var(--f-text)}
.t-word{font:700 var(--fs-word)/1.18 var(--f-round);overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;text-wrap:balance}   /* con lang="en-GB|fr|da" en el elemento */
.t-num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- iconos (sprite Phosphor al principio del <body>; ico(nombre, estilo, tamaño)) ---------- */
.ico{display:inline-block;flex:none;fill:currentColor;vertical-align:middle;overflow:visible;pointer-events:none}

/* ---------- utilidades de estado: acierto en verde lleno, fallo en gris (nunca rojo) ---------- */
.ok-fill{background:var(--ok-fill)!important;color:#fff!important;border-color:transparent!important}
.miss-fill{background:var(--miss-fill)!important;color:var(--miss-on)!important;border-color:transparent!important}
.ok-ink{color:var(--ok-ink)}
.miss-ink{color:var(--miss-ink)}

/* ---------- contenido sólido ---------- */
.card{background:var(--card);color:var(--label);border-radius:var(--r-card)}

/* ---------- vidrio flotante (barras, hojas, menús, avisos): desenfoque con valores literales ---------- */
:where(.glass:not(dialog):not([popover])){position:relative}
.glass{color:var(--label);
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-tint);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:var(--g-hi),0 0 0 .5px var(--g-edge),var(--g-shadow)}
.glass::before,.glass-btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,var(--g-rim1) 0%,var(--g-rim2) 28%,rgba(255,255,255,.04) 55%,var(--g-rim2) 78%,var(--g-rim1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* versión ligera (sin desenfoque, más opaca): granja, juegos, o html[data-glass=lite]. Con :where() pesa lo mismo que
   .glass, así los modos de abajo (sin transparencia, más contraste, data-glass=off) la pisan siempre por orden */
.glass:where(.lite),:where(:root[data-glass=lite]) .glass{-webkit-backdrop-filter:none;backdrop-filter:none;
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite,rgba(255,255,255,.9))}
:where(:root[data-theme=dark]) .glass:where(.lite),:where(:root[data-theme=dark][data-glass=lite]) .glass{
  background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),var(--g-lite-d,rgba(28,28,30,.9))}

/* ---------- vidrio sobre contenido: botones de acción (sin desenfoque, tinte opaco) ---------- */
.glass-btn{--g-rim1:rgba(255,255,255,.75);--g-rim2:rgba(255,255,255,.12);
  position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;max-width:100%;min-width:0;padding:0 22px;border:0;border-radius:var(--r-pill);white-space:nowrap;
  font:600 var(--fs-head)/1.15 var(--f-text);letter-spacing:-.01em;text-align:center;text-decoration:none;color:var(--neu-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 50%),var(--neu);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.05);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.glass-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);
  transition:opacity var(--d-fast,160ms) ease}
.glass-btn.is-pressed::after{opacity:1}
.glass-btn--pri{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 40%),var(--brand-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.10),var(--hb-shadow)}
.glass-btn--ok{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 50%),var(--ok-fill);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.10),0 6px 16px -6px rgba(0,137,50,.6)}
:root[data-theme=dark] .glass-btn{--g-rim1:rgba(255,255,255,.45);--g-rim2:rgba(255,255,255,.08)}
:root[data-theme=dark] .glass-btn:not(.glass-btn--pri):not(.glass-btn--ok){
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 50%),var(--neu);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.glass-btn--lg{min-height:var(--btn-main);padding:0 28px}
.glass-btn--sm{min-height:var(--tap);padding:0 14px;gap:4px;font-size:var(--fs-sub)}
.glass-btn--icon{width:var(--tap);min-height:var(--tap);padding:0;flex:none}
.glass-btn--block{display:flex;width:100%}
.glass-btn:disabled,.glass-btn[aria-disabled=true]{opacity:.45;cursor:default}
.glass-btn:focus-visible,.btn-fill:focus-visible,.glass :focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
/* foco de teclado: el mismo anillo azul en toda la app (no el del navegador, que en algunos sale naranja o dorado) */
:focus-visible{outline:3px solid var(--brand-tint);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* ---------- cápsula sólida (filas, tienda, listas) ---------- */
.btn-fill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);max-width:100%;min-width:0;padding:0 18px;border:0;white-space:nowrap;
  border-radius:var(--r-pill);font:600 var(--fs-sub)/1.15 var(--f-text);text-decoration:none;color:#fff;background:var(--brand-fill);
  cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.btn-fill--neu{background:var(--fill);color:var(--label)}
.btn-fill--ok{background:var(--ok-fill);color:#fff}
.btn-fill--gold{background:var(--gold);color:var(--gold-on)}
.btn-fill:disabled,.btn-fill[aria-disabled=true]{background:var(--fill2);color:var(--label3);cursor:default}

/* ---------- teclas (etiquetas grises que salen tras la primera tecla) ---------- */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .45em;border-radius:7px;
  font:600 var(--fs-min)/1 var(--f-text);color:var(--label2);background:var(--fill);box-shadow:inset 0 -1px 0 var(--sep);
  vertical-align:middle;white-space:nowrap}

/* ---------- si el aparato no puede o el niño lo necesita ---------- */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(255,255,255,.95)}
  :root[data-theme=dark] .glass{background:linear-gradient(180deg,var(--g-top) 0%,rgba(255,255,255,0) 52%),rgba(28,28,30,.95)}}
:root[data-glass=off] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}
@media (prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}}
@media (prefers-contrast:more){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
  .glass::before,.glass-btn::before{display:none}
  .glass-btn{border:2px solid var(--sep)}}
:root[data-contrast=more] .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid);border:2px solid var(--sep)}
:root[data-contrast=more] .glass::before,:root[data-contrast=more] .glass-btn::before{display:none}
:root[data-contrast=more] .glass-btn{border:2px solid var(--sep)}
@media (forced-colors:active){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas;color:CanvasText;border:1px solid CanvasText;box-shadow:none}
  .glass-btn,.btn-fill{border:2px solid ButtonText;background:ButtonFace;color:ButtonText;box-shadow:none}
  .glass::before,.glass-btn::before,.glass-btn::after{display:none}
  .ico{fill:currentColor;forced-color-adjust:auto}}
/* ===================== Armazón de navegación (F2) =====================
   · Barra superior header.topbar: a la izquierda la bandera del idioma (#lang-b, abre el menú #lang-m); a la derecha
     [data-sync-slot] (sync.js monta ahí su pastilla) y el grupo de vidrio .tb-group con las monedas ([data-coins-pill],
     el número en #coins) y Ajustes ([data-open=ajustes] → window.openSettings()).
   · Barra de pestañas nav.tabbar (role=tablist): 5 a.tab[data-nav] con icono relleno de 26 px y nombre de 12/600; la
     activa con aria-selected=true, en azul y con la «gota» de vidrio. Abajo en el móvil; desde 820 px, arriba y centrada.
     No se encoge. Insignias .tb-badge (número azul o punto).
   · #tabhead: título grande y segmentos (.seg, role=tablist) de la pestaña, solo en su raíz.
   · Modo foco html[data-focus] (lección, repaso en marcha, partida): sin barras; .focusbar con la ✕ y el contador de
     monedas [data-coin-target]. html[data-tab] y html[data-sec] dicen la pestaña y la sección actuales. */
:root{--bar-top:calc(var(--safe-t) + 8px);--topbar-h:calc(var(--safe-t) + 60px);--tabbar-h:62px;--tabbar-b:max(12px,var(--safe-b));

@media (min-width:820px){

}
/* «Reducir movimiento»: el del aparato y el de Ajustes (html[data-motion=calm]) hacen lo mismo. Aquí, para todo:
   animaciones y transiciones cortas (≤150 ms) y sin bucles; las reglas propias de cada pantalla y módulo para el
   aparato se copian para data-motion=calm en <style id="css-calm"> (calmCss() más abajo). */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:150ms!important;animation-delay:0s!important;
  animation-iteration-count:1!important;transition-duration:150ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
:root[data-motion=calm] *,:root[data-motion=calm] *::before,:root[data-motion=calm] *::after{animation-duration:150ms!important;
  animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:150ms!important;transition-delay:0s!important;
  scroll-behavior:auto!important}

.lv-bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.lv-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.path{display:flex;flex-direction:column;align-items:center;padding:6px 0 40px}
.unit{width:min(100%,560px);display:flex;align-items:center;gap:10px;margin:26px 0 54px;color:var(--muted);font-weight:700;font-size:.9rem}
.unit::before,.unit::after{content:"";flex:1;height:2px;background:var(--line)}
.unit a{text-decoration:none;white-space:nowrap}
.unit a:hover{text-decoration:underline}
.nd{position:relative;margin:0 0 30px;transform:translateX(var(--x))}
.node{width:74px;height:68px;border-radius:50%;border:0;background:var(--lc);color:#fff;font-size:1.65rem;font-weight:800;box-shadow:0 7px 0 color-mix(in srgb,var(--lc) 60%,#000);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--lc) 60%,#000)}
.node.lock{background:#cdd2db;color:#8a93a3;box-shadow:0 7px 0 #a8b0bd}
.node.cur{outline:6px solid color-mix(in srgb,var(--lc) 28%,transparent);outline-offset:4px}
.node.trophy{width:92px;height:84px;font-size:2.3rem;background:var(--gold);box-shadow:0 7px 0 var(--gold-deep)}
.node.trophy.lock{background:#cdd2db;box-shadow:0 7px 0 #a8b0bd;filter:grayscale(1)}
.nd .stars{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:.8rem;letter-spacing:1px;color:var(--gold-ink);white-space:nowrap}
.nd .stars .e{color:var(--line)}
.nd.hb{margin-top:48px}
.bubble{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);background:var(--card);color:var(--lc);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.85rem;white-space:nowrap;animation:bob 1.4s ease-in-out 3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:8px solid transparent;border-top-color:var(--card);transform:translateX(-50%)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
/* lección */
.ls{width:min(100%,560px);margin:0 auto}
.ls-top{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.ls-top .x{border:0;background:none;font-size:1.5rem;color:var(--muted);padding:0 4px;text-decoration:none}
.ls-prog{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.ls-prog i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.ls-card{background:var(--card);border:1px solid transparent;border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px;text-align:center;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ls-card .img img{max-width:200px;max-height:150px}
.ls-card .tag{font-size:.78rem;font-weight:700;color:var(--lc);text-transform:uppercase;letter-spacing:.06em}
.ls-card .es{color:var(--muted);font-size:1.05rem}
.ls-card .big{font-size:1.9rem;font-weight:800;margin:4px 0}
.ls-card .q{font-size:1.3rem;font-weight:700}
.ls-card .opts{width:100%}
.ls-card .opt{color:var(--ink)}
.ls-foot{margin-top:16px;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ls-foot.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok-ink)}
.ls-foot.bad{background:var(--card);color:var(--miss-ink)}
.ls-foot .msg{flex:1;font-weight:700}.ls-foot .msg small{display:block;font-weight:400;color:var(--ink)}
/* el botón principal es siempre azul (un solo color para lo que se toca); --lc queda para cabeceras y adornos del nivel o juego */
.btn.lc{background:var(--brand-fill);border-color:transparent;color:#fff;font-weight:700;padding:11px 22px;box-shadow:0 4px 0 color-mix(in srgb,var(--brand-fill) 60%,#000)}
.ls-end .big-stars{font-size:2.6rem;color:var(--gold);-webkit-text-stroke:1px var(--gold-deep);letter-spacing:4px}.ls-end .big-stars .e{color:var(--line)}
[data-theme=dark] .node.lock,[data-theme=dark] .node.trophy.lock{background:#333a4a;color:#6f7889;box-shadow:0 7px 0 #222836}
@media (max-width:560px){.nd{transform:translateX(calc(var(--x) * .7))}.lv-tab{min-width:0;flex:1 1 28%}}
/* gramática */
.node.gram{border-radius:22px;background:color-mix(in srgb,var(--lc) 78%,#0b2545);font-size:1.5rem}
.nd .glbl{position:absolute;top:50%;transform:translateY(-50%);width:150px;font-size:.78rem;font-weight:700;color:color-mix(in srgb,var(--lc) 85%,#000);line-height:1.25}
.nd .glbl.r{left:calc(100% + 12px)}.nd .glbl.l{right:calc(100% + 12px);text-align:right}
.nd .glbl small{display:block;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.66rem;letter-spacing:.05em}
.g-card{text-align:left;align-items:stretch;justify-content:flex-start}
.g-card .tag,.g-card .big,.g-card>.es{text-align:center}
.g-body,.g-item{text-align:left}
.g-rule{margin:12px 0 0}
.g-rule h3,.g-ex h3{font-size:1rem;margin:0 0 4px;color:var(--lc)}
.g-rule p{margin:0}
.g-tab{border-collapse:collapse;margin:8px 0 0;font-size:.92rem}
.g-tab td{border:1px solid var(--line);padding:4px 10px}
.g-tab tr:first-child td{background:var(--soft)}
.g-ex{margin-top:14px}
.g-ex .ex{text-align:left}
.g-sent{font-size:1.35rem;font-weight:600;line-height:1.5;margin:8px 0}
.g-gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);color:var(--muted);padding:0 4px}
.g-gap.ok{color:var(--ok-ink);border-color:var(--ok)}.g-gap.bad{color:var(--bad);border-color:var(--bad)}
.ls-foot .msg small+small{color:var(--muted)}
.g-item{padding:0;margin-bottom:10px}
.g-item summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.g-item summary::-webkit-details-marker{display:none}
.g-item summary small{display:block;color:var(--muted);font-size:.85rem}
.g-item[open] summary{border-bottom:1px solid var(--line)}
.g-item>:not(summary){margin-left:16px;margin-right:16px}
.g-item>p:last-child{padding-bottom:14px}
.g-n{flex:none;width:32px;height:32px;border-radius:10px;background:var(--lc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.g-ok{margin-left:auto;color:var(--gold-ink);white-space:nowrap}.g-ok .e{color:var(--line)}
.lv-links{text-align:center;margin:12px 0 0}
.lv-links a{color:var(--lc);font-weight:700;text-decoration:none}
@media (max-width:560px){.nd .glbl{width:110px}.ls-foot .msg{flex-basis:100%}.ls-foot .btn.lc{margin-left:auto}}
.hero{position:relative;display:inline-block;width:1.3em;height:1.25em;line-height:1;flex:none}
.hero span{position:absolute;line-height:1}
.hero .h-base{left:.15em;top:.2em;font-size:1em}
.hero .h-hat{left:.37em;top:-.12em;font-size:.55em;transform:rotate(-8deg)}
.hero .h-face{left:.42em;top:.42em;font-size:.45em}
.hero .h-hand{right:-.18em;bottom:-.02em;font-size:.42em;transform:rotate(12deg)}
.hero .h-pet{left:-.22em;bottom:-.04em;font-size:.4em}
/* personajes y animales de cuerpo entero (img/pj): caja fija parecida a la del emoji para no mover nada */
.pj{display:inline-block;width:1.3em;height:1.1em;object-fit:contain;object-position:50% 100%;vertical-align:-.18em;-webkit-user-drag:none;user-select:none}
.pj.pj-sm{width:1.25em;height:1.05em;vertical-align:-.25em}
.hero.pjh .h-base{left:0;top:0;width:100%;height:100%;font-size:1em}
.hero.pjh .h-base .pj{display:block;width:100%;height:100%}
.hero.pjh .h-hat{font-size:.4em;transform:translate(-50%,-80%) rotate(-10deg);transform-origin:50% 100%}
.hero.pjh .h-face{font-size:.3em;transform:translate(-50%,-50%)}
.hero.pjh .h-hand{left:-.06em;right:auto;bottom:-.03em;font-size:.32em;transform:rotate(-12deg)}
.hero.pjh .h-pet{left:auto;right:-.2em;bottom:-.02em;font-size:.48em}
.hero.pjh .h-pet .pj{display:block}
.me{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:6px 0 10px}
.me-info{flex:1;min-width:200px}
.me-info input{font:inherit;font-size:1.3rem;font-weight:800;border:2px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:6px 10px;width:min(100%,320px)}
.me-coins{font-size:1.2rem;margin:8px 0 4px}
.farm{position:relative;height:340px;border-radius:var(--r-card);overflow:hidden;background:linear-gradient(#8fd3ff 0%,#c9ecff 44%,#6cc551 44%,#4fa83a 100%);box-shadow:var(--shadow);user-select:none}
[data-theme=dark] .farm{background:linear-gradient(#1d3b6b 0%,#2b5a8a 44%,#2f7a2a 44%,#215c1e 100%)}
.farm .sun{position:absolute;right:20px;top:14px;font-size:2.6rem}
.farm .cloud{position:absolute;font-size:2.4rem;opacity:.95;animation:drift 30s linear infinite}
.farm .c1{top:20px;left:-10%}.farm .c2{top:58px;left:-10%;animation-delay:-14s;font-size:1.8rem}
@keyframes drift{to{left:105%}}
.fi{position:absolute;border:0;background:none;font-size:2.4rem;padding:0;line-height:1;transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.fi.bg{font-size:3.4rem}
.fi.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translate(-50%,-50%)}40%{transform:translate(-50%,-85%) scale(1.15)}}
.farm-hero{position:absolute;left:46%;top:46%;z-index:60}
.farm-empty{position:absolute;left:50%;top:70%;transform:translate(-50%,-50%);background:rgba(255,255,255,.88);color:#16202c;padding:10px 16px;border-radius:14px;font-weight:700;text-align:center;width:min(90%,360px)}
.farm-tip{position:absolute;transform:translateX(-50%);background:#fff;color:#16202c;border-radius:12px;padding:6px 12px;font-size:1rem;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99;pointer-events:none}
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.shop-tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700}
.shop-tabs button.on{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{background:var(--card);border:2px solid transparent;border-radius:var(--r-card);padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sc.own{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.sc .se{font-size:3rem;line-height:1.1}
.sc .sn{font-weight:800}.sc .sn::first-letter{text-transform:uppercase}
.sc .sw{color:var(--muted);font-size:.9rem;min-height:30px}
.sc .own{color:var(--ok-ink);font-weight:700;font-size:.9rem}
.btn.sm{padding:5px 12px;font-size:.88rem}.btn.sm.on{border-color:var(--brand);color:var(--brand)}
.btn.buy{background:var(--gold);border-color:transparent;color:var(--gold-on);font-weight:800;padding:7px 16px}
.btn.buy.no{background:var(--soft);border-color:var(--line);color:var(--muted)}
.miss{color:var(--muted);font-size:.78rem}
.sc .sb{display:contents}
#gift{width:min(92vw,380px);text-align:center}
.gift h2{color:var(--ink)}
.gbox{font-size:5.5rem;line-height:1.1;animation:shake 1s 3}
@media (prefers-reduced-motion:reduce){.gbox{animation:none}}
.gbox.open{animation:boom .6s forwards}.gbox.got{animation:gpop .5s}
@keyframes gpop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.gword{font-size:1.6rem;font-weight:800;margin:4px 0}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
@keyframes boom{to{transform:scale(1.8);opacity:0}}
/* inicio para niños */
.hello{display:flex;align-items:center;gap:18px;margin:4px 0 14px}
.speech{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--r-card);padding:12px 16px;font-size:1.15rem;box-shadow:var(--shadow)}
.speech::before{content:"";position:absolute;left:-12px;top:50%;border:10px solid transparent;border-right-color:var(--line);transform:translateY(-50%)}
.speech b{display:block;font-size:1.4rem}
/* premios */
.kid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 14px}
.ks{background:var(--card);border:2px solid transparent;border-radius:var(--r-card);padding:12px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center}
.ks span{font-size:2rem}.ks b{font-size:1.7rem;line-height:1.1}.ks small{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px}

.cd.on span{background:var(--gold-soft)}
.cd.today span{outline:3px solid var(--brand)}
.cd small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.lvms{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvm{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none}
.lvm .ring{width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--lc) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.lvm .ring b{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--lc)}
.lvm.full .ring b{font-size:1.8rem}
.lvm small{color:var(--muted);font-weight:700}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{border:2px dashed var(--line);border-radius:var(--r-md);padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.ach .ae{font-size:2.3rem;filter:grayscale(1);opacity:.45}
.ach.ok{border-style:solid;border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
:root[data-theme=dark] .ach.ok{background:var(--card)}
.ach.ok .ae{filter:none;opacity:1}
.ach small{color:var(--muted);font-size:.78rem}
.ach .done{color:var(--ok-ink);font-style:normal;font-weight:700;font-size:.85rem}
.abar{width:80%;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.abar i{display:block;height:100%;background:var(--gold)}
details.adult summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.adult[open] summary{margin-bottom:10px}
/* repaso para niños */
.rv-btns.kid .btn{font-size:1rem;padding:12px 4px}
.rv-btns.kid .btn span{display:block;font-size:1.8rem}
/* en el móvil, el personaje y el nombre ocupan poco: así la granja se ve antes */
@media (max-width:560px){.me{gap:14px;flex-wrap:nowrap;margin:0 0 4px}.me>.hero{font-size:76px!important}.me-info{min-width:0}
  .me-info input{font-size:1.1rem;width:100%;padding:5px 9px}.me-coins{margin:4px 0 0;font-size:1.1rem}.me-info>.count{display:none}.me-info h1{font-size:1.4rem}}
@media (max-width:560px){.cal{grid-template-columns:repeat(7,1fr)}.hello{gap:12px}.speech{font-size:1rem}.speech b{font-size:1.15rem}.farm{height:300px}.fi{font-size:2rem}.fi.bg{font-size:2.8rem}}

<script>
const LANGS = {
  english:  {label:"🇬🇧 English",  name:"inglés",  code:"en-GB"},
  "français":{label:"🇫🇷 Français", name:"francés", code:"fr-FR"},
  dansk:    {label:"🇩🇰 Dansk",    name:"danés",   code:"da-DK"},
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","english"); if(!LANGS[lang]) lang="english";
let rate = store.get("rate",0.9);
let INDEX = null; const CACHE = {};
const $ = s => document.querySelector(s);
/* conexión con los módulos js/*.js: eventos, rutas y huecos de la portada */
const bus = {h:{}, on(e, f){ (this.h[e] = this.h[e] || []).push(f); }, emit(e, d){ (this.h[e] || []).forEach(f => { try{ f(d); }catch(err){ console.error(err); } }); }};
const ROUTES = {};      /* ROUTES["juegos"] = async partes => {...}   (#/juegos/…) */
const HOME_ACTS = [];   /* {href, e, t, sub, color} botones grandes extra de la portada */
const HOME_SLOTS = [];  /* async () => html, se pinta bajo los botones grandes */
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* icono del sprite Phosphor: ico("house", "fill", 28, "x") → <svg class="ico x">…; estilo "bold" (contorno) o "fill" (relleno) */
function ico(name, style = "bold", size = 24, cls = ""){
  /* si falta ese estilo se usa el otro; si falta el icono, se avisa (un botón sin icono no lo entiende un niño) */
  if(!document.getElementById(`i-${name}-${style}`)){
    const alt = style === "fill" ? "bold" : "fill";
    if(document.getElementById(`i-${name}-${alt}`)) style = alt;
    else console.warn("[ico] falta el icono", name);
  }
  return `<svg class="ico${cls ? " " + cls : ""}" width="${size}" height="${size}" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="#i-${name}-${style}"></use></svg>`;
}

/* ---------- audio ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); voiceNote(); }; }
function voiceFor(code){
  const base = code.slice(0,2);
  const pick = store.get("voice:"+lang, null);
  if(pick){ const v = voices.find(v => v.name===pick); if(v) return v; }
  const c = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));
  return c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase() && /natural|online|google|neural/i.test(v.name))
      || c.find(v => v.lang.replace("_","-").toLowerCase()===code.toLowerCase()) || c[0] || null;
}
function speakable(t){
  return String(t).replace(/\((m|f|m\.\/f\.|pl)\.?\)/g,"").replace(/\(.*?\)/g,"").replace(/\s\/\s/g,", ").replace(/—/g,"").trim();
}
/* audios grabados (ElevenLabs): audio/<en|fr|da>.json dice qué archivo tiene cada palabra;
   si una palabra no tiene audio o no carga, habla la voz del navegador como siempre */
const CLIP_AB = {english:"en", "français":"fr", dansk:"da"};
const clipMaps = {};
function loadClips(l){
  if(clipMaps[l] || !CLIP_AB[l]) return;
  clipMaps[l] = {};
  fetch(`audio/${CLIP_AB[l]}.json`).then(r => r.ok ? r.json() : {}).then(m => { clipMaps[l] = m || {}; }).catch(() => {});
}
loadClips(lang);
const clipFor = t => { const m = clipMaps[lang]; return m && m[speakable(t)]; };
let clipEl = null, clipEnd = null;
function stopClip(){
  if(clipEl){ try{ clipEl.pause(); }catch(e){} clipEl = null; }
  if(clipEnd){ const f = clipEnd; clipEnd = null; f(); }
}
if("speechSynthesis" in window){
  const cancel0 = speechSynthesis.cancel.bind(speechSynthesis);
  try{ speechSynthesis.cancel = () => { stopClip(); cancel0(); }; }catch(e){}
}
/* toca el audio grabado; done(true) al acabar, done(false) si no se pudo (y entonces habla el navegador) */
function playClip(text, slow, done){
  const id = clipFor(text); if(!id) return false;
  const a = new Audio(`audio/${CLIP_AB[lang]}/${id}.mp3`);
  a.preservesPitch = true;
  a.playbackRate = slow ? 0.7 : Math.min(1.25, Math.max(0.75, rate / 0.9));
  clipEl = a;
  let fin = false;
  const end = ok => { if(fin) return; fin = true; if(clipEl === a) clipEl = null; if(clipEnd === endOk) clipEnd = null; done(ok); };
  const endOk = () => end(true);
  clipEnd = endOk;
  a.onended = () => end(true);
  a.onerror = () => end(false);
  a.play().catch(() => end(false));
  return true;
}
function say(text, btn, slow){
  if(!("speechSynthesis" in window) && !clipFor(text)) return alert("Tu navegador no permite audio.");
  if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
  document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
  if(btn) btn.classList.add("playing");
  const off = () => { if(btn) btn.classList.remove("playing"); };
  const tts = () => {
    if(!("speechSynthesis" in window)) return off();
    const u = new SpeechSynthesisUtterance(speakable(text));
    const code = LANGS[lang].code; u.lang = code; u.rate = slow ? SLOW() : rate;
    const v = voiceFor(code); if(v) u.voice = v;
    u.onend = u.onerror = off;
    speechSynthesis.speak(u);
  };
  if(!playClip(text, slow, ok => ok ? off() : tts())) tts();
}
/* audio encadenado para las secuencias automáticas */
let autoTok = 0;
const sleep = ms => new Promise(res => setTimeout(res, ms));
function sayP(text, btn){
  return new Promise(res => {
    if(!text || (!("speechSynthesis" in window) && !clipFor(text))) return res();
    if("speechSynthesis" in window) speechSynthesis.cancel(); else stopClip();
    document.querySelectorAll(".say.playing").forEach(b=>b.classList.remove("playing"));
    let done = false;
    const fin = () => { if(done) return; done = true; if(btn) btn.classList.remove("playing"); res(); };
    if(btn) btn.classList.add("playing");
    const tts = () => {
      if(!("speechSynthesis" in window)) return fin();
      const u = new SpeechSynthesisUtterance(speakable(text));
      const code = LANGS[lang].code; u.lang = code; u.rate = rate;
      const v = voiceFor(code); if(v) u.voice = v;
      u.onend = u.onerror = fin;
      setTimeout(fin, 1500 + speakable(text).length * 110 / rate);
      setTimeout(() => speechSynthesis.speak(u), 30);
    };
    if(playClip(text, false, ok => ok ? fin() : (done ? 0 : tts()))) setTimeout(fin, 8000);
    else tts();
  });
}
function voiceNote(){
  const el = $("#voicenote"); if(!el) return;
  if(!("speechSynthesis" in window)){ el.innerHTML = "Tu navegador no permite audio."; el.hidden=false; return; }
  if(voices.length && !voiceFor(LANGS[lang].code)){
    el.innerHTML = `Este dispositivo no tiene una voz en ${LANGS[lang].name}, así que el audio puede sonar con acento equivocado. En Windows: <b>Configuración › Hora e idioma › Voz › Agregar voces</b>. En Android o iPhone: ajustes de texto a voz. Chrome y Edge suelen traer más voces.`;
    el.hidden = false;
  } else el.hidden = true;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]"); if(!b) return;
  e.stopPropagation(); say(b.dataset.say, b, b.hasAttribute("data-slow"));
});
const slowBtn = (t, sm) => `<button class="say tt${sm?" sm":""}" data-say="${esc(t)}" data-slow title="Escuchar despacio" aria-label="Escuchar despacio">🐢</button>`;
const sayBtn = (t, sm) => t ? `<span class="sayg"><button class="say${sm?" sm":""}" data-say="${esc(t)}" title="Escuchar" aria-label="Escuchar">🔊</button>${slowBtn(t, sm)}</span>` : "";
const SLOW = () => Math.max(0.35, rate * 0.55);

function openCfg(after, from, host){

  const vs = voices.filter(v => v.lang.replace("_","-").toLowerCase().startsWith(base));

  root.innerHTML = `${host ? "" : `<div class="st-top"><h2 class="t-2" id="cfg-tt">Voz y velocidad</h2><button type="button" class="glass-btn glass-btn--sm glass-btn--pri" id="cfg-x">Listo</button></div>`}
    <section class="st-sec" aria-label="Voz y velocidad"><div class="st-g">

        ${vs.length ? `<select id="cfg-v">${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`
          : `<div class="note" style="margin:0">Este dispositivo no tiene voces en ${LANGS[lang].name}. En Windows: Configuración › Hora e idioma › Voz › Agregar voces. En el móvil: ajustes de texto a voz.</div>`}</div>
      <div class="st-r col"><label for="cfg-r">Velocidad: <span id="cfg-rv"></span></label>

      <button type="button" class="st-r st-btn" id="cfg-t"><span class="st-ic tl">${ico("play", "bold", 18)}</span><span class="st-l">Probar la voz</span></button>
    </div></section>`;
  const q = s => root.querySelector(s);
  const rv = () => q("#cfg-rv").textContent = `${(+rate).toFixed(2).replace(/0$/,"")}×` + (rate<0.75?" (lenta)":rate<=1?" (normal)":" (rápida)");
  rv();

/* ---------- repaso espaciado, actividad y progreso ---------- */
const today = () => { const d = new Date(); return Math.floor((d - d.getTimezoneOffset()*60000) / 864e5); };
const IV = [0, 1, 3, 7, 14, 30, 60, 120];   /* días hasta el siguiente repaso según la caja */
const MASTER = 4;                            /* desde 14 días se considera dominada */
const srsAll = () => store.get("srs:"+lang, {});
const srsK = (id, r) => id + "|" + r.es;
function srsPut(m){ store.set("srs:"+lang, m); updBadge(); }
function srsNext(x, g){ const b = x ? x.b : 0; return g===0 ? 0 : g===1 ? Math.max(1, Math.round(IV[b]/2)) : IV[Math.min(IV.length-1, b+1)]; }
function srsGrade(id, r, g){            /* g: 0 no la sabía · 1 difícil · 2 la sabía */
  const m = srsAll(), k = srsK(id, r), x = m[k] || {d:id, e:r.es, b:0, n:0};
  const days = srsNext(m[k], g);
  if(g===0) x.b = 0; else if(g===2) x.b = Math.min(IV.length-1, x.b+1);
  x.due = today() + days; x.n = (x.n||0) + 1; m[k] = x; srsPut(m); logAct();
}
function srsAdd(id, rows, box){         /* añade al repaso; box 0 = hoy, 1 = mañana, 2 = en 3 días */
  const m = srsAll(); let c = 0;
  for(const r of rows){
    const k = srsK(id, r);
    if(!m[k]){ m[k] = {d:id, e:r.es, b:box, due:today()+IV[box], n:0}; c++; }
    else if(m[k].b < box){ m[k].b = box; m[k].due = today()+IV[box]; }
  }
  srsPut(m); return c;
}
const dueList = () => Object.values(srsAll()).filter(x => x.due <= today());
const dayKey = d => d.toLocaleDateString("sv");
function logAct(n=1){ const a = store.get("act", {}), k = dayKey(new Date()); a[k] = (a[k]||0) + n; store.set("act", a); }
function streak(){
  const a = store.get("act", {}), d = new Date(); let s = 0;
  if(!a[dayKey(d)]) d.setDate(d.getDate()-1);
  while(a[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function updBadge(){ const n = dueList().length; tabBadge("aprender", n, n === 1 ? "1 palabra para repasar" : `${n} palabras para repasar`); }
function statsHtml(){
  const m = Object.values(srsAll()), due = m.filter(x=>x.due<=today()).length, mast = m.filter(x=>x.b>=MASTER).length;
  const a = store.get("act", {}), st = streak();
  return `<div class="stats">
    <a class="stat hl" href="#/repaso"><div class="v">🔁 ${due}</div><div class="k">Para repasar hoy</div></a>
    <a class="stat" href="#/progreso"><div class="v">🔥 ${st}</div><div class="k">${st===1?"día seguido":"días seguidos"}</div></a>
    <a class="stat" href="#/granja"><div class="v">🪙 ${game().coins}</div><div class="k">Monedas</div></a>
    <a class="stat" href="#/progreso"><div class="v">💎 ${mast}</div><div class="k">Palabras que ya no olvidas</div></a>
  </div>`;
}
const inDays = n => n<=0 ? "hoy otra vez" : n===1 ? "mañana" : n<30 ? `en ${n} días` : n<60 ? "en 1 mes" : `en ${Math.round(n/30)} meses`;

let rv = null;
async function repaso(){
  /* un repaso abierto (se salió con «atrás» o por el accesorio «Seguir») sigue donde estaba; la ✕ lo cierra antes */
  if(rv && rv.q && rv.i < rv.q.length){ document.onkeydown = null; rvDraw(); updFocus(); scrollTo(0, 0); return; }
  rv = null; document.onkeydown = null;
  const idx = await getIndex(), ready = idx.filter(d => d.langs.includes(lang));
  const due = dueList();
  $("#app").innerHTML = `<div class="hello">${heroHtml(90)}<div class="speech">${due.length
      ? `<b>¡${due.length} palabra${due.length>1?"s":""} te ${due.length>1?"esperan":"espera"}!</b>Ya las viste antes. Vamos a ver si te acuerdas. Cada palabra que sepas te da 🪙.`
      : `<b>¡Todo repasado por hoy! 🎉</b>Vuelve mañana: las palabras vuelven justo cuando se te van a olvidar.`}</div></div>
    <div class="panel" style="text-align:center">${due.length
      ? `<button class="btn lc" id="rv-go" style="--lc:#1E6EF4;font-size:1.2rem;padding:14px 30px">▶ ¡Vamos a repasar!</button>`
      : `<a class="btn lc" href="#/mapa" style="--lc:#008932;text-decoration:none;font-size:1.1rem;padding:12px 26px">🗺️ Aprender palabras nuevas</a>`}</div>
    <details class="panel adult"><summary>👨‍👩‍👦 Para mayores: añadir palabras al repaso</summary>
      <p class="sub">El repaso es espaciado: cada palabra vuelve mañana, a los 3 días, a la semana, a las 2 semanas, al mes… Si se falla, vuelve a empezar. Las palabras entran solas al terminar lecciones del camino, una Práctica 21 o al fallar en el Test.</p>
      <h2>Añadir palabras nuevas</h2>
      <p class="sub">También entran solas cuando terminas una Práctica 21 (vuelven mañana) o fallas una pregunta del Test.</p>
      <div class="pr-row"><select id="rv-doc">${ready.map(d=>`<option value="${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</option>`).join("")}</select>
      <select id="rv-n"><option value="5">5 palabras</option><option value="10" selected>10 palabras</option><option value="20">20 palabras</option><option value="999">Todas</option></select>
      <button class="btn" id="rv-add">➕ Añadir</button></div>
      <div class="count" id="rv-msg" style="margin-top:8px"></div></details>`;
  if($("#rv-go")) $("#rv-go").onclick = rvStart;
  $("#rv-add").onclick = async () => {
    const id = $("#rv-doc").value, doc = await getDoc(id), m = srsAll();
    const fresh = doc.rows.filter(r => r.es && r.l[lang] && !m[srsK(id, r)]).slice(0, +$("#rv-n").value);
    if(!fresh.length){ $("#rv-msg").textContent = "Ese documento ya está entero en tu repaso."; return; }
    srsAdd(id, fresh, 0); repaso().then(() => $("#rv-msg").textContent = `Añadidas: ${fresh.map(r=>r.es).join(", ")}.`);
  };
  /* desde Hoy («Empezar» o «Repasar N») el repaso empieza directamente */
  if(rvGo){ rvGo = false; if(due.length) await rvStart(); }
}
async function rvStart(){
  const due = dueList(), ids = [...new Set(due.map(x => x.d))];
  await Promise.all(ids.map(id => getDoc(id).catch(()=>null)));
  const q = shuffle(due.map(x => { const doc = CACHE[x.d], r = doc && doc.rows.find(r => r.es===x.e && r.l[lang]); return r ? {id:x.d, r} : null; }).filter(Boolean));
  rv = {q, i:0, flip:false, done:0, total:q.length, coins:0};
  rvDraw(); updFocus(); scrollTo(0, 0);
}
function rvDraw(){
  if(!rv) return;
  if(rv.i >= rv.q.length){
    award(10, "¡Repaso terminado!"); bus.emit("review-done", {n: rv.total});
    $("#app").innerHTML = `<div class="pr-setup pr-end" style="margin:0 auto">${heroHtml(90)}<h2>¡Repaso terminado! 🎉</h2>
      <p class="sub">Repasaste ${rv.total} palabra${rv.total>1?"s":""} y ganaste 🪙 ${rv.coins + 10}. Racha: 🔥 ${streak()} día${streak()===1?"":"s"}.</p>
      <div class="pr-row" style="justify-content:center"><a class="btn pri" href="#/granja" style="text-decoration:none">🏡 Ir a mi granja</a><a class="btn" href="#/mapa" style="text-decoration:none">🗺️ Seguir el camino</a></div></div>`;
    rv = null; document.onkeydown = null; updFocus(); return;
  }
  const {id, r} = rv.q[rv.i], d = r.l[lang], x = srsAll()[srsK(id, r)];
  const pct = Math.round(100 * rv.done / Math.max(1, rv.total));
  $("#app").innerHTML = `<a class="back" href="#/repaso">← Salir del repaso</a>
    <div class="rv"><div class="count" style="text-align:center">Quedan ${rv.q.length - rv.i} · ${pct}% hecho</div>
    <div class="pr-bar"><i style="width:${pct}%"></i></div>
    <div class="fc">${imgHtml(r)}<div class="big">${esc(r.es)}</div>
    ${rv.flip ? `<div class="ans-word">${esc(d.word)}</div><div>${sayBtn(d.word)}</div>
      <div class="meta" style="justify-content:center"><span class="pron">${esc(d.pron)}</span><span class="ipa">${esc(d.ipa)}</span></div>
      ${d.forms?`<div class="count">${esc(d.forms)}</div>`:""}
      ${d.ex?`<div class="ex">${esc(d.ex)} ${sayBtn(d.ex,1)}<div class="tr">${esc(d.ex_es)}</div></div>`:""}
      <div class="count" style="margin-top:12px">¿La sabías?</div>
      <div class="rv-btns kid" style="margin-top:6px">
        <button class="btn b-bad" data-g="0" title="Vuelve ${inDays(srsNext(x,0))}"><span>😕</span>No</button>
        <button class="btn" data-g="1" title="Vuelve ${inDays(srsNext(x,1))}"><span>🤔</span>Más o menos</button>
        <button class="btn b-ok" data-g="2" title="Vuelve ${inDays(srsNext(x,2))}"><span>😄</span>¡Sí!</button></div>`
    : `<div class="hint" style="font-size:1rem">¿Cómo se dice en ${LANGS[lang].name}? Dilo en voz alta y luego mira.</div>
       <button class="btn lc" id="rv-show" style="--lc:#1E6EF4;margin-top:16px;font-size:1.1rem">👀 Ver la respuesta</button>`}
    </div></div>`;
  const tok = ++autoTok;
  if(rv.flip){
    (async () => { await sayP(d.word, $(".fc .say")); if(tok===autoTok && prUI.ex && d.ex){ await sleep(400); if(tok===autoTok) sayP(d.ex); } })();
    document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      autoTok++; speechSynthesis && speechSynthesis.cancel();
      const g = +b.dataset.g; srsGrade(id, r, g); if(g){ award(g, "", true); rv.coins += g; }
      bus.emit("review-card", {grade: g, es: r.es, word: d.word});
      if(g===0) rv.q.push(rv.q[rv.i]); else rv.done++;
      rv.i++; rv.flip = false; rvDraw();
    });
  } else $("#rv-show").onclick = () => { rv.flip = true; rvDraw(); };
  document.onkeydown = e => {
    if(!rv || !location.hash.startsWith("#/repaso")){ document.onkeydown = null; return; }
    if(e.target.closest && e.target.closest("input,select,textarea")) return;
    if(!rv.flip && (e.key===" " || e.key==="Enter")){ e.preventDefault(); $("#rv-show").click(); }
    else if(rv.flip && "123".includes(e.key) && e.key.length===1){ const b = document.querySelector(`[data-g="${+e.key-1}"]`); if(b) b.click(); }
  };
}

async function progreso(el){
  const idx = await getIndex(), m = Object.values(srsAll()), a = store.get("act", {});
  const days = []; for(let k=13; k>=0; k--){ const d = new Date(); d.setDate(d.getDate()-k); days.push({k:dayKey(d), n:a[dayKey(d)]||0, lbl:d.toLocaleDateString("es",{weekday:"short"})}); }
  const max = Math.max(1, ...days.map(x=>x.n));
  const by = {}; for(const x of m){ const o = by[x.d] = by[x.d] || {l:0, m:0}; if(x.b>=MASTER) o.m++; else o.l++; }
  const rows = idx.filter(d => d.langs.includes(lang)).map(d => {
    const o = by[d.id] || {l:0, m:0}, pm = 100*o.m/d.count, pl = 100*o.l/d.count;
    return `<tr><td><a href="#/doc/${d.id}">${d.num?String(d.num).padStart(2,"0")+" · ":""}${esc(d.title)}</a></td>
      <td>${o.m} / ${d.count}</td><td style="width:40%"><div class="mbar"><i class="m" style="width:${pm}%"></i><i class="l" style="width:${pl}%"></i></div></td></tr>`;
  }).join("");
  const total = days.reduce((s,x)=>s+x.n,0);
  (el || $("#app")).innerHTML = `${el ? "" : `<h1>Tu progreso <span style="color:var(--muted);font-weight:400">en ${LANGS[lang].name}</span></h1>
    ${statsHtml()}`}
    <div class="panel"><h2>Últimos 14 días</h2><div class="count">${total} repeticiones en total. La racha cuenta los días seguidos con al menos una práctica, test o repaso.</div>
      <div class="days">${days.map(x=>`<i class="${x.n?"on":""}" style="height:${Math.max(5, 100*x.n/max)}%" title="${x.k}: ${x.n}"></i>`).join("")}</div>
      <div class="dlbl"><span>${days[0].lbl}</span><span>hoy</span></div></div>
    <div class="panel"><h2>Por documento</h2>
      <div class="legend"><span><i style="background:var(--ok)"></i>Dominadas (repaso cada 14 días o más)</span><span><i style="background:var(--brand);opacity:.6"></i>Aprendiendo</span></div>
      <table class="ptable"><thead><tr><th>Documento</th><th>Dominadas</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="panel"><h2>📲 En el móvil y sin internet</h2>
      <p class="sub">Puedes instalar esta web como una app: en Android o en Chrome, Ajustes (el engranaje) › «Instalar la app» o menú ⋮ › «Instalar aplicación»; en iPhone, Safari › Compartir › «Añadir a pantalla de inicio». Tu progreso se guarda en cada dispositivo (y en Google si lo conectas).</p>
      <div id="off-panel"></div></div>`;
  offlinePanel($("#off-panel"));
}

/* «Descargar todo»: la app va a la caché del shell actual (la de sw.js) y los documentos, la gramática, los dibujos y los
   audios del idioma actual a vocab-media, que se conserva entre versiones. 6 descargas a la vez, con progreso y Cancelar.
   Pide con cache:"no-store" para que sw.js no lo guarde otra vez por su cuenta. */

  "data/sprites.json", "js/motion.js", "js/gestures.js", "js/sfx.js", "js/farm.js", "js/games.js", "js/buddy.js", "js/album.js",

  "icons/icon-192-maskable.png", "icons/icon-512-maskable.png", "fonts/nunito-latin-700-normal.woff2", "fonts/nunito-latin-800-normal.woff2"];
/* tamaños medidos en Chrome (MiB y KiB; todo en inglés ocupa unos 33 MiB) */
const OFF_FIRST_MB = 6.2;                         /* la app, los documentos y la gramática (se piden siempre) */
const OFF_IMG_MB = 7.5, OFF_IMG_N = 970;          /* dibujos y personajes (los que ya están no se vuelven a pedir) */
const AUDIO_KB = {en:7.1, fr:9.5, da:8.2}, ENTRY_KB = .4;    /* audio medio de cada idioma y lo que suma cada entrada */
const OFF_NET_FAILS = 10;                         /* tantos fallos de red seguidos = no hay conexión: se para */
const OFF_MEDIA_RE = /\.(png|jpe?g|gif|webp|svg|mp3)$/i;
let offJob = null;                                /* la descarga en curso (sigue aunque se cambie de pantalla) */
const offMB = b => (b / 1048576).toLocaleString("es", {maximumFractionDigits: b < 10485760 ? 1 : 0});
async function offShellName(){
  const v = (await caches.keys()).map(n => /^vocab-shell-v(\d+)$/.exec(n)).filter(Boolean).sort((a, b) => b[1] - a[1])[0];
  return v ? v[0] : OFF_SHELL;
}
/* los audios del idioma: los nombres de archivo distintos que hay en audio/<ab>.json */
async function audioIds(l){
  const ab = CLIP_AB[l]; if(!ab) return [];
  let m = clipMaps[l];
  if(!m || !Object.keys(m).length){ try{ const r = await fetch(`audio/${ab}.json`); m = r.ok ? await r.json() : {}; }catch(e){ m = {}; } }
  return [...new Set(Object.values(m || {}))].filter(id => /^[\w-]+$/.test(String(id)));
}
const audioKB = l => (AUDIO_KB[CLIP_AB[l]] || 8.5) + ENTRY_KB;
const offEstimate = (l, n) => (OFF_FIRST_MB + OFF_IMG_MB) * 1048576 + n * audioKB(l) * 1024;
/* lo que falta por guardar (para no pedir sitio para lo que ya está): fetched = lo que se va a bajar (barra de progreso);
   room = lo que ocupará de más (los documentos se sustituyen, así que solo cuentan si faltan) */
async function offNeed(l, idx, ids, media){
  const have = new Set((await media.keys()).map(r => r.url)), abs = u => new URL(u, location.href).href, ab = CLIP_AB[l];
  const docsMiss = idx.length ? idx.filter(d => !have.has(abs(`data/${d.id}.json`))).length / idx.length : 1;
  let img = 0; for(const u of have) if(u.includes("/img/")) img++;
  const imgMiss = Math.max(0, 1 - img / OFF_IMG_N);
  const audio = ids.filter(id => !have.has(abs(`audio/${ab}/${id}.mp3`))).length * audioKB(l) * 1024;
  return {fetched: (OFF_FIRST_MB + imgMiss * OFF_IMG_MB) * 1048576 + audio,
          room: (docsMiss * OFF_FIRST_MB + imgMiss * OFF_IMG_MB) * 1048576 + audio};
}
/* qué hay ya guardado: documentos y audios del idioma actual (mira unos pocos) */
async function offState(l){
  if(!("caches" in window)) return {docs:false, audio:false};
  try{
    const media = await caches.open(OFF_MEDIA), idx = await getIndex(), ids = await audioIds(l), ab = CLIP_AB[l];
    const has = async u => !!(await media.match(u));
    const docs = idx.length > 0 && await has(`data/${idx[0].id}.json`) && await has(`data/${idx[idx.length - 1].id}.json`);
    const audio = ids.length > 0 && await has(`audio/${ab}/${ids[0]}.mp3`) && await has(`audio/${ab}/${ids[ids.length - 1]}.mp3`) && await has(`audio/${ab}/${ids[ids.length >> 1]}.mp3`);
    return {docs, audio, n:ids.length};
  }catch(e){ return {docs:false, audio:false}; }
}
/* el bloque de la descarga: botón, tamaño, barra de progreso y Cancelar. Se puede poner en cualquier sitio. */
function offlinePanel(el){
  if(!el) return;
  el.innerHTML = `<div class="off-dl">
    <div class="pr-row"><button class="btn pri" id="off-dl" type="button">${ico("download-simple", "bold", 20)} Descargar todo para usar sin internet</button>
      <button class="btn" id="off-x" type="button" hidden>Cancelar</button></div>
    <div class="off-bar" id="off-bar" role="progressbar" aria-label="Descarga" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden><i></i></div>
    <div class="count" id="off-msg" aria-live="polite"></div></div>`;
  $("#off-dl").onclick = downloadAll;
  $("#off-x").onclick = () => { if(offJob) offJob.ctrl.abort(); };
  if(offJob) return paintOff();
  if(!("caches" in window) || !("serviceWorker" in navigator)){ $("#off-msg").textContent = "Este navegador no permite guardar la web sin internet."; $("#off-dl").disabled = true; return; }
  const l = lang;
  offState(l).then(st => {
    const m = $("#off-msg"); if(!m || offJob || l !== lang) return;
    const name = LANGS[l].name, size = st.n ? `unos ${offMB(offEstimate(l, st.n))} MB` : "bastante espacio";
    m.textContent = st.docs && st.audio ? `✓ Ya está guardado en este dispositivo, con los audios del ${name}. Puedes volver a descargarlo para actualizarlo.`
      : st.docs ? `Ya guardado, pero sin los audios del ${name}. Descárgalo otra vez para añadirlos (en total ${size}).`
      : `Ocupa ${size}, con los audios del ${name}. Mejor con wifi.`;
  });
}
function paintOff(){
  const j = offJob, b = $("#off-dl"), x = $("#off-x"), bar = $("#off-bar"), m = $("#off-msg");
  if(!b || !m) return;
  b.disabled = !!(j && !j.end); if(x) x.hidden = !(j && !j.end);
  if(!j) return;
  const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
  if(bar){ bar.hidden = !!j.end && !j.ok; bar.setAttribute("aria-valuenow", pct); bar.firstElementChild.style.width = pct + "%"; }
  m.textContent = j.end ? j.end
    : j.total ? `Guardando… ${pct} % · ${offMB(j.bytes)} de unos ${offMB(Math.max(j.est, j.bytes))} MB`
    : "Preparando la descarga…";
}
async function downloadAll(){
  if(offJob && !offJob.end) return;
  if(!("caches" in window)){ const m = $("#off-msg"); if(m) m.textContent = "Este navegador no permite guardar la web sin internet."; return; }
  const l = lang, ab = CLIP_AB[l];
  const job = offJob = {ctrl:new AbortController(), done:0, total:0, bytes:0, est:0, fails:0, net:0, failed:[], end:"", ok:false};
  const sig = job.ctrl.signal;
  paintOff();
  const fin = (text, ok) => {
    if(job.fails) console.warn(`No se pudieron guardar ${job.fails} archivos, por ejemplo:`, job.failed.join(", "));
    job.end = text; job.ok = ok; paintOff(); setTimeout(() => { if(offJob === job){ offJob = null; } }, 0);
  };
  const OFFLINE = "Sin conexión: conéctate a internet para descargar. Lo que ya se guardó se queda.";
  if(navigator.onLine === false) return fin(OFFLINE, false);
  try{
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
    const [shellName, idx, ids] = [await offShellName(), await getIndex(), await audioIds(l)];
    const shell = await caches.open(shellName), media = await caches.open(OFF_MEDIA);
    const need = await offNeed(l, idx, ids, media);
    job.est = need.fetched;
    if(navigator.storage && navigator.storage.estimate){
      const q = await navigator.storage.estimate().catch(() => null);
      if(q && q.quota && q.quota - (q.usage || 0) < need.room) return fin(`No cabe: hacen falta unos ${offMB(need.room)} MB y quedan ${offMB(q.quota - (q.usage || 0))} MB libres.`, false);
    }
    /* guarda una url; skip: si ya está, no la vuelve a pedir (imágenes y audios) */
    const one = async (u, c, skip, json) => {
      if(sig.aborted) throw new DOMException("cancelada", "AbortError");
      let out = null;
      if(skip && await c.match(u)){ job.done++; paintOff(); return null; }
      try{
        const r = await fetch(u, {signal:sig, cache:"no-store"});
        if(r.status !== 200) throw new Error("HTTP " + r.status);
        if(json) out = await r.clone().json();
        await c.put(u, r);
        job.net = 0;
        job.bytes += +r.headers.get("content-length") || (OFF_MEDIA_RE.test(u) ? 8192 : 4096);
      }catch(e){
        if(e.name === "AbortError" || e.name === "QuotaExceededError") throw e;
        job.fails++; if(job.failed.length < 5) job.failed.push(u);
        /* fallo de red (no un 404): si se repite, es que no hay conexión y no tiene sentido seguir */
        if(e instanceof TypeError && ++job.net >= OFF_NET_FAILS){ const n = new Error(OFFLINE); n.name = "NetworkError"; throw n; }
      }
      job.done++; paintOff();
      return out;
    };
    const pool = async (list, fn) => {
      let i = 0;
      const worker = async () => { while(i < list.length) await fn(list[i++]); };
      await Promise.all(Array.from({length:Math.min(6, list.length)}, worker));
    };
    /* 1) la app y los documentos (de ellos salen los dibujos); 2) dibujos, personajes y audios */
    const docs = idx.map(d => `data/${d.id}.json`);
    const first = [...OFF_APP.map(u => [u, shell]), ...docs.map(u => [u, media]),
      ...["en", "fr", "da"].map(g => [`data/grammar_${g}.json`, media]), ...(ab ? [[`audio/${ab}.json`, media]] : [])];
    const imgs = new Set();
    let sprites = {};
    job.total = first.length + 200 + ids.length;      /* se ajusta al saber cuántos dibujos hay */
    await pool(first, async ([u, c]) => {
      const j = await one(u, c, false, docs.includes(u) || u === "data/sprites.json");
      if(j && u === "data/sprites.json") sprites = j;
      else if(j && Array.isArray(j.rows)) j.rows.forEach(r => r.img && imgs.add(r.img));
    });
    Object.keys(sprites || {}).forEach(k => /^[\w-]+$/.test(k) && imgs.add(`img/pj/${k}.png`));
    const second = [...[...imgs].map(u => [u, media]), ...ids.map(id => [`audio/${ab}/${id}.mp3`, media])];
    job.total = first.length + second.length;
    await pool(second, ([u, c]) => one(u, c, true, false));
    if(job.fails){
      fin(`Casi: ${job.fails} de ${job.total} archivos no se pudieron guardar. Vuelve a intentarlo con buena conexión.`, false);
    } else {
      store.set("offline", true);
      fin(`✓ Listo: ${job.total} archivos guardados, con los audios del ${LANGS[l].name}. Ya puedes usarla sin internet.`, true);
    }
  }catch(e){
    if(!sig.aborted) job.ctrl.abort();                /* para a las demás descargas */
    if(e.name === "AbortError") fin("Descarga parada. Lo que ya se guardó se queda; puedes seguir cuando quieras.", false);
    else if(e.name === "NetworkError") fin(OFFLINE, false);
    else if(e.name === "QuotaExceededError") fin("No cabe en este dispositivo: libera espacio y vuelve a intentarlo.", false);
    else fin("No se pudo descargar todo: " + e.message, false);
  }
}
let installEv = null;
/* el aviso de instalar se guarda y se usa desde Ajustes › Para mayores › «Instalar la app» */
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEv = e; });
addEventListener("appinstalled", () => { installEv = null; });
if("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(e => console.warn("No se pudo instalar el modo sin internet:", e.message));

/* ---------- tema: Automático (sin clave "theme": sigue al sistema), Claro u Oscuro ----------
   Nunca se guarda "auto": elegir Automático borra la clave. */
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const sysTheme = () => darkMQ.matches ? "dark" : "light";
function themeMode(){ const t = store.get("theme", null); return t === "light" || t === "dark" ? t : "auto"; }
function applyTheme(){
  const m = themeMode(), t = m === "auto" ? sysTheme() : m;
  document.documentElement.dataset.theme = t;
  /* las dos metas theme-color siguen al sistema en Automático; con un tema fijo, las dos dicen el color elegido */
  document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
    const dark = m === "auto" ? /dark/.test(el.getAttribute("media") || "") : t === "dark";
    el.setAttribute("content", dark ? "#000000" : "#F2F2F7");
  });
  paintTheme();
}
function setTheme(mode){
  if(mode === "light" || mode === "dark") store.set("theme", mode);
  else { try{ localStorage.removeItem("theme"); }catch(e){} }
  applyTheme();
}
/* Ajustes › Apariencia (si está abierta) marca lo elegido */
function paintTheme(){
  document.querySelectorAll("[data-th]").forEach(x => { const on = x.dataset.th === themeMode(); x.setAttribute("aria-checked", on); x.tabIndex = on ? 0 : -1; });
}
darkMQ.addEventListener("change", () => { if(themeMode() === "auto") applyTheme(); });
addEventListener("storage", e => { if(e.key === "theme" || e.key === null) applyTheme(); });
applyTheme();

/* ---------- datos ---------- */
async function getIndex(){ if(!INDEX) INDEX = await (await fetch("data/index.json")).json(); return INDEX; }
async function getDoc(id){ if(!CACHE[id]) CACHE[id] = await (await fetch(`data/${id}.json`)).json(); return CACHE[id]; }

/* ---------- armazón de navegación: pestañas, segmentos, barra superior y modo foco ----------
   TABS: las pestañas de la barra, en orden. Cada una: id (data-nav y #tab-<id>), t (nombre), ic (icono Phosphor
   relleno), root (adónde va la primera vez), title (título grande en su raíz; null = sin título), secs (primer trozo
   de las rutas que son suyas) y segs (segmentos de arriba; solo se pintan si hay 2 o más): t, h (ruta) y secs.
   Un módulo puede añadir una pestaña o un segmento al cargar, antes de que arranque la app:
     TABS.find(t => t.id === "premios").segs.push({t: "Mi zorro", h: "#/zorro", secs: ["zorro"]});
   y registrar su ruta en ROUTES["zorro"]. Las rutas que no son de ninguna pestaña dejan marcada la de antes. */
const TABS = [
  {id:"hoy", t:"Hoy", ic:"house", root:"#/", title:"Hoy", secs:[""]},
  {id:"aprender", t:"Aprender", ic:"graduation-cap", root:"#/mapa", title:"Aprender", secs:["repaso", "mapa", "palabras", "gramatica", "doc", "leccion"],
    segs:[{t:"Repasar", h:"#/repaso", secs:["repaso"]}, {t:"Camino", h:"#/mapa", secs:["mapa", "leccion"]},
          {t:"Palabras", h:"#/palabras", secs:["palabras", "doc"]}, {t:"Gramática", h:"#/gramatica", secs:["gramatica"]}]},
  {id:"jugar", t:"Jugar", ic:"game-controller", root:"#/juegos", title:"Jugar", secs:["juegos", "album"],
    segs:[{t:"Juegos", h:"#/juegos", secs:["juegos"]}, {t:"Álbum", h:"#/album", secs:["album"]}]},
  {id:"granja", t:"Granja", ic:"barn", root:"#/granja", title:null, secs:["granja"]},
  {id:"premios", t:"Premios", ic:"trophy", root:"#/progreso", title:"Premios", secs:["progreso"], segs:[{t:"Medallas", h:"#/progreso", secs:["progreso"]}]},
];
const hashPath = (hash = location.hash) => hash.replace(/^#\/?/, "").split("?")[0];
const secOf = h => String(h || "").split("/")[0];
const tabOf = h => TABS.find(t => t.secs.includes(secOf(h))) || null;
const segOf = (t, h) => (t && t.segs || []).find(s => s.secs.includes(secOf(h))) || null;
const lessonLv = id => { const m = /^(?:G-)?([A-C][12])\b/.exec(id || ""); return m ? m[1] : ""; };
/* la raíz de lo que se ve: una ficha vuelve a Palabras, una partida o una página del álbum a su lista y una lección a
   su nivel del camino. #/mapa/<nivel> y #/gramatica/<nivel> ya son raíz. */
function rootOf(h){
  const [a, b] = String(h || "").split("/");
  if(a === "doc") return "palabras";
  if(a === "leccion") return lessonLv(b) ? "mapa/" + lessonLv(b) : "mapa";
  if((a === "juegos" || a === "album") && b) return a;
  return String(h || "");
}
const isRootPath = h => rootOf(h) === h;
/* cada pestaña recuerda su última pantalla y su scroll (solo en esta sesión: sessionStorage, fuera de la partida) */
const TABMEM = (() => { try{ const m = JSON.parse(sessionStorage.getItem("vocab:tabs")); return m && typeof m === "object" ? m : {}; }catch(e){ return {}; } })();
let memT = 0;
const memSave = () => { clearTimeout(memT); memT = setTimeout(() => { try{ sessionStorage.setItem("vocab:tabs", JSON.stringify(TABMEM)); }catch(e){} }, 250); };
/* lo que se recuerda de una ruta: de una lección, su nivel del camino; de una partida, el menú de juegos */
const memHash = h => secOf(h) === "leccion" || (secOf(h) === "juegos" && h.includes("/")) ? "#/" + rootOf(h) : "#/" + h;
let curTab = null, tabRestore = null, ROUTE_RESTORE = false, focusOn = "", lastInput = 0;
["pointerdown", "wheel", "keydown", "touchstart"].forEach(t => addEventListener(t, () => { lastInput = Date.now(); }, {capture: true, passive: true}));

function renderTabbar(){
  const nav = $("#tabbar"); if(!nav) return;
  nav.innerHTML = TABS.map(t => `<a class="tab" role="tab" id="tab-${t.id}" data-nav="${t.id}" href="${esc(t.root)}" aria-selected="false" tabindex="-1">${ico(t.ic, "fill", 26)}<span class="tl">${esc(t.t)}</span><span class="tb-badge"${t.id === "aprender" ? ' id="due-b"' : ""} aria-hidden="true" hidden></span></a>`).join("");
}
/* aviso en una pestaña: v = número (más de 9 sale «9+»), true = punto azul, 0/false = nada. label es lo que lee el
   lector de pantalla junto al nombre («6 palabras para repasar»). Da un saltito (M.bump) cuando cambia. Siempre azul. */
const BADGES = {};
function tabBadge(id, v, label){
  const a = document.getElementById("tab-" + id), b = a && a.querySelector(".tb-badge"); if(!b) return;
  const n = typeof v === "number" ? Math.max(0, Math.floor(v) || 0) : !!v;
  const key = n === true ? "dot" : String(n || 0), old = BADGES[id];
  b.hidden = !n; b.classList.toggle("dot", n === true);
  b.textContent = typeof n === "number" && n ? (n > 9 ? "9+" : String(n)) : "";
  const t = TABS.find(x => x.id === id);
  if(n && label) a.setAttribute("aria-label", `${t ? t.t : id}, ${label}`); else a.removeAttribute("aria-label");
  BADGES[id] = key;
  if(old !== undefined && old !== key && n && window.M) M.bump(b);
}
/* lo que se ve de la barra: pestaña marcada, adónde lleva cada una, vidrio ligero en la granja y en las partidas */
function paintTabs(h){
  const t = tabOf(h); if(t) curTab = t.id;
  const root = document.documentElement;
  root.dataset.tab = curTab || ""; root.dataset.sec = secOf(h);
  for(const x of TABS){
    const a = document.getElementById("tab-" + x.id); if(!a) continue;
    const on = x.id === curTab, m = TABMEM[x.id];
    a.setAttribute("aria-selected", on); a.tabIndex = on ? 0 : -1;
    a.setAttribute("href", on ? "#/" + rootOf(h) : m && m.h ? m.h : x.root);
  }
  const lite = curTab === "granja" || /^juegos\//.test(h) || root.hasAttribute("data-gm-play");
  ["#tabbar", "#lang-b", ".tb-group", "#lang-m", "#fx-x"].forEach(s => { const el = $(s); if(el) el.classList.toggle("lite", lite); });
}
/* título grande y segmentos, solo en la raíz de la pestaña (y nunca en modo foco) */
function paintHead(h){
  const el = $("#tabhead"); if(!el) return;
  const t = tabOf(h), segs = t && t.segs && t.segs.length > 1 ? t.segs : null;
  if(!t || focusOn || !isRootPath(h) || (!t.title && !segs)){ el.hidden = true; el.innerHTML = ""; return; }
  const cur = segOf(t, h), key = `${t.id}|${cur ? cur.h : ""}`;
  if(el.dataset.k !== key || !el.innerHTML){
    el.dataset.k = key;
    el.innerHTML = `${t.title ? `<h1 class="th-t t-lt">${esc(t.title)}</h1>` : ""}${segs ? `<div class="seg" role="tablist" aria-label="${esc(t.t)}">${segs.map(s =>
      `<a class="seg-i" role="tab" href="${esc(s.h)}" aria-selected="${s === cur}" tabindex="${s === cur ? 0 : -1}">${esc(s.t)}</a>`).join("")}</div>` : ""}`;
  }
  el.hidden = false;
}
/* modo foco (html[data-focus]): lección, repaso en marcha o partida (games.js marca html[data-gm-play]). Sin barras,
   con la ✕ (vuelve a la raíz de la pestaña) y el contador de monedas. */
function updFocus(){
  const h = hashPath(), root = document.documentElement;
  const f = secOf(h) === "leccion" ? "leccion" : rv && secOf(h) === "repaso" ? "repaso" : root.hasAttribute("data-gm-play") ? "juego" : "";
  const x = $("#fx-x");
  if(x) x.setAttribute("href", f === "leccion" ? "#/" + rootOf(h) : f === "repaso" ? "#/repaso" : f === "juego" ? "#/juegos" : "#/");
  if(f === focusOn) return;
  focusOn = f;
  if(f){ root.dataset.focus = f; langMenu(false); } else delete root.dataset.focus;
  paintHead(h); paintTabs(h);
}
new MutationObserver(updFocus).observe(document.documentElement, {attributes: true, attributeFilter: ["data-gm-play"]});
/* vuelve al scroll que tenía la pestaña (la página puede tardar en crecer: se reintenta un poco si no tocan) */
function restoreScroll(y){
  const t0 = Date.now(), go = () => { if(lastInput > t0) return; if(Math.abs(scrollY - y) > 2) scrollTo(0, y); };
  scrollTo(0, y); requestAnimationFrame(go); setTimeout(go, 150); setTimeout(go, 450);
}
function topSmooth(){ try{ scrollTo({top: 0, behavior: window.M && M.rm() ? "auto" : "smooth"}); }catch(e){ scrollTo(0, 0); } }
function navTo(hash){ if(location.hash === hash || (hash === "#/" && !hashPath())) route(); else location.hash = hash; }
/* tocar una pestaña: la otra vuelve a donde se quedó; la que ya está marcada sube arriba o vuelve a su raíz */
function goTab(id){
  const t = TABS.find(x => x.id === id); if(!t) return;
  const h = hashPath();
  if(curTab === id && tabOf(h) === t){
    const r = rootOf(h);
    if(r !== h) navTo("#/" + r); else topSmooth();
    return;
  }
  const m = TABMEM[id], ok = m && typeof m.h === "string" && tabOf(hashPath(m.h)) === t;
  const to = ok ? m.h : t.root;
  tabRestore = ok && m.y > 0 ? m.y : null;
  navTo(to);
}
/* flechas en una lista de pestañas o segmentos (el foco se mueve; Intro o Espacio la abre) */
function rovingKeys(e, items){
  const i = items.indexOf(document.activeElement); if(i < 0) return;
  const k = {ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1}[e.key];
  let j = k ? (i + k + items.length) % items.length : e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : -1;
  if(e.key === " "){ e.preventDefault(); e.stopPropagation(); items[i].click(); return; }
  if(j < 0) return;
  e.preventDefault(); e.stopPropagation(); items[j].focus();
}
function wireNav(){
  const bar = $("#tabbar");
  bar.addEventListener("click", e => {
    const a = e.target.closest(".tab"); if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button > 0) return;
    e.preventDefault(); goTab(a.dataset.nav);
  });
  bar.addEventListener("keydown", e => rovingKeys(e, [...bar.querySelectorAll(".tab")]));
  const head = $("#tabhead");
  head.addEventListener("click", e => {
    const a = e.target.closest(".seg-i"); if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button > 0) return;
